# Dependabot config (issue #118). Keeps every Go module's go.mod/go.sum and the
# SHA-pinned GitHub Actions current — supply-chain hygiene for the root binary,
# importable engine, reusable authn adapter, and opt-in providers.
#
# Dependabot processes each gomod directory INDEPENDENTLY, so every workspace
# module gets its own update config. Minor+patch bumps are GROUPED into a single
# PR per ecosystem to cut review noise; majors stay separate
# (they can break, so they deserve an individual PR).
#
# The repo SHA-pins every GitHub Action with a `# vX.Y.Z` comment. Dependabot
# SUPPORTS and PRESERVES that style: it bumps the SHA and the trailing comment
# together, so this config does not weaken the pinning discipline.
version: 2

updates:
  # Root module (the heavy dependency cone).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Engine submodule (the importable core's tiny, self-contained closure).
  - package-ecosystem: gomod
    directory: "/engine"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Opt-in caller-identity adapter module (ADR 0206; not a provider).
  - package-ecosystem: gomod
    directory: "/authn/oidc"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Opt-in LLM-provider submodules (ADR 0093) — each its own go.mod closure.
  - package-ecosystem: gomod
    directory: "/provider/anthropic"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/provider/openai"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/provider/openaichat"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/provider/ssefilter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  # SHA-pinned GitHub Actions (bumps the pin SHA + its `# vX.Y.Z` comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
