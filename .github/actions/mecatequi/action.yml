# mecatequi — reusable COMPOSITE action that runs one mecatequi single-shot agent
# run inside a GitHub Actions job and exposes its result as step outputs.
#
# WHAT THIS IS. mecatequi is the headless, single-shot mecatl runner (cmd/mecatequi):
# it runs ONE prompt against an in-process engine, drives it to a terminal state, and
# emits three artifacts — a working-tree git diff, a machine-readable summary JSON, and
# an optional durable JSONL event log — then maps the terminal stop reason to a process
# exit code. This action wires that binary into a job: it acquires the binary, runs it
# with the prompt file you pass, captures the exit code WITHOUT failing the step, and
# surfaces the summary fields + an exit class as outputs so the CALLING workflow decides
# what to do next (open a PR, post a comment, fail).
#
# TRUST POSTURE. The prompt is passed by FILE (`prompt-file`), never as an argv token or
# an inline ${{ }} interpolation, and `untrusted` (default true) tells the binary to
# wrap the prompt body in the harness untrusted-data fence. The intended split-privilege
# template (.github/workflows/mecatequi-example.yml) runs THIS action in a job that holds
# ONLY the LLM key and NO GitHub write token; a separate, agent-code-free job publishes
# the result. See docs/design/MECATEQUI.md.
#
# THE LLM KEY IS NOT AN INPUT. mecatequi reads provider secrets from the ENVIRONMENT
# (e.g. OPENAI_API_KEY), never from a flag — so the caller sets the key in the calling
# JOB's env, not as an action input. It MUST be job-level (not step-level on the `uses:`
# step): step-level env on a `uses:` step does NOT propagate into a composite action's
# internal steps, whereas job-level env (the shared $GITHUB_ENV store) does. A secret
# routed through an action input would be eligible to leak into logs; the env path keeps
# it out of the inputs surface entirely.
#
# DISTRIBUTION (matlatl pattern: build from the action's OWN checkout — single path, no auth).
# The binary is built from the action's own source tree, located via $GITHUB_ACTION_PATH.
# This is exactly how stacklok/matlatl's composite works, and it is UNIFORM across both ways
# the action is referenced:
#
#   • SELF (this repo): `uses: ./.github/actions/mecatequi` → $GITHUB_ACTION_PATH is the
#     local workspace's action directory, so it builds the checked-out tree (HEAD).
#   • CROSS-REPO: `uses: stacklok/mecatl/.github/actions/mecatequi@<tag>` → GitHub checks the
#     WHOLE mecatl repo out at that tag into $GITHUB_ACTION_PATH; the build then uses that
#     tagged source. NO mecatl checkout is needed in the consuming repo, and — because the
#     action source itself is the build input — there is NO token, NO GOPRIVATE, and NO PAT.
#     The only requirement is the ORG setting that lets Actions use a private/internal repo's
#     actions (Settings → Actions → General → Access for stacklok/mecatl).
#
# The action lives at .github/actions/mecatequi/, so the repo root is $GITHUB_ACTION_PATH/
# ../../.. (where go.mod + cmd/mecatequi live). The "Set up Go" + "Acquire mecatequi binary"
# steps are isolated so a future swap to a signed, checksum-verified release-asset download
# is a contained change (drop both, add a download+verify). The signed-asset follow-up is
# documented in docs/design/MECATEQUI.md §5. The `uses: …@<ref>` tag IS the version — there
# is no version input (matlatl has none either).
#
# OMITTED INPUT — the ask-reviewer policy file. --subagent-ask-reviewer is surfaced (see
# the input) so a posture:auto run can adjudicate a child's read-only substitution instead
# of silently auto-denying it, but --subagent-ask-reviewer-policy (a TRUSTED rubric file
# whose CONTENT replaces the built-in rubric) is NOT surfaced: it grants the reviewer a
# rule set the operator would have to author and check into the repo, which is a deliberate
# deployment decision better made by editing this action than by a workflow input. The
# built-in rubric is the safe default; add the input here if a deployment needs a custom one.

name: mecatequi
description: >-
  Run a single-shot, headless mecatequi agent over a prompt file and expose the run
  summary (stop-reason, non-empty-diff, exit-class) and artifact paths as outputs.

inputs:
  prompt-file:
    description: >-
      Path to a file whose contents are the prompt body. REQUIRED. Pass a file the job
      wrote from event data via jq — NEVER inline untrusted issue text into a run: body
      or an argv token.
    required: true
  untrusted:
    description: >-
      When "true" (default), treat the prompt body as UNTRUSTED data and wrap it in the
      harness untrusted-data fence (--untrusted-prompt). Set "false" only for a prompt
      that is the operator's own trusted task.
    required: false
    default: "true"
  instructions:
    description: >-
      TRUSTED operator framing emitted OUTSIDE the untrusted-prompt fence (never fenced),
      via --instructions. The default bakes in two paragraphs every consumer gets with zero
      config: write the final message as a pull-request description, and self-verify (run
      the repo's build/lint/test and make them green) before finishing. Overriding this
      input REPLACES both defaults — supply your own framing wholesale. Empty omits it
      entirely. Distinct from prompt-file, which carries the task and IS fenced.
    required: false
    default: >-
      Your FINAL assistant message becomes the body of the pull request this run opens.
      Write it as a pull-request description: a crisp, structured summary of WHAT you
      changed and WHY (what problem it solves, the approach, and anything a reviewer should
      check) — not a conversational reply, a greeting, or a sign-off.


      Before you finish, VERIFY your work: run the repository's own build, lint, and test
      commands (e.g. the project's Makefile/Taskfile targets such as `task build`, `task
      lint`, `task test`, or the language-native equivalents) and make them pass. If a
      check fails, fix it and re-run until the build, lint, and tests are green; only then
      end your turn. Do not claim success without having run them.
  workspace:
    description: Session workspace root (must be a git repository so the diff can be computed).
    required: false
    default: ${{ github.workspace }}
  posture:
    description: >-
      Operator posture ladder (strict < trusted < auto < yolo). Default "auto" — the
      documented CI posture (allow-all, child injection-defence ON). "strict" would
      CANCEL the run on the first mutate because a headless run has no approver.
    required: false
    default: "auto"
  timeout:
    description: Wall-clock bound on the whole run (e.g. 15m). 0 disables it.
    required: false
    default: "15m"
  max-run-tokens:
    description: >-
      Max cumulative input+output tokens per run; the run ends cleanly with stop=budget
      on crossing it. Empty (default) omits the flag (unlimited).
    required: false
    default: ""
  model:
    description: >-
      Model identifier sent to the provider (empty -> provider-appropriate default). This
      is the PER-SESSION PASSTHROUGH path: it accepts ANY model the provider serves,
      including ids newer than the embedded catalog. Prefer this over `default-model` for a
      newer/uncatalogued model.
    required: false
    default: ""
  default-provider:
    description: >-
      Deployment default provider id (e.g. openai, openrouter, anthropic). Auto-detected
      from the secrets present in the env (e.g. OPENAI_API_KEY) — set only to FORCE the
      provider.
    required: false
    default: ""
  default-model:
    description: >-
      Deployment default model id for the default provider. VALIDATED against the embedded
      model catalog at startup and REJECTED if the id is not in the snapshot — for a
      newer/uncatalogued model use the `model` input instead, which passes through.
    required: false
    default: ""
  openai:
    description: >-
      When "true", use the OpenAI Responses provider (key from OPENAI_API_KEY in the step
      env). Auto-detected from OPENAI_API_KEY in env — set only to FORCE the provider.
    required: false
    default: ""
  openai-base-url:
    description: Override the OpenAI API base URL (compatible endpoints).
    required: false
    default: ""
  guardrails-model:
    description: >-
      GUARDRAILS (issue #27) checker model id / alias inspecting outbound args + inbound
      results. Empty disables guardrails.
    required: false
    default: ""
  subagent-ask-reviewer:
    description: >-
      OPT-IN headless ask reviewer (issue #31) → --subagent-ask-reviewer: model id / alias
      of a tool-less one-turn reviewer that adjudicates a CHILD permission ask the headless
      auto-deny would otherwise reject (so a posture:auto run whose subagent wants a
      read-only $(...) substitution is reviewed rather than silently denied). Empty (default)
      = no reviewer (children auto-deny). The TRUSTED policy-rubric file is NOT an input —
      see the action header.
    required: false
    default: ""
  subagent-ask-reviewer-max-denies:
    description: >-
      Circuit breaker for --subagent-ask-reviewer: consecutive non-allow outcomes that
      disable the reviewer for the rest of the run. Empty (default) uses the binary's
      default (3).
    required: false
    default: ""
  pr-body-template:
    description: >-
      OPTIONAL path (relative to the checkout) to a PR-body template with {{placeholder}}
      tokens, consumed by publish.sh. When empty (default), publish.sh uses
      .github/mecatequi/pr-body.md if present, else the built-in rich body. The trust caveat
      is ALWAYS force-prepended regardless of the template — a custom template cannot drop it,
      and you must NOT add your own caveat line in the template or you get a duplicate.
      Substitution is literal + single-pass; unknown {{tokens}} are left intact. See
      docs/design/MECATEQUI.md for the full placeholder list. NOTE: this action runs the AGENT
      (no GitHub token); publish.sh runs in the separate privileged job, so a workflow that
      calls publish.sh directly threads this via the MQ_PR_BODY_TEMPLATE env — this input is
      the documented surface + the threading point when publish.sh is wrapped in a composite.
    required: false
    default: ""
  pr-title-template:
    description: >-
      OPTIONAL path (relative to the checkout) to a one-line PR-title template (same
      placeholders as pr-body-template), consumed by publish.sh via MQ_PR_TITLE_TEMPLATE.
      When empty (default), the title is the triggering issue's own title as
      "<issue title> (#<n>)", falling back to "mecatequi: changes for issue #<n>" when the
      issue title cannot be fetched. A template here overrides that default.
      Use the SHORT placeholders in a title ({{issue_ref}}, {{stop_reason}}, {{branch}});
      prose placeholders like {{what_agent_did}} or {{summary_table}} flatten to one
      unwieldy line.
    required: false
    default: ""
  out-diff:
    description: Where the working-tree git patch is written.
    required: false
    default: ${{ runner.temp }}/mecatequi.patch
  out-summary:
    description: >-
      Where the run-summary JSON is written. A FILE (not "-") so logs never collide and
      the JSON stays clean for jq.
    required: false
    default: ${{ runner.temp }}/mecatequi.summary.json
  out-events:
    description: Where the durable event log (JSONL) is written.
    required: false
    default: ${{ runner.temp }}/mecatequi.events.jsonl
outputs:
  patch-path:
    description: Path to the working-tree git patch the run produced.
    value: ${{ steps.run.outputs.patch-path }}
  summary-path:
    description: Path to the run-summary JSON (the ROBUST result channel — read this, not summary-json, for anything large).
    value: ${{ steps.run.outputs.summary-path }}
  events-path:
    description: Path to the durable event log (JSONL). Tracks the out-events input so an override is never silently missed.
    value: ${{ steps.run.outputs.events-path }}
  summary-json:
    description: >-
      The run-summary JSON compacted to one line (jq -c .). BEST-EFFORT and size-bounded:
      $GITHUB_OUTPUT has a cap, so for a large summary read summary-path instead.
    value: ${{ steps.run.outputs.summary-json }}
  stop-reason:
    description: The terminal session stop reason (jq -r .stop_reason).
    value: ${{ steps.run.outputs.stop-reason }}
  non-empty-diff:
    description: Whether the run left a working-tree change (jq -r .non_empty_diff).
    value: ${{ steps.run.outputs.non-empty-diff }}
  exit-class:
    description: >-
      Derived from the captured process exit code — clean (0), run-failure (1), or
      setup-failure (2). The caller branches on this instead of the raw code.
    value: ${{ steps.run.outputs.exit-class }}

runs:
  using: composite
  steps:
    # ── Toolchain provision ───────────────────────────────────────────────────────
    # Provision Go from the ACTION's own go.mod (the single source of truth for the required
    # toolchain), so the runner's preinstalled Go never decides the build. $GITHUB_ACTION_PATH
    # is .github/actions/mecatequi/, so the repo-root go.mod is at ../../../go.mod. Mirrors
    # matlatl's `go-version-file: ${{ github.action_path }}/go.mod`, adjusted for the subdir.
    # SHA-pinned to the house set (matches ci.yml / release.yml).
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ github.action_path }}/../../../go.mod
        cache: true
        cache-dependency-path: ${{ github.action_path }}/../../../go.sum

    # ── Binary acquisition (build from the action's OWN checkout) ──────────────────
    # ISOLATED on purpose. To swap to a signed/checksum-verified release asset later, drop
    # this step plus the setup-go step above and replace them with a download+cosign-verify;
    # the run step below reads "$RUNNER_TEMP/mecatequi" regardless.
    #
    # `go build -C "$GITHUB_ACTION_PATH/../../.."` compiles the action's own source tree —
    # the local checkout for self-use, or the tag GitHub checked out for `uses: …@<tag>`.
    # GOTOOLCHAIN=local is satisfied by the provisioned toolchain; GOFLAGS=-mod=readonly
    # forbids module-graph edits. NO token, NO GOPRIVATE — the action source IS the input.
    - name: Acquire mecatequi binary
      shell: bash
      env:
        REPO_ROOT: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        export GOTOOLCHAIN=local
        export GOFLAGS=-mod=readonly
        go build -C "${REPO_ROOT}" -o "${RUNNER_TEMP}/mecatequi" ./cmd/mecatequi
        echo "Built mecatequi from the action checkout at ${RUNNER_TEMP}/mecatequi"

    # ── Run (Finding B mitigation lives in the WORKFLOW, not here): capture rc, never
    # fail the step ───────────────────────────────────────────────────────────────────
    # The prompt reaches the binary ONLY via --prompt-file; the file path is passed via
    # an env var, never an inline interpolation of any event-derived value. We compute the
    # exit code with `set +e; ...; rc=$?; set -e` so a run-failure (rc=1) or setup-failure
    # (rc=2) does NOT fail this composite step — the CALLER inspects `exit-class` and
    # decides. A missing summary file (a build/flag failure before any summary was written)
    # still yields a safe exit-class=setup-failure with empty summary fields.
    - name: Run mecatequi
      id: run
      shell: bash
      env:
        MQ_PROMPT_FILE: ${{ inputs.prompt-file }}
        MQ_UNTRUSTED: ${{ inputs.untrusted }}
        MQ_INSTRUCTIONS: ${{ inputs.instructions }}
        MQ_WORKSPACE: ${{ inputs.workspace }}
        MQ_POSTURE: ${{ inputs.posture }}
        MQ_TIMEOUT: ${{ inputs.timeout }}
        MQ_MAX_RUN_TOKENS: ${{ inputs.max-run-tokens }}
        MQ_MODEL: ${{ inputs.model }}
        MQ_DEFAULT_PROVIDER: ${{ inputs.default-provider }}
        MQ_DEFAULT_MODEL: ${{ inputs.default-model }}
        MQ_OPENAI: ${{ inputs.openai }}
        MQ_OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        MQ_GUARDRAILS_MODEL: ${{ inputs.guardrails-model }}
        MQ_ASK_REVIEWER: ${{ inputs.subagent-ask-reviewer }}
        MQ_ASK_REVIEWER_MAX_DENIES: ${{ inputs.subagent-ask-reviewer-max-denies }}
        MQ_OUT_DIFF: ${{ inputs.out-diff }}
        MQ_OUT_SUMMARY: ${{ inputs.out-summary }}
        MQ_OUT_EVENTS: ${{ inputs.out-events }}
      run: |
        set -euo pipefail

        if [ -z "${MQ_PROMPT_FILE}" ] || [ ! -f "${MQ_PROMPT_FILE}" ]; then
          echo "::error::prompt-file '${MQ_PROMPT_FILE}' is missing or empty; pass a file written from event data (never inline untrusted text)."
          exit 1
        fi

        # FAIL-SAFE untrusted parse: a security toggle must not silently flip OFF on a typo.
        # Normalise to lowercase; ONLY explicit false/0/no disable the fence — anything else
        # (incl. a near-miss "True", an empty value, a typo) keeps the fence ON.
        untrusted_norm="$(printf '%s' "${MQ_UNTRUSTED}" | tr '[:upper:]' '[:lower:]')"
        fence_on=true
        case "${untrusted_norm}" in
          false | 0 | no) fence_on=false ;;
        esac
        # openai is parsed with the same normalise (its fail-direction is benign — a
        # spurious --openai just forces a provider, never weakens a defence).
        openai_norm="$(printf '%s' "${MQ_OPENAI}" | tr '[:upper:]' '[:lower:]')"
        openai_on=false
        case "${openai_norm}" in
          true | 1 | yes) openai_on=true ;;
        esac

        # Build the argv as an ARRAY from env values — never string-interpolated. Each
        # event-derived value crosses as a discrete token, so no value can be re-parsed
        # as a flag or a shell metacharacter.
        args=(
          --prompt-file "${MQ_PROMPT_FILE}"
          --workspace "${MQ_WORKSPACE}"
          --posture "${MQ_POSTURE}"
          --timeout "${MQ_TIMEOUT}"
          --headless=true
          --out-diff "${MQ_OUT_DIFF}"
          --out-summary "${MQ_OUT_SUMMARY}"
          --out-events "${MQ_OUT_EVENTS}"
        )
        [ "${fence_on}" = "true" ] && args+=( --untrusted-prompt )
        [ -n "${MQ_INSTRUCTIONS}" ] && args+=( --instructions "${MQ_INSTRUCTIONS}" )
        [ -n "${MQ_MAX_RUN_TOKENS}" ] && args+=( --max-run-tokens "${MQ_MAX_RUN_TOKENS}" )
        [ -n "${MQ_MODEL}" ] && args+=( --model "${MQ_MODEL}" )
        [ -n "${MQ_DEFAULT_PROVIDER}" ] && args+=( --default-provider "${MQ_DEFAULT_PROVIDER}" )
        [ -n "${MQ_DEFAULT_MODEL}" ] && args+=( --default-model "${MQ_DEFAULT_MODEL}" )
        [ "${openai_on}" = "true" ] && args+=( --openai )
        [ -n "${MQ_OPENAI_BASE_URL}" ] && args+=( --openai-base-url "${MQ_OPENAI_BASE_URL}" )
        [ -n "${MQ_GUARDRAILS_MODEL}" ] && args+=( --guardrails-model "${MQ_GUARDRAILS_MODEL}" )
        [ -n "${MQ_ASK_REVIEWER}" ] && args+=( --subagent-ask-reviewer "${MQ_ASK_REVIEWER}" )
        [ -n "${MQ_ASK_REVIEWER_MAX_DENIES}" ] && args+=( --subagent-ask-reviewer-max-denies "${MQ_ASK_REVIEWER_MAX_DENIES}" )

        # Capture the exit code WITHOUT failing the step. The binary writes the summary to
        # a FILE, so its stdout is free; operational logs + the per-event trace go to its
        # stderr, which the runner captures in the step log.
        set +e
        "${RUNNER_TEMP}/mecatequi" "${args[@]}"
        rc=$?
        set -e
        echo "mecatequi exited rc=${rc}"

        # Map the raw exit code to a stable class the caller branches on.
        case "${rc}" in
          0) exit_class=clean ;;
          1) exit_class=run-failure ;;
          2) exit_class=setup-failure ;;
          *) exit_class=setup-failure ;;
        esac

        # Read the summary fields from the FILE. A missing/empty file (a failure before any
        # summary was written) degrades to empty/false defaults and exit-class stays as
        # captured — never a crash.
        summary_json='{}'
        stop_reason=''
        non_empty_diff='false'
        if [ -s "${MQ_OUT_SUMMARY}" ]; then
          summary_json="$(jq -c . "${MQ_OUT_SUMMARY}")"
          stop_reason="$(jq -r '.stop_reason // ""' "${MQ_OUT_SUMMARY}")"
          non_empty_diff="$(jq -r '.non_empty_diff // false' "${MQ_OUT_SUMMARY}")"
        fi

        {
          echo "patch-path=${MQ_OUT_DIFF}"
          echo "summary-path=${MQ_OUT_SUMMARY}"
          echo "events-path=${MQ_OUT_EVENTS}"
          echo "summary-json=${summary_json}"
          echo "stop-reason=${stop_reason}"
          echo "non-empty-diff=${non_empty_diff}"
          echo "exit-class=${exit_class}"
        } >> "${GITHUB_OUTPUT}"
