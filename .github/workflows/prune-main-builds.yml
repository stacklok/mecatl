# Prunes old continuous main builds (continuous.yml) from GHCR. Only the four
# main/ packages are touched; release images and charts are never named here.
#
# Retention per package: every build younger than 7 days, plus the newest
# older ones (20 charts, 30 images). Images keep more than charts, so every kept
# chart still resolves its digest-pinned images even when a few runs failed
# between pushing an image and pushing the charts. Followers select the newest
# chart, so they never run a pruned build. Untagged leftovers of failed runs and
# signatures whose image is gone are removed once they pass the same age.
#
# ghcr-cleanup-action deletes a multi-arch image together with its platform
# manifests, its sha256-<digest>.{sig,att,sbom} tags, and its OCI referrers
# (the build-provenance attestations), so nothing a kept build needs is
# removed. Deleting a version needs the Admin role on the package, which the
# publishing repository holds for packages its GITHUB_TOKEN created.
name: Prune main builds

on:
  schedule:
    # Daily, off-peak UTC; the action's manifest cache expires after 7 idle days.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be deleted without deleting it'
        required: false
        type: boolean
        default: true

permissions: {}

# Never prune one package from two runs at once.
concurrency:
  group: prune-main-builds
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'stacklok/mecatl'
    name: Prune ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # list and delete package versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: mecatl/main/mecak8s, keep: 30}
          - {package: mecatl/main/studio, keep: 30}
          - {package: mecatl/main/charts/mecak8s, keep: 20}
          - {package: mecatl/main/charts/mecatl-studio, keep: 20}
    steps:
      # A package appears with its first main build; until then there is
      # nothing to prune.
      - name: Check that the package exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -eu
          encoded=$(jq -rn --arg p "$PACKAGE" '$p | @uri')
          if gh api "/orgs/${OWNER}/packages/container/${encoded}" --silent 2> lookup.err; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' lookup.err; then
            echo "::notice title=Nothing to prune::${PACKAGE} has not been published yet."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat lookup.err >&2
            exit 1
          fi

      - name: Prune old versions
        if: steps.exists.outputs.found == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.package }}
          older-than: 7 days
          keep-n-tagged: ${{ matrix.keep }}
          delete-untagged: true
          delete-orphaned-images: true
          validate: true
          # Scheduled runs delete; a manual run defaults to a dry run.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
