# kind-based k8s e2e suite for mecak8s.
#
# Spins a real kind cluster + Redis StatefulSet + two storage-free mecak8s agent
# replicas and asserts lease exclusion, graceful failover, session persistence,
# and caller identity against an in-cluster Dex OIDC provider. The suite lives
# under e2e/k8s/ (build tag `kind_e2e`); `task e2e:k8s` runs
# `GOWORK=off go test -tags kind_e2e -count=1 -timeout 30m ./e2e/k8s/...`. Slow
# (~5-8 min) and needs Docker, so it is NOT part of `task test` and runs only on
# changes (the mecak8s binary, the Redis store, the server surface it composes, the
# deploy manifests, the suite itself, and the build config).
#
# Trigger model:
#   - push to main, pull_request — both gated by a `paths:` filter so an unrelated
#     doc-only or engine-only PR never pays the kind spin-up cost.
#   - pull_request omits the untracked go.work.sum; push to main still covers it.
#     Taskfile.yml stays: it defines the qualification entry points.
#   - Only same-repository release/* PRs authored by toolhive-release-app[bot]
#     skip both jobs; a contributor-controlled branch name alone cannot skip CI.
#
# Deliberately uses `pull_request` (NOT `pull_request_target`): this job checks out
# and executes untrusted PR code, so it must run WITHOUT access to repo secrets —
# the same pwn-request rationale as ci.yml. The suite is fully offline (no provider
# key); the image is built into the local Docker daemon under a ko.local ref with
# no registry push, so no credentials are needed at all.
#
# All third-party actions are SHA-pinned (with a # vX.Y.Z comment) so a re-pointed
# tag from a compromised maintainer cannot change what runs here. Pins match the
# Stacklok house set used in ci.yml / e2e-live.yml.
name: k8s-e2e

on:
  workflow_dispatch:
    inputs:
      natural_expiry:
        description: Include long deployed mecak8s automatic TLS reload proof across natural expiry
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - cmd/mecak8s/**
      - internal/cliconfig/**
      - adapters/redisstore/**
      - adapters/go.mod
      - adapters/go.sum
      - internal/adaptersupport/**
      - contracts/gen/go/mecatl/driver/**
      - go.work
      - go.work.sum
      - internal/adapter/server/authn.go
      - internal/adapter/server/service.go
      - internal/adapter/server/errors.go
      - internal/adapter/server/grpc.go
      - internal/adapter/server/http.go
      - deploy/helm/mecak8s/**
      - deploy/helm/mecatl-execution/**
      - cmd/mecatl-execution-provider/**
      - cmd/mecatl-executor/**
      - internal/adapter/executioncontroller/**
      - internal/adapter/executionclient/**
      - internal/executionenv/**
      - contracts/proto/mecatl/execution/**
      - e2e/k8s_execution/**
      - deploy/mecatl-execution-kind/**
      - deploy/execution-templates/**
      - build/execution-provider/Dockerfile
      - build/execution-workload/Dockerfile
      - e2e/k8s/**
      - go.mod
      - go.sum
      - .ko.yaml
      - Taskfile.yml
      - .github/workflows/k8s-e2e.yml
  pull_request:
    paths:
      - cmd/mecak8s/**
      - internal/cliconfig/**
      - adapters/redisstore/**
      - adapters/go.mod
      - adapters/go.sum
      - internal/adaptersupport/**
      - contracts/gen/go/mecatl/driver/**
      - go.work
      - internal/adapter/server/authn.go
      - internal/adapter/server/service.go
      - internal/adapter/server/errors.go
      - internal/adapter/server/grpc.go
      - internal/adapter/server/http.go
      - deploy/helm/mecak8s/**
      - deploy/helm/mecatl-execution/**
      - cmd/mecatl-execution-provider/**
      - cmd/mecatl-executor/**
      - internal/adapter/executioncontroller/**
      - internal/adapter/executionclient/**
      - internal/executionenv/**
      - contracts/proto/mecatl/execution/**
      - e2e/k8s_execution/**
      - deploy/mecatl-execution-kind/**
      - deploy/execution-templates/**
      - build/execution-provider/Dockerfile
      - build/execution-workload/Dockerfile
      - e2e/k8s/**
      - go.mod
      - go.sum
      - .ko.yaml
      - Taskfile.yml
      - .github/workflows/k8s-e2e.yml

# Least-privilege: the job only reads source. The suite is fully offline; no
# registry push and no API write are needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a force-push doesn't pile up minutes
# (same shape as ci.yml).
concurrency:
  group: k8s-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  k8s-e2e:
    name: k8s e2e (kind)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'toolhive-release-app[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-24.04
    # `task e2e:k8s` has a 30m `go test -timeout`; setup and build consume this
    # job budget too. Leave the suite enough outer-deadline margin to emit its
    # diagnostics and upload the tee'd failure log.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - id: go-cache
        uses: ./.github/actions/go-cache-restore
        with:
          family: go-k8s-e2e

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Validate the chart's default + oidc.enabled renders before the runtime
      # suite. The Dex fixture adds its test-only private-issuer relaxation
      # imperatively, so it cannot prove the operator-facing chart remains safe
      # or well-formed. Match the Helm version used to package releases.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Install deploy manifest validators
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0

      - name: Run Helm unit tests
        run: task deploy:helm-unittest

      - name: task deploy:check
        run: task deploy:check

      # kind: pinned version, installed via `go install` (no third-party action —
      # the house idiom for go-installable tools, matching actionlint/govulncheck
      # in ci.yml). v0.33.0 is the current release.
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      # ko: pinned version, same `go install` idiom. v0.18.1 builds the mecak8s
      # image from .ko.yaml onto the distroless base. KO_DOCKER_REPO=ko.local below
      # loads it into the local container daemon with no registry push.
      - name: Install ko
        run: go install github.com/google/ko@v0.18.1

      # kubectl is pre-installed on ubuntu-24.04 runners.

      # `task e2e:k8s` == `task build` (deps), then
      # `GOWORK=off go test -tags kind_e2e -count=1 -timeout 30m ./e2e/k8s/...`.
      # The suite builds the image with `ko build` under a deterministic
      # ko.local/mecak8s:e2e ref (the test itself pins KO_DOCKER_REPO, so this
      # step's env is a documentation-only fallback), then `<runtime> save` +
      # `kind load image-archive` loads the tarball into the kind node —
      # bypassing `kind load docker-image`'s containerd-snapshotter bridge, which
      # fails on the runner's Docker daemon ("failed to detect containerd
      # snapshotter"). No podman needed. It then `helm upgrade --install`s the
      # deploy/helm/mecak8s chart with the Kind values profile. Output is teed so
      # the failure-artifact upload has the full log; explicit `shell: bash`
      # gives `-o pipefail` so the tee never masks a test failure.
      - name: task e2e:k8s
        shell: bash
        env:
          KO_DOCKER_REPO: ko.local
        run: task e2e:k8s 2>&1 | tee k8s-e2e-output.log

      # Failure-only artifact upload (mirrors e2e-live.yml's pattern): the tee'd
      # test log is the deliverable of a failed run — it carries the full `go test`
      # output (kind bring-up, pod logs, assertion failures). if-no-files-found is
      # `warn` (not `ignore`) so a future regression in the tee path is VISIBLE in
      # the job log instead of silent.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-e2e-artifacts-${{ github.run_id }}
          path: k8s-e2e-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Save Go caches
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: ${{ steps.go-cache.outputs.path }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}

  # Sharded across independent Kind clusters; deploy/mecatl-execution-kind/shards.txt
  # assigns every cluster test to one shard, and shards_test.go keeps that table,
  # the test functions, and this matrix in agreement.
  execution-production-e2e:
    name: execution provider production profile (kind, shard ${{ matrix.shard }})
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'toolhive-release-app[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-24.04
    strategy:
      # Every shard's result is independent evidence; don't cancel siblings.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Per shard: ~10m provisioning + serial tests (45m ceiling) + the in-flight
    # renewal phase (10m ceiling, owning shard only) + cleanup. Only explicit
    # manual qualification adds natural expiry (80m) on its owning shard.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.natural_expiry && 210 || 75 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The job above caches non-trimpath compiles under its own family, which
      # never warms ko's -trimpath builds. This job owns its own entry:
      # restored everywhere, saved once per go.sum by shard 1 outside PRs.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: k8s-execution-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum', 'engine/go.sum', 'adapters/go.sum', 'internal/adaptersupport/go.sum', 'contracts/gen/go/mecatl/driver/go.sum') }}
          restore-keys: |
            k8s-execution-go-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Install pinned Kind and ko
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          go install github.com/google/ko@v0.18.1
      - name: Run production execution qualification
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          MECATL_EXECUTION_QUAL_CI: "1"
          MECATL_EXECUTION_QUAL_SHARD: ${{ matrix.shard }}
          MECATL_EXECUTION_QUAL_NATURAL_EXPIRY: ${{ github.event_name == 'workflow_dispatch' && inputs.natural_expiry && '1' || '0' }}
        run: task e2e:k8s:execution:production
      # Build outputs are content-addressed, so a failed qualification still
      # leaves a valid cache. PR refs never save: their entries are visible only
      # to the same PR and would churn the repository's 10GB cache budget.
      - name: Save Go caches
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.shard == 1 && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Upload bounded failure artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-e2e-artifacts-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: .scratch/k8s-execution/*/production-failure-artifact.txt
          retention-days: 7
          if-no-files-found: warn
