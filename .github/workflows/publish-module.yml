# Tooling is always the dispatch's immutable github.sha, never source/parent.
# Writers use GitHub APIs only: no candidate checkout, Go, Task, hooks or caches.
name: Publish one Go module

on:
  workflow_call:
    inputs:
      module:
        description: 'Known module directory; absent from versions means pass through'
        type: string
        required: true
      source:
        type: string
        required: true
      versions:
        type: string
        required: true
      branch:
        type: string
        required: true
      parent:
        description: 'Head returned only after the preceding public proof'
        type: string
        required: true
    outputs:
      head:
        description: 'Publicly verified commit, or unchanged parent when unselected'
        value: ${{ jobs.prove.outputs.head }}

permissions:
  contents: read

env:
  SOURCE: ${{ inputs.source }}
  VERSIONS: ${{ inputs.versions }}
  MODULE: ${{ inputs.module }}
  PARENT: ${{ inputs.parent }}
  BRANCH: ${{ inputs.branch }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - name: Select without checking out or executing candidate code
        id: select
        run: >-
          python3 tooling/.github/scripts/module-publication.py prepare --selection-only
          --module "$MODULE" --source "$SOURCE" --versions "$VERSIONS"
          --parent "$PARENT" --root "$GITHUB_WORKSPACE/candidate"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.select.outputs.selected == 'true'
        with:
          ref: ${{ inputs.parent }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Refresh main and tags without persisted credentials
        if: steps.select.outputs.selected == 'true'
        run: git -C candidate fetch --force origin main --tags
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.select.outputs.selected == 'true'
        with:
          go-version-file: tooling/go.work
          cache: false
      - name: Prepare and test exact metadata without write credentials
        if: steps.select.outputs.selected == 'true'
        run: >-
          python3 tooling/.github/scripts/module-publication.py prepare
          --module "$MODULE" --source "$SOURCE" --versions "$VERSIONS" --parent "$PARENT"
          --root "$GITHUB_WORKSPACE/candidate" --metadata "$RUNNER_TEMP/metadata.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.select.outputs.selected == 'true'
        id: upload
        with:
          name: ${{ steps.select.outputs.artifact-name }}
          path: ${{ runner.temp }}/metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/prepared
          merge-multiple: true
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit exact tested bytes and create immutable lightweight tag
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python3 tooling/.github/scripts/module-publication.py publish
          --module "$MODULE" --source "$SOURCE" --versions "$VERSIONS" --parent "$PARENT"
          --branch "$BRANCH" --metadata "$RUNNER_TEMP/prepared/metadata.json"

  prove:
    needs: [prepare, publish]
    # A selected writer must succeed; only an unselected writer may be skipped.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          ((needs.prepare.outputs.selected == 'true' && needs.publish.result == 'success') ||
           (needs.prepare.outputs.selected == 'false' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head: ${{ steps.prove.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: tooling
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.prepare.outputs.selected == 'true'
        with:
          go-version-file: tooling/go.work
          cache: false
      - name: Public proxy and checksum consumer proof, or unselected pass-through
        id: prove
        env:
          HEAD: ${{ needs.prepare.outputs.selected == 'true' && needs.publish.outputs.head || inputs.parent }}
        run: >-
          python3 tooling/.github/scripts/module-publication.py prove
          --module "$MODULE" --versions "$VERSIONS" --head "$HEAD"
