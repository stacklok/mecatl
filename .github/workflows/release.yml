# Publishes and signs the mecated, mecatui, and mecak8s images, the Slack bot
# example image, the Mecatl Studio image (early access, ADR 0351), the mecak8s
# Helm chart, and the mecated+mecatui CLI archives (a GitHub Release plus a
# stacklok/homebrew-tap formula) from root `v*` tags or an explicitly selected tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run hook for re-publishing a tag's artifacts (e.g. after a
  # transient registry failure). Re-running re-signs idempotently.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)publish'
        required: true
        type: string

# Least-privilege default. Jobs elevate individually, and only to exactly what
# they need: ko-push + cosign-keyless for image jobs, `contents: write` for the
# release creator and release-asset publishers, and artifact attestations where
# applicable.
permissions:
  contents: read

# Never run two releases for the same tag concurrently. Keyed on the TAG, not
# github.ref: on workflow_dispatch github.ref is refs/heads/main while on a tag
# push it is refs/tags/vX.Y.Z, so a ref-keyed group would let a dispatch
# re-publish of vX.Y.Z run alongside the original tag-push run. The ko jobs
# tolerate that; a GitHub Release object and a cross-repo tap commit do not.
# Do NOT cancel in progress — a half-signed release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  # A v* tag can be created from ANY commit — GitHub cannot branch-filter a tag trigger — so
  # "the tag is on main" has to be checked at run time. It used to be checked in publish-cli
  # ONLY, which left the five image/chart jobs publishing cosign-signed, SLSA-attested
  # artifacts from a tag cut on an unreviewed branch. That is the bypass around the release-PR
  # flow, so the check gates every publishing job now.
  #
  # A shared job rather than the same four lines copied six times. publish-cli deliberately
  # KEEPS its own inline copy as well (like the pin gate it repeats): it is the one job that
  # writes outside this repository, so it re-verifies rather than inheriting.
  guard:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/tags/{0}', inputs.tag))
    name: Verify immutable release tag
    runs-on: ubuntu-24.04
    # 10, not 5: the v0.0.35 release was LOST because an unfiltered depth-0 clone
    # took 5m18s and tripped a 5-minute cap, skipping all six publish jobs. The
    # blob filter below removes the cause; this removes the cliff, so a slow
    # network cannot silently cost a release again.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    env:
      # On workflow_dispatch github.ref_name is the default branch, so prefer the
      # explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          # The guard implementation is trusted only from protected main. The tag
          # and dispatch input remain data verified by that implementation.
          ref: refs/heads/main

      - name: Verify and check out the immutable release tag
        id: verify
        run: .github/scripts/release-tag-guard.sh

  validate-release-ref:
    needs: guard
    name: Validate immutable release tag ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    outputs:
      signing_ref: ${{ steps.validate.outputs.signing_ref }}
    steps:
      - name: Require the run itself to use the requested tag ref
        id: validate
        run: |
          set -euo pipefail
          case "${VERSION}" in v*) ;; *) echo "release version must name a v* tag: ${VERSION}" >&2; exit 1 ;; esac
          signing_ref="refs/tags/${VERSION}"
          if [ "${GITHUB_REF}" != "${signing_ref}" ]; then
            echo "release ref mismatch: got ${GITHUB_REF}, want ${signing_ref}" >&2
            exit 1
          fi
          echo "signing_ref=${signing_ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Assert guard and immutable run commits agree
        env:
          RELEASE_COMMIT: ${{ needs.guard.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"

  publish:
    name: Build, publish, sign, attest
    needs: [guard, validate-release-ref]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: ghcr login, cosign keyless signing AND provenance
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      # ghcr.io/<owner>/<repo>, lowercased by GHCR. ko appends the binary import
      # path unless --bare is used (we use --bare, matching the Taskfile).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ko reads the base image digest from .ko.yaml; no deep history needed.
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (go.work monorepo); its go.sum is part of
          # the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            environment/microvm/go.sum

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # OIDC-backed registry login. The GITHUB_TOKEN is scoped to this repo's
      # packages by the job `permissions.packages: write` above — no PAT, no
      # username/password stored in secrets.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Unwraps the plain ingest key from the MECATL_METRICS_KEY secret's
      # {"mecatl": "<key>"} JSON blob (stacklok/infra#5604's ExternalSecret
      # mirrors the same AWS Secrets Manager property shape) into
      # MECATL_METRICS_INGEST_KEY, which .ko.yaml's ldflags read. GitHub
      # already masks the raw secret in logs; ::add-mask:: additionally masks
      # the unwrapped value, since deriving it doesn't inherit that automatically.
      # An absent/empty secret degrades to a disabled pipeline (a bare `=`
      # ldflag) rather than failing the release — only a SET-but-malformed
      # secret (present, but no non-empty .mecatl property) is a hard error,
      # since that is a real misconfiguration worth surfacing immediately.
      - name: Extract the product-metrics ingest key
        env:
          MECATL_METRICS_KEY: ${{ secrets.MECATL_METRICS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MECATL_METRICS_KEY" ]; then
            echo "::warning::MECATL_METRICS_KEY secret is not set; this build will ship with product metrics disabled"
            exit 0
          fi
          key=$(printf '%s' "$MECATL_METRICS_KEY" | jq -r '.mecatl // empty')
          if [ -z "$key" ]; then
            echo "::error::MECATL_METRICS_KEY secret is set but has no non-empty .mecatl property"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "MECATL_METRICS_INGEST_KEY=$key" >> "$GITHUB_ENV"

      # Build multi-arch, push by digest, and have ko generate + push an SPDX
      # SBOM next to the image. --bare keeps the repo path clean (no import-path
      # suffix), matching `task ko:publish`. We tag both the version and latest.
      # The digest is captured for signing so we sign the immutable artifact,
      # not a mutable tag.
      - name: Build and push image (+ SBOM)
        id: build
        run: |
          set -euo pipefail
          # --image-refs writes the fully-qualified pushed refs (one per line,
          # including the @sha256 digest) to a file; ko's build logs go to
          # stderr, so reading the file avoids any log interleaving.
          KO_DOCKER_REPO="${KO_DOCKER_REPO}" ko build \
            --platform=linux/amd64,linux/arm64 \
            --bare \
            --sbom=spdx \
            -t "${VERSION}" -t latest \
            --image-refs=image-refs.txt \
            --image-label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --image-label=org.opencontainers.image.title=mecated \
            --image-label=org.opencontainers.image.revision=${{ needs.guard.outputs.commit }} \
            --image-label=org.opencontainers.image.vendor=Stacklok \
            ./cmd/mecated
          # The digest ref is the same image regardless of tag; take the first.
          digest="$(head -n1 image-refs.txt)"
          # Write the three step outputs in ONE redirect group (shellcheck SC2129).
          # attest-build-provenance wants the repo name and the sha256 digest
          # split apart, so derive both from the immutable ref ko just pushed.
          {
            echo "digest=${digest}"
            echo "image_name=${digest%@*}"
            echo "image_digest=${digest##*@}"
          } >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Keyless sign the image BY DIGEST. --yes skips the confirmation prompt;
      # the OIDC identity (this workflow) is logged to Rekor automatically.
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      # ko already pushed the SBOM as an OCI artifact; additionally attach it as
      # a signed cosign attestation so it is covered by the same Sigstore
      # transparency guarantees as the signature.
      - name: Generate SBOM file
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # SBOM is attested below; don't also publish it as a release asset.
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}"

      # SLSA build provenance for the published image. GitHub's native
      # attestation generates a signed SLSA provenance predicate, keyless via
      # the same Sigstore (Fulcio/Rekor) machinery as the cosign steps, and
      # stores it with the image in GHCR. The subject is the IMMUTABLE digest
      # ko produced (subject-name = repo, subject-digest = sha256:...), never a
      # mutable tag, so the provenance binds to the exact artifact. push-to-
      # registry uploads the attestation as an OCI referrer of the image, so
      # `cosign verify-attestation` / `gh attestation verify` can find it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true
          # attest-build-provenance defaults create-storage-record to true whenever
          # push-to-registry is set, which then needs an `artifact-metadata: write`
          # permission and emits two warnings per job when it is absent (8 per
          # release, present since at least v0.0.29). We do not consume GitHub's
          # artifact-metadata index — the attestation itself is what
          # `gh attestation verify` / `cosign verify-attestation` read, and it
          # succeeds regardless. Granting the permission is not currently an option:
          # actionlint v1.7.7 rejects `artifact-metadata` as an unknown scope, so it
          # would fail `task lint:actions`. Declare the feature off instead of
          # silently failing at it.
          create-storage-record: false

  create-release:
    name: Create GitHub Release
    needs: validate-release-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release before asset uploads
        run: gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes

  # The opt-in nested module ships host microvmd and Linux guest-agent payloads
  # separately from the standard container images. Every published byte is
  # digest-addressed, signed, SBOM-described, and provenance-attested.
  publish-microvm:
    name: Publish microVM artifacts (${{ matrix.platform }})
    needs: [validate-release-ref, create-release, endorse-brood-resolution]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload immutable release assets
      id-token: write # keyless Sigstore evidence
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-arm64]
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      SIGNING_REF: ${{ needs.validate-release-ref.outputs.signing_ref }}
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: environment/microvm/go.mod
          cache: true
          cache-dependency-path: |
            engine/go.sum
            environment/microvm/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download controlled Brood platform resolution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brood-endorsed-platforms
          path: dist/brood

      - name: Verify endorsed Brood index and platform resolution
        run: .github/scripts/verify-brood-resolution.sh dist/brood/brood-base-index.json dist/brood/brood-platforms.json

      - name: Reuse a complete immutable platform asset set
        id: existing-assets
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/reuse-platform-release-assets.sh "${VERSION}" microvm "${PLATFORM}" "${VERSION}" "dist/${PLATFORM}"

      - name: Build deterministic microvmd and guest payloads
        if: steps.existing-assets.outputs.reused != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux-amd64) guest_arch=amd64 ;;
            linux-arm64|darwin-arm64) guest_arch=arm64 ;;
            *) echo "unsupported platform ${PLATFORM}" >&2; exit 2 ;;
          esac
          export MICROVM_RELEASE_EXECUTION_IMAGE_REF
          export MICROVM_RELEASE_EXECUTION_IMAGE_MANIFEST_DIGEST
          export MICROVM_RELEASE_EXECUTION_IMAGE_TREE_DIGEST
          export MICROVM_RELEASE_EXECUTION_IMAGE_DISCOVERY_REFERENCE
          export MICROVM_RELEASE_EXECUTION_IMAGE_RESOLUTION_EVIDENCE
          export MICROVM_RELEASE_EXECUTION_IMAGE_PLATFORM
          MICROVM_RELEASE_EXECUTION_IMAGE_REF="$(jq -er --arg arch "${guest_arch}" '.[$arch].reference' dist/brood/brood-platforms.json)"
          MICROVM_RELEASE_EXECUTION_IMAGE_MANIFEST_DIGEST="$(jq -er --arg arch "${guest_arch}" '.[$arch].manifest_digest' dist/brood/brood-platforms.json)"
          MICROVM_RELEASE_EXECUTION_IMAGE_TREE_DIGEST="$(jq -er --arg arch "${guest_arch}" '.[$arch].tree_digest' dist/brood/brood-platforms.json)"
          MICROVM_RELEASE_EXECUTION_IMAGE_DISCOVERY_REFERENCE="$(jq -er --arg arch "${guest_arch}" '.[$arch].discovery_reference' dist/brood/brood-platforms.json)"
          MICROVM_RELEASE_EXECUTION_IMAGE_RESOLUTION_EVIDENCE="$(jq -er --arg arch "${guest_arch}" '.[$arch].resolution_evidence' dist/brood/brood-platforms.json)"
          MICROVM_RELEASE_EXECUTION_IMAGE_PLATFORM="$(jq -er --arg arch "${guest_arch}" '.[$arch].platform' dist/brood/brood-platforms.json)"
          .github/scripts/package-microvm-release.sh "dist/${PLATFORM}" "${PLATFORM}" "${VERSION}"

      - name: Generate microvmd dependency SBOM
        if: steps.existing-assets.outputs.reused != 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/${{ matrix.platform }}/mecatl-microvmd-${{ matrix.platform }}
          format: spdx-json
          output-file: dist/${{ matrix.platform }}/mecatl-microvmd-${{ matrix.platform }}.spdx.json
          upload-artifact: false

      - name: Generate guest-agent dependency SBOM
        if: steps.existing-assets.outputs.reused != 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/${{ matrix.platform }}/mecatl-guest-agent-${{ matrix.platform }}
          format: spdx-json
          output-file: dist/${{ matrix.platform }}/mecatl-guest-agent-${{ matrix.platform }}.spdx.json
          upload-artifact: false

      - name: Generate artifact-digest dependency SBOM
        if: steps.existing-assets.outputs.reused != 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/${{ matrix.platform }}/mecatl-artifact-digest-${{ matrix.platform }}
          format: spdx-json
          output-file: dist/${{ matrix.platform }}/mecatl-artifact-digest-${{ matrix.platform }}.spdx.json
          upload-artifact: false

      - name: Sign provenance statements (keyless Sigstore)
        if: steps.existing-assets.outputs.reused != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/sign-microvm-release-evidence.sh "dist/${PLATFORM}"

      - name: Assemble versioned platform bootstrap bundle
        if: steps.existing-assets.outputs.reused != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bundle="mecatl-microvm-${VERSION}-${PLATFORM}.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --exclude="${bundle}" -C "dist/${PLATFORM}" -cf - . | gzip -n > "dist/${PLATFORM}/${bundle}"
          sha="$(sha256sum "dist/${PLATFORM}/${bundle}" | cut -d' ' -f1)"
          signing_ref="${{ needs.validate-release-ref.outputs.signing_ref }}"
          signing_ref="$(.github/scripts/validate-release-ref.sh "${VERSION}" "${signing_ref}")"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${signing_ref}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${bundle}"
          jq -n --arg version "${VERSION}" --arg platform "${PLATFORM}" --arg url "${url}" --arg sha256 "${sha}" \
            --arg policy_revision "release-${VERSION}" --arg certificate_identity "${identity}" \
            --arg oidc_issuer 'https://token.actions.githubusercontent.com' \
            '{version:$version,platform:$platform,url:$url,sha256:$sha256,policy_revision:$policy_revision,certificate_identity:$certificate_identity,oidc_issuer:$oidc_issuer}' \
            > "dist/${PLATFORM}/microvm-default-${PLATFORM}.json"

      - name: Upload microVM default metadata for mecatui packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-default-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/microvm-default-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload microVM release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          assets=()
          manifest=
          completion=
          for asset in dist/"${PLATFORM}"/*; do
            name="$(basename "${asset}")"
            if [ "${PLATFORM}" != linux-amd64 ] && [ "${name}" = install-microvm-release.sh ]; then
              continue
            fi
            case "${name}" in
              microvm-release-*.json) manifest="${asset}" ;;
              microvm-default-*.json) completion="${asset}" ;;
              *) assets+=("${asset}") ;;
            esac
          done
          # Payloads and their signed evidence land first. The release manifest is
          # published only after those assets, and the bootstrap defaults are the
          # final completion marker. A rerun can therefore resume an interrupted
          # payload upload without an incomplete set claiming completion.
          .github/scripts/upload-release-assets.sh "${VERSION}" "${assets[@]}"
          .github/scripts/upload-release-assets.sh "${VERSION}" "${manifest}"
          .github/scripts/upload-release-assets.sh "${VERSION}" "${completion}"

  resolve-brood-base:
    name: Resolve and freeze Brood Box platform bytes
    needs: [validate-release-ref, create-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      BROOD_DISCOVERY_REFERENCE: ghcr.io/stacklok/brood-box/base:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: environment/microvm/go.mod
      - name: Reuse the tag's frozen resolution or resolve it once
        run: |
          set -euo pipefail
          assets="$(gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          has_index=false
          has_platforms=false
          printf '%s\n' "${assets}" | grep -Fx brood-base-index.json >/dev/null && has_index=true
          printf '%s\n' "${assets}" | grep -Fx brood-platforms.json >/dev/null && has_platforms=true
          if ${has_index} && ${has_platforms}; then
            gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern brood-base-index.json --pattern brood-platforms.json
          elif ${has_index} || ${has_platforms}; then
            echo 'release contains an incomplete frozen Brood resolution' >&2
            exit 1
          else
            docker buildx imagetools inspect "${BROOD_DISCOVERY_REFERENCE}" --raw > brood-base-index.json
            resolution_evidence="sha256:$(sha256sum brood-base-index.json | cut -d' ' -f1)"
            mkdir -p brood-tree
            for arch in amd64 arm64; do
              manifest="$(jq -er --arg arch "${arch}" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("expected exactly one linux/" + $arch + " manifest") end' brood-base-index.json)"
              reference="ghcr.io/stacklok/brood-box/base@${manifest}"
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" GOWORK=off go build -trimpath -buildvcs=false -ldflags='-buildid=' -o "brood-tree/digest-${arch}" ./environment/microvm/cmd/mecatl-oci-tree-digest
              mkdir -p "brood-tree/cache-${arch}"
              tree="$(docker run --rm --platform "linux/${arch}" -v "${PWD}/brood-tree:/release" 'docker.io/library/alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce' "/release/digest-${arch}" "${reference}" "/release/cache-${arch}")"
              jq -n --arg reference "${reference}" --arg manifest_digest "${manifest}" --arg tree_digest "${tree}" \
                --arg discovery_reference "${BROOD_DISCOVERY_REFERENCE}" --arg resolution_evidence "${resolution_evidence}" --arg platform "linux/${arch}" \
                '{reference:$reference,manifest_digest:$manifest_digest,tree_digest:$tree_digest,discovery_reference:$discovery_reference,resolution_evidence:$resolution_evidence,platform:$platform}' > "brood-${arch}.json"
            done
            jq -s '{amd64:.[0],arm64:.[1]}' brood-amd64.json brood-arm64.json > brood-platforms.json
          fi
          .github/scripts/verify-brood-resolution.sh brood-base-index.json brood-platforms.json
          .github/scripts/upload-release-assets.sh "${VERSION}" brood-base-index.json brood-platforms.json
      - name: Upload frozen Brood resolution handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brood-platforms
          path: |
            brood-base-index.json
            brood-platforms.json
          if-no-files-found: error
          retention-days: 1

  endorse-brood-resolution:
    name: Verify Brood resolution for downstream endorsement
    needs: [validate-release-ref, resolve-brood-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brood-platforms
          path: dist/brood
      - name: Verify raw index evidence and platform cardinality
        run: .github/scripts/verify-brood-resolution.sh dist/brood/brood-base-index.json dist/brood/brood-platforms.json
      - name: Forward verified resolution to platform release jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brood-endorsed-platforms
          path: |
            dist/brood/brood-base-index.json
            dist/brood/brood-platforms.json
          if-no-files-found: error
          retention-days: 1

  # Release-stamped host binaries are the first-run bootstrap. Each platform
  # binary embeds only the matching digest-bound microVM bundle defaults and is
  # published as a signed/provenanced release asset. mecated is the canonical
  # operator surface; mecatui carries the same defaults for compatibility and
  # embedded-server use. This is deliberately separate from the optional OCI
  # images below.
  publish-mecatui-host:
    name: Publish host ${{ matrix.binary }} (${{ matrix.platform }})
    needs: [validate-release-ref, publish-microvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-arm64]
        binary: [mecated, mecatui]
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      SIGNING_REF: ${{ needs.validate-release-ref.outputs.signing_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            environment/microvm/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download matching microVM bootstrap defaults
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: microvm-default-${{ matrix.platform }}
          path: microvm-default
      - name: Reuse a complete immutable host asset set
        id: existing-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/reuse-platform-release-assets.sh "${VERSION}" "${{ matrix.binary }}" "${{ matrix.platform }}" "${VERSION}" dist
      - name: Build host binary with matching bootstrap defaults
        if: steps.existing-assets.outputs.reused != 'true'
        run: |
          set -euo pipefail
          platform='${{ matrix.platform }}'
          binary_name='${{ matrix.binary }}'
          case "${platform}" in
            linux-amd64) goos=linux; goarch=amd64 ;;
            linux-arm64) goos=linux; goarch=arm64 ;;
            darwin-arm64) goos=darwin; goarch=arm64 ;;
            *) echo "unsupported platform ${platform}" >&2; exit 2 ;;
          esac
          case "${binary_name}" in
            mecated) version_symbol=main.microVMReleaseVersion ;;
            mecatui) version_symbol=main.version ;;
            *) echo "unsupported host binary ${binary_name}" >&2; exit 2 ;;
          esac
          MICROVM_RELEASE_DEFAULTS_B64="$(jq -c --arg platform "${platform}" '{($platform):.}' "microvm-default/microvm-default-${platform}.json" | base64 -w0)"
          binary="dist/${binary_name}-${VERSION}-${platform}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X ${version_symbol}=${VERSION} -X main.microVMReleaseDefaultsB64=${MICROVM_RELEASE_DEFAULTS_B64} -X main.microVMReleaseStampRequired=release" \
            -o "${binary}" "./cmd/${binary_name}"
          digest="$(sha256sum "${binary}" | cut -d' ' -f1)"
          printf '%s  %s\n' "${digest}" "$(basename "${binary}")" > "${binary}.sha256"
      - name: Generate host binary SBOM
        if: steps.existing-assets.outputs.reused != 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/${{ matrix.binary }}-${{ env.VERSION }}-${{ matrix.platform }}
          format: spdx-json
          output-file: dist/${{ matrix.binary }}-${{ env.VERSION }}-${{ matrix.platform }}.spdx.json
          upload-artifact: false
      - name: Sign host binary (keyless Sigstore)
        if: steps.existing-assets.outputs.reused != 'true'
        run: |
          binary="dist/${{ matrix.binary }}-${VERSION}-${{ matrix.platform }}"
          cosign sign-blob --yes --bundle "${binary}.sigstore.json" "${binary}"
      - name: Attest host binary provenance
        if: steps.existing-assets.outputs.reused != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.binary }}-${{ env.VERSION }}-${{ matrix.platform }}
      - name: Upload host binary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="dist/${{ matrix.binary }}-${VERSION}-${{ matrix.platform }}"
          .github/scripts/upload-release-assets.sh "${VERSION}" "${prefix}"*

  # The mecatui image carries cmd/mecatui/kodata/agent.yaml through ko's kodata
  # support and identifies it with the org.stacklok.broodbox.agent OCI label.
  publish-mecatui:
    name: Build, publish, sign, attest mecatui
    needs: [guard, publish-microvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: ghcr login, cosign keyless signing AND provenance
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      # mecatui publishes under its own GHCR repo (/mecatui suffix) so the TUI
      # image is a sibling of the mecated image, not mixed into it. ko appends
      # the binary import path unless --bare is used (we use --bare).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/mecatui
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ko reads the base image digest from .ko.yaml; no deep history needed.
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Assert checkout is the immutable run commit
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Download versioned microVM platform defaults
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: microvm-default-*
          path: microvm-defaults
          merge-multiple: true

      - name: Stamp strict microVM release defaults
        run: |
          set -euo pipefail
          jq -s 'map({key:.platform,value:.}) | from_entries' microvm-defaults/microvm-default-*.json > microvm-defaults.json
          echo "MICROVM_RELEASE_DEFAULTS_B64=$(base64 -w0 microvm-defaults.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (go.work monorepo); its go.sum is part of
          # the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            environment/microvm/go.sum

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # OIDC-backed registry login. The GITHUB_TOKEN is scoped to this repo's
      # packages by the job `permissions.packages: write` above — no PAT, no
      # username/password stored in secrets.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Unwraps the plain ingest key from the MECATL_METRICS_KEY secret's
      # {"mecatl": "<key>"} JSON blob (stacklok/infra#5604's ExternalSecret
      # mirrors the same AWS Secrets Manager property shape) into
      # MECATL_METRICS_INGEST_KEY, which .ko.yaml's ldflags read. GitHub
      # already masks the raw secret in logs; ::add-mask:: additionally masks
      # the unwrapped value, since deriving it doesn't inherit that automatically.
      # An absent/empty secret degrades to a disabled pipeline (a bare `=`
      # ldflag) rather than failing the release — only a SET-but-malformed
      # secret (present, but no non-empty .mecatl property) is a hard error,
      # since that is a real misconfiguration worth surfacing immediately.
      - name: Extract the product-metrics ingest key
        env:
          MECATL_METRICS_KEY: ${{ secrets.MECATL_METRICS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MECATL_METRICS_KEY" ]; then
            echo "::warning::MECATL_METRICS_KEY secret is not set; this build will ship with product metrics disabled"
            exit 0
          fi
          key=$(printf '%s' "$MECATL_METRICS_KEY" | jq -r '.mecatl // empty')
          if [ -z "$key" ]; then
            echo "::error::MECATL_METRICS_KEY secret is set but has no non-empty .mecatl property"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "MECATL_METRICS_INGEST_KEY=$key" >> "$GITHUB_ENV"

      # Build multi-arch, push by digest, and have ko generate + push an SPDX
      # SBOM next to the image. --bare keeps the repo path clean (no import-path
      # suffix). We tag both the version and latest. The brood-box agent label
      # points at /var/run/ko/agent.yaml, where ko's kodata lands the manifest.
      # The digest is captured for signing so we sign the immutable artifact,
      # not a mutable tag.
      - name: Build and push image (+ SBOM)
        id: build
        run: |
          set -euo pipefail
          # --image-refs writes the fully-qualified pushed refs (one per line,
          # including the @sha256 digest) to a file; ko's build logs go to
          # stderr, so reading the file avoids any log interleaving.
          KO_DOCKER_REPO="${KO_DOCKER_REPO}" ko build \
            --platform=linux/amd64,linux/arm64 \
            --bare \
            --sbom=spdx \
            -t "${VERSION}" -t latest \
            --image-refs=image-refs.txt \
            --image-label=org.stacklok.broodbox.agent=/var/run/ko/agent.yaml \
            --image-label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --image-label=org.opencontainers.image.title=mecatui \
            --image-label=org.opencontainers.image.revision=${{ needs.guard.outputs.commit }} \
            --image-label=org.opencontainers.image.vendor=Stacklok \
            ./cmd/mecatui
          # The digest ref is the same image regardless of tag; take the first.
          digest="$(head -n1 image-refs.txt)"
          # Write the three step outputs in ONE redirect group (shellcheck SC2129).
          # attest-build-provenance wants the repo name and the sha256 digest
          # split apart, so derive both from the immutable ref ko just pushed.
          {
            echo "digest=${digest}"
            echo "image_name=${digest%@*}"
            echo "image_digest=${digest##*@}"
          } >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Keyless sign the image BY DIGEST. --yes skips the confirmation prompt;
      # the OIDC identity (this workflow) is logged to Rekor automatically.
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      # ko already pushed the SBOM as an OCI artifact; additionally attach it as
      # a signed cosign attestation so it is covered by the same Sigstore
      # transparency guarantees as the signature.
      - name: Generate SBOM file
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # SBOM is attested below; don't also publish it as a release asset.
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}"

      # SLSA build provenance for the published image. GitHub's native
      # attestation generates a signed SLSA provenance predicate, keyless via
      # the same Sigstore (Fulcio/Rekor) machinery as the cosign steps, and
      # stores it with the image in GHCR. The subject is the IMMUTABLE digest
      # ko produced (subject-name = repo, subject-digest = sha256:...), never a
      # mutable tag, so the provenance binds to the exact artifact. push-to-
      # registry uploads the attestation as an OCI referrer of the image, so
      # `cosign verify-attestation` / `gh attestation verify` can find it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true
          # attest-build-provenance defaults create-storage-record to true whenever
          # push-to-registry is set, which then needs an `artifact-metadata: write`
          # permission and emits two warnings per job when it is absent (8 per
          # release, present since at least v0.0.29). We do not consume GitHub's
          # artifact-metadata index — the attestation itself is what
          # `gh attestation verify` / `cosign verify-attestation` read, and it
          # succeeds regardless. Granting the permission is not currently an option:
          # actionlint v1.7.7 rejects `artifact-metadata` as an unknown scope, so it
          # would fail `task lint:actions`. Declare the feature off instead of
          # silently failing at it.
          create-storage-record: false

