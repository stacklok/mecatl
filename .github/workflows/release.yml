  # Publish the chart only after its default image tag exists.
  publish-helm-chart:
    name: Package, publish, sign Helm chart
    needs: publish-mecak8s
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      packages: write # push chart to GHCR (helm registry login + docker/login-action use GITHUB_TOKEN, not OIDC)
      id-token: write # OIDC: cosign keyless signing only
    env:
      # Sibling OCI path for release charts.
      OCI_REGISTRY: ghcr.io/${{ github.repository }}/charts
      CHART_PATH: deploy/helm/mecak8s
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # No version is baked into the Go code or the chart's committed
      # Chart.yaml — the tag IS the release (see .claude/skills/cut-release).
      # Strip the leading `v`: Helm/semver does not accept it in
      # Chart.yaml's version field.
      - name: Resolve chart version from tag
        id: version
        run: |
          CHART_VERSION="${VERSION#v}"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: $CHART_VERSION (from ${VERSION})"

      # Bare `helm lint` renders with an empty values.yaml, which trips the
      # Redis and secure real-provider guards. Lint with the minimal production
      # overrides that target already uses. The chart version supplies the image tag.
      - name: helm lint
        run: helm lint "${CHART_PATH}" --set redis.endpoint=redis.example.internal:6379,redis.credentialsSecret=redis-credentials,tls.enabled=true,tls.secretName=mecak8s-tls,oidc.enabled=true,oidc.issuer=https://idp.example.com,oidc.audience=mecatl

      - name: helm package
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          mkdir -p dist
          helm package "${CHART_PATH}" --version "${CHART_VERSION}" --destination dist
          ls -la dist/
          test -f "dist/mecak8s-${CHART_VERSION}.tgz"

      - name: helm registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # cosign reads the Docker keychain (~/.docker/config.json), NOT helm's
      # registry config — so `helm registry login` above does not authenticate
      # it. Without this, `cosign sign` fails reading the just-pushed manifest
      # back from ghcr with `UNAUTHORIZED: authentication required`.
      - name: Log in to ghcr for cosign
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: helm push
        id: push
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          # helm push prints `Digest: sha256:...` on success — capture for
          # cosign sign.
          OUTPUT=$(helm push "dist/mecak8s-${CHART_VERSION}.tgz" "oci://${OCI_REGISTRY}" 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "FAIL: could not parse digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "▶ pushed chart digest: $DIGEST"

      - name: cosign sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Sign by digest, not tag — guarantees we sign the artifact that
          # was just pushed, even if a concurrent push moves the tag.
          cosign sign -y "${OCI_REGISTRY}/mecak8s@${DIGEST}"

      - name: Summary
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Helm chart published"
            echo ""
            echo "**Pull command:**"
            echo ""
            echo '```'
            echo "helm pull oci://${OCI_REGISTRY}/mecak8s --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "**Install command:**"
            echo ""
            echo '```'
            echo "helm install mecak8s oci://${OCI_REGISTRY}/mecak8s --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "**Verify signature:**"
            echo ""
            echo '```'
            echo "cosign verify ${OCI_REGISTRY}/mecak8s@${DIGEST} \\"
            echo "  --certificate-identity-regexp='https://github.com/stacklok/mecatl/' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
