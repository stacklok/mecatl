        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true

  publish-mecak8s:
    name: Build, publish, sign, attest mecak8s
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: cosign keyless signing AND provenance (ghcr login uses GITHUB_TOKEN, not OIDC)
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      # mecak8s publishes under its own GHCR repo (/mecak8s suffix), matching
      # deploy/helm/mecak8s/values.yaml's image.repository default. ko appends
      # the binary import path unless --bare is used (we use --bare).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/mecak8s
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
