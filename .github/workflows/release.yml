  # Not a Go binary, so this doesn't go through ko like the jobs above — a
  # plain docker/build-push-action build of the existing dev/Compose
  # Dockerfile. The bot's TypeScript source still lives under
  # sdk/typescript/examples/ and isn't a published npm package (see
  # ../sdk/typescript/examples/slack-bot/README.md); only this container
  # image is released, from the same v* tag as mecated/mecatui/mecak8s.
  publish-slack-bot:
    needs: guard
    name: Build, publish, sign, attest Slack bot example image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR; also covers reading
        # @stacklok/mecatl-sdk from GitHub Packages during the build (write
        # is a superset of read) — no separate secret needed for that half
      id-token: write # OIDC: cosign keyless signing AND provenance (ghcr login uses GITHUB_TOKEN, not OIDC)
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      IMAGE: ghcr.io/${{ github.repository }}/slack-bot
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the example directory itself — the bot depends on
      # the PUBLISHED @stacklok/mecatl-sdk (GitHub Packages), not a sibling
      # source symlink, so the SDK's source tree no longer needs to be in the
      # build context (see the Dockerfile's own header comment). Tag both the
      # version and latest, matching the ko-based jobs above.
      #
      # @stacklok/mecatl-sdk has no public npm registry yet, only GitHub
      # Packages (TODO: drop the `secrets:` input below once it does) — the
      # job's own ephemeral GITHUB_TOKEN, already packages:write above (a
      # superset of read), covers installing it during the build; passed as
      # a build secret, never a build arg/env (which would leak into layers).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sdk/typescript/examples/slack-bot
          file: sdk/typescript/examples/slack-bot/docker/bot.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=slack-bot
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Stacklok

      # Sign/SBOM/attest the pushed manifest list BY DIGEST, matching the
      # ko-based jobs above — never a mutable tag, so this binds to the exact
      # artifact docker/build-push-action just pushed.
      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate SBOM file
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # SBOM is attested below; don't also publish it as a release asset.
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # attest-build-provenance defaults create-storage-record to true whenever
          # push-to-registry is set, which then needs an `artifact-metadata: write`
          # permission and emits two warnings per job when it is absent (8 per
          # release, present since at least v0.0.29). We do not consume GitHub's
          # artifact-metadata index — the attestation itself is what
          # `gh attestation verify` / `cosign verify-attestation` read, and it
          # succeeds regardless. Granting the permission is not currently an option:
          # actionlint v1.7.7 rejects `artifact-metadata` as an unknown scope, so it
          # would fail `task lint:actions`. Declare the feature off instead of
          # silently failing at it.
          create-storage-record: false

  # Publish the chart only after its default image tag exists.
  publish-helm-chart:
    name: Package, publish, sign Helm chart
    needs: [guard, publish-mecak8s]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      packages: write # push chart to GHCR (helm registry login + docker/login-action use GITHUB_TOKEN, not OIDC)
      id-token: write # OIDC: cosign keyless signing only
    env:
      # Sibling OCI path for release charts.
      OCI_REGISTRY: ghcr.io/${{ github.repository }}/charts
      CHART_PATH: deploy/helm/mecak8s
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # No version is baked into the Go code or the chart's committed
      # Chart.yaml — the tag IS the release (see .claude/skills/cut-release).
      # Strip the leading `v`: Helm/semver does not accept it in
      # Chart.yaml's version field.
      - name: Resolve chart version from tag
        id: version
        run: |
          CHART_VERSION="${VERSION#v}"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved chart version: $CHART_VERSION (from ${VERSION})"

      # Bare `helm lint` renders with an empty values.yaml, which trips the
      # Redis and secure real-provider guards. Lint with the minimal production
      # overrides that target already uses. The chart version supplies the image tag.
      - name: helm lint
        run: helm lint "${CHART_PATH}" --set redis.endpoint=redis.example.internal:6379,redis.credentialsSecret=redis-credentials,tls.enabled=true,tls.secretName=mecak8s-tls,oidc.enabled=true,oidc.issuer=https://idp.example.com,oidc.audience=mecatl

      - name: helm package
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          mkdir -p dist
          helm package "${CHART_PATH}" --version "${CHART_VERSION}" --destination dist
          ls -la dist/
          test -f "dist/mecak8s-${CHART_VERSION}.tgz"

      - name: helm registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # cosign reads the Docker keychain (~/.docker/config.json), NOT helm's
      # registry config — so `helm registry login` above does not authenticate
      # it. Without this, `cosign sign` fails reading the just-pushed manifest
      # back from ghcr with `UNAUTHORIZED: authentication required`.
      - name: Log in to ghcr for cosign
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: helm push
        id: push
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          # helm push prints `Digest: sha256:...` on success — capture for
          # cosign sign.
          OUTPUT=$(helm push "dist/mecak8s-${CHART_VERSION}.tgz" "oci://${OCI_REGISTRY}" 2>&1)
          echo "$OUTPUT"
          DIGEST=$(echo "$OUTPUT" | awk '/^Digest:/ {print $2}')
          if [ -z "$DIGEST" ]; then
            echo "FAIL: could not parse digest from helm push output" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "▶ pushed chart digest: $DIGEST"

      - name: cosign sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Sign by digest, not tag — guarantees we sign the artifact that
          # was just pushed, even if a concurrent push moves the tag.
          cosign sign -y "${OCI_REGISTRY}/mecak8s@${DIGEST}"

      - name: Summary
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Helm chart published"
            echo ""
            echo "**Pull command:**"
            echo ""
            echo '```'
            echo "helm pull oci://${OCI_REGISTRY}/mecak8s --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "**Install command:**"
            echo ""
            echo '```'
            echo "helm install mecak8s oci://${OCI_REGISTRY}/mecak8s --version ${CHART_VERSION}"
            echo '```'
            echo ""
            echo "**Verify signature:**"
            echo ""
            echo '```'
            echo "cosign verify ${OCI_REGISTRY}/mecak8s@${DIGEST} \\"
            echo "  --certificate-identity-regexp='https://github.com/stacklok/mecatl/' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The CLI half of a mecatl release: the mecated + mecatui BINARIES, shipped as
  # per-platform tarballs on a GitHub Release, plus the `mecatl` formula in
  # stacklok/homebrew-tap. GoReleaser owns this and only this; ko still owns
  # every container image (the jobs above, .ko.yaml). One formula, two binaries,
  # mirroring the `install` Taskfile target.
  #
  # Deliberately NOT `needs:` any job above: there is no artifact dependency, and
  # serialising a multi-minute job behind another buys nothing. It runs the
  # reusable-pin gate ITSELF rather than inheriting it from `publish`, because a
  # published formula is the most user-visible artifact in this workflow and must
  # not be gated by luck of job ordering.
  #
  # Partial-failure shape, stated deliberately: GoReleaser's brew pipe continues
  # on error and the Release is created before the formula is pushed, so a bad
  # tap token fails this job WITHOUT losing the Release. Recover by re-running.
  # If a run dies BETWEEN "release created" and "assets uploaded" it leaves a
  # DRAFT, which a lookup by tag does not return, so a naive re-run tries to
  # create the release again and fails; recover with
  #   gh release delete <tag> --cleanup-tag=false --yes
  # before re-dispatching. See .claude/skills/cut-release.
  publish-cli:
    needs: guard
    name: Build, publish, sign, attest CLI archives + Homebrew formula
    runs-on: ubuntu-24.04
    # 60, measured rather than guessed. On the v0.0.30 run the disk reclaim took
    # ~2 min and eight cross-compiles were still going at 22 min (at --parallelism
    # 2 on a 4-CPU runner); at the default parallelism, builds plus four syft
    # scans, five Fulcio/Rekor round-trips and ~400 MB of asset upload need more
    # than the 30 min that timed that attempt out.
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release + upload assets (read covers the changelog compare API)
      id-token: write # OIDC: cosign keyless sign-blob AND provenance
      attestations: write # SLSA build provenance via actions/attest-build-provenance
      # NOTE: the only job here holding contents: write, and it is scoped to THIS
      # repo. The write to stacklok/homebrew-tap uses the separately minted App
      # installation token below, never GITHUB_TOKEN.
    env:
      # On workflow_dispatch github.ref_name is the default branch, so prefer the
      # explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 0, NOT 1 (unlike the ko jobs): GoReleaser derives the current AND
          # previous tag from git, and changelog.use=github compares the two. A
          # depth-1 clone has neither and leaves .git/shallow, which GoReleaser
          # warns about. With depth 0, actions/checkout fetches all branches AND
          # all tags even when `ref` names a tag — which is also what makes the
          # origin/main guard below work under persist-credentials: false.
          fetch-depth: 0
          ref: ${{ env.VERSION }}

      # Eight cross-compiles (2 binaries x 4 platforms) of this dependency graph
      # exhaust the runner's disk: the first v0.0.30 attempt died 18 minutes in
      # with `compile: writing output: ... no space left on device` while linking
      # linux_amd64. The Go build cache holds a separate full entry set per
      # target, and dist/ alone is ~1.6 GB.
      #
      # Reclaim the preinstalled toolchains this job never uses. Done inline
      # rather than via a third-party action so there is no extra dependency to
      # SHA-pin for a handful of rm calls. `|| true` on each: the exact set of
      # preinstalled directories varies by runner image, and a missing path must
      # not fail the release.
      #
      # MEASURED on the v0.0.30 run: the runner starts with just 14 GB free (the
      # floor GitHub actually guarantees), and this reclaims 28 GB, ending at
      # 42 GB free against a ~10 GB need. Takes ~2 minutes.
      #
      # The before/after report is deliberate — if this ever runs out of space
      # again, the log says how much headroom there actually was.
      - name: Reclaim runner disk space
        run: |
          set -uo pipefail
          echo "::group::Disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune --all --force || true
          echo "::group::Disk after"
          df -h /
          echo "::endgroup::"

      # The same on-main gate the `guard` job runs. Repeated here, not merely
      # inherited via needs:, for the same reason the pin gate above is: this is
      # the only job that writes OUTSIDE this repository (a public tap commit),
      # so it re-verifies rather than trusting the job graph.
      # Compare against origin/main, which the depth-0 checkout already fetched — NOT
      # `git fetch origin main`, which has no credentials here
      # (persist-credentials: false) and would fail on this internal repo.
      # HEAD, not $GITHUB_SHA: on workflow_dispatch $GITHUB_SHA is the branch
      # head, while HEAD is the tag commit actually checked out.
      - name: Ensure the release tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tags must be cut from a commit on main; $(git rev-parse HEAD) is not on main"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ and authn/oidc are their own modules (go.work monorepo);
          # their go.sum files are part of the build cache key.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum

      # GoReleaser shells out to cosign for signs: and syft for sboms:; neither
      # is bundled. download-syft puts syft on PATH.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # A per-run, scoped GitHub App installation token — the only credential
      # that can write to stacklok/homebrew-tap. This job's GITHUB_TOKEN cannot
      # (it is scoped to this repository), and no long-lived PAT is kept.
      # permission-contents: write is the single permission the formula commit
      # needs; the App installation itself is restricted to homebrew-tap.
      - name: Mint the Homebrew tap token
        id: homebrew-tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: stacklok
          repositories: homebrew-tap
          permission-contents: write

      # `release --clean` wipes dist/, then builds, archives, SBOMs, checksums,
      # signs, creates the Release, uploads, and LAST pushes the formula.
      #
      # GORELEASER_CURRENT_TAG is set explicitly rather than relying on
      # `git tag --points-at HEAD`: that fallback picks by -version:refname when
      # several tags share a commit, which will happen once engine/vX.Y.Z tags
      # exist (see .claude/skills/cut-release). The tag is never inferred here.
      #
      # `version:` pins the GoReleaser BINARY (a prebuilt download, not a source
      # build) and must stay in lockstep with Taskfile.yml's GORELEASER_VERSION
      # and the ci.yml validation step.
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "v2.16.0"
          # No --parallelism cap. A cap of 2 was tried and REGRESSED the job into
          # a 30-minute timeout: the runner has 4 CPUs, so the default is already
          # 4, and halving it left the build on target 7 of 8 at the deadline.
          # Peak $WORK usage was the reason to cap, and the reclaim above now
          # provides 42 GB against a ~10 GB need, so the cap bought nothing.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      # GoReleaser has no native GitHub-attestation pipe (unlike sboms/signs), so
      # provenance is a post-step over the artifacts it just wrote. Feeding
      # checksums.txt rather than a glob produces ONE attestation whose subjects
      # are every artifact listed there, with the names and sha256 digests
      # GoReleaser already computed — no glob to drift, no digest recomputed.
      # `always()` is deliberate: if the tap push failed but the assets uploaded,
      # the published archives still get their provenance. Precedent:
      # release-sdk-typescript.yml attests a loose tarball the same way.
      - name: Attest archive build provenance
        if: ${{ always() && hashFiles('dist/checksums.txt') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Verify GitHub artifact attestation
        if: ${{ always() && hashFiles('dist/checksums.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$REPO"
          done

      - name: Summary
        if: ${{ always() && hashFiles('dist/checksums.txt') != '' }}
        run: |
          set -euo pipefail
          {
            echo "## CLI archives published"
            echo ""
            echo '```sh'
            echo "brew install stacklok/tap/mecatl"
            echo '```'
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
