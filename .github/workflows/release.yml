# Publishes and signs the mecated, mecatui, and mecak8s images, the mecak8s Helm
# chart, and the mecated+mecatui CLI archives (a GitHub Release plus a
# stacklok/homebrew-tap formula) from root `v*` tags or an explicitly selected tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run hook for re-publishing a tag's artifacts (e.g. after a
  # transient registry failure). Re-running re-signs idempotently.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)publish'
        required: true
        type: string

# Least-privilege default. Jobs elevate individually, and only to exactly what
# they need: ko-push + cosign-keyless for the image jobs, and additionally
# contents: write for publish-cli, which is the only job that creates a
# GitHub Release.
permissions:
  contents: read

# Never run two releases for the same tag concurrently. Keyed on the TAG, not
# github.ref: on workflow_dispatch github.ref is refs/heads/main while on a tag
# push it is refs/tags/vX.Y.Z, so a ref-keyed group would let a dispatch
# re-publish of vX.Y.Z run alongside the original tag-push run. The ko jobs
# tolerate that; a GitHub Release object and a cross-repo tap commit do not.
# Do NOT cancel in progress — a half-signed release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  # A v* tag can be created from ANY commit — GitHub cannot branch-filter a tag trigger — so
  # "the tag is on main" has to be checked at run time. It used to be checked in publish-cli
  # ONLY, which left the five image/chart jobs publishing cosign-signed, SLSA-attested
  # artifacts from a tag cut on an unreviewed branch. That is the bypass around the release-PR
  # flow, so the check gates every publishing job now.
  #
  # A shared job rather than the same four lines copied six times. publish-cli deliberately
  # KEEPS its own inline copy as well (like the pin gate it repeats): it is the one job that
  # writes outside this repository, so it re-verifies rather than inheriting.
  guard:
    name: Ensure the release tag is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # On workflow_dispatch github.ref_name is the default branch, so prefer the
      # explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 0 so origin/main is present to compare against. NOT `git fetch origin main`:
          # persist-credentials is false, so a fetch has no credentials on this repo.
          fetch-depth: 0
          ref: ${{ env.VERSION }}

      # HEAD, not $GITHUB_SHA: on workflow_dispatch $GITHUB_SHA is the branch head, while
      # HEAD is the tag commit actually checked out above.
      - name: Ensure the release tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::release tags must be cut from a commit on main; $(git rev-parse HEAD) is not on main"
            exit 1
          fi
          echo "$(git rev-parse HEAD) is on main"

  publish:
    needs: guard
    name: Build, publish, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: ghcr login, cosign keyless signing AND provenance
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      # ghcr.io/<owner>/<repo>, lowercased by GHCR. ko appends the binary import
      # path unless --bare is used (we use --bare, matching the Taskfile).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ko reads the base image digest from .ko.yaml; no deep history needed.
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (go.work monorepo); its go.sum is part of
          # the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # OIDC-backed registry login. The GITHUB_TOKEN is scoped to this repo's
      # packages by the job `permissions.packages: write` above — no PAT, no
      # username/password stored in secrets.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Build multi-arch, push by digest, and have ko generate + push an SPDX
      # SBOM next to the image. --bare keeps the repo path clean (no import-path
      # suffix), matching `task ko:publish`. We tag both the version and latest.
      # The digest is captured for signing so we sign the immutable artifact,
      # not a mutable tag.
      - name: Build and push image (+ SBOM)
        id: build
        run: |
          set -euo pipefail
          # --image-refs writes the fully-qualified pushed refs (one per line,
          # including the @sha256 digest) to a file; ko's build logs go to
          # stderr, so reading the file avoids any log interleaving.
          KO_DOCKER_REPO="${KO_DOCKER_REPO}" ko build \
            --platform=linux/amd64,linux/arm64 \
            --bare \
            --sbom=spdx \
            -t "${VERSION}" -t latest \
            --image-refs=image-refs.txt \
            --image-label=org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --image-label=org.opencontainers.image.title=mecated \
            --image-label=org.opencontainers.image.revision=${{ github.sha }} \
            --image-label=org.opencontainers.image.vendor=Stacklok \
            ./cmd/mecated
          # The digest ref is the same image regardless of tag; take the first.
          digest="$(head -n1 image-refs.txt)"
          # Write the three step outputs in ONE redirect group (shellcheck SC2129).
          # attest-build-provenance wants the repo name and the sha256 digest
          # split apart, so derive both from the immutable ref ko just pushed.
          {
            echo "digest=${digest}"
            echo "image_name=${digest%@*}"
            echo "image_digest=${digest##*@}"
          } >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Keyless sign the image BY DIGEST. --yes skips the confirmation prompt;
      # the OIDC identity (this workflow) is logged to Rekor automatically.
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      # ko already pushed the SBOM as an OCI artifact; additionally attach it as
      # a signed cosign attestation so it is covered by the same Sigstore
      # transparency guarantees as the signature.
      - name: Generate SBOM file
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # SBOM is attested below; don't also publish it as a release asset.
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}"

      # SLSA build provenance for the published image. GitHub's native
      # attestation generates a signed SLSA provenance predicate, keyless via
      # the same Sigstore (Fulcio/Rekor) machinery as the cosign steps, and
      # stores it with the image in GHCR. The subject is the IMMUTABLE digest
      # ko produced (subject-name = repo, subject-digest = sha256:...), never a
      # mutable tag, so the provenance binds to the exact artifact. push-to-
      # registry uploads the attestation as an OCI referrer of the image, so
      # `cosign verify-attestation` / `gh attestation verify` can find it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true
          # attest-build-provenance defaults create-storage-record to true whenever
          # push-to-registry is set, which then needs an `artifact-metadata: write`
          # permission and emits two warnings per job when it is absent (8 per
          # release, present since at least v0.0.29). We do not consume GitHub's
          # artifact-metadata index — the attestation itself is what
          # `gh attestation verify` / `cosign verify-attestation` read, and it
          # succeeds regardless. Granting the permission is not currently an option:
          # actionlint v1.7.7 rejects `artifact-metadata` as an unknown scope, so it
          # would fail `task lint:actions`. Declare the feature off instead of
          # silently failing at it.
          create-storage-record: false

  # The mecatui image carries cmd/mecatui/kodata/agent.yaml through ko's kodata
  # support and identifies it with the org.stacklok.broodbox.agent OCI label.
  publish-mecatui:
    needs: guard
    name: Build, publish, sign, attest mecatui
