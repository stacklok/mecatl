    env:
      # mecatui publishes under its own GHCR repo (/mecatui suffix) so the TUI
      # image is a sibling of the mecated image, not mixed into it. ko appends
      # the binary import path unless --bare is used (we use --bare).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/mecatui
