        with:
          subject-name: ${{ steps.build.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true

  # publish-mecak8s (ADR 0048): the same build/sign/attest pipeline as the
  # mecated publish job above, targeting the mecak8s storage-free k8s-native
  # agent binary under its own GHCR repo. It shares the reusable-workflow pin
  # check run in `publish` (that step is release-global, not per-image), so
  # this job omits it. Until this job existed, deploy/helm/mecak8s's default
  # `image.repository: ghcr.io/stacklok/mecatl/mecak8s` pointed at an image
  # that had never been published anywhere — k8s-e2e.yml only ever builds the
  # binary as a local `ko.local/mecak8s` ref loaded straight into the runner's
  # Docker daemon, never pushed to a real registry.
  publish-mecak8s:
    name: Build, publish, sign, attest mecak8s
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push image + SBOM to GHCR
      id-token: write # OIDC: cosign keyless signing AND provenance (ghcr login uses GITHUB_TOKEN, not OIDC)
      attestations: write # SLSA build provenance via actions/attest-build-provenance
    env:
      # mecak8s publishes under its own GHCR repo (/mecak8s suffix), matching
      # deploy/helm/mecak8s/values.yaml's image.repository default. ko appends
      # the binary import path unless --bare is used (we use --bare).
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}/mecak8s
      # On workflow_dispatch github.ref_name is the default branch, so prefer
      # the explicit input; on a tag push github.ref_name is the tag.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
