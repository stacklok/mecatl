name: Studio

on:
  pull_request:
    paths:
      - "studio/**"
      - "sdk/typescript/**"
      - ".github/workflows/studio.yml"
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "sdk/typescript/**"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

jobs:
  checks:
    name: Build, test, lint, typecheck, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Studio depends on the TypeScript SDK as `file:../sdk/typescript`; npm
      # links the checkout without building it, so the SDK is built first with
      # its own toolchain (pnpm, pinned exactly as ci.yml's SDK job pins it).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Build the TypeScript SDK
        run: |
          task sdk:install
          task sdk:build

      # No package in the tree needs install scripts (Next/sharp ship prebuilt
      # binaries), so scripts stay off — supply-chain surface CI never runs.
      - name: Install
        working-directory: studio
        run: npm ci --ignore-scripts

      - name: Lint, typecheck, dead-code
        working-directory: studio
        run: |
          npm run lint
          npm run typecheck
          npm run knip

      - name: Unit tests
        working-directory: studio
        run: npx vitest run

      - name: Build + hermetic server-tier suite
        working-directory: studio
        run: npm run test:server

      - name: Audit
        working-directory: studio
        run: npm audit --audit-level=high

      - name: License headers
        run: |
          if git grep -l "SPDX-License-Identifier: Proprietary" -- studio/; then
            echo "Proprietary SPDX headers are not allowed in studio/" >&2
            exit 1
          fi

  # Browser smoke over the real proxy tier against the fixture daemon.
  # Separate job so a browser-infra flake never masks the checks above.
  e2e:
    name: Playwright (fixture daemon)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Studio depends on the TypeScript SDK as `file:../sdk/typescript`; npm
      # links the checkout without building it, so the SDK is built first with
      # its own toolchain (pnpm, pinned exactly as ci.yml's SDK job pins it).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Build the TypeScript SDK
        run: |
          task sdk:install
          task sdk:build

      - name: Install
        working-directory: studio
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build and test
        working-directory: studio
        run: npm run test:e2e
