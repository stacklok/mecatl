# Trusted-main coordinated controller. Schema 2 replaces the undeployed per-module
# flow. R never supplies workflow/controller code; all jobs use the run's fixed T.
# One API-only protected write OR credential-free execution per serialized run.
name: Module releases

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Reconcile, or a fresh explicit human retry/abandon of the named batch'
        type: choice
        options: [reconcile, retry, abandon]
        default: reconcile
      batch_id:
        description: 'Exact active batch ID required for retry/abandon'
        type: string
        required: false
      adoption_head:
        description: 'Exceptional reviewed module-adoption/* head descending from R; normally empty'
        type: string
        required: false

permissions:
  contents: read

# Shared with intake. The fixed active ref is the durable lifecycle reservation;
# this lock serializes acquisition, reconciliation and release across human waits.
concurrency:
  group: module-releases
  cancel-in-progress: false

env:
  MODULE_RELEASES_ENABLED: ${{ vars.MODULE_RELEASES_ENABLED }}
  RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
  RELEASE_APP_BOT_ID: ${{ vars.RELEASE_APP_BOT_ID }}
  RELEASE_BATCH_HUMAN_TEAM: ${{ vars.RELEASE_BATCH_HUMAN_TEAM }}

jobs:
  plan:
    name: Plan
    if: vars.MODULE_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      batch: ${{ steps.plan.outputs.batch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_OPERATION: ${{ inputs.operation }}
          BATCH_ID: ${{ inputs.batch_id }}
          ADOPTION_HEAD: ${{ inputs.adoption_head }}
        run: |
          python3 .github/scripts/module-release-github.py plan --output plan.json
          python3 -c 'import json,os; a=json.load(open("plan.json"))["action"]; open(os.environ["GITHUB_OUTPUT"],"a").write("kind="+a["kind"]+"\nbatch="+a["id"]+"\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan.json
          retention-days: 90

  prepare:
    name: Prepare ${{ needs.plan.outputs.batch }}
    needs: plan
    if: needs.plan.outputs.kind == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/module-release-github.py execute --input plan.json --output result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          retention-days: 90

  qualify:
    name: Qualify ${{ needs.plan.outputs.batch }}
    needs: plan
    if: needs.plan.outputs.kind == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
      # No environment/App/write token. Candidate subprocesses receive only the
      # public_environment allowlist, not even this read-only transport token.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/module-release-github.py execute --input plan.json --output result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          retention-days: 90

  full-ci:
    name: Full release CI
    needs: plan
    if: needs.plan.outputs.kind == 'qualify'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      release-batch: ${{ needs.plan.outputs.batch }}

  full-ci-receipt:
    name: Full release CI receipt
    needs: [plan, full-ci]
    if: needs.plan.outputs.kind == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
      # Informational bytes only: the writer independently checks every exact
      # named server job, trusted workflow/run/attempt/T and the complete binding.
      - run: python3 .github/scripts/module-release-ci.py receipt --input plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-full-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-ci.json
          if-no-files-found: error
          retention-days: 90

  proof:
    name: Proof ${{ needs.plan.outputs.batch }}
    needs: plan
    if: needs.plan.outputs.kind == 'prove'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/module-release-github.py execute --input plan.json --output result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: result.json
          retention-days: 90

  write:
    name: Write ${{ needs.plan.outputs.batch }}
    needs: [plan, prepare]
    if: >-
      always() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.kind == 'prepare' && needs.prepare.result == 'success') ||
       needs.plan.outputs.kind == 'bind' || needs.plan.outputs.kind == 'adopt' ||
       needs.plan.outputs.kind == 'complete' || needs.plan.outputs.kind == 'abandon' || needs.plan.outputs.kind == 'finalize')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.kind == 'prepare'
        with:
          name: module-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Validate fixed authority and static protections before minting
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RESULT_ARGUMENT: ${{ needs.plan.outputs.kind == 'prepare' && '--result incoming/result.json' || '' }}
        run: |
          if [ -n "$RESULT_ARGUMENT" ]; then
            python3 .github/scripts/module-release-github.py validate-write --input incoming/plan.json --result incoming/result.json --output "$RUNNER_TEMP/module-write.json"
          else
            python3 .github/scripts/module-release-github.py validate-write --input incoming/plan.json --output "$RUNNER_TEMP/module-write.json"
          fi
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # API-only after minting: NO Go/Git/subprocess/candidate code. Every API
      # mutation rechecks the durable reservation and logical exact-R freeze.
      - env:
          GH_TOKEN: ${{ github.token }}
          MODULE_RELEASE_WRITE_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/scripts/module-release-github.py write --input "$RUNNER_TEMP/module-write.json"

  tag:
    name: Tag ${{ needs.plan.outputs.batch }}
    needs: plan
    if: needs.plan.outputs.kind == 'tag'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Revalidate whole qualification, prerequisite proofs, exact R and protections
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: python3 .github/scripts/module-release-github.py validate-write --input incoming/plan.json --output "$RUNNER_TEMP/module-write.json"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # This static writer has NO PR/workflow/administration grant. It exits
      # before a different run's credential-free Proof job executes Go code.
      - env:
          GH_TOKEN: ${{ github.token }}
          MODULE_RELEASE_WRITE_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/scripts/module-release-github.py write --input "$RUNNER_TEMP/module-write.json"

  continue:
    name: Continue ${{ needs.plan.outputs.batch }}
    needs: [plan, prepare, qualify, full-ci, full-ci-receipt, proof, write, tag]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.kind != 'wait' && needs.plan.outputs.kind != 'complete' && needs.plan.outputs.kind != 'abandon' && needs.plan.outputs.kind != 'finalize' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-plan-${{ github.run_id }}-${{ github.run_attempt }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/module-release-github.py continue --input plan.json
