# Performance regression tracking for mecatl — the Phase 3 CI gate + trend store
# of docs/adr/0019-perf-tracking.md.
#
# WHY A DEDICATED WORKFLOW (not folded into ci.yml): the two jobs here need
# DIFFERENT permission postures. The PR job is read-only (`contents: read`) and
# never pushes; the main job needs `contents: write` to push the trend data to the
# `gh-pages` branch. ci.yml is uniformly `contents: read`, and mixing a write job
# into it would over-grant the whole file. Keeping perf separate keeps each job at
# least privilege.
#
# THE PR-vs-MAIN SPLIT:
#   - `perf-pr`   (pull_request): build the benchmarks, HARD-gate allocs/op against
#                 the previous-main baseline with the tested allocsgate program,
#                 then run the scenario suite through github-action-benchmark with
#                 fail-on-alert but `auto-push: false` — it FAILS a regressing PR
#                 but never writes the trend store.
#   - `perf-main` (push to main): the same build, then github-action-benchmark with
#                 `auto-push: true` to update the gh-pages trend dashboard, and a
#                 re-run of the allocs gate against the just-superseded baseline so a
#                 regression that slipped through still gets flagged. It also stores
#                 `bench.txt` on gh-pages so the next PR's allocs gate has a baseline
#                 to fetch (perf-tracking.md baseline-storage resolution).
# perf-pr runs github-action-benchmark THREE times (a smaller-is-better gate, a
# bigger-is-better gate, then a smaller-is-better ADVISORY render-allocs suite); the
# second and third invocations set `skip-fetch-gh-pages` to reuse the first's
# gh-pages fetch, because re-fetching is a non-fast-forward against the local ref the
# first step already advanced — whereas perf-main's `auto-push` keeps local and
# remote in sync so each step's fetch stays a fast-forward.
#
# Like ci.yml, this uses `pull_request` (NOT `pull_request_target`): PR code is
# untrusted and must run without secrets and with a read-only token. The only
# secret used anywhere is the automatic `GITHUB_TOKEN`, scoped per job by the
# `permissions:` block — no PAT, no repo secret.
#
# GATING POLICY: allocs/op is HARD-gated (deterministic — survives noisy shared
# runners); ns/op is advisory-only (it rides the `go`-tool trend dashboard on main
# but never fails a build). See perf-tracking.md "Why allocs-first". The gate
# DECISION is made by perf/cmd/allocsgate (a tested Go program, FAIL-CLOSED on an
# empty/corrupt bench file); benchstat is the LOCAL human A/B tool (see `task bench`
# help), deliberately NOT in the CI gate path.
#
# THE ONE ADVISORY-ALLOCS CARVE-OUT: the tui_scrollback_view* render benches'
# allocs/op is NOT deterministic the way the loop scenarios' is — it carries a b.N
# residual (the streaming bench re-joins the whole scrollback every op) and
# process-wide runtime.ReadMemStats background noise (perf/kpi cannot goroutine-scope
# the MemStats read). gh-pages history showed ~4.6% (view) / ~30% (steady) swings on
# commits that touched no TUI code, which false-positives the 2% smaller-suite gate.
# perfconvert routes those two allocs/op points to a dedicated ADVISORY
# customSmallerIsBetter suite (fail-on-alert:false) — the escalation the smaller
# suite anticipated, now SHIPPED. Their deterministic siblings (tokens/goroutine,
# always 0) stay on the gated smaller suite.
#
# All third-party actions are SHA-pinned (with a # vX.Y.Z comment) so a re-pointed
# tag from a compromised maintainer cannot change what runs here. Pins for
# checkout/setup-go/setup-task/upload-artifact match the house set in ci.yml /
# e2e-live.yml.
name: perf

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; each job narrows or widens as needed.
permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  # The previous-main baseline lives on gh-pages at this path (written by
  # perf-main). The gate fetches it read-only via the raw URL.
  BENCH_BASELINE_PATH: dev/bench/bench.txt

jobs:
  perf-pr:
    name: Perf gate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Cancel superseded PR runs on the same ref.
    concurrency:
      group: perf-pr-${{ github.ref }}
      cancel-in-progress: true
    env:
      # The PR head SHA stamped into the scenario JSON rows (house style: no inline
      # interpolation in run: bodies; see e2e-live.yml).
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (go.work monorepo); its go.sum is part of
          # the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Hot-path microbenchmarks → bench-new.txt (the allocs/op gate feed).
      - name: task bench → bench-new.txt
        shell: bash
        run: task bench BENCHCOUNT=10 | tee bench-new.txt

      # Fetch the previous-main baseline from gh-pages via AUTHENTICATED gh api
      # (GITHUB_TOKEN). raw.githubusercontent.com is unauthenticated and 404s on a
      # PRIVATE repo, which would silently sink the gate into the skip path — so we
      # read the file through the contents API instead. If it is absent (first run
      # before perf-main has ever published) the gate SKIPS cleanly with a notice —
      # same green-skip posture as e2e-live's secret gate. On a failed fetch we leave
      # NO file (not an empty one) so allocsgate takes its absent→skip path, not its
      # present-but-empty→fail-loud path.
      - name: Fetch previous-main baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${BENCH_BASELINE_PATH}?ref=gh-pages" \
               -H "Accept: application/vnd.github.raw" > bench-old.txt 2>/dev/null; then
            echo "fetched baseline from gh-pages:${BENCH_BASELINE_PATH}"
          else
            echo "::notice title=perf baseline missing::No gh-pages baseline at ${BENCH_BASELINE_PATH} yet (first run); the allocs gate will skip green. It engages once perf-main has published a baseline."
            rm -f bench-old.txt
          fi

      # The allocs/op HARD gate. allocsgate is deterministic (allocs do not move
      # with CPU load, so no statistical significance test is needed — that is
      # benchstat's job, and benchstat is the local human A/B tool, not this gate).
      # It compares the median allocs/op per benchmark and fails iff some benchmark
      # rose beyond the epsilon (>= 1 whole alloc AND > 2%). It is FAIL-CLOSED: an
      # empty/corrupt bench file fails rather than passing on no data; a missing
      # baseline (first run) skips green. It prints its own markdown delta table.
      - name: allocs gate
        shell: bash
        run: |
          set -o pipefail
          # bench-old.txt may not exist (first run); pass the path regardless —
          # allocsgate skips green when the baseline file is absent.
          go run ./perf/cmd/allocsgate bench-old.txt bench-new.txt | tee allocsgate.txt
          {
            echo '## Perf allocs/op gate (PR vs previous main)'
            cat allocsgate.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # Scenario suite → JSON KPIs, stamped with the PR head SHA.
      - name: task perf:scenarios → JSON
        shell: bash
        run: |
          MECATL_PERF_JSON=perf-scenarios.json MECATL_PERF_SHA="$HEAD_SHA" \
            task perf:scenarios BENCHCOUNT=6

      - name: Convert scenario JSON → benchmark suites
        shell: bash
        run: |
          go run ./perf/cmd/perfconvert \
            -in perf-scenarios.json \
            -smaller perf-scenarios-smaller.json \
            -bigger perf-scenarios-bigger.json \
            -render perf-scenarios-render.json

      # The smaller-is-better suite (allocs/op + tokens + goroutine-delta) gates the
      # PR. ONE alert-threshold (102%) covers all three metrics in this unified
      # suite; scenario allocs are therefore gated at 2% — SAFE because the LOOP
      # scenarios' allocs are deterministic (no machine-load noise). The tui render
      # benches' allocs/op is the ONE exception — it is NOT deterministic (a b.N
      # residual + process-wide MemStats background noise), so perfconvert routes it
      # to the dedicated ADVISORY render suite below; only the render benches'
      # deterministic tokens/goroutine metrics (always 0) ride this gated suite.
      #
      # ORDERING INVARIANT: this (smaller) step MUST run FIRST and MUST keep fetching
      # gh-pages (no skip-fetch-gh-pages here) — it is what populates the local gh-pages
      # baseline that the (bigger) AND (render) steps below reuse via skip-fetch-gh-pages.
      # Do NOT add skip-fetch here or reorder the steps, or the later steps lose their
      # baseline and silently pass (no data to compare → no alert).
      - name: github-action-benchmark — scenarios (smaller)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (smaller-is-better)
          tool: customSmallerIsBetter
          output-file-path: perf-scenarios-smaller.json
          alert-threshold: '102%'
          fail-on-alert: true
          auto-push: false
          save-data-file: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bigger-is-better suite is ONLY the whitelisted cache-hit-rate points
      # (single_session_long, team_fanout); a 5% drop fails the PR.
      - name: github-action-benchmark — scenarios (bigger)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (bigger-is-better)
          tool: customBiggerIsBetter
          output-file-path: perf-scenarios-bigger.json
          alert-threshold: '105%'
          fail-on-alert: true
          auto-push: false
          save-data-file: false
          skip-fetch-gh-pages: true   # reuse the gh-pages fetched by the (smaller) step above; re-fetching here is a non-fast-forward against the local ref that step advanced
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The ADVISORY render-allocs suite: the tui_scrollback_view* allocs/op points
      # ONLY. fail-on-alert:false because these are NON-deterministic on a shared
      # runner (a b.N residual + process-wide runtime.ReadMemStats background noise
      # that perf/kpi cannot goroutine-scope) — gh-pages history showed ~4.6% / ~30%
      # swings on zero-TUI-code commits, which would false-positive the 2% gate. It
      # records the trend without ever failing a PR. Same skip-fetch-gh-pages reuse +
      # after-the-smaller-step ordering as the (bigger) step.
      - name: github-action-benchmark — scenarios (render allocs, advisory)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (render allocs, advisory)
          tool: customSmallerIsBetter
          output-file-path: perf-scenarios-render.json
          fail-on-alert: false
          auto-push: false
          save-data-file: false
          skip-fetch-gh-pages: true   # reuse the gh-pages fetched by the (smaller) step above; re-fetching here is a non-fast-forward against the local ref that step advanced
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-pr-${{ github.run_id }}
          path: |
            perf-scenarios.json
            perf-scenarios-smaller.json
            perf-scenarios-bigger.json
            perf-scenarios-render.json
            bench-new.txt
            allocsgate.txt
          retention-days: 14
          if-no-files-found: ignore

  perf-main:
    name: Perf trend (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # gh-pages push only; nothing else is elevated.
      contents: write
    # Never cancel an in-flight main publish — a cancelled push could leave the
    # gh-pages store half-written.
    concurrency:
      group: perf-main
      cancel-in-progress: false
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (go.work monorepo); its go.sum is part of
          # the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task bench → bench-new.txt
        shell: bash
        run: task bench BENCHCOUNT=10 | tee bench-new.txt

      # Fetch the previous-main baseline BEFORE it is superseded, so the post-merge
      # allocs gate can catch a regression that slipped through PR review. Authenticated
      # gh api (GITHUB_TOKEN) — raw.githubusercontent.com is unauthenticated and 404s
      # on a private repo. Failed fetch leaves NO file (allocsgate absent→skip).
      - name: Fetch previous-main baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${BENCH_BASELINE_PATH}?ref=gh-pages" \
               -H "Accept: application/vnd.github.raw" > bench-old.txt 2>/dev/null; then
            echo "fetched baseline from gh-pages:${BENCH_BASELINE_PATH}"
          else
            echo "::notice title=perf baseline missing::No previous gh-pages baseline yet; the post-merge allocs gate will skip green on this first publish."
            rm -f bench-old.txt
          fi

      # Post-merge allocs gate: the merge already happened, but a regression that
      # slipped past PR review must still be loud, so this FAILS the main run.
      - name: allocs gate (post-merge)
        shell: bash
        run: |
          set -o pipefail
          go run ./perf/cmd/allocsgate bench-old.txt bench-new.txt | tee allocsgate.txt
          {
            echo '## Perf allocs/op gate (post-merge, new main vs previous main)'
            cat allocsgate.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: task perf:scenarios → JSON
        shell: bash
        run: |
          MECATL_PERF_JSON=perf-scenarios.json MECATL_PERF_SHA="$HEAD_SHA" \
            task perf:scenarios BENCHCOUNT=6

      - name: Convert scenario JSON → benchmark suites
        shell: bash
        run: |
          go run ./perf/cmd/perfconvert \
            -in perf-scenarios.json \
            -smaller perf-scenarios-smaller.json \
            -bigger perf-scenarios-bigger.json \
            -render perf-scenarios-render.json

      # The ns/op + allocs TREND dashboard (advisory — fail-on-alert:false). This is
      # the `go`-tool suite over the raw `task bench` output; it never fails a build,
      # it just records the time series so a human can see drift.
      - name: github-action-benchmark — go bench trend (advisory)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl go microbenchmarks
          tool: go
          output-file-path: bench-new.txt
          benchmark-data-dir-path: dev/bench
          fail-on-alert: false
          auto-push: true
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: github-action-benchmark — scenarios (smaller)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (smaller-is-better)
          tool: customSmallerIsBetter
          output-file-path: perf-scenarios-smaller.json
          benchmark-data-dir-path: dev/bench
          alert-threshold: '102%'
          fail-on-alert: true
          auto-push: true
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: github-action-benchmark — scenarios (bigger)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (bigger-is-better)
          tool: customBiggerIsBetter
          output-file-path: perf-scenarios-bigger.json
          benchmark-data-dir-path: dev/bench
          alert-threshold: '105%'
          fail-on-alert: true
          auto-push: true
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The ADVISORY render-allocs suite (tui_scrollback_view* allocs/op). It pushes
      # the trend to gh-pages like the gated suites, but fail-on-alert:false — these
      # allocs are non-deterministic on a shared runner (b.N residual + process-wide
      # MemStats noise), so they record drift without ever failing the main run.
      # auto-push keeps local and remote in sync so its fetch stays a fast-forward.
      - name: github-action-benchmark — scenarios (render allocs, advisory)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: mecatl scenarios (render allocs, advisory)
          tool: customSmallerIsBetter
          output-file-path: perf-scenarios-render.json
          benchmark-data-dir-path: dev/bench
          fail-on-alert: false
          auto-push: true
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Persist the raw bench.txt into the gh-pages data dir so the allocs gate has a
      # baseline to fetch next time (perf-tracking.md baseline-storage resolution
      # (a): the baseline IS the gh-pages-stored bench.txt). The
      # github-action-benchmark commits above already advanced gh-pages; we add one
      # more commit carrying bench.txt at BENCH_BASELINE_PATH. The push retries on a
      # non-fast-forward (a clone races a concurrent gh-pages advance) so the
      # baseline update is never silently dropped, leaving the next PR to gate
      # against a stale baseline.
      - name: Publish bench.txt baseline to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$remote" "$tmp"
          mkdir -p "$tmp/$(dirname "${BENCH_BASELINE_PATH}")"
          cp bench-new.txt "$tmp/${BENCH_BASELINE_PATH}"
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" add "${BENCH_BASELINE_PATH}"
          if git -C "$tmp" diff --cached --quiet; then
            echo "bench.txt baseline unchanged; nothing to commit."
            exit 0
          fi
          git -C "$tmp" commit -m "perf: update bench.txt baseline for ${HEAD_SHA}"
          # Push with a rebase-retry loop: a concurrent gh-pages advance (e.g. the
          # action's own dashboard commit on another run) makes the first push a
          # non-fast-forward; rebase onto the new tip and retry rather than drop it.
          for attempt in 1 2 3 4 5; do
            if git -C "$tmp" push origin gh-pages; then
              echo "pushed bench.txt baseline (attempt $attempt)."
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/gh-pages and retrying."
            git -C "$tmp" pull --rebase origin gh-pages
            sleep $(( attempt * 2 ))
          done
          echo "::error title=baseline push failed::could not push bench.txt baseline after 5 attempts."
          exit 1

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-main-${{ github.run_id }}
          path: |
            perf-scenarios.json
            perf-scenarios-smaller.json
            perf-scenarios-bigger.json
            perf-scenarios-render.json
            bench-new.txt
            allocsgate.txt
          retention-days: 14
          if-no-files-found: ignore
