# ════════════════════════════════════════════════════════════════════════════════════
# mecatequi-reusable — the REUSABLE (`workflow_call`) entry point. A consumer adopts
# mecatequi with a ~15-line caller workflow instead of vendoring the whole split-privilege
# job graph plus the glue scripts (extract-prompt.sh, publish.sh). Caller sketch:
#
#   jobs:
#     mecatequi:
#       uses: stacklok/mecatl/.github/workflows/mecatequi-reusable.yml@v0.0.3
#       secrets:
#         openrouter-key: ${{ secrets.OPENROUTER_CI_TOKEN }}
#         publish-app-id: ${{ secrets.RELEASE_APP_ID }}
#         publish-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#       with:
#         label: ready-for-agent
#         model: anthropic/claude-sonnet-4.6
#         default-provider: openrouter
#
# THIS IS THE RECOMMENDED ADOPTION PATH. The hand-rolled template
# .github/workflows/mecatequi-example.yml remains the ESCAPE HATCH for a consumer that
# needs to customise the job graph itself (a custom author-gate job, an extra approval
# stage, a different trigger). Full design: docs/design/MECATEQUI.md §5.
# ════════════════════════════════════════════════════════════════════════════════════
#
# THE TOKEN BOUNDARY INVARIANT (the whole point — and why this is a reusable WORKFLOW, not
# just a composite action). A reusable workflow can hold multiple jobs each with its OWN
# `permissions:`, so it preserves the split-privilege model a single composite action
# cannot:
#   - The `implement` job RUNS THE AGENT but holds NO GitHub write token (contents: read,
#     no id-token, no write). Its only secrets are the LLM keys. If the agent is hijacked
#     by a prompt-injection in untrusted issue text, the blast radius is the rotatable LLM
#     key — it cannot push code, open PRs, or comment.
#   - The `publish` job HOLDS THE WRITE TOKEN but RUNS NO AGENT CODE. It only applies the
#     produced patch as DATA (git apply) and posts the summary as text.
# The step that can write to GitHub never runs agent code; the step that runs agent code
# never holds a write token. The secret-scoping proof: the publish-token secrets are
# interpolated ONLY in the `publish` job, so GitHub never materialises them in `implement`.
#
# INJECTION SAFETY: untrusted issue text never appears in a ${{ }} interpolation inside a
# run: body or as an argv token. The mecatequi-extract-prompt action reads
# $GITHUB_EVENT_PATH with jq into a file; the file reaches the binary via --prompt-file;
# the binary fences it. Every event-derived value crosses via env:/inputs, never inline.
#
# SIBLING-ACTION REFS ARE FULL-PATH, PINNED LITERALS (the reusable-workflow wrinkle).
# Inside a workflow called as `uses: owner/repo/.github/workflows/X.yml@ref`, a
# `uses: ./.github/actions/Y` would resolve to the CALLER's checkout, NOT mecatl's — so the
# three sibling actions below are referenced by FULL path
# `stacklok/mecatl/.github/actions/<name>@v0.0.3`. GitHub AUTO-FETCHES a `uses:` action from
# mecatl at that ref (no consumer vendoring, no mecatl checkout in the consumer). Expressions
# are ILLEGAL in `uses:`, so the ref is a HARDCODED literal tag.
#
# PINNING RATIONALE — these are FIRST-PARTY same-repo actions, so they pin to the VERSION
# TAG @v0.0.3, NOT a SHA. The supply-chain SHA-pin rule defends against a THIRD-PARTY action
# whose tag a compromised maintainer could re-point; these actions live in THIS repo and are
# released together, so a SHA would be (a) impossible to write before the release commit
# exists (a chicken-and-egg bootstrap) and (b) no stronger than the tag (we control both).
# THE RELEASE-PROCESS COST: every release tag MUST bump these three @v0.0.3 pins in the SAME
# tagged commit, or the tag ships pins pointing at the PREVIOUS version (version skew). The
# `lint:reusable-pins` Taskfile target mechanically asserts all three equal the release tag.
# Third-party actions (checkout, upload/download-artifact, create-github-app-token) stay
# SHA-pinned with a `# vX.Y.Z` comment per the house set (see .github/workflows/README.md).

name: mecatequi (reusable)

on:
  workflow_call:
    # Inputs are the per-session passthrough surface of the mecatequi action. The
    # escape-hatch-only knobs are deliberately NOT exposed here — `default-model` (catalog-
    # validated, rejects an uncatalogued id — use `model` instead), `openai` (provider is
    # auto-detected from the present key), and `subagent-ask-reviewer` (an autonomous-approval
    # capability that is a deployment decision better made by editing the action) — so a
    # consumer needing them vendors the escape-hatch template rather than the reusable workflow.
    inputs:
      label:
        description: >-
          Issue label that triggers a run (the caller's `issues: labeled` event must carry
          it). A reusable workflow cannot reliably read the caller repo's `vars.*`, so the
          trigger label/mention are INPUTS, not repo variables.
        type: string
        required: false
        default: mecatequi
      mention:
        description: Comment mention that triggers a run on an issue_comment.
        type: string
        required: false
        default: "@mecatequi"
      model:
        description: >-
          Model identifier (per-session passthrough — accepts ids newer than the embedded
          catalog). Prefer this over a catalog-validated default-model. Empty -> provider
          default.
        type: string
        required: false
        default: ""
      default-provider:
        description: >-
          Deployment default provider id (openai | openrouter | anthropic). Auto-detected
          from the present provider key; set only to FORCE the provider.
        type: string
        required: false
        default: ""
      posture:
        description: >-
          Operator posture ladder (strict < trusted < auto < yolo). Default "auto" — the
          documented CI posture (allow-all, child injection-defence ON).
        type: string
        required: false
        default: auto
      max-run-tokens:
        description: >-
          Max cumulative input+output tokens per run; the run ends cleanly with stop=budget
          on crossing it. Empty (default) is unlimited.
        type: string
        required: false
        default: ""
      timeout:
        description: Wall-clock bound on the whole run (e.g. 15m). 0 disables it.
        type: string
        required: false
        default: 15m
      openai-base-url:
        description: >-
          Override the OpenAI API base URL (for an OpenAI-compatible endpoint). Empty
          (default) uses the provider default.
        type: string
        required: false
        default: ""
      guardrails-model:
        description: >-
          Guardrails (issue #27) checker model id / alias that inspects outbound tool args +
          inbound results. Empty (default) disables guardrails.
        type: string
        required: false
        default: ""
      base-branch:
        description: >-
          Base branch for the PR. Empty (default) lets publish.sh resolve the repo default
          branch.
        type: string
        required: false
        default: ""
      pr-body-template:
        description: >-
          OPTIONAL path (relative to the caller's checkout) to a PR-body template with
          {{placeholder}} tokens. Empty uses .github/mecatequi/pr-body.md if present, else
          the built-in body. The trust caveat is always force-prepended.
        type: string
        required: false
        default: ""
      pr-title-template:
        description: >-
          OPTIONAL path (relative to the caller's checkout) to a one-line PR-title template
          (same placeholders). Empty uses the built-in title.
        type: string
        required: false
        default: ""
    secrets:
      # THREE NAMED PROVIDER SECRETS, all optional. The implement job sets all three at
      # job-level env: (OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY). An
      # undefined secret yields the EMPTY STRING, which the binary treats as ABSENT (the
      # registry registers a provider iff its key resolves non-empty — see
      # internal/app/registry.go providerKey/buildProviderRegistry; an empty key is a no-op),
      # so a caller wires only the provider(s) it uses. The binary auto-detects the provider
      # from a present key; `default-provider` forces it.
      openrouter-key:
        description: OpenRouter API key (OPENROUTER_API_KEY). Optional — set the one provider you use.
        required: false
      openai-key:
        description: OpenAI API key (OPENAI_API_KEY). Optional.
        required: false
      anthropic-key:
        description: Anthropic API key (ANTHROPIC_API_KEY). Optional.
        required: false
      # THE PUBLISH TOKEN — the one real interface decision (issue #69). Supports BOTH forms;
      # the consumer wires whichever they have. App-token minting is consumer-specific (their
      # own GitHub App id/key), so it cannot be hidden behind a default:
      #   1. publish-app-id + publish-app-private-key -> a SHORT-LIVED installation token is
      #      minted in the publish job (the stronger posture: a JIT token scoped to exactly
      #      this repo's contents + pull-requests + issues, no standing grant); OR
      #   2. publish-token -> a pre-minted token (e.g. a fine-grained PAT) the consumer
      #      manages; OR
      #   3. neither -> the publish job falls back to the standing GITHUB_TOKEN grant (with a
      #      ::warning::). Zero-config, but a standing broad grant — the weakest form.
      publish-token:
        description: Pre-minted GitHub token for the publish job (contents+PR+issues write). Optional.
        required: false
      publish-app-id:
        description: GitHub App id for JIT installation-token minting in the publish job. Optional.
        required: false
      publish-app-private-key:
        description: GitHub App private key paired with publish-app-id. Optional.
        required: false

# Least-privilege workflow default. A called workflow's GITHUB_TOKEN can only be DOWNGRADED
# from the caller's grant, never escalated; each job below sets its own scope explicitly.
permissions:
  contents: read

# Never run two mecatequi runs for the same issue at once. Fall back to run_id for any
# non-issue event so distinct events never collapse into one group.
concurrency:
  group: mecatequi-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # ── acknowledge: post an EARLY issue-side trace, FIRST, before any agent runs ──────────
  # Runs first, gated on the SAME trigger as `implement`, holds ONLY issues:write (no LLM
  # key, no agent code), and posts a durable "working on it" comment with the run URL. Even
  # if everything downstream fails, the author has a link to the run from the moment it
  # starts. No checkout — it touches no repository contents.
  acknowledge:
    name: Acknowledge (early issue comment, no agent code)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Same gate as `implement` (kept in lockstep — both must match for a run to start). The
    # trigger label/mention come from INPUTS (a reusable workflow can't reliably read the
    # caller's vars.*). The label path requires the configured label; the comment path
    # requires the configured mention on an ISSUE (not a PR — issue_comment fires for PR
    # comments too, where the "issue" is the PR). GitHub can't filter `on: issues: labeled`
    # by name, so the filtering is here in the `if:`; an unmatched label just skips.
    if: >-
      ( github.event_name == 'issues' && github.event.label.name == inputs.label ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, inputs.mention)
      )
    # Only issues:write. No contents write, no id-token, no LLM key — runs no agent code.
    permissions:
      issues: write
    steps:
      - name: Post acknowledgement comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The body is a fixed string + the run URL (a github-context value, not event text),
        # passed via env and --body — never an inline interpolation of untrusted issue text.
        run: |
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" \
            --body "🤖 mecatequi is working on this — see the run: ${RUN_URL}"

  implement:
    name: Run mecatequi (agent, no write token)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Run after `acknowledge` so the issue always carries an early trace before the agent
    # starts. `needs: acknowledge` makes implement skip whenever acknowledge was skipped
    # (the gate did not match), and `needs.acknowledge.result == 'success'` keeps implement
    # from running if the acknowledge step itself failed. The TRIGGER conditions are restated
    # here as defense-in-depth (editing the acknowledge gate alone can never silently run the
    # agent on the wrong event).
    #
    # We deliberately do NOT gate on author_association: GitHub's webhook author_association
    # is unreliable for membership (it reports an org MEMBER as CONTRIBUTOR), so basing a gate
    # on it wrongly SKIPS legitimate runs. For a PRIVATE repo the trigger IS the gate (label
    # application needs triage/write; comment access is team-only). For a PUBLIC repo, the
    # caller should use the escape-hatch template and add a dedicated permission-check gate
    # job (see docs/design/MECATEQUI.md).
    needs: acknowledge
    if: >-
      needs.acknowledge.result == 'success' && (
        ( github.event_name == 'issues' && github.event.label.name == inputs.label ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          contains(github.event.comment.body, inputs.mention)
        )
      )
    # NO write, NO id-token. The only secrets are the LLM keys.
    permissions:
      contents: read
    # The LLM keys MUST be delivered at JOB level, not on the `uses:` step that invokes the
    # composite action. STEP-LEVEL env on a `uses:` step does NOT propagate into a composite
    # action's internal steps, but JOB-level env does — and the composite reads the key from
    # the process environment, never an input. All three are set unconditionally: an undefined
    # secret yields the empty string, which the binary treats as absent (registry registers a
    # provider iff its key resolves non-empty). Scoped to THIS (implement) job ONLY — the
    # publish job must never see an LLM key.
    env:
      OPENROUTER_API_KEY: ${{ secrets.openrouter-key }}
      OPENAI_API_KEY: ${{ secrets.openai-key }}
      ANTHROPIC_API_KEY: ${{ secrets.anthropic-key }}
    steps:
      # Pin to the IMMUTABLE event SHA so the tree the agent diffs against is exactly the
      # tree `publish` later applies the patch onto — the default branch tip can move between
      # the two jobs (especially on issue_comment), which would apply the patch to the wrong
      # tree. This checks out the CALLER's repo (the workflow runs in the caller's context).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # AGENT SELF-VERIFICATION TOOLCHAIN (Fix 3, OPTIONAL — not added here). The mecatequi
      # action bakes in a `--instructions` framing asking the agent to run the repo's
      # build/lint/test and make them green before finishing. A consumer who wants that
      # self-verification must install their PROJECT's OWN build/lint/test toolchain on PATH
      # BEFORE the mecatequi step — but a reusable workflow cannot, because the caller's stack
      # is unknown. A consumer needing pre-mecatequi toolchain steps vendors the escape-hatch
      # template (.github/workflows/mecatequi-example.yml) instead. Go for the binary build is
      # provisioned by the mecatequi composite action itself.

      # Extract the UNTRUSTED prompt from the event JSON into a file via jq — never an inline
      # ${{ }} of the body. FULL-PATH sibling-action ref (see the header): `./` would resolve
      # to the caller's checkout, not mecatl's, so this must be the @v0.0.3-pinned full path.
      - name: Extract prompt
        id: prompt
        uses: stacklok/mecatl/.github/actions/mecatequi-extract-prompt@v0.0.3
        with:
          out-file: ${{ runner.temp }}/prompt.txt

      # The LLM keys reach the binary via the JOB-level env: block above, NOT a step env
      # here — step-level env on a `uses:` step does not propagate into the composite action's
      # internal steps, and the binary reads the key from the process environment. FULL-PATH
      # sibling-action ref, @v0.0.3-pinned.
      - name: mecatequi
        id: mecatequi
        uses: stacklok/mecatl/.github/actions/mecatequi@v0.0.3
        with:
          prompt-file: ${{ steps.prompt.outputs.prompt-file }}
          untrusted: "true"
          posture: ${{ inputs.posture }}
          model: ${{ inputs.model }}
          default-provider: ${{ inputs.default-provider }}
          max-run-tokens: ${{ inputs.max-run-tokens }}
          timeout: ${{ inputs.timeout }}
          openai-base-url: ${{ inputs.openai-base-url }}
          guardrails-model: ${{ inputs.guardrails-model }}

      - name: Upload run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mecatequi-run
          # Read every path from the action's outputs (including events-path) so an
          # out-events override is never silently missed.
          path: |
            ${{ steps.mecatequi.outputs.patch-path }}
            ${{ steps.mecatequi.outputs.summary-path }}
            ${{ steps.mecatequi.outputs.events-path }}
          if-no-files-found: warn
          retention-days: 7

    outputs:
      stop-reason: ${{ steps.mecatequi.outputs.stop-reason }}
      non-empty-diff: ${{ steps.mecatequi.outputs.non-empty-diff }}
      exit-class: ${{ steps.mecatequi.outputs.exit-class }}

  publish:
    name: Publish result (write token, no agent code)
    needs: [acknowledge, implement]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Run whenever the gate matched (acknowledge succeeded) and the run was not cancelled —
    # on implement SUCCESS *and* on implement FAILURE — so the operator always gets a
    # terminal result (an honest failure comment, never silence). `needs.acknowledge.result
    # == 'success'` means a non-matching trigger (acknowledge skipped) skips publish too,
    # while an implement failure (result == 'failure') still lands here: publish.sh reads an
    # empty/failed EXIT_CLASS as setup-failure and posts the honest failure comment.
    if: ${{ !cancelled() && needs.acknowledge.result == 'success' }}
    # The privileged job. It applies the patch as DATA and posts text — it never runs agent
    # output as code. The publish-token secrets are interpolated ONLY in this job, so GitHub
    # never materialises them in the implement job — the secret-scoping proof of the token
    # boundary.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # The `secrets` context is NOT allowed in a step `if:` (only in `env:`/`with:`), so map
    # the app-private-key PRESENCE to a job-level env flag and gate the mint step on that. The
    # flag is a boolean-ish string ("true"/"") — it leaks no secret value, only its presence.
    env:
      HAVE_APP_KEY: ${{ secrets.publish-app-private-key != '' }}
    steps:
      # Pin to the SAME immutable SHA `implement` diffed against (see that job's checkout)
      # so the patch applies onto the matching tree. persist-credentials:false keeps the
      # checkout token off disk — publish.sh pushes via the explicit GH_TOKEN env, not the
      # on-disk credential.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # NON-FATAL on purpose: when `implement` failed before its upload-artifact step, the
      # 'mecatequi-run' artifact does not exist and download-artifact would otherwise HARD-
      # ABORT this job — exactly the silent-failure case the acknowledge job + this fallback
      # close. continue-on-error lets publish.sh run regardless: a missing artifact leaves
      # PATCH_PATH/SUMMARY_PATH absent and an empty EXIT_CLASS, which the script reads as
      # setup-failure and comments.
      - name: Download run artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: mecatequi-run
          path: ${{ runner.temp }}/mecatequi-run

      # PUBLISH-TOKEN form (1): mint a SHORT-LIVED GitHub App installation token when app
      # creds are present. The `if:` is gated on the private key being non-empty — when the
      # consumer wired only a pre-minted publish-token (or neither), this step skips and
      # steps.app-token.outputs.token is empty, so the GH_TOKEN fallback chain below resolves
      # to the next form. SHA-pinned third-party action (house set).
      - name: Mint GitHub App token
        id: app-token
        if: ${{ env.HAVE_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.publish-app-id }}
          private-key: ${{ secrets.publish-app-private-key }}

      # Resolve the publish token ONCE into the job environment ($GITHUB_ENV), per the
      # publish-token decision: minted app token (form 1) -> pre-minted publish-token
      # (form 2) -> standing GITHUB_TOKEN (form 3). It MUST be written to $GITHUB_ENV (not
      # set as step-level env: on the `uses:` step below): step-level env on a `uses:` step
      # does NOT propagate into a composite action's internal steps, whereas a $GITHUB_ENV
      # write IS visible to every subsequent step in the job, including the composite's
      # internal step that runs publish.sh — the SAME mechanism job-level env relies on. The
      # GH_TOKEN value is written via env: (never inline-interpolated into the run: body), and
      # `>> "$GITHUB_ENV"` masks it from the log. Emit the standing-token ::warning:: here too
      # (form 3): the run still works zero-config, but a broad standing write grant is weaker
      # than a JIT app token — the warning nudges the operator toward form (1) or (2).
      - name: Resolve publish token
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISH_TOKEN: ${{ secrets.publish-token }}
          STANDING_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN}" ]; then
            gh_token="${APP_TOKEN}"
            echo "mecatequi-publish: using a minted GitHub App installation token (form 1)."
          elif [ -n "${PUBLISH_TOKEN}" ]; then
            gh_token="${PUBLISH_TOKEN}"
            echo "mecatequi-publish: using the pre-minted publish-token (form 2)."
          else
            gh_token="${STANDING_TOKEN}"
            echo "::warning::mecatequi-publish: no publish-app-private-key and no publish-token were provided; falling back to the standing GITHUB_TOKEN grant (form 3). The stronger posture is a JIT GitHub App installation token (publish-app-id + publish-app-private-key) or a pre-minted publish-token — see docs/design/MECATEQUI.md."
          fi
          # Write to $GITHUB_ENV so publish.sh reads GH_TOKEN from the process environment.
          # The value never appears in the log: it is piped to the file, not echoed.
          echo "GH_TOKEN=${gh_token}" >> "${GITHUB_ENV}"

      # publish.sh applies the patch as DATA (git apply) and posts text — never agent output
      # as code. It reads GH_TOKEN from the process environment, resolved into $GITHUB_ENV by
      # the step above (a job-scoped write, the only delivery that reaches a composite's
      # internal step). FULL-PATH sibling-action ref, @v0.0.3.
      - name: Publish
        uses: stacklok/mecatl/.github/actions/mecatequi-publish@v0.0.3
        with:
          issue-number: ${{ github.event.issue.number }}
          patch-path: ${{ runner.temp }}/mecatequi-run/mecatequi.patch
          summary-path: ${{ runner.temp }}/mecatequi-run/mecatequi.summary.json
          exit-class: ${{ needs.implement.outputs.exit-class }}
          repo: ${{ github.repository }}
          base-branch: ${{ inputs.base-branch }}
          pr-body-template: ${{ inputs.pr-body-template }}
          pr-title-template: ${{ inputs.pr-title-template }}
