# CI for mecatl — runs on every push to main and every pull_request.
#
# Deliberately uses `pull_request` (NOT `pull_request_target`): these jobs check
# out and execute untrusted PR code, so they must run WITHOUT access to repo
# secrets. `pull_request` runs in the fork's context with a read-only token and
# no secrets, which is exactly what we want here. `pull_request_target` would
# run in the BASE repo's context WITH secrets — combining that with a checkout
# of PR code is the classic "pwn request" RCE pattern. See:
#   https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
#   https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# All third-party actions are SHA-pinned (with a # vX.Y.Z comment) so a
# re-pointed tag from a compromised maintainer cannot change what runs here.
# Pins match the Stacklok house set used in a downstream consumer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      race_timing:
        description: Capture and upload per-command go test JSONL timing records
        required: false
        type: boolean
        default: false
      race_vet_off:
        description: "Experimental: append -vet=off to race tests (manual dispatch only)"
        required: false
        type: boolean
        default: false

# Least-privilege default for the whole workflow. The CI jobs only read source.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a force-push doesn't pile up minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail loudly rather than silently downloading a different toolchain over the
  # network if the local Go is older than go.mod requires. setup-go provisions
  # the right version; this keeps the build deterministic against that pin.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  # Prefer the checksum-backed public proxy, but use the module's VCS origin if
  # its transport fails. `|` (unlike `,`) permits fallback on any proxy error.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # Do not use workflow-level path filters: required checks must exist on every
  # push/PR. This job instead classifies the exact compare range and fail-closes
  # to full validation whenever Git cannot prove a narrow docs-only change.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$PUSH_SHA"
              ;;
            *)
              base=""
              head=""
              ;;
          esac
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ "$head" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$base" != 0000000000000000000000000000000000000000 ]] \
            && [[ "$head" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --no-tags origin "$base" "$head" \
            && git cat-file -e "$base^{commit}" \
            && git cat-file -e "$head^{commit}"; then
            trusted_classifier="$RUNNER_TEMP/docs-only-changes.sh"
            if git show "$base:.github/scripts/docs-only-changes.sh" > "$trusted_classifier"; then
              result="$(git diff --name-only --no-renames -z "$base" "$head" | bash "$trusted_classifier")" || result=false
              if [[ "$result" == true ]]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  sdk:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the packageManager pin explicitly. Do not rely on corepack being
      # present or enabled on the runner.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install SDK dependencies (frozen)
        run: task sdk:install

      - name: Audit SDK dependency closure
        run: task sdk:audit

      - name: Lint and format-check SDK
        run: task sdk:lint

      - name: Type-check SDK
        run: task sdk:typecheck

      - name: Test SDK unit suite
        run: task sdk:test

      - name: Build SDK
        run: task sdk:build

      - name: Type-check published SDK examples
        run: task sdk:examples:typecheck

      - name: Pack SDK
        run: task sdk:pack

      - name: Verify SDK API reports
        run: task sdk:api:check

  sdk-integration:
    name: TypeScript SDK codegen and offline e2e
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.72.0'

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install SDK dependencies (frozen)
        run: task sdk:install

      - name: Verify generated contracts are fresh
        run: |
          task generate
          git diff --exit-code -- contracts/gen sdk/typescript/src/gen

      - name: Run offline SDK e2e against same-checkout mecated
        run: task sdk:e2e

  sdk-browser:
    name: TypeScript SDK browser (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium full flow
            project: chromium-full
            runner: ubuntu-24.04
          - browser: firefox
            label: Firefox smoke
            project: firefox-smoke
            runner: ubuntu-24.04
          - browser: webkit
            label: WebKit smoke
            project: webkit-smoke
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install SDK dependencies (frozen)
        run: task sdk:install

      - name: Resolve pinned Playwright version
        id: playwright-version
        working-directory: sdk/typescript
        run: node -e "process.stdout.write('version=' + require('@playwright/test/package.json').version + '\\n')" >> "$GITHUB_OUTPUT"

      - name: Cache pinned Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      - name: Ensure pinned Playwright browser and host dependencies
        working-directory: sdk/typescript
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser project
        run: task sdk:browser:project PROJECT="${{ matrix.project }}"

  sdk-macos-spawn:
    name: TypeScript SDK macOS spawn (macos-14, Node 22)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      # setup-node and setup-go include runner OS and architecture in their cache
      # keys, so this macos-14 job cannot restore either Linux cache family.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install SDK dependencies (frozen)
        run: task sdk:install

      - name: Run the focused macOS Node spawn smoke
        run: task sdk:macos-spawn

  slack-bot-example:
    name: Slack bot example
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the packageManager pin explicitly. Do not rely on corepack being
      # present or enabled on the runner.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: sdk/typescript/examples/slack-bot/pnpm-lock.yaml

      # Builds the SDK's dist/ (this example's own dependency) and, for the
      # offline bridge test, bin/mecated — both are plain Go/tsc builds, same
      # toolchain the `sdk` job above already provisions.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install Slack bot example dependencies (frozen)
        run: task slack-bot:install

      - name: Lint and format-check Slack bot example
        run: task slack-bot:lint

      - name: Type-check Slack bot example
        run: task slack-bot:typecheck

      - name: Test Slack bot example (offline, spawns mecated --mock)
        run: task slack-bot:test

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # engine/ is its own module (consumed via the committed go.work), so its
          # go.sum participates in the build cache key alongside the root's.
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      # Resolve the declared dependency graphs before compiling. A successful main
      # run then saves a complete shared module cache for later PR jobs. Retry only
      # network resolution, never build or test execution.
      - name: Download Go modules
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if (
              go mod download all
              cd engine && go mod download all
              cd ../authn/oidc && go mod download all
              cd ../../provider/ssefilter && go mod download all
              cd ../anthropic && go mod download all
              cd ../openai && go mod download all
              cd ../openaichat && go mod download all
            ); then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: go build
        run: go build ./...

      # engine/ is a separate module under the workspace — `./...` from the root
      # does NOT cross the module boundary, so build it explicitly too.
      - name: go build (engine module)
        run: cd engine && go build ./...

      - name: go build (OIDC authn module)
        run: cd authn/oidc && go build ./...

      # provider/ holds the opt-in LLM-provider Go submodules (ADR 0093), each
      # its own module under the workspace — build them explicitly too.
      - name: go build (provider modules)
        run: |
          (cd provider/ssefilter && go build ./...)
          (cd provider/anthropic && go build ./...)
          (cd provider/openai && go build ./...)
          (cd provider/openaichat && go build ./...)

  managed-temp-macos:
    name: Managed temporary storage (macOS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
      - name: Run managed temporary storage tests
        run: |
          go test ./internal/adapter/managedtemp -count=1
          go test ./internal/adapter/osfs -run '^TestADR_0281_.*' -count=1
          go test ./internal/app -run '^TestADR_0281_ManagedModeUnixAdmission$' -count=1
          GOOS=freebsd GOARCH=amd64 go test -c -o "$RUNNER_TEMP/osfs-freebsd.test" ./internal/adapter/osfs
          GOOS=freebsd GOARCH=amd64 go test -c -o "$RUNNER_TEMP/app-freebsd.test" ./internal/app

  test-race-root-a:
    name: Test (race root-a)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RACE_VET_OFF: ${{ github.event_name == 'workflow_dispatch' && inputs.race_vet_off }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum
      - name: Validate race workflow contracts
        run: |
          bash .github/scripts/root-race-packages_test.sh
          bash .github/scripts/root-race-packages.sh validate
          bash .github/scripts/race-test_test.sh
          bash .github/scripts/race-vet-off-workflow_test.sh
          bash .github/scripts/race-aggregate-workflow_test.sh
          bash .github/scripts/docs-only-changes_test.sh
          bash .github/scripts/docs-only-workflow_test.sh
      - name: go test -race (root-a and modules)
        env:
          RACE_TIMING: ${{ github.event_name == 'workflow_dispatch' && inputs.race_timing }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(bash .github/scripts/root-race-packages.sh root-a)
          bash .github/scripts/race-test.sh root-a -count=1 "${packages[@]}"
          (cd engine && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" engine ./...)
          (cd authn/oidc && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" oidc ./...)
          (cd provider/ssefilter && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" provider-ssefilter ./...)
          (cd provider/anthropic && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" provider-anthropic ./...)
          (cd provider/openai && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" provider-openai ./...)
          (cd provider/openaichat && bash "$GITHUB_WORKSPACE/.github/scripts/race-test.sh" provider-openaichat ./...)
      - name: Upload root-a race timing records
        if: always() && github.event_name == 'workflow_dispatch' && inputs.race_timing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-timing-root-a
          path: .scratch/race-timing/*.jsonl
          if-no-files-found: warn
          retention-days: 3

  test-race-root-b:
    name: Test (race root-b)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RACE_VET_OFF: ${{ github.event_name == 'workflow_dispatch' && inputs.race_vet_off }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum
      - name: go test -race (root-b)
        env:
          RACE_TIMING: ${{ github.event_name == 'workflow_dispatch' && inputs.race_timing }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(bash .github/scripts/root-race-packages.sh root-b)
          bash .github/scripts/race-test.sh root-b -count=1 "${packages[@]}"
      - name: Upload root-b race timing records
        if: always() && github.event_name == 'workflow_dispatch' && inputs.race_timing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-timing-root-b
          path: .scratch/race-timing/*.jsonl
          if-no-files-found: warn
          retention-days: 3

  test-race-ui:
    name: Test (race UI)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RACE_VET_OFF: ${{ github.event_name == 'workflow_dispatch' && inputs.race_vet_off }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum
      - name: go test -race (UI)
        env:
          RACE_TIMING: ${{ github.event_name == 'workflow_dispatch' && inputs.race_timing }}
        run: bash .github/scripts/race-test.sh ui -count=1 ./cmd/mecatui/ui
      - name: Upload UI race timing records
        if: always() && github.event_name == 'workflow_dispatch' && inputs.race_timing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-timing-ui
          path: .scratch/race-timing/*.jsonl
          if-no-files-found: warn
          retention-days: 3

  test-non-race-draft:
    name: Test (non-race draft coverage)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum
      - name: Complete test coverage without race detector
        run: |
          set -euo pipefail
          mapfile -t root_a < <(bash .github/scripts/root-race-packages.sh root-a)
          mapfile -t root_b < <(bash .github/scripts/root-race-packages.sh root-b)
          go test -count=1 "${root_a[@]}"
          go test -count=1 "${root_b[@]}"
          go test -count=1 ./cmd/mecatui/ui
          (cd engine && go test ./...)
          (cd authn/oidc && go test ./...)
          (cd provider/ssefilter && go test ./...)
          (cd provider/anthropic && go test ./...)
          (cd provider/openai && go test ./...)
          (cd provider/openaichat && go test ./...)

  # The stable required context is emitted only by full-race push/non-draft PR
  # runs. Draft coverage and docs-only runs use distinct contexts.
  test:
    name: ${{ needs.changes.outputs.docs_only == 'true' && 'Test (docs-only)' || github.event_name == 'pull_request' && github.event.pull_request.draft && 'Test (non-race draft)' || github.event_name == 'workflow_dispatch' && 'Test (race experiment)' || 'Test (race)' }}
    needs: [changes, test-race-root-a, test-race-root-b, test-race-ui, test-non-race-draft]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the applicable test coverage
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          ROOT_A_RESULT: ${{ needs.test-race-root-a.result }}
          ROOT_B_RESULT: ${{ needs.test-race-root-b.result }}
          UI_RESULT: ${{ needs.test-race-ui.result }}
          DRAFT_RESULT: ${{ needs.test-non-race-draft.result }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "changes job did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            exit 0
          fi
          if [[ "$IS_DRAFT" == true ]]; then
            [[ "$DRAFT_RESULT" == success ]] || { echo "draft non-race coverage failed: $DRAFT_RESULT" >&2; exit 1; }
            exit 0
          fi
          if [[ "$ROOT_A_RESULT" != success || "$ROOT_B_RESULT" != success || "$UI_RESULT" != success ]]; then
            echo "race shard failure: root-a=$ROOT_A_RESULT root-b=$ROOT_B_RESULT ui=$UI_RESULT" >&2
            exit 1
          fi

  analysis:
    name: Analysis
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - id: golangci-version
        run: echo "version=$(sh scripts/install-golangci-lint.sh --version)" >> "$GITHUB_OUTPUT"

      # golangci-lint-action manages its own cache and installs the same pinned
      # release local `task lint` installs into .tools/bin.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be a golangci-lint built with Go >= the go.mod toolchain
          # (1.26.x): older binaries refuse to load with "the Go language
          # version used to build golangci-lint is lower than the targeted Go
          # version". The version is declared by scripts/install-golangci-lint.sh.
          version: ${{ steps.golangci-version.outputs.version }}
          # 10m, not 5m: the repo outgrew the old budget on the 2-core runners —
          # at 5m the run died with exit code 4 ("Timeout exceeded") and the
          # interrupted staticcheck pass reported spurious SA5011s (partial
          # no-return facts), failing every push since. The module lint steps run
          # sequentially, so the 30-minute job budget leaves room after a worst-case
          # root lint for the remaining module lint and workflow checks; this
          # lets golangci-lint, not the job, report a timeout.
          args: --timeout=10m

      # engine/ is its own module — lint it with the SHARED root config (no
      # engine-local .golangci.yml) so the depguard layering allowlists stay the
      # single source of truth across the module boundary. Uses the binary the
      # action above installed onto PATH.
      - name: golangci-lint (engine module)
        run: cd engine && golangci-lint run --config ../.golangci.yml --allow-parallel-runners --timeout=10m ./...

      - name: golangci-lint (OIDC authn module)
        run: cd authn/oidc && golangci-lint run --config ../../.golangci.yml --allow-parallel-runners --timeout=10m ./...

      # provider/ submodules (ADR 0093) — each its own module, sharing the ROOT
      # golangci config so the depguard allowlists stay the single source of truth.
      - name: golangci-lint (provider modules)
        run: |
          (cd provider/ssefilter && golangci-lint run --config ../../.golangci.yml --allow-parallel-runners --timeout=10m ./...)
          (cd provider/anthropic && golangci-lint run --config ../../.golangci.yml --allow-parallel-runners --timeout=10m ./...)
          (cd provider/openai && golangci-lint run --config ../../.golangci.yml --allow-parallel-runners --timeout=10m ./...)
          (cd provider/openaichat && golangci-lint run --config ../../.golangci.yml --allow-parallel-runners --timeout=10m ./...)

      # Lint the GitHub Actions workflows + assert the reusable workflow's first-party
      # sibling-action pins match the release tag (the version-skew guard). actionlint is
      # pinned via `go run` so no extra binary install is needed; it embeds shellcheck for
      # `run:` blocks when available. `task lint:actions` chains the reusable-pins check.
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check reusable-workflow pins
        run: bash .github/actions/check-reusable-pins.sh

      # Reject a LIVE empty ${{ }} expression in a PARSED field of any workflow/action manifest
      # (issue #70). GitHub evaluates `${{ ... }}` inside parsed action.yml/workflow scalars, and
      # an EMPTY `${{ }}` is a hard parse error ("An expression was expected") that makes the
      # action fail to load and aborts every run that references it — exactly what bricked the
      # v0.0.2 reusable workflow. The guard excludes YAML `#` comment lines (never evaluated).
      - name: Check action templates for empty expressions
        run: bash .github/actions/check-action-templates.sh

      # The mecatequi composite-action glue scripts (extract-prompt.sh, publish.sh) have
      # offline bash tests with fake gh/git stubs that assert their SECURITY logic (no
      # untrusted-body interpolation; protected-paths gate incl. the -z path-quoting bypass;
      # template-confinement; literal+single-pass PR-body render; the comment-without-PR
      # branches). The action-wrappers test pins the composite action.yml env-mapping contract
      # (actionlint cannot lint a composite action). They are shell, not Go, so they ride here
      # rather than in `go test`.
      - name: Test GitHub Actions scripts
        run: |
          bash .github/actions/mecatequi-extract-prompt/extract-prompt_test.sh
          bash .github/actions/mecatequi-publish/publish_test.sh
          bash .github/actions/action-wrappers_test.sh
          bash .github/scripts/lint-vet-workflow_test.sh

  # Keep cmd/vet authoritative and complete without serializing its cold root-module
  # cost behind golangci-lint. The two jobs use separate runners, so vet adds no CPU
  # or memory contention to the already resource-bound golangci analysis.
  vet:
    name: Vet
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - name: Require complete vet coverage
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          (cd engine && go vet ./...)
          (cd authn/oidc && go vet ./...)
          (cd provider/ssefilter && go vet ./...)
          (cd provider/anthropic && go vet ./...)
          (cd provider/openai && go vet ./...)
          (cd provider/openaichat && go vet ./...)

  # Preserve one stable required context while analysis and vet run concurrently.
  # The aggregate itself validates the classifier and both applicable child jobs,
  # so failures and cancellations cannot be hidden by dependency skipping.
  lint:
    name: Lint
    needs: [changes, analysis, vet]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable lint coverage
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          VET_RESULT: ${{ needs.vet.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "changes job did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            if [[ "$ANALYSIS_RESULT" != skipped || "$VET_RESULT" != skipped ]]; then
              echo "docs-only child jobs were not skipped: analysis=$ANALYSIS_RESULT vet=$VET_RESULT" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "$ANALYSIS_RESULT" != success || "$VET_RESULT" != success ]]; then
            echo "lint coverage failed: analysis=$ANALYSIS_RESULT vet=$VET_RESULT" >&2
            exit 1
          fi

  fuzz-smoke:
    name: Fuzz smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # A short coverage-guided pass over the security-critical parsers. This is
      # a smoke check (find shallow crashers fast), NOT the nightly deep fuzz —
      # the seed corpora already run under `go test` in the test job. The
      # Taskfile `fuzz` task runs the FuzzXxx targets sequentially.
      #
      # FUZZTIME is an ITERATION COUNT (`Nx`), not a wall-clock duration. A
      # duration budget (e.g. `40s`) races go test's own fuzz coordinator: near
      # the deadline the coordinator can kill an in-flight worker RPC and
      # report the whole target as failed with "context deadline exceeded" —
      # this reproduced reliably at 20s/target and intermittently even after
      # doubling to 40s/target, on a loaded runner. An iteration count has no
      # deadline to race: the coordinator stops after N executions regardless
      # of how fast the runner is that day. 300000 execs/target is comfortably
      # under a minute per target even on a slow runner (CI logs showed
      # 10k-30k execs/sec), well inside the job timeout.
      # The governance fuzzers live in the engine module — `task fuzz` runs
      # them from engine/ (workspace-on, so it resolves against the same
      # checkout).
      - name: task fuzz (short)
        run: task fuzz FUZZTIME=300000x

  engine-standalone:
    name: Engine module (standalone, GOWORK=off)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Proves the importable-core module builds + tests with NO workspace and NO
    # host-repo deps: the engine's tiny dependency closure (doublestar + x/sync +
    # goleak) is self-contained, so an external `go get
    # github.com/stacklok/mecatl/engine` resolves only that closure, not mecatl's
    # heavy require cone. See docs/adr/0036-engine-module.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache: true
          cache-dependency-path: engine/go.sum

      # GOWORK=off ignores the committed go.work, so the engine module resolves
      # against its OWN go.mod/go.sum alone — exactly an external consumer's view.
      - name: go build (engine standalone)
        env:
          GOWORK: off
        run: cd engine && go build ./...

      - name: go test (engine standalone)
        env:
          GOWORK: off
        run: cd engine && go test ./...

  provider-standalone:
    name: Provider modules (standalone, GOWORK=off)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Proves the opt-in provider/ submodules build + test with NO workspace
    # (GOWORK=off), the engine-standalone hygiene gate. Because mecatl is a
    # private/INTERNAL repo, a module that `require`s another mecatl module
    # (anthropic → engine; openai/openaichat → engine + provider/ssefilter) can
    # only be fetched from the origin WITH auth — proxy.golang.org cannot serve a
    # private module. So the cache is WARMED with read-only git auth (the
    # workflow's GITHUB_TOKEN via an insteadOf rewrite), then the gate itself runs
    # fully OFFLINE (GOPROXY=off): the proof that the module's closure is
    # self-contained never touches the network, and the token lives only on the
    # warm step. Covers ssefilter + anthropic. openai + openaichat additionally
    # `require provider/ssefilter v0.0.0`, which is unresolvable until the first
    # provider/ssefilter/vX.Y.Z tag — deferred (issue #379); covered by the
    # workspace (GOWORK=on) build/test jobs. Once mecatl is open-sourced the warm
    # needs no token (proxy serves the modules). See ADR 0093.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            provider/ssefilter/go.sum
            provider/anthropic/go.sum

      # Warm the module cache. The build/test resolve the FULL (incl. test-only)
      # dependency graph into the cache. engine v0.8.0 (and provider/ssefilter for
      # the openai family) are fetched from the private origin over HTTPS using
      # the GITHUB_TOKEN via an insteadOf rewrite; GOFLAGS=-mod=mod overrides the
      # global -mod=readonly so the graph can resolve. GOPRIVATE keeps the
      # checksum DB + proxy from rejecting the private module path.
      - name: warm module cache (ssefilter + anthropic)
        env:
          GOWORK: off
          GOFLAGS: -mod=mod
          GOPRIVATE: github.com/stacklok/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          (cd provider/ssefilter && go build ./... && go test ./... >/dev/null)
          (cd provider/anthropic && go build ./... && go test ./... >/dev/null)

      - name: drop git credential rewrite
        if: always()
        run: git config --global --unset-all url."https://x-access-token@github.com/".insteadOf || true

      # The proof itself: fully offline (GOPROXY=off) + no workspace (GOWORK=off).
      # If any dependency were missing from the cache this fails — no credential
      # is present on this step.
      - name: go build (provider standalone, offline)
        env:
          GOWORK: off
          GOPROXY: off
        run: |
          (cd provider/ssefilter && go build ./...)
          (cd provider/anthropic && go build ./...)

      - name: go test (provider standalone, offline)
        env:
          GOWORK: off
          GOPROXY: off
        run: |
          (cd provider/ssefilter && go test ./...)
          (cd provider/anthropic && go test ./...)

  api-compat:
    name: API compat (engine public surface)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The engine module's public API surface (the seven core packages) is a
    # committed compatibility contract — see engine/COMPATIBILITY.md + ADR 0037.
    # This gate re-derives the surface and fails on any drift from the committed
    # engine/api/*.txt baselines, forcing a deliberate, reviewed `task api:update`
    # + an engine/CHANGELOG.md note. The dumper test lives in the ROOT module
    # (internal/apicheck) so the engine go.mod stays free of go/tools. This test
    # ALSO runs in the main `test` job via ./...; the dedicated job is for a clear
    # named signal (acceptable redundancy, like fuzz-smoke).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      - name: go test ./internal/apicheck
        run: go test ./internal/apicheck

  vuln:
    name: Vulnerabilities (govulncheck)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Supply-chain hygiene that travels with the engine library: govulncheck
    # reports only REACHABLE vulnerabilities (call-graph analysis, not a bare
    # require-list scan), so a reachable CVE in either module's dependency cone
    # reds the PR. Both modules are scanned — the engine module's tiny closure
    # separately from the root's heavy cone, so a downstream consumer pin of the engine
    # library inherits this gate against its own deps.
    #
    # govulncheck has NO native allowlist and its text mode exits non-zero on ANY
    # finding, so we run `-format json` (which exits 0 even WITH findings) and
    # filter through .github/scripts/govulncheck-gate.go, which fails on any NEW
    # reachable id while accepting a documented allowlist. `set -o pipefail` +
    # the gate's own fail-closed checks make a govulncheck build/network error a
    # hard FAIL (never a vacuous pass).
    #
    # ROOT ALLOWLIST: empty as of 2026-06-26 — the toolhive bump to v0.31.0
    # pulled a fixed docker/docker, clearing GO-2026-4887/4883/5617/5668/5746.
    # Re-add a dated entry here ONLY if a new reachable vuln has no upstream fix.
    # ENGINE: STRICT — no allowlist; it is clean and must stay clean.
    # See docs/usage.md (supply-chain) + issue #118.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      # Self-test the gate filter on synthetic JSON first (offline) so a broken
      # gate is caught here rather than silently mis-judging the real scan below.
      - name: Test govulncheck gate
        run: bash .github/scripts/govulncheck-gate_test.sh

      # govulncheck is PINNED and installed ONCE here (`go install`, not `go run`
      # per invocation) — four separate `go run pkg@version` calls below each
      # re-resolved+downloaded the SAME govulncheck dep closure (x/vuln,
      # x/telemetry, x/mod, x/tools, x/sync) from scratch, which repeatedly ate
      # into this job's network-bound window and its timeout budget. Installing
      # once cuts that 4x down to 1x; `go env GOPATH`/bin is added to PATH so
      # every module-scoped step below can just call `govulncheck`.
      - name: Install govulncheck (pinned, shared by every module below)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `./...` from the root does NOT cross the engine module boundary, so the
      # engine module is a second, separate invocation against its OWN go.mod/go.sum.
      - name: govulncheck (root module — allowlisted gate)
        shell: bash
        run: |
          set -o pipefail
          govulncheck -format json ./... \
            | go run .github/scripts/govulncheck-gate.go # v1.1.4 — no allowlist (toolhive v0.31.0 cleared the docker/docker vulns)

      - name: govulncheck (engine module — strict, no allowlist)
        shell: bash
        run: |
          set -o pipefail
          cd engine && govulncheck -format json ./... \
            | go run ../.github/scripts/govulncheck-gate.go # v1.1.4

      - name: govulncheck (OIDC authn module — strict, no allowlist)
        shell: bash
        run: |
          set -o pipefail
          cd authn/oidc && govulncheck -format json ./... \
            | go run ../../.github/scripts/govulncheck-gate.go # v1.1.4

      # provider/ submodules (ADR 0093) — each its own module; scan against its
      # own go.mod so the provider library's closure is checked independently.
      - name: govulncheck (provider modules — strict, no allowlist)
        shell: bash
        run: |
          set -o pipefail
          (cd provider/ssefilter && govulncheck -format json ./... \
            | go run ../../.github/scripts/govulncheck-gate.go) # v1.1.4
          (cd provider/anthropic && govulncheck -format json ./... \
            | go run ../../.github/scripts/govulncheck-gate.go) # v1.1.4
          (cd provider/openai && govulncheck -format json ./... \
            | go run ../../.github/scripts/govulncheck-gate.go) # v1.1.4
          (cd provider/openaichat && govulncheck -format json ./... \
            | go run ../../.github/scripts/govulncheck-gate.go) # v1.1.4

  docs:
    name: Docs (matlatl)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The config-reference + skeleton generator is a Go program; the matlatl
      # composite action below brings its own toolchain but does not expose one to
      # later steps, so provision Go here for the freshness gate. Pinned to the same
      # SHA as the other jobs (house rule).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            engine/go.sum
            authn/oidc/go.sum
            provider/ssefilter/go.sum
            provider/anthropic/go.sum
            provider/openai/go.sum
            provider/openaichat/go.sum

      # Documentation-only changes still run the repository's Go-backed document
      # invariants (ADR numbering, citations, lifecycle, and reading-map checks).
      - name: go test ./docs/lint
        run: go test ./docs/lint

      # This command owns an executable contract for the session-storage
      # operations guide under user-docs/. Keep it on the docs-only path: a
      # documentation rename or edit must not leave a stale referenced runbook.
      - name: go test documented mecated operations
        run: go test ./cmd/mecated -run '^TestSessionStorageContinuity_Scenario9_'

      # Freshness gate for the generated configuration reference + the embedded
      # config-init skeleton: regenerate both to a temp dir and fail if they differ
      # from what's committed. The error names the exact regen command.
      - name: configuration reference is up to date
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/configgen/cmd/configref \
            --skeleton "${RUNNER_TEMP}/settings.skeleton.yaml" \
            --reference "${RUNNER_TEMP}/configuration-reference.md"
          stale=0
          if ! diff -u internal/configgen/settings.skeleton.yaml "${RUNNER_TEMP}/settings.skeleton.yaml"; then
            stale=1
          fi
          if ! diff -u docs/configuration-reference.md "${RUNNER_TEMP}/configuration-reference.md"; then
            stale=1
          fi
          if [ "$stale" -ne 0 ]; then
            echo "::error file=docs/configuration-reference.md::config reference / settings skeleton is out of date — run 'task docs:configref' and commit the result."
            exit 1
          fi

      # matlatl's composite action builds the gate from ITS OWN checkout, so
      # there is no binary step and no extra credentials here — only org Actions
      # access to stacklok/matlatl (granted org-wide). strict also fails on
      # orphans / unreachable / ambiguous links (ADR 0005), not just broken
      # links/anchors. Pinned to a release SHA (house rule); the # comment
      # records the tag. findings.json + junit.xml land in matlatl-out/.
      - name: matlatl docs gate (strict)
        id: matlatl
        uses: stacklok/matlatl@166a04c0fec85155f5be150eab34e3451672b033 # v0.0.8
        with:
          strict: "true"

  user-docs:
    name: User docs (Docusaurus build)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `user-docs/` (the mecatl.dev site content) is excluded from the matlatl
    # corpus above — see .matlatlignore — because its Docusaurus content-root
    # links aren't matlatl-relative. Without this job nothing on the PR path
    # checks it at all: `deploy-site.yml` only runs on push to main, AFTER
    # merge. `npm run build` is the SAME command that workflow uses to publish,
    # and Docusaurus's own `onBrokenLinks: 'throw'` (docusaurus.config.ts) fails
    # the build on a broken internal link or a page that isn't in any sidebar —
    # the cheapest available freshness gate, not a content-completeness check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build

  domain-model:
    name: Domain model
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # modelith's composite action downloads a prebuilt, checksum-verified
      # release binary — stacklok/modelith is now public, so there's no
      # cross-repo Actions access grant to worry about (unlike when it was
      # private). Pinned to a SHA (house rule); the # comment records the
      # revision the committed .md was rendered with. `lint` validates the
      # model (completeness gaps are errors — the model is currently clean),
      # and check-rendered fails the build if
      # docs/architecture/mecatl.modelith.md has drifted from its .yaml
      # source.
      - uses: stacklok/modelith@26d8f41b42f445144ba0f14d0997a3b9eb9657f4 # post-v0.4.0
        with:
          files: docs/architecture/mecatl.modelith.yaml
          completeness: error
          check-rendered: true
