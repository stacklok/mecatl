<!--
  Mecatl architecture: what is fixed and what is yours to choose.

  Source of truth: Figma "Diagram Kit" > page "Mecatl · README" > frame
  "mecatl-architecture". Used under "Open and modular by design". This is the
  Mecatl-only view; the Theirs/Yours comparison is the README hero
  (assets/mecatl-hero.svg) and the original deeper comparison is kept at
  assets/mecatl-modular.svg.

  To change it: edit in Figma, re-export as SVG with LIVE TEXT (not outlined), then
  re-apply the font-family fallback stacks below. GitHub renders README images via
  <img>, which puts the SVG in secure static mode with no external resource loading,
  so a webfont @import cannot work and Space Grotesk/Inter fall back to the system
  sans stack for most viewers. Layout is verified to fit even in the widest fallback.

  ACCENT CORD CLIPPING - fixed at source, do not "tidy" it away. Figma's SVG
  exporter emits a clipPath only when a child overflows the parent's bounding BOX;
  it ignores corner-radius overlap. The cords are 4px wide and flush with the
  card's left edge, so without a clip their square corners poke out past the
  rounded edge. Some cards got clipped anyway, but only incidentally - their text
  was slightly taller than the height they were given, and the clip Figma emitted
  for the text trimmed the cord for free. Cards whose content happened to fit
  exactly (the engine bar, the state strip) got no clip and showed the artifact.
  The fix, in the Figma component: the Cord is layoutPositioning=ABSOLUTE with
  vertical STRETCH constraints, y=-1 and height=parent+2, so it always overflows
  by 1px and the clip is always emitted with the correct rounded geometry. The
  Content column carries paddingLeft=20 (instead of 16) to make up for the cord
  no longer occupying 4px of the auto-layout flow, so text position is unchanged.
  Exports are now self-correcting; the clipPaths in this file are equivalent.

  Palette tokens are from website/src/pages/colophon.tsx (dark-only).
-->
<svg width="800" height="488" viewBox="0 0 800 488" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mecatl keeps the agent loop constant while the client, runtime, model provider, tools and state store all remain yours to choose.</title>
<desc>A central bar reads "the constant: Mecatl engine loop - tool dispatch, permissions, hooks, delegation, compaction, events". Connected above it: Client (any client - mecatui, your app, TypeScript SDK, gRPC and HTTP) and Runtime (anywhere - local, remote, Kubernetes replicas). Connected below it: Models (any provider - Anthropic, OpenAI, OpenRouter, or your own adapter) and Tools and gateways (any gateway - MCP servers, LLM gateways, your own tools). A State strip beneath reads "durable outside the process - JSONL, Redis, your store". Each surrounding block carries its own accent cord, marking it as independently replaceable.</desc>

