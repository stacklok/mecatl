# golangci-lint configuration for mecatl.
#
# Schema: v2 (golangci-lint v2.x). Adapted from Stacklok house style
# (toolhive, mkp) and calibrated for this early-stage, hexagonal codebase.
#
# Parallel-safe by design: run.allow-parallel-runners lets multiple work
# packages run `task lint` concurrently against the same module without the
# runners clobbering each other's lock/cache.
version: "2"

run:
  # Permit concurrent golangci-lint invocations (required: multiple WPs lint
  # the same checkout in parallel).
  allow-parallel-runners: true
  # 0 lets golangci-lint pick GOMAXPROCS; bound it so parallel runners do not
  # oversubscribe the host.
  concurrency: 4
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    # depguard is the PER-FILE half of the machine-enforced clean-core layering
    # (the other half is the whole-graph DAG test in engine/arch/layering_test.go).
    # The core tiers (session, governance, tool, prompt, port, team, agent) are an
    # ALLOWLIST: each rule is list-mode: strict and lists $gostd + exactly the mecatl
    # core packages that tier legitimately imports (see the import map in CLAUDE.md's
    # "layering rule"). This makes a NEW heavy adapter import rejected BY DEFAULT — the
    # whole point of an allowlist over a denylist of named adapters. cmd/ mains are
    # composition roots and are deliberately NOT targeted by any core rule.
    #
    # The `os` deny entries are the expressiveness patch: `os` is stdlib so $gostd
    # would otherwise allow it, but CLAUDE.md bans core packages from importing os.
    # depguard applies deny OVER allow, so the deny wins. (Confirmed: no core package
    # imports os today, so these fire zero false positives on the clean tree.) NOTE
    # this `os` ban is DIRECT-only: depguard sees one file's imports, so a *transitive*
    # reach into os (every core pkg ultimately touches os via fmt/etc.) is intentionally
    # NOT graph-enforced — neither here nor in the DAG test. The rule is "no core file
    # may name os directly", not "no core package may transitively depend on os".
    #
    # Every core rule EXCLUDES '!$test': test files legitimately import the
    # memfs/mockllm adapters (offline tests) and the external-test convention
    # imports the package-under-test itself. This mirrors the DAG test in
    # engine/arch/layering_test.go, which reads NON-TEST imports only. Production
    # (non-test) core code is what the allowlist holds to the inward-only rule.
    depguard:
      rules:
        # ORTHOGONAL to the core-tier layering rules below: this is the house
        # deprecation guard (io/ioutil), not part of the clean-core allowlist set.
        deprecated:
          list-mode: lax
          files:
            - $all
            - '!$test'
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os
        # Domain leaves: pure, no mecatl-core dependencies. (session is the pure
        # domain leaf; governance is the session-free leaf.)
        core-domain-leaf:
          list-mode: strict
          files:
            - '**/engine/session/**.go'
            - '**/engine/governance/**.go'
            - '!$test'
          allow:
            - $gostd
          deny:
            - pkg: os
              desc: 'core domain must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # Domain (tool): holds the FileSystem/Workspace interfaces, imports session only.
        core-tool:
          list-mode: strict
          files:
            - '**/engine/tool/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'core domain must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # Domain (prompt): two-layer assembly + consumer-local ports; imports
        # session + tool only (NOT port — prompt's ports live in prompt).
        core-prompt:
          list-mode: strict
          files:
            - '**/engine/prompt/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'core domain must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # port: the inward-facing interfaces; imports domain only (session,
        # governance, prompt, tool) + stdlib. Adapters meet these only in composition.
        core-port:
          list-mode: strict
          files:
            - '**/engine/port/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/governance
            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'port must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # team: the agent-team domain types; imports session only.
        core-team:
          list-mode: strict
          files:
            - '**/engine/team/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'core domain must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # --- engine/adapter/* reference adapters -------------------------------
        # These travel WITH the importable engine tree (offline tests, in-memory
        # workspace, default policy, snapshot DTO, FS conformance suite, the
        # production wallclock) and are
        # held to the same strict allowlist discipline: $gostd + the exact engine
        # packages (+ doublestar for memfs' Glob) — never a heavy dep, never os,
        # never anything outside engine/. Core-tier PRODUCTION code still must not
        # import them (the core rules don't list them; the DAG test forbids the
        # engine/adapter/ prefix) — only core $test files may.
        engine-adapter-memfs:
          list-mode: strict
          files:
            - '**/engine/adapter/memfs/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/tool
            - github.com/bmatcuk/doublestar/v4
          deny:
            - pkg: os
              desc: 'memfs is the in-memory FileSystem fake; it must not touch the real OS'
        engine-adapter-memmemory:
          list-mode: strict
          files:
            - '**/engine/adapter/memmemory/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'memmemory is process-local reference memory; it must not touch the real OS'
        engine-adapter-memproposal:
          list-mode: strict
          files:
            - '**/engine/adapter/memproposal/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/learning
          deny:
            - pkg: os
              desc: 'memproposal is the process-local proposal reference store; it must not touch the real OS'
        engine-adapter-memorypromotion:
          list-mode: strict
          files:
            - '**/engine/adapter/memorypromotion/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/learning
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'memorypromotion is portable policy over injected proposal and memory ports; it must not touch the real OS'
        engine-adapter-proposalconformance:
          list-mode: strict
          files:
            - '**/engine/adapter/proposalconformance/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/learning
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'proposalconformance drives the abstract repository contract; it must not touch the real OS'
        engine-adapter-memorytools:
          list-mode: strict
          files:
            - '**/engine/adapter/memorytools/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'memorytools are portable tool bodies over an injected MemoryStore; they must not touch the real OS'
        engine-adapter-fstools:
          list-mode: strict
          files:
            - '**/engine/adapter/fstools/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'fstools are the core FS tool bodies over the injected tool.Workspace/CommandRunner; they must not touch the real OS'
        engine-adapter-agentfs:
          list-mode: strict
          files:
            - '**/engine/adapter/agentfs/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/tool
            - go.yaml.in/yaml/v3
          deny:
            - pkg: os/exec
              desc: 'agentfs discovers agent-def files via os.ReadDir/ReadFile; it must never spawn processes'
        engine-adapter-skillfs:
          list-mode: strict
          files:
            - '**/engine/adapter/skillfs/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
            - go.yaml.in/yaml/v3
          deny:
            - pkg: os/exec
              desc: 'skillfs discovers SKILL.md trees via os.ReadDir/ReadFile; it must never spawn processes'
        engine-adapter-rulesfs:
          list-mode: strict
          files:
            - '**/engine/adapter/rulesfs/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/prompt
            - go.yaml.in/yaml/v3
          deny:
            - pkg: os/exec
              desc: 'rulesfs discovers <name>.md rule files via os.ReadDir/ReadFile; it must never spawn processes'
        engine-adapter-nofs:
          list-mode: strict
          files:
            - '**/engine/adapter/nofs/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'nofs is the honest no-filesystem Workspace; it must not touch the real OS'
        engine-adapter-mockllm:
          list-mode: strict
          files:
            - '**/engine/adapter/mockllm/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'mockllm is the scripted offline provider; it must not touch the OS or the network'
        engine-adapter-memstore:
          list-mode: strict
          files:
            - '**/engine/adapter/memstore/**.go'
