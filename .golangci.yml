              desc: 'permstore is the in-memory always-allow rule store; it must not touch os'
        engine-adapter-wallclock:
          list-mode: strict
          files:
            - '**/engine/adapter/wallclock/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/port
          deny:
            - pkg: os
              desc: 'wallclock is the stateless production port.Clock; it must not touch os'
        engine-adapter-memlease:
          list-mode: strict
          files:
            - '**/engine/adapter/memlease/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'memlease is the in-memory reference port.SessionLease; it must not touch os'
        engine-adapter-leaseconformance:
          list-mode: strict
          files:
            - '**/engine/adapter/leaseconformance/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/session
          deny:
