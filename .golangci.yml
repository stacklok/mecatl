            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
          deny:
            - pkg: os
              desc: 'anthropic implements port.LLMProvider over the Anthropic SDK; it must not touch os or the root module'
        provider-openai:
          list-mode: strict
          files:
            - '**/provider/openai/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/openai/openai-go/v3
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
            - github.com/stacklok/mecatl/provider/ssefilter
          deny:
            - pkg: os
              desc: 'openai implements port.LLMProvider over the OpenAI Responses API; it must not touch os or the root module'
        provider-openaichat:
          list-mode: strict
          files:
            - '**/provider/openaichat/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/openai/openai-go/v3
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
            - github.com/stacklok/mecatl/provider/ssefilter
          deny:
            - pkg: os
              desc: 'openaichat implements port.LLMProvider over the OpenAI Chat Completions API; it must not touch os or the root module'
    # forbidigo is the BAN GUARD for the logging architecture (iteration 3): no NEW
    # global-slog drift may re-enter internal/. Diagnostics flow through the injected
    # port.Diagnostics seam; slog.Default()/slog.SetDefault()/package-level
    # slog.Info|Warn|Debug|Error are forbidden there. cmd/ mains are EXEMPT (see the
    # exclusions block below) — they own the third-party-slog bridge (mecated→stderr,
    # mecatui→file). The patterns are precise: slog.New*/Handler/HandlerOptions/Level/
    # DiscardHandler (slogdiag's legitimate internals) and the *slog.Logger type (the
    # perf surface) do NOT match, so only the banned call shapes trip. See
    # docs/adr/0020-diagnostics.md and CLAUDE.md ("global slog is banned in engine/ and internal/").
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: 'slog\.Default\b'
          msg: 'global slog is banned in engine/ and internal/: route diagnostics through the injected port.Diagnostics seam (slogdiag adapter); the cmd/ main owns the sink. See docs/adr/0020-diagnostics.md.'
        - pattern: 'slog\.SetDefault\b'
          msg: 'global slog is banned in engine/ and internal/: only cmd/ mains may install a slog default (the third-party-slog bridge). Everything else must take a port.Diagnostics. See docs/adr/0020-diagnostics.md.'
        - pattern: 'slog\.(Info|Warn|Debug|Error)(Context)?\b'
          msg: 'package-level slog.* is banned in engine/ and internal/: log through the injected port.Diagnostics seam, not the global logger. See docs/adr/0020-diagnostics.md.'
    goconst:
      ignore-tests: true
      min-occurrences: 5
    gocyclo:
      # Bumped from the house default of 15: this codebase has a couple of
      # legitimately branchy parsers (bash command splitting, snapshot restore)
      # that are clearer as one function than artificially decomposed.
      min-complexity: 20
    gosec:
      excludes:
        - G601 # implicit memory aliasing of range var (fixed by Go 1.22 loopvar)
        # The osfs/hookexec adapters exist precisely to read caller-supplied
        # paths and run configured hook commands; flagging those as taint is
        # noise here. Path-escape and command safety are enforced in the
        # adapters' own logic and tests, not by gosec.
        - G204 # subprocess launched with variable (hookexec runs configured hooks)
        - G301 # directory permission (0755 is intentional for workspace dirs)
        - G304 # file inclusion via variable (osfs reads caller-relative paths)
        - G306 # WriteFile permission (0644 is intentional for workspace files)
    # misspell is intentionally NOT enabled: the codebase mixes US and UK
    # spellings in prose/comments (e.g. serialized/serialised, behavior/
    # behaviour), so any single locale produces noise that fights the existing
    # text rather than catching real typos. The Stacklok reference repos
    # (toolhive, mkp) likewise do not run misspell.
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: duplicated-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
          severity: error
        - name: if-return
        - name: identical-branches
        - name: indent-error-flow
        - name: import-shadowing
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: struct-tag
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      # Tests are allowed to be longer, denser, and to ignore errors on
      # best-effort cleanup; do not let style linters fight test ergonomics.
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: (.+)_test\.go
      # SA5011 (possible nil dereference) false-positives on the idiomatic test
      # guard `if x == nil { t.Fatal(...) }; use(x)`: staticcheck's no-return
      # facts for t.Fatal are computed over the whole program, and on
      # resource-constrained / divergent environments (CI's 2-core runner vs
      # local) they come back incomplete, flagging a rolling subset of the ~117
      # test files that use the idiom while reporting 0 on others. The guard is
      # not a real nil deref (t.Fatal aborts the test). Production code keeps the
      # check at full strength.
      - linters:
          - staticcheck
        text: SA5011
        path: (.+)_test\.go
      # fsconformance/memconformance/storeconformance/sourceconformance/
      # eventlogconformance are shared
      # test-helper packages (importing "testing" in a non-_test.go file, the
      # conventional Go pattern à la testing/fstest). Their conformance tables are
      # dense like tests, so apply the same relaxations.
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/fsconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/memconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/storeconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/sourceconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/eventlogconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/leaseconformance/
      - linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam
        path: engine/adapter/scheduleconformance/
      - linters:
          - revive
        path: .golangci.yml
      # forbidigo (the global-slog ban) covers everything outside cmd/ — engine/ and
      # internal/ alike. cmd/ mains are the composition roots that legitimately own
      # the third-party-slog bridge — mecated installs a stderr default, mecatui
      # redirects the default to a file — so they MUST be allowed
      # slog.Default/SetDefault. The ban exists to keep the engine and the adapters
      # on the injected port.Diagnostics seam, not to police the mains.
      - linters:
          - forbidigo
        path: ^cmd/
      # Test files may name the banned patterns in literals/messages (e.g. the guard
      # test asserting the rule bites, or doc-comments referencing slog.Warn).
      - linters:
          - forbidigo
        path: (.+)_test\.go
      # SessionID and ToolSpec are deliberate, frozen domain names from the WP1
      # ports that other packages depend on. revive flags them as "stutter"
      # (session.SessionID / tool.ToolSpec) but renaming would break the public
      # API the rest of the harness is built against. agent.AgentMeta is the
      # same case: it is the deliberate, layering-clean boundary value the agents
      # adapter is translated into (the agent package must NOT import the adapter),
      # so the "agent" prefix names the role, not stutter. Suppress just those.
      - linters:
          - revive
        text: 'type name will be used as (session\.SessionID|tool\.ToolSpec|agent\.AgentMeta)'
      # Generated proto/grpc code (WP10 will land contracts/gen). Never lint it.
      - linters:
          - errcheck
          - gocyclo
          - gosec
          - revive
          - staticcheck
          - unconvert
          - unparam
          - unused
        path: contracts/gen/
    paths:
      - contracts/gen
      - third_party$
      - builtin$
      - examples$
      - \.worktrees
      - \.scratch

formatters:
  enable:
    - gofmt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stacklok/mecatl)
  exclusions:
    generated: lax
    paths:
      - contracts/gen
      - third_party$
      - builtin$
      - examples$
      - \.worktrees
      - \.scratch
