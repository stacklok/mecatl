            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/adapter/sessnap
          deny:
            - pkg: os
              desc: 'memstore is the in-memory SessionStore; it must not touch the real OS'
        engine-adapter-sessnap:
          list-mode: strict
          files:
            - '**/engine/adapter/sessnap/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
          deny:
            - pkg: os
              desc: 'sessnap is the pure session-snapshot DTO; it must not touch os'
        engine-adapter-eventsource:
          list-mode: strict
          files:
            - '**/engine/adapter/eventsource/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/adapter/sessnap
          deny:
