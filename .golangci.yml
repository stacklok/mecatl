              desc: 'scheduleconformance drives the abstract ScheduleStore contract (a test-helper, it may use cronparse to compute expected next fires); it must not touch the real OS'
        # learning: reflection domain; reuses tool's canonical memory security helpers.
        core-learning:
          list-mode: strict
          files:
            - '**/engine/learning/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/tool
          deny:
