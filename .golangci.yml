            - github.com/stacklok/mecatl/engine/session
            - github.com/stacklok/mecatl/engine/learning
            - github.com/stacklok/mecatl/engine/governance
            - github.com/stacklok/mecatl/engine/prompt
            - github.com/stacklok/mecatl/engine/tool
            - github.com/stacklok/mecatl/engine/port
            - github.com/stacklok/mecatl/engine/team
            - golang.org/x/sync/errgroup
          deny:
            - pkg: os
              desc: 'agent (application loop) must not import os (CLAUDE.md layering rule); side effects belong in adapters/composition'
        # --- authn/oidc opt-in caller-identity module (ADR 0103) ---------------
        # Production verification depends only on stdlib, the narrow engine
        # principal projection, and ToolHive's authn implementation. Tests are
        # exempt per the repository convention for local fixtures.
        authn-oidc:
          list-mode: strict
          files:
