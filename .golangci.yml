              desc: 'the OIDC adapter must not touch the host OS or import the root module'
        # --- provider/* opt-in LLM-provider submodules (ADR 0093) ----------------
        # The real provider wire-format adapters graduated OUT of internal/adapter
        # into their own opt-in Go modules (consumers import the SDK transitively
        # only by importing the provider). They meet the engine's port.LLMProvider
        # port, so their closure is $gostd + the exact engine packages they
        # implement against + their SDK (+ provider/ssefilter for the openai-go
        # family) — never the root module, never os directly.
        provider-ssefilter:
          list-mode: strict
          files:
            - '**/provider/ssefilter/**.go'
            - '!$test'
          allow:
            - $gostd
            - github.com/openai/openai-go/v3
          deny:
            - pkg: os
              desc: 'ssefilter is the SSE keepalive guard over the openai-go middleware seam; it must not touch os or the root module'
        provider-anthropic:
          list-mode: strict
