# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
kind: DomainModel
version: v1
title: mecatl — Agentic Coding Harness
description: >
  The domain of mecatl: a headless agentic coding harness. A `Session` carries a
  `Conversation` that a `Run` drives turn by turn against a `Provider`, invoking
  `Tools` under a permission model, emitting a stream of `Events`, and optionally
  delegating to `Subagents` and `Teams`. Invariants and scenarios describe the
  domain contracts. For the prose walkthrough see the
  [architecture guide](../architecture.md).

glossary:
  Principal: >
    The human or caller on whose behalf a `Session` runs — the source of the
    trusted prompt and team goal.
  Operator: >
    Whoever deploys and configures the harness: sets `PermissionRules`, `Hooks`,
    token budgets, provider credentials, and connects `MCPServers`.
  Client: >
    An API consumer driving a `Session` over gRPC, HTTP/SSE, or ACP — and the
    party that answers a `PermissionAsk`.
  Lead: >
    The `TeamMember` that coordinates a `Team` and produces the consolidated
    synthesis returned as the team's result.

entities:
  Session:
    definition: >
      The central aggregate and unit of work: a stateful conversation between a
      principal and a model, with an `Environment` binding, usage accounting, and
      limits. A `Session` is a state machine (idle, running, awaiting, completed,
      cancelled, failed) and is bound to one `Provider`. Its effective `Model`
      is fixed for each `Turn`; a `PermissionMode` change can re-resolve the model
      between turns within that provider. It survives process restarts when
      backed by a store.
    relationships:
      - entity: Conversation
        cardinality: "1:1"
        ownership: owned
        role: records
      - entity: Environment
        cardinality: "1:1"
        ownership: referenced
        role: bound to
        note: >
          The `Session` persists the exact environment identity; the host
          reattaches its capabilities before a `Run`. Binding to an
          `Environment` does not imply exclusive ownership of its files.
      - entity: HarnessContext
        cardinality: "n:1"
        ownership: referenced
        role: receives instructions and customizations from
        note: >
          Proposed relationship: composition selects the context independently
          from execution. A context source may explicitly share execution files;
          the source-selection and restart contract is under interface review.
      - entity: Provider
        cardinality: "n:1"
        ownership: referenced
        role: bound to
        note: The `Session`'s provider binding stays fixed across turns
      - entity: Model
        cardinality: "n:1"
        ownership: referenced
        role: runs against
        note: >
          The host resolves this effective binding from the requested session
          selection and `PermissionMode`; the aggregate stores selection labels
          without interpreting them. The relationship describes the effective
          target for a turn, not a lifetime model pin. Existing restart semantics
          remain unchanged: explicit selections are restored, while an empty
          selection follows the deployment default rather than persisting the
          previously effective target.
      - entity: PermissionMode
        cardinality: "1:1"
        ownership: owned
        role: posture is
        note: >
          The `Session`'s `PermissionMode` governs its toolset and — via ADR 0030
          Layer 3 — its effective `Model`: switching to plan mode re-resolves the
          plan slot to a strong-reasoning `Model` within the same `Provider`,
          between turns.
      - entity: Memory
        cardinality: "n:n"
        ownership: referenced
        role: remembers into
      - entity: Skill
        cardinality: "n:n"
        ownership: referenced
        role: activates
      - entity: EventLog
        cardinality: "1:1"
        ownership: referenced
        role: is logged to
        note: >
          The `Session` aggregate is also persisted as a point-in-time snapshot
          (state, `Conversation`, usage, pending `PermissionAsk`); the snapshot
          plus the `EventLog` together rehydrate it after a restart.
    invariants:
      - id: fixed-provider-per-session
        statement: >
          The host preserves a `Session`'s `Provider` binding across turns.
          Mode-driven `Model` re-resolution stays within that provider and takes
          effect between turns. Provider/model-dependent collaborators are
          derived coherently for the effective target, never cloned with only
          the LLM swapped. This does not pin a floating default selection across
          restart.
      - id: session-recover-before-reuse
        statement: >
          A `Session` in a terminal state (completed, cancelled, or failed) is
          returned to idle before any new `Run` reuses it.
      - id: session-usage-survives-restart
        statement: >
          Cumulative token usage is preserved across reopen, interrupt, recover,
          and process restart.

  Conversation:
    definition: >
      The ordered history of `Messages` belonging to one `Session`. It is the
      replayed context sent to the `Provider` each turn, and the thing a
      compactor rewrites when it grows too large. It cannot exist outside its
      `Session`.
    relationships:
      - entity: Message
        cardinality: "1:n"
        ownership: owned
        role: orders
    invariants:
      - id: conversation-no-orphan-tool-result
        statement: >
          Every tool `Message` pairs with a preceding `ToolCall`; the
          `Conversation` never contains an orphaned `ToolResult`.
      - id: compaction-keeps-recent-user-intent
        statement: >
          Compaction preserves the first and most-recent user `Messages`
          verbatim and never produces unpaired history.
      - id: compaction-archived-to-log
        statement: >
          Before compaction rewrites the `Conversation`, the replaced span is
          archived to the `EventLog`, so compacted history remains reconstructible.

  Message:
    definition: >
      One entry in a `Conversation`, attributed to a role (user, assistant, or
      tool). An assistant `Message` may carry text, an opaque reasoning blob, and
      one or more `ToolCalls`; a tool `Message` carries a `ToolResult`. `Messages`
      are immutable once recorded.
    relationships:
      - entity: ToolCall
        cardinality: "1:n"
        ownership: owned
        role: requests
    invariants:
      - id: message-immutable
        statement: "A `Message` is immutable once recorded into a `Conversation`."

  Run:
    definition: >
      A single drive of a `Session` from a starting state to a terminal one —
      one invocation of the agent loop. A `Run` sequences `Turns`, emits a stream
      of `Events`, and ends with a stop reason (end-of-turn, budget, no-progress,
      cancelled, error). It is the execution, not the state: the `Session` it
      drives outlives it.
    relationships:
      - entity: Session
        cardinality: "n:1"
        ownership: referenced
        role: drives
      - entity: Turn
        cardinality: "1:n"
        ownership: owned
        role: sequences
      - entity: Event
        cardinality: "1:n"
        ownership: owned
        role: emits
    invariants:
      - id: run-one-terminal-stop
        statement: >
          A `Run` drives its `Session` to exactly one terminal state and reports
          exactly one stop reason.
      - id: run-no-replay-after-first-chunk
        statement: >
          Once a `Turn` has streamed its first chunk, the `Run` never retries or
          replays that `Turn`.

  Turn:
    definition: >
      One round-trip with the `Provider` inside a `Run`: the model is given the
      replayed `Conversation`, streams back a response, and the loop dispatches
      any `ToolCalls` it requested. A `Run` is a sequence of `Turns`, bounded by
      a max-turns limit.
    relationships:
      - entity: Message
        cardinality: "1:n"
        ownership: referenced
        role: produces
    invariants:
      - id: turn-count-bounded
        statement: "The number of `Turns` in a `Run` is bounded by a configured maximum."
      - id: empty-turn-nudged-not-looped
        statement: >
          A `Turn` that completes with no `ToolCall` and no meaningful text is
          nudged a bounded number of times, then ends cleanly — never silently
          and never in an infinite loop.
      - id: snapshot-at-turn-boundary
        statement: >
          The `Session` snapshot is persisted at every `Turn` boundary; an
          in-flight `Turn` cut by a `Process` death is replayed from the last
          boundary, not resumed mid-stream.

  Event:
    definition: >
      A typed, ordered item on a `Run`'s output stream — the single observable
      currency shared by every interface (gRPC, HTTP/SSE, ACP). Each step of the
      loop (turn start/end, tool call, tool result, permission ask, result) is an
      `Event`. A transient `Event` is recorded into the durable `EventLog` for
      later replay.
    invariants:
      - id: event-ordered-and-typed
        statement: >
          Every `Event` is emitted in order on its `Run`'s stream, and the same
          typed `Event` model is shared by every interface.

  Tool:
    definition: >
      A capability the model can invoke by name — Read, ListDir, Edit, Write, Copy,
      Move, Remove, Grep, Glob, Shell, and opt-in tools like memory, skills, and
      delegation. A `Tool` is either read-only (may run concurrently) or mutating
      (never concurrent). It
      defines a name and an argument schema; a `ToolCall` is one invocation of it.
    invariants:
      - id: tool-readonly-or-mutating
        statement: >
          Every `Tool` is classified read-only or mutating, and that
          classification governs how its `ToolCalls` are dispatched.
      - id: plan-mode-invisible-tools
        statement: >
          In plan mode, the `Catalog` hides mutating `Tools` from the model's
          view before dispatch — a defense in depth ahead of the evaluator's
          hard-deny gate, so the model never even sees a mutating `ToolSpec`.

  ToolCall:
    definition: >
      A single request by the model to invoke a `Tool` with concrete arguments,
      issued within a `Turn`. It must be authorized by the permission model
      before it executes, and it produces exactly one `ToolResult`.
    relationships:
      - entity: Tool
        cardinality: "n:1"
        ownership: referenced
        role: invokes
      - entity: Environment
        cardinality: "n:1"
        ownership: referenced
        role: executes with capabilities from
      - entity: ToolResult
        cardinality: "1:1"
        ownership: owned
        role: produces
    invariants:
      - id: toolcall-authorized-before-execute
        statement: "A `ToolCall` executes only after the permission model resolves it to allow."
      - id: toolcall-exactly-one-result
        statement: "A `ToolCall` produces exactly one `ToolResult`."
      - id: mutating-toolcalls-serial
        statement: >
          Two mutating `ToolCalls` never execute concurrently; read-only
          `ToolCalls` may run in parallel.

  ToolResult:
    definition: >
      The outcome of executing a `ToolCall` — either a success payload or an
      error — recorded back into the `Conversation` as a tool `Message`. Each
      `ToolResult` belongs to exactly one `ToolCall`.
    invariants:
      - id: toolresult-one-call
        statement: >
          A `ToolResult` belongs to exactly one `ToolCall` and is recorded back
          into the `Conversation`.

  Environment:
    definition: >
      The binding between a `Workspace`, a session-scoped `ReadLedger`, and an
      optional `CommandRunner`. The host assembles these capabilities and passes
      them together to each `ToolCall`. The binding defines how file access and
      command execution reach the same logical files, even when their adapters
      or physical locations differ. A shared directory or mount needs no copy
      synchronization. A binding using separate copies would need an explicit
      synchronization mechanism with conflict and failure handling; that mechanism
      is not implemented by the Environment value itself. Local environments use
      shared files; Redis-backed workspaces have no command runner today.
    relationships:
      - entity: Workspace
        cardinality: "n:1"
        ownership: referenced
        role: provides file access through
        note: Multiple environments can reference the same backing files.
      - entity: ReadLedger
        cardinality: "1:1"
        ownership: referenced
        role: carries read evidence in
      - entity: CommandRunner
        cardinality: "1:1"
        ownership: referenced
        role: optionally provides command execution through
        note: >
          Optional relationship: one runner when command execution is available,
          none otherwise. The 1:1 cardinality describes the present case; it
          does not require every environment to provide command execution.
    invariants:
      - id: environment-binding-coherent
        statement: >
          When a `CommandRunner` is present, the binding must make successful
          `Workspace` changes visible to subsequent commands and completed command
          changes visible to subsequent file operations. Matching root-path
          strings alone does not establish that both capabilities reach the same
          files. This is a binding contract, not a guarantee of atomicity against
          concurrent external writers.
      - id: environment-binding-failure-visible
        statement: >
          An unavailable binding, or a synchronization failure in a binding that
          requires synchronization, must be reported rather than silently using
          unrelated or stale copies. Establishing and maintaining the connection
          belongs to the host's binding implementation, not the agent loop or
          individual file `Tools`.
      - id: environment-runner-optional
        statement: >
          An `Environment` can provide file access without a `CommandRunner`.
          File storage does not imply command execution; absent capabilities
          are omitted from the toolset or reported as unavailable. A no-filesystem
          environment supplies a workspace that refuses file access and has no
          command runner.

  HarnessContext:
    definition: >
      Proposed source-authority model, not yet implemented. The deployment-configured
      selection of model-facing project instructions, commands, rules, skills, and
      agent definitions supplied to a `Session` through logical source contracts.
      Sources can read APIs, host files, databases, or explicitly selected files in
      the execution environment. Source selection is separate from `Environment`
      selection; separate responsibilities do not require separate storage.
    relationships:
      - entity: Skill
        cardinality: "1:n"
        ownership: referenced
        role: makes available
      - entity: AgentDef
        cardinality: "1:n"
        ownership: referenced
        role: makes available
    invariants:
      - id: harness-context-independent-of-execution
        statement: >
          Proposed: deployment composition explicitly selects admitted harness
          sources. An execution `Workspace`, backend kind, root, or command
          namespace never implicitly selects instructions or customizations.
      - id: harness-context-explicit-storage-sharing
        statement: >
          Proposed: a context source may explicitly read the same logical files
          as the execution `Workspace`, using that backend's capabilities. Those
          files then follow the source's admission and freshness rules. Sharing
          storage does not merge source authority with execution authority or
          permit reopening a virtual root through a different backend.
      - id: harness-context-provenance-governs-trust
        statement: >
          Proposed: source trust follows configured provenance and admission.
          Host-backed content is not trusted by locality, and project-tier
          content is admitted only by the resolved project-ingestion decision.
      - id: harness-context-preserves-source-freshness
        statement: >
          Proposed: commands remain live on each List and Expand, project
          instructions are read once per `Run`, and rules, skills, and agent
          definitions retain their source-lifetime snapshot semantics. Listing
          and consumption use the same configured source authority.
      - id: harness-context-does-not-share-read-evidence
        statement: >
          Proposed: harness-source reads never consult or update the execution
          `ReadLedger`, including when source and execution share backing files.
          `Sessions` sharing a harness context retain independent read evidence.

  Workspace:
    definition: >
      A logical file namespace exposed through a backend-independent port.
      File `Tools` use it for content, metadata, search, and versioned mutations;
      an optional namespace capability adds listing, copying, moving, and removal.
      An adapter can serve local files, Redis-backed files, memory, or editor
      buffers. Its root belongs to that backend and need not be a directory on
      the harness host. Multiple `Sessions` can share the same backing files;
      their read evidence remains separate in each session's `ReadLedger`.
    invariants:
      - id: workspace-contained
        statement: >
          File access stays within the backend's namespace unless both the
          backend supports the requested external access and policy authorizes
          it. A posture cannot create a missing backend capability or turn a
          virtual root into a host filesystem path. Local out-of-root serving
          is operation-specific: Read, ListDir, Write, and Edit can serve
          policy-authorized external absolute targets, while mutating namespace
          operations and searches remain confined.
      - id: workspace-tools-use-ports
        statement: >
          Read, ListDir, Write, Edit, Copy, Move, Remove, Glob, and Grep use the
          `Environment`'s `Workspace` capabilities. Their bodies do not select a
          storage backend or fall back to host filesystem access. Unsupported
          namespace operations return an explicit error.

  ReadLedger:
    definition: >
      A session's evidence of the file versions it has read, stored independently
      of the `Workspace` content backend. Read records a version; Edit and
      overwrite-Write compare that evidence with the current version before a
      conditional replacement. The ledger can be in memory or durable storage.
    relationships:
      - entity: Session
        cardinality: "1:1"
        ownership: referenced
        role: records read evidence for
    invariants:
      - id: read-evidence-session-scoped
        statement: >
          Sharing backing files does not share read evidence between `Sessions`.
          A new child session receives fresh evidence even when it uses the
          parent's file namespace. A command changing a file does not count as
          the model reading that file's new version.

  CommandRunner:
    definition: >
      The optional command-execution port bound into an `Environment`. It runs
      commands in a namespace selected by the host. Programs access files through
      a filesystem they understand, such as a shared directory or mount; they do
      not call the Workspace interface. The environment binding supplies that
      connection. Binding a working directory does not by itself sandbox a
      command's filesystem access.
    invariants:
      - id: command-runner-bound
        statement: >
          A `CommandRunner` is bound at construction. Shell uses the runner from
          the live `Environment`; it does not select a different workspace per
          call. An isolated child binding connects both file access and command
          execution to the child namespace, never to the parent's files.
      - id: command-runner-env-scrubbed
        statement: >
          Every agent-facing shell runs with provider credentials and other
          secrets scrubbed from its process environment.

  Provider:
    definition: >
      An LLM backend behind a provider-agnostic port — OpenAI Responses, the
      native Anthropic Messages API, or OpenRouter. A `Provider` offers a catalog
      of `Models` and is selected per `Session`. Adapters are stateless: the full
      `Conversation` is replayed each turn.
    relationships:
      - entity: Model
        cardinality: "1:n"
        ownership: referenced
        role: offers
    invariants:
      - id: provider-stateless-replay
        statement: >
          A `Provider` adapter holds no server-side conversation state; the full
          `Conversation` is replayed each `Turn` behind a byte-stable cache prefix.

  Model:
    definition: >
      A specific model identified by the exact provider/model pair. Discovery
      changes knowledge about its properties, not its identity. Provider listings
      can be non-exhaustive; omission alone does not invalidate a passthrough
      model. A `Session` runs against an effective `Model`; a `Subagent` or
      `TeamMember` may override it within the same `Provider`, and a
      `PermissionMode` change may re-resolve it within the same `Provider`
      (plan mode → a strong-reasoning model, ADR 0030 Layer 3).
    invariants:
      - id: model-override-stays-in-provider
        statement: >
          A `Subagent` or `TeamMember` may override the `Model` only within the
          `Session`'s bound `Provider`.

  ModelMetadata:
    definition: >
      An immutable observation value object
      describing one exact `Model`'s properties, including context window, input
      capabilities, and reasoning support. Each field carries explicit knowledge
      (known or unknown) and provenance (configuration, live discovery, or
      catalog). A known capability can be supported or explicitly unsupported.
      Observation records the evidence; host resolution policy chooses effective
      values from that evidence and configuration. A policy fallback is a resolved
      value, not an observation.
    relationships:
      - entity: Model
        cardinality: "n:1"
        ownership: referenced
        role: describes
        note: Observations from different sources can describe the same exact target
    invariants:
      - id: metadata-knowledge-explicit
        statement: >
          An absent property remains unknown, not false or unsupported.
          Resolution preserves the distinction between an observed value and a
          policy-permitted fallback, including their provenance.

  ProviderDiscovery:
    definition: >
      Provider-scoped knowledge and attempt lifecycle,
      shared by sessions within one host deployment instance. One composition-owned
      discovery coordinator owns this lifecycle for each provider and is the
      authoritative publisher of accepted live observations. It is neither a
      per-session owner nor a singleton shared across replicas. Attempt states
      are unattempted, in-flight, succeeded (returned model entries), empty
      (completed with no entries), and failed. The latest attempt outcome is
      distinct from the last successful metadata observations. Host resolution
      policy determines whether those observations remain usable after failure.
      The host coordinates discovery requests and publishes their results.
    relationships:
      - entity: Provider
        cardinality: "n:1"
        ownership: referenced
        role: discovers metadata for
        note: >
          One lifecycle per provider within a host deployment instance; separate
          instances have independent discovery knowledge.
      - entity: ModelMetadata
        cardinality: "1:n"
        ownership: referenced
        role: publishes accepted live observations as
        note: >
          A successful listing can describe multiple models, each with its own
          observation. The 1:n cardinality describes the populated case; zero
          observations are allowed, including before discovery or after an empty
          first result. Configuration and catalog observations are other sources
          of `ModelMetadata`, not results of a live discovery attempt.
    invariants:
      - id: discovery-provider-local
        statement: >
          Only a provider's own attempts establish its discovery state.
          Another provider settling proves nothing about this provider's metadata;
          unattempted is distinct from failed. Native providers remain demand-driven
          without adding authenticated startup discovery.
      - id: discovery-outcome-separate-from-observations
        statement: >
          A failed refresh records the latest attempt outcome without
          turning last successful observations into a failed or empty observation.
      - id: discovery-publication-ordered
        statement: >
          An obsolete attempt cannot overwrite newer accepted
          observations. Publication follows the coordinator's ordering of attempts,
          not the order in which network requests finish.

  PermissionMode:
    definition: >
      A `Session`'s permission posture — default, plan, or acceptEdits — governing
      which `Tools` may run and, via ADR 0030 Layer 3, the effective `Model`: in
      plan mode the `Session` re-resolves the plan slot to a strong-reasoning
      `Model` within the same `Provider`. Plan mode is enforced at two layers
      (catalog filter hides mutating `Tools`; evaluator gate hard-denies
      mutations). `acceptEdits` is a declared-but-not-yet-implemented posture
      (ADR 0022 Future work): it is carried as metadata and surfaced in mode
      pickers, but the decision path treats it identically to `default`
      (deny→ask→allow), so it auto-allows nothing today. It is a value object
      owned by exactly one `Session`; a control surface switches it out of band
      (e.g. ACP session/set_mode).
    relationships:
      - entity: Session
        cardinality: "1:1"
        ownership: referenced
        role: posture of
      - entity: Model
        cardinality: "n:1"
        ownership: referenced
        role: selects via slot
        note: >
          Plan mode re-resolves the plan slot to a `Model` within the `Session`'s
          bound `Provider`; default/acceptEdits keep the session `Model`.
    invariants:
      - id: mode-switch-rejected-mid-turn
        statement: >
          A `PermissionMode` change is rejected while a turn is in flight (running
          or awaiting); a control surface defers it to the next turn boundary.
      - id: mode-model-same-provider
        statement: >
          A mode-driven `Model` re-resolution stays within the `Session`'s bound
          `Provider`; the provider is fixed per session.
      - id: mode-model-fixed-per-turn
        statement: >
          The effective `Model` is fixed for the duration of a turn; a mode change
          re-resolves it only between turns, at the run-entry seam, never mid-stream.
      - id: acceptedits-declared-not-implemented
        statement: >
          `acceptEdits` is carried as metadata and surfaced in mode pickers, but the
          permission decision path never branches on it — it resolves identically to
          `default` (deny→ask→allow). It auto-allows no `ToolCall` today; a real
          auto-accept-edits tier is ADR 0022 Future work.

  PermissionRule:
    definition: >
      A governance rule that maps a `Tool` invocation to an effect — deny, ask,
      or allow — within a scope (managed, CLI, project, user, built-in default)
      and an audience (main session or delegated child). Rules resolve
      deny-dominant: a deny in any scope is absolute.
    relationships:
      - entity: ToolCall
        cardinality: "n:n"
        ownership: referenced
        role: authorizes
    invariants:
      - id: deny-dominant
        statement: >
          A deny in any scope is absolute; among ask and allow the higher
          configured scope wins, and a configured ask is never suppressed by a
          higher-scope allow.
      - id: plan-mode-denies-mutations
        statement: "In plan mode, every mutating `ToolCall` is denied."
      - id: allow-always-learns-rule
        statement: >
          An allow-always verdict on a `PermissionAsk` learns a `PermissionRule`
          matching the approved `Tool`, so the same `ToolCall` is not asked again.
      - id: learned-rule-volatile-rehydrated-from-log
        statement: >
          A learned `PermissionRule` is held in memory and lost on restart; it is
          reconstructed from the `EventLog` when the `Session` is rehydrated.

  PermissionAsk:
    definition: >
      A suspension of a `Run` when a `ToolCall` resolves to "ask": the loop pauses
      and surfaces the request to the `Client`, which approves or denies before
      the loop continues. A child's ask may surface to an interactive parent or be
      adjudicated by a bounded reviewer in a headless deployment.
    relationships:
      - entity: ToolCall
        cardinality: "1:1"
        ownership: referenced
        role: suspends
      - entity: Run
        cardinality: "n:1"
        ownership: referenced
        role: pauses
    invariants:
      - id: ask-suspends-run-until-resolved
        statement: >
          A `PermissionAsk` suspends its `Run` and blocks the `ToolCall` from
          executing until a `Client` or reviewer resolves it.
      - id: child-ask-redacts-raw-args
        statement: >
          A child `PermissionAsk` surfaced to a parent or reviewer never carries
          the child's raw `ToolCall` arguments.
      - id: ask-resolves-to-verdict
        statement: >
          A `PermissionAsk` resolves to exactly one verdict — allow-once,
          allow-always, or deny.

  Hook:
    definition: >
      A deterministic, operator-configured program that fires at a lifecycle
      point (session start, prompt submit, pre/post tool use, stop) and can allow
      or block by exit code. Hooks are the deterministic counterpart to the
      model-based permission and guardrail layers.
    relationships:
      - entity: ToolCall
        cardinality: "n:n"
        ownership: referenced
        role: gates
    invariants:
      - id: hook-exit-code-decides
        statement: >
          A `Hook` allows the gated action on exit code 0 and blocks it on exit
          code 2.

  Subagent:
    definition: >
      A one-shot, isolated child agent spawned by a `Session` to explore or
      delegate a task in its own read-only sandbox, returning a single result. It
      runs the same agent loop in a less-privileged child context and may be
      instantiated from an `AgentDef`. Subagents do not nest.
    relationships:
      - entity: Session
        cardinality: "n:1"
        ownership: referenced
        role: spawned by
      - entity: AgentDef
        cardinality: "n:1"
        ownership: referenced
        role: instantiates
    invariants:
      - id: subagent-no-nesting
        statement: "A `Subagent` cannot spawn further `Subagents`."
      - id: subagent-read-only-sandbox
        statement: "A `Subagent` runs in a strictly less-privileged, read-only child context."
      - id: subagent-fanout-bounded
        statement: "Concurrent child agents are bounded by a child-concurrency gate."

  Team:
    definition: >
      A coordinated crew of `TeamMembers` spawned by a `Session`, working a shared
      task list and findings ledger under a lead that synthesizes the consolidated
      result. The team's goal is trusted by default; peer messages are not.
    relationships:
      - entity: Session
        cardinality: "n:1"
        ownership: referenced
        role: spawned by
      - entity: TeamMember
        cardinality: "1:n"
        ownership: owned
        role: coordinates
      - entity: Task
        cardinality: "1:n"
        ownership: owned
        role: tracks
      - entity: Finding
        cardinality: "1:n"
        ownership: owned
        role: collects in its ledger
    invariants:
      - id: team-goal-trusted-peers-untrusted
        statement: >
          A `Team`'s goal is trusted as principal-authored; peer messages and
          claimed-task descriptions are treated as untrusted input.
      - id: team-returns-lead-synthesis
        statement: >
          A `Team` returns the `Lead`'s consolidated synthesis, not concatenated
          `TeamMember` output.
      - id: team-coordination-not-durable
        statement: >
          Mid-round `Team` coordination state — roster, `Task` assignments, the
          `Finding` ledger, and the round number — is not durable; only member
          sessions persist, so a mid-round `Team` does not survive a `Process`
          restart and must be re-created.

  TeamMember:
    definition: >
      One worker within a `Team`, running an isolated child loop and contributing
      findings to the shared ledger. A member may be instantiated from an
      `AgentDef` and has its own persisted child session. It cannot exist outside
      its `Team`.
    relationships:
      - entity: AgentDef
        cardinality: "n:1"
        ownership: referenced
        role: instantiates
    invariants:
      - id: member-isolated-loop
        statement: >
          Each `TeamMember` runs an isolated child loop and never shares a
          `Conversation` with another member.

  Skill:
    definition: >
      A logical bundle of instructions and named assets that the agent can
      activate by name to extend its behavior for a task. A `Skill` crosses the
      boundary as identity, body, and payloads — never as a path. Textual assets
      are read one at a time by logical name through the `Skill` tool.
    invariants:
      - id: skill-crosses-as-bundle-not-path
        statement: >
          A `Skill` crosses the boundary as identity, body, and named assets —
          never as a filesystem path or directory.
      - id: skill-assets-on-demand
        statement: "A `Skill`'s textual assets are retrieved one at a time by logical name; they are not materialized or exposed to the `Workspace`."

  AgentDef:
    definition: >
      A reusable definition of a specialist agent — its role prompt, tool grants,
      model, and optional memory head — from which a `Subagent` or `TeamMember`
      can be instantiated. It is a value object: where it came from is a tier
      label (managed, project, user), not a location.
    invariants:
      - id: agentdef-origin-is-tier-not-location
        statement: >
          An `AgentDef`'s origin is a trust tier (managed, project, user), never
          a filesystem location.

  Memory:
    definition: >
      Durable, tiered knowledge a `Session` can write (Remember) and read back
      (Recall, SearchMemory) across runs and sessions, with an optional
      background consolidation pass. A user-scoped tier sits alongside the
      session-scoped one. Memory is independent of any single `Session`.
    invariants:
      - id: memory-outlives-session
        statement: >
          `Memory` persists independently of any single `Session` and is readable
          across runs and sessions.

  MCPServer:
    definition: >
      An external Model Context Protocol server, connected over streaming-HTTP
      transport only, whose tools are registered into the catalog as namespaced
      `Tools`. It is a driven adapter, never spawned as a local stdio process.
    relationships:
      - entity: Tool
        cardinality: "1:n"
        ownership: referenced
        role: provides
    invariants:
      - id: mcp-streaming-http-only
        statement: >
          An `MCPServer` connects only over streaming-HTTP transport; it is never
          spawned as a local stdio process.
      - id: mcp-tools-namespaced
        statement: "An `MCPServer`'s `Tools` are registered into the catalog under a server-namespaced name."

  EventLog:
    definition: >
      The durable, append-only record of a `Session`'s `Events`, distinct from
      the transient stream the loop emits. It is the source of truth for
      replaying state the `Session` snapshot does not carry — learned
      `PermissionRules`, the pre-compaction `Conversation` archive, and the
      user-role turns (the log-only `EvUserPrompt`) — when a `Session` is
      rehydrated after a restart. Because it carries the user turns alongside the
      assistant/tool `Events`, a host whose system of record IS the log can
      reconstruct the whole `Session` by FOLDING the stream (the event-sourced
      rehydration path), not only top up a snapshot (structural reconstruction; a
      pure fold is byte-identical-replay only for providers not using the opaque
      reasoning-replay fields — Reasoning/ProviderPhase/ToolCall.ItemID are not on
      the event stream — see ADR 0038).
    relationships:
      - entity: Event
        cardinality: "1:n"
        ownership: referenced
        role: records
    invariants:
      - id: event-log-append-only
        statement: >
          The `EventLog` is append-only and records each `Event` at most once,
          independently of whether a `Client` is still connected.
      - id: event-log-records-terminal-tail
        statement: >
          The `EventLog` records every `Event` a `Run` emits, including the
          terminal result emitted after a `Client` disconnects.
      - id: event-log-reconstructs-user-turns
        statement: >
          The `EventLog` records every user-role turn (the genuine prompt and the
          harness's synthetic continuations) as a log-only `EvUserPrompt`, so
          folding the stream reconstructs the `Session`'s `Conversation` including
          what the user asked — not only the assistant and tool `Events`.

  Process:
    definition: >
      A disposable harness instance — one running process — that loads `Sessions`
      from the durable stores, holds their `SessionLeases`, and executes `Runs`.
      Killing a `Process` and starting another over the same stores loses nothing
      the user relies on: rehydration is a new `Process` reconstructing a
      `Session` from its snapshot plus the `EventLog`.
    relationships:
      - entity: Run
        cardinality: "1:n"
        ownership: referenced
        role: executes
      - entity: SessionLease
        cardinality: "1:n"
        ownership: referenced
        role: holds
    invariants:
      - id: process-disposable
        statement: >
          Killing a `Process` and starting another over the same durable stores
          loses no state the user relies on; all load-bearing state is
          externalized to the snapshot and the `EventLog`.

  SessionLease:
    definition: >
      An exclusive, renewable, expiring claim on a `Session` held by a single
      `Process`, so that at most one `Process` writes a `Session` at a time.
      Sessions are routed to the `Process` holding their lease (session affinity);
      when a holding `Process` dies, the lease expires and another `Process` may
      acquire it and rehydrate the `Session`.
    relationships:
      - entity: Session
        cardinality: "1:1"
        ownership: referenced
        role: grants exclusive write to
        note: A `Session` has at most one live `SessionLease` at a time
    invariants:
      - id: single-writer-per-session
        statement: >
          At most one live `SessionLease` exists per `Session`; two `Process`
          instances never write the same `Session` concurrently.
      - id: session-affinity-routing
        statement: >
          A `Session` is routed to the `Process` that holds its `SessionLease`.

  Task:
    definition: >
      A unit of work on a `Team`'s shared task list, assigned to a `TeamMember`
      and tracked to completion. A `Task` has no meaning outside its `Team`.
    relationships:
      - entity: TeamMember
        cardinality: "n:1"
        ownership: referenced
        role: assigned to
    invariants:
      - id: task-within-team
        statement: >
          A `Task` exists only within its `Team` and is assigned to at most one
          `TeamMember` at a time.

  Finding:
    definition: >
      An entry a `TeamMember` records to its `Team`'s shared findings ledger. The
      `Lead` synthesizes the team's consolidated result from the `Findings`. A
      `Finding` is part of its `Team` and does not outlive it.
    relationships:
      - entity: TeamMember
        cardinality: "n:1"
        ownership: referenced
        role: recorded by
    invariants:
      - id: finding-fenced-untrusted
        statement: >
          A `Finding` read by another `TeamMember` or the `Lead` is treated as
          untrusted input.

scenarios:
  - name: Proposed - Harness sources remain independent from execution storage
    actors: [Principal, Operator]
    steps:
      - "This is a proposed contract scenario. The operator configures a `HarnessContext` using API-backed or file-backed sources independently from the execution `Environment`."
      - "The command palette and prompt expansion consult the same configured live source, and instruction assembly uses the configured project-instruction source."
      - "Changing execution storage or runner does not implicitly change source authority, precedence, provenance, or freshness."
    invariants_touched:
      [harness-context-independent-of-execution, harness-context-preserves-source-freshness, workspace-tools-use-ports]

  - name: Proposed - Unselected execution content cannot become harness sources
    actors: [Principal, Operator]
    steps:
      - "The operator configures an external context source. The execution `Workspace` contains conflicting AGENTS.md, command, rule, skill, and agent-definition content that is not part of that source."
      - "File tools may read the execution content under ordinary permissions, but automatic harness discovery and assembly do not ingest it."
      - "The configured source retains its admission rules regardless of whether it is on the host or behind an API."
    invariants_touched:
      [harness-context-independent-of-execution, harness-context-provenance-governs-trust, workspace-contained]

  - name: Proposed - Context explicitly reads execution files
    actors: [Principal, Operator]
    steps:
      - "The operator explicitly configures a context source over files in the execution namespace; the source uses that backend rather than interpreting its root as a host path."
      - "Admitted project instructions and command definitions from those files are available through the source contracts. Palette listing and expansion use that same source."
      - "An edit to a selected command file is visible on the next live List or Expand; project instructions refresh on the next Run. Unselected files do not become additional sources."
    invariants_touched:
      [harness-context-explicit-storage-sharing, harness-context-preserves-source-freshness, harness-context-provenance-governs-trust]

  - name: Proposed - Shared harness context keeps session read ledgers isolated
    actors: [Principal, Operator]
    steps:
      - "Two `Sessions` attach the same `HarnessContext` and use execution environments backed by the same logical files."
      - "Both sessions see the same admitted customizations, but each `Environment` carries its own `ReadLedger`."
      - "A source read or a file read by the first session does not authorize Edit or overwrite-Write in the second session."
    invariants_touched:
      [harness-context-does-not-share-read-evidence, read-evidence-session-scoped]

  - name: File tools and commands share a local binding
    actors: [Principal, Operator]
    steps:
      - "The host binds a local `Workspace` and `CommandRunner` to shared files in an `Environment`, with a session-scoped `ReadLedger`."
      - "An authorized Write creates a source file through the `Workspace`; a subsequent Shell command sees that file through its bound runner."
      - "The command runs with a secret-scrubbed process environment and modifies the source file. The next Read sees the modification and records its version."
    invariants_touched:
      [environment-binding-coherent, workspace-tools-use-ports, command-runner-bound, command-runner-env-scrubbed, read-evidence-session-scoped]

  - name: Shared Redis files do not imply shared read evidence or a shell
    actors: [Principal, Operator]
    steps:
      - "The host binds two `Sessions` for the same principal to Redis-backed files through separate `Environments`, each with its own `ReadLedger` and no `CommandRunner`."
      - "The first session creates a file; ListDir and Read in the second session access it through that session's `Workspace`, without consulting the host filesystem."
      - "The second session must read the file itself before Edit; the first session's read evidence does not authorize an overwrite."
      - "Shell is unavailable because this binding has no runner connected to the Redis files."
    invariants_touched:
      [environment-runner-optional, workspace-tools-use-ports, workspace-contained, read-evidence-session-scoped]

  - name: An isolated child keeps file access and execution together
    actors: [Principal]
    steps:
      - "The host forks an `Environment` into an isolated child namespace with fresh read evidence."
      - "The child's `Workspace` and any `CommandRunner` refer to the child's files. A command sees changes made through the child's file tools."
      - "The parent's files and `ReadLedger` are unchanged by work in that isolated child."
    invariants_touched:
      [environment-binding-coherent, command-runner-bound, read-evidence-session-scoped]

  - name: A separate-copy binding must expose synchronization failures
    actors: [Operator]
    steps:
      - "This is a contract scenario for a future binding using separate copies, not a shipped synchronization feature. The binding implementation must define how the `Workspace` and `CommandRunner` exchange changes and handle conflicts."
      - "Before a command can consume a file-tool change, the binding must make it visible in the execution filesystem. After a command changes files, it must make those changes visible before subsequent file operations."
      - "If synchronization fails or encounters an unresolved conflict, the affected operation reports the failure rather than claiming success against stale copies."
    invariants_touched:
      [environment-binding-coherent, environment-binding-failure-visible]

  - name: A tool call pauses for approval and resumes
    actors: [Principal, Client]
    steps:
      - "`Principal` sends a prompt; the `Run` begins and the model issues a `ToolCall` a `PermissionRule` resolves to ask."
      - "The `Run` suspends on a `PermissionAsk` and surfaces it to the `Client`."
      - "`Client` approves; the `ToolCall` executes, producing one `ToolResult` recorded into the `Conversation`."
    invariants_touched:
      [toolcall-authorized-before-execute, deny-dominant, ask-suspends-run-until-resolved, toolcall-exactly-one-result]

  - name: Read-parallel, mutate-serial dispatch
    actors: [Principal]
    steps:
      - "A `Turn` returns several `ToolCalls` at once: three read-only and one mutating."
      - "The read-only `ToolCalls` dispatch concurrently while the mutating one runs alone."
      - "Each `ToolCall` yields exactly one `ToolResult`."
    invariants_touched: [tool-readonly-or-mutating, mutating-toolcalls-serial, toolcall-exactly-one-result]

  - name: Switching to plan mode re-resolves the model between turns
    actors: [Principal, Client]
    steps:
      - "`Principal` runs a turn in default mode; the `Session` runs against its session `Model`."
      - "`Client` switches the `Session`'s `PermissionMode` to plan; the change is rejected if a turn is in flight and otherwise deferred to the next turn."
      - "At the next run entry the `Session` re-resolves the plan slot to a strong-reasoning `Model` within the same `Provider`, and `resolved_model` re-emits it."
    invariants_touched:
      [mode-switch-rejected-mid-turn, mode-model-same-provider, mode-model-fixed-per-turn, fixed-provider-per-session]

  - name: Plan mode hides mutating tools and denies any mutation
    actors: [Principal, Client]
    steps:
      - "`Client` switches the `Session`'s `PermissionMode` to plan between turns."
      - "On the next turn the `Catalog` advertises only read-only `ToolSpecs` to the model, so no mutating `Tool` is visible."
      - "If a mutation is somehow requested anyway, the evaluator's plan-mode gate hard-denies it before any learned allow is consulted."
    invariants_touched:
      [plan-mode-invisible-tools, plan-mode-denies-mutations, deny-dominant]

  - name: acceptEdits is carried but not enforced
    actors: [Principal, Client]
    steps:
      - "`Client` switches the `Session`'s `PermissionMode` to acceptEdits between turns; the mode picker advertises it."
      - "On the next turn the `Catalog` advertises the full toolset (acceptEdits hides nothing) and the decision path resolves `ToolCalls` through the normal deny→ask→allow fold — identically to `default`."
      - "A mutating `ToolCall` still surfaces a `PermissionAsk`; nothing is auto-allowed by the mode alone."
    invariants_touched:
      [acceptedits-declared-not-implemented, deny-dominant, toolcall-authorized-before-execute]

  - name: The conversation is compacted without losing the task
    actors: [Principal]
    steps:
      - "A long `Run` grows the `Conversation` past the context window."
      - "A compactor rewrites the history, summarizing the middle while keeping the first and recent user `Messages` verbatim."
      - "The rewritten `Conversation` contains no orphaned `ToolResult`."
    invariants_touched: [compaction-keeps-recent-user-intent, conversation-no-orphan-tool-result, message-immutable]

  - name: A subagent fans out to explore
    actors: [Principal]
    steps:
      - "The model issues delegation `ToolCalls` that spawn several `Subagents` from an `AgentDef`, bounded by the concurrency gate."
      - "Each `Subagent` runs a read-only child loop and cannot spawn its own `Subagents`."
      - "A child `PermissionAsk` surfaces without raw arguments; every child gets the configured `MaxRunTokens` value as its own independently enforced ceiling, so child spend does not draw down the parent."
    invariants_touched:
      [subagent-no-nesting, subagent-read-only-sandbox, subagent-fanout-bounded, child-ask-redacts-raw-args, per-engine-budget-inherited-tighten-only]

  - name: A team works a shared task and the lead synthesizes
    actors: [Principal, Lead]
    steps:
      - "A `Team` is spawned with a trusted goal; each `TeamMember` runs an isolated loop and records findings to the shared ledger."
      - "Peer messages between members are treated as untrusted input."
      - "`Lead` reads the ledger and returns one consolidated synthesis as the `Team`'s result."
      - "Each `TeamMember` and the `Lead` synthesis use the configured `MaxRunTokens` value as independently enforced per-engine ceilings; their spend does not draw down the parent."
      - "The separate `MaxTeamTokens` ceiling aggregates team rounds: when crossed it prevents new rounds, while the in-flight round and lead synthesis finish."
    invariants_touched:
      [team-goal-trusted-peers-untrusted, member-isolated-loop, team-returns-lead-synthesis, per-engine-budget-inherited-tighten-only, team-budget-round-aggregate]

  - name: A run crosses the token budget
    actors: [Operator]
    steps:
      - "`Operator` sets a run token budget; a `Run` streams a `Turn` that pushes cumulative usage past it."
      - "The in-flight `Turn` completes without being replayed."
      - "The budget stops the `Run` cleanly at the next `Turn` boundary."
    invariants_touched: [budget-enforced-at-turn-boundary, run-no-replay-after-first-chunk, run-one-terminal-stop]

  - name: A session resumes after a restart at a pending ask
    actors: [Operator, Client]
    steps:
      - "A `Session` is parked on a `PermissionAsk` when the process dies; the `EventLog` holds every `Event` up to that point."
      - "`Operator` restarts the harness; a new `Process` recovers the `Session` to idle before reuse, preserving cumulative usage."
      - "`Client` approves the pending ask; the `Run` re-enters the loop at the ask and the pending `ToolCall` executes exactly once."
    invariants_touched:
      [session-recover-before-reuse, event-log-records-terminal-tail, ask-suspends-run-until-resolved, session-usage-survives-restart, rehydrate-tool-exactly-once]

  - name: A rehydrated session does not re-ask a previously granted tool
    actors: [Operator, Client]
    steps:
      - "In an earlier `Run`, `Client` resolves a `PermissionAsk` allow-always, learning a `PermissionRule`; the verdict is recorded in the `EventLog` as metadata only."
      - "`Operator` restarts; rehydration loads the `Session` snapshot and replays the `EventLog`, reconstructing the learned `PermissionRule`."
      - "The model re-issues the same `ToolCall` and it is allowed without a new `PermissionAsk`."
    invariants_touched:
      [ask-resolves-to-verdict, allow-always-learns-rule, learned-rule-volatile-rehydrated-from-log, rehydration-needs-snapshot-plus-log, event-log-append-only]

  - name: An MCP server's tools join the catalog
    actors: [Operator]
    steps:
      - "`Operator` connects an `MCPServer` over streaming-HTTP."
      - "Its tools register into the catalog under server-namespaced names."
      - "The model issues a `ToolCall` against one of them like any other `Tool`."
    invariants_touched: [mcp-streaming-http-only, mcp-tools-namespaced]

  - name: A hook blocks a tool use
    actors: [Operator]
    steps:
      - "`Operator` configures a pre-tool-use `Hook`."
      - "The model issues a `ToolCall`; the `Hook` runs and exits with code 2."
      - "The `ToolCall` is blocked before it executes."
    invariants_touched: [hook-exit-code-decides, toolcall-authorized-before-execute]

  - name: A skill is activated
    actors: [Principal]
    steps:
      - "The model activates a `Skill` by name; it crosses as identity, body, and assets, never as a path."
      - "Activation lists logical asset names without reading their content."
      - "When needed, the model calls `Skill` again with the name and one asset; that textual payload is returned without widening the `Workspace`."
    invariants_touched: [skill-crosses-as-bundle-not-path, skill-assets-on-demand, workspace-contained]

  - name: A subagent overrides the model within the same provider
    actors: [Principal]
    steps:
      - "A `Session` keeps its `Provider` binding across turns; its effective `Model` is fixed during each turn."
      - "A delegation `ToolCall` spawns a `Subagent` with a `Model` override on the same `Provider`, deriving provider/model-dependent collaborators together for that target."
      - "The `Subagent` replays its own `Conversation` statelessly each `Turn`."
    invariants_touched: [fixed-provider-per-session, model-override-stays-in-provider, provider-stateless-replay]

  - name: Cold resume discovers metadata on the first explicit prompt
    actors: [Principal, Client, Operator]
    steps:
      - "The host restores a transcript for an explicitly selected native provider/model without authenticated native startup discovery. That provider is healthy but its `ProviderDiscovery` is unattempted and the context window is unknown."
      - "The first explicit prompt initiates or joins that provider's discovery through the deployment's coordinator. No earlier rejected prompt or model-picker request is required."
      - "Discovery succeeds and publishes `ModelMetadata` for the exact target. Admission resolves the context window before context-dependent execution, including compaction and inference."
      - "Execution and client projections use coherent resolution for that target and evidence/configuration basis; opening the picker is not a prerequisite."
    invariants_touched:
      [discovery-provider-local, metadata-before-context-dependent-execution, model-resolution-coherent]

  - name: Providers settle independently and listings can omit passthrough models
    actors: [Principal, Operator]
    steps:
      - "Provider A settles successfully while provider B remains unattempted. Sessions targeting B share B's lifecycle, not A's completion."
      - "A prompt targeting B initiates or joins B's attempt rather than treating B as already failed. B returns a healthy listing that omits the requested passthrough `Model`."
      - "The omission alone invalidates neither that exact target nor the existing healthy-omission fallback. Host policy can establish a permitted context-window fallback before execution, keeping it distinct from observed metadata. Listing membership is not an allowlist."
    invariants_touched:
      [discovery-provider-local, metadata-knowledge-explicit, metadata-before-context-dependent-execution]

  - name: Failed refresh and obsolete completion preserve distinct knowledge
    actors: [Operator]
    steps:
      - "A provider has accepted successful observations. An older refresh remains in flight when a newer attempt publishes updated observations."
      - "The older request completes late with different values; its obsolete result cannot regress the newer accepted knowledge."
      - "A subsequent refresh fails. `ProviderDiscovery` distinguishes this latest outcome from the last successful `ModelMetadata`; host resolution policy governs whether those observations remain usable."
    invariants_touched:
      [discovery-publication-ordered, discovery-outcome-separate-from-observations]

  - name: Missing properties are not unsupported capabilities
    actors: [Client, Operator]
    steps:
      - "Live `ModelMetadata` reports a context window but omits reasoning support and an input capability. Those fields are unknown."
      - "An observation explicitly reporting no reasoning support is distinct from the omitted field. Host policy resolves required properties from available evidence and configuration without presenting a fallback as an observation."
      - "For the same exact target and evidence/configuration basis, execution and client projections agree on resolved facts and knowledge distinctions; the client does not independently reinterpret unknown as unsupported."
    invariants_touched:
      [metadata-knowledge-explicit, model-resolution-coherent]

  - name: The agent remembers a fact and recalls it later
    actors: [Principal]
    steps:
      - "During a `Run`, the model writes a fact to `Memory`."
      - "The `Session` ends, and `Memory` persists independently of it."
      - "A later `Session` recalls the fact."
    invariants_touched: [memory-outlives-session]

  - name: Two replicas, one writer
    actors: [Operator]
    steps:
      - "`Process` A acquires the `SessionLease` for a `Session` and runs it; `Process` B is routed away by session affinity."
      - "A dies and its `SessionLease` expires."
      - "B acquires the `SessionLease`, rehydrates the `Session` from its snapshot plus the `EventLog`, and continues — never writing concurrently with A."
    invariants_touched:
      [single-writer-per-session, session-affinity-routing, process-disposable, rehydration-needs-snapshot-plus-log]

  - name: A mid-round team does not survive a restart
    actors: [Principal, Operator]
    steps:
      - "A `Team` is mid-round: `Tasks` are assigned to `TeamMembers` and `Findings` are accumulating in the shared ledger."
      - "The `Process` dies; the member sessions persist as loadable transcripts, but the roster, `Task` assignments, and `Finding` ledger are gone."
      - "Recovery is to re-create the `Team` from scratch; a mid-round team is not resumable in v1."
    invariants_touched: [team-coordination-not-durable, member-isolated-loop, process-disposable]

# Model-level invariants: cross-entity rules with no single owner.
invariants:
  - id: model-resolution-coherent
    statement: >
      For the same exact provider/model target and evidence/configuration
      basis, execution and client projections use coherent host resolution of
      context, capabilities, and reasoning. Metadata-dependent session facts and
      provider/model-dependent collaborators use that basis; clients project the
      host's interpretation rather than resolving it independently. This does not
      require instantaneous atomic updates across network boundaries.
  - id: metadata-before-context-dependent-execution
    statement: >
      Admission resolves the metadata needed for context-dependent
      execution, or establishes a policy-permitted fallback, before compaction or
      inference. Otherwise execution remains unadmitted. It need not await every
      property, require picker activity, or add native-provider startup
      authentication. A healthy listing's omission of a passthrough model alone
      neither invalidates it nor removes its policy-permitted fallback.
  - id: budget-enforced-at-turn-boundary
    statement: >
      The token budget is checked at a `Turn` boundary: an in-flight `Turn`
      always completes, and the budget then stops the next `Turn` cleanly.
  - id: per-engine-budget-inherited-tighten-only
    statement: >
      `MaxRunTokens` is the same configured ceiling for the main engine, each
      `Subagent`, each `Parallel` branch, every `TeamMember`, and lead synthesis,
      but each engine enforces it only against its own session usage. Child spend
      never draws down parent usage; per-call overrides may only tighten a child's
      ceiling. A delegation tree can therefore exceed this per-engine ceiling.
  - id: team-budget-round-aggregate
    statement: >
      `MaxTeamTokens` is a distinct, tighten-only aggregate checked between team
      rounds. Crossing it prevents new rounds; the in-flight round and lead
      synthesis still complete. Cross-tree aggregate enforcement and observability
      are deferred.
  - id: rehydration-needs-snapshot-plus-log
    statement: >
      Rehydrating a `Session` after a restart restores the aggregate from its
      snapshot and re-derives volatile state — learned `PermissionRules` and the
      pre-compaction `Conversation` archive — by replaying the `EventLog`; the
      snapshot alone is insufficient.
  - id: snapshot-is-primary-projection
    statement: >
      The `Session` snapshot is the primary replay projection and the source of
      truth for rehydration; the `EventLog` is additive, replayed only for state
      the snapshot does not carry.
  - id: rehydrate-tool-exactly-once
    statement: >
      When a `Process` resumes a `Session` parked on a `PermissionAsk`, the
      pending `ToolCall` executes exactly once and every other unanswered
      `ToolCall` on the turn is closed out as an aborted result.
