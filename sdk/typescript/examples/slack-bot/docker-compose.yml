# Runs the whole Slack bot demo: a real `mecated` plus the bot, wired
# together on an internal-only Docker network (neither port is published to
# the host — the bot reaches Slack outbound over Socket Mode; nothing needs
# to reach in). Both Dockerfiles under docker/ are local dev/demo images,
# not the project's official release artifact — see their header comments.
#
# Usage: copy .env.example to .env, fill it in, then `docker compose up --build`.
services:
  mecated:
    build:
      context: ../../../..
      dockerfile: sdk/typescript/examples/slack-bot/docker/mecated.Dockerfile
    command:
      - serve
      - --grpc-addr=0.0.0.0:50051
      - --http-addr=
      - --workspace=/workspace
      - --ready-file=/tmp/mecated-ready.json
      # Optional OpenAI-compatible gateway, reached with a plain key
      # (OPENAI_API_KEY) and NOT the `toolhive` provider's OIDC path — that one
      # needs the host's OS keyring, which a container can't reach. See
      # DESIGN.md/README.md. Set OPENAI_BASE_URL in .env to point at one.
      #
      # Leaving it unset is safe, and is NOT the empty-string trap described
      # under `environment:` below — that trap is about provider KEYS, where an
      # empty value still reads as "this provider is configured, try it". An
      # empty base URL is inert: cliconfig.EndpointOverrides() registers an
      # override only for a non-empty value, so `--openai-base-url=` leaves the
      # OpenAI provider on its own default endpoint, exactly as if the flag
      # were absent.
      - --openai-base-url=${OPENAI_BASE_URL:-}
    # List form, no `:-` default: an unset var is genuinely OMITTED from the
    # container's environment. `KEY: ${VAR:-}` (map form) instead sets an EMPTY
    # STRING when unset — which mecated still treats as "this provider is
    # configured" and tries it (failing with a real 401), rather than skipping
    # it and falling through to whichever provider actually has a real key.
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
    volumes:
      - mecatl-workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mecated-ready.json"]
      interval: 2s
      timeout: 2s
      retries: 30

  slack-bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
      # @stacklok/mecatl-sdk installs from GitHub Packages during the build
      # (see the Dockerfile's own header comment) — needs a read:packages
      # token. Passed as a build secret, never a build arg/env (those leak
      # into image layer history).
      secrets:
        - npm_token
    depends_on:
      mecated:
        condition: service_healthy
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?set SLACK_BOT_TOKEN in .env}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?set SLACK_APP_TOKEN in .env}
      MECATL_GRPC_ADDRESS: mecated:50051
      # Session placement is always server-owned. The bot sends no workspace path;
      # mecated assigns /workspace (its own --workspace flag) to every new session.
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:-}
      SLACK_RATE_LIMIT_MAX: ${SLACK_RATE_LIMIT_MAX:-}
      SLACK_RATE_LIMIT_WINDOW_MS: ${SLACK_RATE_LIMIT_WINDOW_MS:-}
      SLACK_LOG_LEVEL: ${SLACK_LOG_LEVEL:-}

volumes:
  mecatl-workspace:

secrets:
  # TODO: once @stacklok/mecatl-sdk is on public npm, this secret and its
  # GH_PACKAGES_TOKEN source (see .env.example) stop being needed entirely.
  npm_token:
    environment: GH_PACKAGES_TOKEN
