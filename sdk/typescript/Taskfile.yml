version: '3'

tasks:
  install:
    desc: Install the TypeScript SDK dependencies from the frozen pnpm lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  lint:
    desc: Lint and format-check the TypeScript SDK with Biome
    deps: [install]
    cmds:
      - pnpm run lint

  format:
    desc: Format and apply safe import organization to the TypeScript SDK
    deps: [install]
    cmds:
      - pnpm run format

  typecheck:
    desc: Type-check the TypeScript SDK without emitting files
    deps: [install]
    cmds:
      - pnpm run typecheck

  test:
    desc: Run the TypeScript SDK Vitest unit suite (excludes e2e/)
    deps: [install]
    cmds:
      - pnpm run test

  test:release:
    desc: Run release unit tests; declaration and packed-artifact gates run separately
    deps: [install]
    cmds:
      - pnpm exec vitest run --exclude test/declarations.test.ts --exclude test/package.test.ts

  declarations:
    desc: Compile the published declarations with both supported TypeScript compilers
    deps: [install]
    cmds:
      - pnpm exec vitest run test/declarations.test.ts

  package:check:
    desc: Apply the exact package inventory and consumer checks to one packed tarball
    deps: [install]
    cmds:
      - pnpm exec vitest run test/package.test.ts

  audit:
    desc: Gate the complete dependency closure on the pnpm vulnerability advisory database
    deps: [install]
    cmds:
      - pnpm audit

  e2e:
    desc: Build the SDK and same-checkout mecated, then run the Node/Bun offline wire suite
    deps: [build, e2e:fixture]
    cmds:
      - test -x "${BUN_BIN:-}" || command -v bun >/dev/null 2>&1 || { echo "bun is required for the SDK e2e runtime matrix"; exit 1; }
      - task --dir ../.. build
      - pnpm run test:e2e

  e2e:fixture:
    desc: Build the test-only MCP authorization fixture daemon
    cmds:
      - CGO_ENABLED=0 go build -o ../../bin/mecatl-sdk-authorization-fixture ./e2e/fixturedaemon

  deno:
    desc: Type-check the package exports and run the Deno.Command local integration
    deps: [install]
    cmds:
      - test -x "${DENO_BIN:-}" || command -v deno >/dev/null 2>&1 || { echo "deno is required for the SDK Deno integration"; exit 1; }
      - if [ -z "${MECATL_SDK_PACKED_TARBALL:-}" ]; then task pack; fi
      - task --dir ../.. build
      - node scripts/run-deno-integration.mjs

  browser:install:
    desc: Install the pinned Chromium, Firefox, and WebKit revisions and host dependencies
    deps: [install]
    cmds:
      - pnpm exec playwright install --with-deps chromium firefox webkit

  browser:
    desc: Pack the SDK and run all offline browser projects against same-checkout mecated
    deps: [pack]
    cmds:
      - task --dir ../.. build
      - pnpm run test:browser

  browser:project:
    desc: Pack the SDK and run one named offline browser project against same-checkout mecated
    deps: [pack]
    requires:
      vars: [PROJECT]
    cmds:
      - task --dir ../.. build
      - pnpm exec playwright test --config e2e/browser/playwright.config.ts --project "{{.PROJECT}}"

  macos-spawn:
    desc: Build the SDK and same-checkout mecated, then run only the macOS Node spawn smoke
    deps: [build]
    platforms: [darwin]
    cmds:
      - task --dir ../.. build
      - pnpm run test:macos-spawn

  build:
    desc: Build ESM modules, declarations, and source maps with tsc
    deps: [install]
    cmds:
      - pnpm run build

  examples:typecheck:
    desc: Type-check concise examples against only the built package exports
    deps: [build]
    cmds:
      - pnpm run examples:typecheck

  api:check:
    desc: Verify the public API reports for the root, Node/Bun, and Deno entry points
    deps: [build]
    cmds:
      - pnpm run api:check

  api:update:
    desc: Refresh the committed public API reports after an intentional change
    deps: [build]
    cmds:
      - pnpm run api:update

  docs:
    desc: Regenerate the committed TypeScript SDK method reference
    deps: [build]
    cmds:
      - pnpm run api:check
      - pnpm run docs:generate

  docs:check:
    desc: Verify the committed TypeScript SDK method reference is current
    deps: [build]
    cmds:
      - pnpm run api:check
      - |
        sdk_docs_tmp="$(mktemp -d)"
        trap 'rm -r "$sdk_docs_tmp"' EXIT
        pnpm run docs:generate --output "$sdk_docs_tmp"
        diff -u ../../user-docs/reference/typescript-sdk-api/core.md "$sdk_docs_tmp/core.md"
        diff -u ../../user-docs/reference/typescript-sdk-api/node.md "$sdk_docs_tmp/node.md"
        diff -u ../../user-docs/reference/typescript-sdk-api/deno.md "$sdk_docs_tmp/deno.md"

  pack:
    desc: Build and pack the TypeScript SDK into the ignored temporary directory
    deps: [install]
    vars:
      PACK_DESTINATION: '{{default ".api-extractor-temp" .PACK_DESTINATION}}'
    cmds:
      - pnpm pack --pack-destination "{{.PACK_DESTINATION}}"
