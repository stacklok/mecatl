version: '3'

tasks:
  install:
    desc: Install the TypeScript SDK dependencies from the frozen pnpm lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  lint:
    desc: Lint and format-check the TypeScript SDK with Biome
    deps: [install]
    cmds:
      - pnpm run lint

  format:
    desc: Format and apply safe import organization to the TypeScript SDK
    deps: [install]
    cmds:
      - pnpm run format

  typecheck:
    desc: Type-check the TypeScript SDK without emitting files
    deps: [install]
    cmds:
      - pnpm run typecheck

  test:
    desc: Run the TypeScript SDK Vitest unit suite (excludes e2e/)
    deps: [install]
    cmds:
      - pnpm run test

  e2e:
    desc: Build the SDK and same-checkout mecated, then run the Node/Bun offline wire suite
    deps: [build]
    cmds:
      - test -x "${BUN_BIN:-}" || command -v bun >/dev/null 2>&1 || { echo "bun is required for the SDK e2e runtime matrix"; exit 1; }
      - task --dir ../.. build
      - pnpm run test:e2e

  browser:install:
    desc: Install the pinned Chromium revision and its host dependencies
    deps: [install]
    cmds:
      - pnpm exec playwright install --with-deps chromium

  browser:
    desc: Pack the SDK and run the offline Chromium project against same-checkout mecated
    deps: [pack]
    cmds:
      - task --dir ../.. build
      - pnpm run test:browser

  build:
    desc: Build ESM modules, declarations, and source maps with tsc
    deps: [install]
    cmds:
      - pnpm run build

  api:check:
    desc: Verify the public API reports for the root and node entry points
    deps: [build]
    cmds:
      - pnpm run api:check

  api:update:
    desc: Refresh the committed public API reports after an intentional change
    deps: [build]
    cmds:
      - pnpm run api:update

  pack:
    desc: Build and pack the TypeScript SDK into the ignored temporary directory
    deps: [install]
    cmds:
      - pnpm pack --pack-destination .api-extractor-temp
