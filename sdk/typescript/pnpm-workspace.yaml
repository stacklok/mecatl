# pnpm 11's enforced build-script policy.
allowBuilds:
  esbuild: true
# Retained as the Scenario 11 acceptance-contract spelling; pnpm 11 replaced
# this setting with allowBuilds, so both must remain aligned.
onlyBuiltDependencies:
  - esbuild
# Transitive dev-tooling advisories. source-map-js (via vitest > vite > postcss)
# has a patched release; force it until vite's range picks it up. vite (via
# vitest) 8.2.0-8.2.3 bundles a vulnerable launch-editor and has dev-server
# path checks that can be bypassed; 8.2.4 fixes both.
overrides:
  source-map-js@<1.2.2: ^1.2.2
  vite@>=8.2.0 <8.2.4: ^8.2.4
  # GHSA-g3hv-75wg-m249: API Extractor still pins vulnerable minimatch 10.
  # Remove this scoped override when upstream adopts a patched version.
  "@microsoft/api-extractor>minimatch@<11.0.1": ^11.0.1
auditConfig:
  ignoreGhsas:
    # sprintf-js DoS via unbounded precision specifiers; no patched release
    # exists. Reached only through @microsoft/api-extractor > argparse at build
    # time, never shipped in the SDK. Remove when a fixed version is published.
    - GHSA-hp3w-g68c-fv3c
