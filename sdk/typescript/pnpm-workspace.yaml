# pnpm 11's enforced build-script policy.
allowBuilds:
  esbuild: true
# Retained as the Scenario 11 acceptance-contract spelling; pnpm 11 replaced
# this setting with allowBuilds, so both must remain aligned.
onlyBuiltDependencies:
  - esbuild
# Vitest 5.0.0 shipped broken strict declarations; both fixes are merged upstream.
# Remove this patch once a release includes vitest-dev/vitest#11141 and #11175.
patchedDependencies:
  vitest@5.0.0: patches/vitest@5.0.0.patch
