version: v2
modules:
  - path: contracts/proto
deps:
  # protovalidate annotations — `(buf.validate.field)` etc. Pulled in from
  # the BSR. V1 authors the annotations for documentation + future runtime
  # enforcement; required-field checks are enforced in the Go server adapter.
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - contracts/proto/mecatl/broker/v1/session.proto
    RPC_RESPONSE_STANDARD_NAME:
      - contracts/proto/mecatl/broker/v1/session.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - contracts/proto/mecatl/broker/v1/session.proto
    ENUM_VALUE_PREFIX:
      - contracts/proto/mecatl/broker/v1/session.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - contracts/proto/mecatl/broker/v1/session.proto
breaking:
  use:
    - FILE
