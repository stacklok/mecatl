# brood-box agent manifest for the mecatui container image (issue #302).
#
# brood-box locates this file via the OCI config label
# `org.stacklok.broodbox.agent` (set to /var/run/ko/agent.yaml at build time),
# falling back to /usr/share/broodbox/agent.yaml when the label is absent. ko's
# per-package kodata/ dir lands at $KO_DATA_PATH (/var/run/ko/), so this file
# ships at /var/run/ko/agent.yaml in the image.
#
# mecatl auto-detects its provider from whichever key is set, so we forward all
# four supported provider keys (internal/cliconfig knownAuthProviders) and allow
# egress to all four provider endpoints. The `image:` ref below is overridden by
# brood-box on import with the digest-pinned ref it actually pulled; `command:`
# is the mecatui entrypoint. This manifest is operator-tunable — edit it for a
# deployment that pins a single provider or a stricter egress profile.
name: mecatui
image: ghcr.io/stacklok/mecatl/mecatui:latest
command: ["mecatui"]
env_forward: [OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENCODE_API_KEY]
mcp:
  mode: env
egress_profile: standard
egress_hosts:
  standard:
    - { name: api.anthropic.com, ports: [443] }
    - { name: openrouter.ai, ports: [443] }
    - { name: api.openai.com, ports: [443] }
    - { name: opencode.ai, ports: [443] }
