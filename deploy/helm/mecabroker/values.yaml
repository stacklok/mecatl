nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/stacklok/mecatl/mecabroker
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The listener pair is TLS-only. The Secret must contain tls.crt and tls.key.
tls:
  secretName: mecabroker-tls
  certKey: tls.crt
  keyKey: tls.key

# Workload identity verifies every mecak8s gRPC call. caSecret must contain ca.pem.
workloadIdentity:
  issuer: ""
  jwksURI: ""
  audience: mecabroker
  # Exact subject of the sole workload allowed to own broker sessions/handles.
  subject: ""
  caSecret: mecabroker-workload-identity
  caKey: ca.pem
  maxJWKSStaleness: 15m

# Config is mounted read-only. OAuth client secrets named by client_secret_env
# are supplied with extraEnv valueFrom.secretKeyRef, never inline here.
brokerConfig: |
  {"callback_url":"https://broker.invalid/callback","profiles":[]}
extraEnv: []

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi}

# The public listener multiplexes TLS gRPC and browser callback routes.
service:
  port: 8443

terminationGracePeriodSeconds: 70
# Numeric seconds let the chart prove that Kubernetes has enough time for the
# preStop drain: propagationDelaySeconds + timeoutSeconds + 5s resource close.
drain:
  propagationDelaySeconds: 2
  timeoutSeconds: 55

# Every broker transport, retention, and capacity bound is explicit so an
# operator can tune a singleton without relying on unreviewable extraArgs.
transport:
  dialTimeoutSeconds: 5
  rpcDeadlineSeconds: 10
  executeDeadlineSeconds: 120
  handleIdleTimeoutSeconds: 300
  sweepIntervalSeconds: 30
  cleanupTimeoutSeconds: 10
  maxHandles: 128
  maxOwners: 128
  maxReceipts: 4096
  maxReceiptBytes: 8388608
  maxPendingControls: 1024
  maxActiveExecutes: 64

# Runtime ownership is distinct from transport handles/owners. It bounds
# ToolHive logical sessions and their pending authorization state.
runtime:
  maxLogicalSessions: 1024
  logicalRetentionSeconds: 86400
  maxPendingAuthStates: 1024

networkPolicy:
  enabled: true
  # publicFrom reaches the multiplexed TLS gRPC and callback listener.
  publicFrom: []
  # Operator-owned NetworkPolicyEgressRule entries for DNS plus concrete
  # OIDC/JWKS, upstream OAuth, and MCP destination CIDRs/selectors. Dynamic
  # destinations must be maintained by the operator or an external policy system.
  operatorEgress: []
