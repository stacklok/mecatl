{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mecabroker.fullname" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mecabroker.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
{{- if .Values.networkPolicy.publicFrom }}
  ingress:
    - from:
{{ toYaml .Values.networkPolicy.publicFrom | indent 8 }}
      ports: [{protocol: TCP, port: public}]
{{- else }}
  ingress: []
{{- end }}
  # operatorEgress entries use only standard peers: namespaceSelector,
  # podSelector, and ipBlock. Supply DNS plus concrete OIDC/JWKS, upstream OAuth,
  # and MCP destination policy. Empty means default-deny egress.
  egress:
{{ toYaml .Values.networkPolicy.operatorEgress | indent 4 }}
{{- end }}
