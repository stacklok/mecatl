apiVersion: v1
kind: Service
metadata:
  name: {{ include "mecabroker.fullname" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "mecabroker.labels" . | nindent 4 }}
  ports:
    - {name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc}
    - {name: browser-callback, port: {{ .Values.service.callbackPort }}, targetPort: callback}
