{{- include "mecabroker.validateImage" . -}}
{{- include "mecabroker.validateShutdownBudget" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecabroker.fullname" . }}
  labels: {{- include "mecabroker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Process-bound authorization and callback correlation are not transferable.
    type: Recreate
  selector:
    matchLabels: {{- include "mecabroker.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mecabroker.labels" . | nindent 8 }}
      annotations:
        checksum/broker-config: {{ .Values.brokerConfig | sha256sum }}
    spec:
      serviceAccountName: {{ include "mecabroker.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: {{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ default (printf "v%s" .Chart.Version) .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen-addr=0.0.0.0:8443
            - --admin-addr=127.0.0.1:8081
            - --tls-cert=/var/run/secrets/tls/{{ .Values.tls.certKey }}
            - --tls-key=/var/run/secrets/tls/{{ .Values.tls.keyKey }}
            - --oidc-issuer={{ required "workloadIdentity.issuer is required" .Values.workloadIdentity.issuer }}
            - --oidc-jwks-uri={{ required "workloadIdentity.jwksURI is required" .Values.workloadIdentity.jwksURI }}
            - --oidc-audience={{ required "workloadIdentity.audience is required" .Values.workloadIdentity.audience }}
            - --oidc-subject={{ required "workloadIdentity.subject is required" .Values.workloadIdentity.subject }}
            - --oidc-ca=/var/run/secrets/workload-identity/{{ .Values.workloadIdentity.caKey }}
            - --oidc-max-jwks-staleness={{ .Values.workloadIdentity.maxJWKSStaleness }}
            - --config=/etc/mecabroker/broker.json
            - --drain-propagation-delay={{ .Values.drain.propagationDelaySeconds }}s
            - --drain-timeout={{ .Values.drain.timeoutSeconds }}s
            - --broker-dial-timeout={{ .Values.transport.dialTimeoutSeconds }}s
            - --broker-rpc-deadline={{ .Values.transport.rpcDeadlineSeconds }}s
            - --broker-execute-deadline={{ .Values.transport.executeDeadlineSeconds }}s
            - --broker-handle-idle-timeout={{ .Values.transport.handleIdleTimeoutSeconds }}s
            - --broker-sweep-interval={{ .Values.transport.sweepIntervalSeconds }}s
            - --broker-cleanup-timeout={{ .Values.transport.cleanupTimeoutSeconds }}s
            - --broker-max-handles={{ .Values.transport.maxHandles }}
            - --broker-max-owners={{ .Values.transport.maxOwners }}
            - --broker-max-logical-sessions={{ .Values.runtime.maxLogicalSessions }}
            - --broker-logical-retention={{ .Values.runtime.logicalRetentionSeconds }}s
            - --broker-max-pending-auth-states={{ .Values.runtime.maxPendingAuthStates }}
            - --broker-max-receipts={{ .Values.transport.maxReceipts }}
            - --broker-max-receipt-bytes={{ .Values.transport.maxReceiptBytes }}
            - --broker-max-pending-controls={{ .Values.transport.maxPendingControls }}
            - --broker-max-active-executes={{ .Values.transport.maxActiveExecutes }}
          {{- with .Values.extraEnv }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {name: public, containerPort: 8443}
            - {name: admin, containerPort: 8081}
          startupProbe:
            exec: {command: ["/ko-app/mecabroker", "ready"]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["/ko-app/mecabroker", "ready"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["/ko-app/mecabroker", "health"]}
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["/ko-app/mecabroker", "drain"]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tls, mountPath: /var/run/secrets/tls, readOnly: true}
            - {name: workload-identity, mountPath: /var/run/secrets/workload-identity, readOnly: true}
            - {name: broker-config, mountPath: /etc/mecabroker, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "tls.secretName is required" .Values.tls.secretName }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.tls.certKey }}, path: {{ .Values.tls.certKey }}}
              - {key: {{ .Values.tls.keyKey }}, path: {{ .Values.tls.keyKey }}}
        - name: workload-identity
          secret:
            secretName: {{ required "workloadIdentity.caSecret is required" .Values.workloadIdentity.caSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.workloadIdentity.caKey }}, path: {{ .Values.workloadIdentity.caKey }}}
        - name: broker-config
          configMap:
            name: {{ include "mecabroker.fullname" . }}-config
            defaultMode: 0444
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
