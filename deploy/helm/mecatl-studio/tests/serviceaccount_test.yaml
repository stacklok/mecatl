suite: service account contracts
templates:
  - templates/serviceaccount.yaml
  - templates/deployment.yaml
release:
  name: mecatl-studio
set:
  mecatl.baseURL: https://mecak8s.example.com
  publicURL: https://studio.example.com
  session.secretName: studio-session
tests:
  - it: creates a token-less account named after the release
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.annotations:
        example.com/role: studio
    asserts:
      - equal:
          path: metadata.name
          value: mecatl-studio
      - equal:
          path: metadata.annotations
          value:
            example.com/role: studio
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses an existing account without creating one
    set:
      serviceAccount.create: false
      serviceAccount.name: shared-studio
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared-studio
        template: templates/deployment.yaml

  - it: requires a name for an existing account
    template: templates/deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name is required when serviceAccount.create is false"
