{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mecatl-studio.fullname" . }}
  labels: {{- include "mecatl-studio.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- if .Values.httpRoute.hostnames }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- else }}
    - {{ include "mecatl-studio.publicHost" . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: {{ include "mecatl-studio.fullname" . }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.httpRoute.requestTimeout | quote }}
{{- end }}
