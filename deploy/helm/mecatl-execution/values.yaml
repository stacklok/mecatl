fullnameOverride: ""
provider:
  image: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  securitySecretName: ""
  # Project only platform-managed TLS Secret keys; cert-manager can own these Secrets.
  # securitySources:
  #   - name: provider-tls
  #     items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
  #   - name: provider-client-roots
  #     items: [{key: ca.crt, path: clients.pem}]
  securityManifest: ""
  securityReloadInterval: 2s
  maxConcurrentStreams: 64
  maxConcurrentRPCs: 128
  maxConcurrentRPCsPerClient: 32
  healthPort: 8081
  clientIngressSelectors: []
  apiServerCIDRs: []
  dnsCIDRs: []
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 256Mi}
service:
  port: 8443
networkPolicy:
  enabled: true
  dnsPorts: [53]
  apiServerPorts: [443]
  workloadProfiles: {}
resourceGovernance:
  enabled: true
  # Required operator-owned namespace budgets when governance is enabled.
  # Example for 1000 1Gi/100m/128Mi environments plus provider headroom.
  # This budgets resources; it is not a measured throughput guarantee:
  # pods: "1100"
  # persistentVolumeClaims: "1000"
  # executionEnvironments: "1000"
  # requestsCPU: "120"
  # requestsMemory: 150Gi
  # requestsStorage: 1100Gi
  # requestsEphemeralStorage: 100Gi
  # limitsCPU: "1100"
  # limitsMemory: 1100Gi
  # limitsEphemeralStorage: 1100Gi
  pods: ""
  persistentVolumeClaims: ""
  executionEnvironments: ""
  requestsCPU: ""
  requestsMemory: ""
  requestsStorage: ""
  requestsEphemeralStorage: ""
  limitsCPU: ""
  limitsMemory: ""
  limitsEphemeralStorage: ""
templates: {}
# One-upgrade opt-in: name only definitions removed from retained lifetime.json.
# Requires no affected-revision allocations or unresolved affected-ID reservations,
# and an observed scaled-to-zero provider. Other IDs' workspaces may remain.
maintenance:
  pruneRevisions: {}

# Each revision key must be v1- plus the lowercase SHA-256 of
# "mecatl/execution-template/v1\0" followed by encoding/json of the
# validated Go ProfileSpec. Keep historical execution definitions for retained
# allocations; display and deprecation/revocation policy may change independently.
# maxEnvironments is a positive ID-level quota outside the recipe hash. Lowering
# it below current usage blocks new reservations without evicting allocations.
# Copy complete output from deploy/execution-templates into template-values.yaml;
# pass it alongside provider/network/resource budgets in execution-values.yaml.
# Only an ID with no eligible revisions may omit default while keeping its
# deprecated or revoked history. The mecak8s deployment pins its own eligible
# default ID/revision and checks it at startup; no other ID is substituted.
# templates:
#   go:
#     maxEnvironments: 1000
#     default: v1-<CANONICAL_EXECUTION_DIGEST>
#     revisions:
#       v1-<CANONICAL_EXECUTION_DIGEST>:
#         deprecated: false
#         revoked: false
#         execution:
#           image: registry.example/workload@sha256:<image digest>
#           storageClass: standard
#           storageSize: 2Gi
#           cpuRequest: 100m
#           memoryRequest: 128Mi
#           cpuLimit: "1"
#           memoryLimit: 1Gi
#           ephemeralStorageRequest: 64Mi
#           ephemeralStorageLimit: 1Gi
#           tmpSizeLimit: 256Mi
#           runtimeClassName: gvisor
#           maxFileBytes: 5242880
#           maxCommandBytes: 1048576
#           maxCommandDuration: 5m
