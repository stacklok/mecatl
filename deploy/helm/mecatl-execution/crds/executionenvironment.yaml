apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: executionenvironments.execution.mecatl.dev
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: execution.mecatl.dev
  scope: Namespaced
  names:
    plural: executionenvironments
    singular: executionenvironment
    kind: ExecutionEnvironment
    shortNames: [execenv]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            x-kubernetes-validations:
            - rule: "!has(oldSelf.allocationID) || self.allocationID == oldSelf.allocationID"
              message: allocationID is immutable
            - rule: "!has(oldSelf.revision) || self.revision == oldSelf.revision"
              message: revision is immutable
            - rule: "!has(oldSelf.ownerHash) || self.ownerHash == oldSelf.ownerHash"
              message: ownerHash is immutable
            - rule: "!has(oldSelf.clientHash) || self.clientHash == oldSelf.clientHash"
              message: clientHash is immutable
            - rule: "!has(oldSelf.bindingID) || self.bindingID == oldSelf.bindingID"
              message: bindingID is immutable
            - rule: "!has(oldSelf.requestFingerprint) || self.requestFingerprint == oldSelf.requestFingerprint"
              message: requestFingerprint is immutable
            - rule: "!has(oldSelf.profileDigest) || self.profileDigest == oldSelf.profileDigest"
              message: profileDigest is immutable
            - rule: "!has(oldSelf.profile) || self.profile == oldSelf.profile"
              message: profile is immutable
            - rule: "!has(oldSelf.image) || self.image == oldSelf.image"
              message: image is immutable
            - rule: "!has(oldSelf.storageClass) || self.storageClass == oldSelf.storageClass"
              message: storageClass is immutable
            - rule: "!has(oldSelf.storageSize) || self.storageSize == oldSelf.storageSize"
              message: storageSize is immutable
            - rule: "!has(oldSelf.resources) || self.resources == oldSelf.resources"
              message: resources are immutable
            required: [allocationID, revision, ownerHash, clientHash, bindingID, requestFingerprint, profile, profileDigest, image, storageClass, storageSize, resources, desired]
            properties:
              allocationID: {type: string, minLength: 1, maxLength: 63}
              revision: {type: string, minLength: 1, maxLength: 64}
              ownerHash: {type: string, pattern: "^[0-9a-f]{64}$"}
              clientHash: {type: string, pattern: "^[0-9a-f]{64}$"}
              bindingID: {type: string, minLength: 1, maxLength: 253}
              requestFingerprint: {type: string, pattern: "^[0-9a-f]{64}$"}
              profile: {type: string, minLength: 1, maxLength: 63}
              profileDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
              image: {type: string, pattern: "@sha256:[0-9a-fA-F]{64}$"}
              storageClass: {type: string, minLength: 1}
              storageSize: {type: string, minLength: 1}
              resources:
                type: object
                additionalProperties: false
                required: [cpuRequest, memoryRequest, cpuLimit, memoryLimit]
                properties:
                  cpuRequest: {type: string, minLength: 1}
                  memoryRequest: {type: string, minLength: 1}
                  cpuLimit: {type: string, minLength: 1}
                  memoryLimit: {type: string, minLength: 1}
              desired: {type: string, enum: [Active, Retiring]}
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              epoch: {type: integer, format: int64, minimum: 1}
              fenceState: {type: string, enum: [Healthy, FenceUnknown]}
              references:
                type: array
                maxItems: 64
                x-kubernetes-list-type: set
                items: {type: string, maxLength: 253}
              pvc:
                type: object
                properties:
                  name: {type: string}
                  uid: {type: string}
              pod:
                type: object
                properties:
                  name: {type: string}
                  uid: {type: string}
              activeOperation:
                type: object
                required: [id, operation, startedAt]
                properties:
                  id: {type: string}
                  operation: {type: string}
                  startedAt: {type: string, format: date-time}
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status, reason, message, observedGeneration, lastTransitionTime]
                  properties:
                    type: {type: string}
                    status: {type: string, enum: ["True", "False", Unknown]}
                    reason: {type: string}
                    message: {type: string, maxLength: 1024}
                    observedGeneration: {type: integer, format: int64}
                    lastTransitionTime: {type: string, format: date-time}
