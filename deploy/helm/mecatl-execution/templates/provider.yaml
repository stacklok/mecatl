apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mecatl-execution.fullname" . }}-profiles
data:
  profiles.yaml: |
    profiles:
{{ toYaml .Values.profiles | indent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecatl-execution.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "mecatl-execution.fullname" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "mecatl-execution.fullname" . }}}
    spec:
      serviceAccountName: {{ include "mecatl-execution.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: provider
        image: {{ required "provider.image must be digest-pinned" .Values.provider.image | quote }}
        imagePullPolicy: {{ .Values.provider.imagePullPolicy }}
        args:
        - --namespace={{ .Release.Namespace }}
        - --profiles=/etc/mecatl-execution/profiles.yaml
        - --tls-cert=/etc/mecatl-execution/tls/tls.crt
        - --tls-key=/etc/mecatl-execution/tls/tls.key
        - --client-ca=/etc/mecatl-execution/tls/ca.crt
        - --grant-signing-key=/etc/mecatl-execution/grant/key.pem
        - --grant-key-id={{ .Values.provider.grantKeyID }}
        - --client-uri-san={{ join "," .Values.provider.clientURISANs }}
        - --owner-attester-uri-san={{ join "," .Values.provider.ownerAttesterURISANs }}
        - --administrator-uri-san={{ join "," .Values.provider.administratorURISANs }}
        ports:
        - {name: grpc, containerPort: 8443}
        startupProbe:
          tcpSocket: {port: grpc}
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          tcpSocket: {port: grpc}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: grpc}
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - {name: profiles, mountPath: /etc/mecatl-execution/profiles.yaml, subPath: profiles.yaml, readOnly: true}
        - {name: tls, mountPath: /etc/mecatl-execution/tls, readOnly: true}
        - {name: grant, mountPath: /etc/mecatl-execution/grant, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: profiles
        configMap: {name: {{ include "mecatl-execution.fullname" . }}-profiles}
      - name: tls
        secret: {secretName: {{ required "provider.tlsSecretName is required" .Values.provider.tlsSecretName }}}
      - name: grant
        secret: {secretName: {{ required "provider.grantSigningSecretName is required" .Values.provider.grantSigningSecretName }}}
      - name: tmp
        emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mecatl-execution.fullname" . }}
spec:
  selector: {app.kubernetes.io/name: {{ include "mecatl-execution.fullname" . }}}
  ports:
  - {name: grpc, port: {{ .Values.service.port }}, targetPort: grpc}
