{{- $fullname := include "mecatl-execution.fullname" . }}
{{- $name := printf "%s-%s-provider-secrets" .Release.Namespace $fullname }}
{{- $provider := printf "system:serviceaccount:%s:%s" .Release.Namespace $fullname }}
# RBAC cannot scope Secret create or delete to generated names; this confines
# the provider to its own executor certificate Secrets.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "DELETE"]
      resources: ["secrets"]
  matchConditions:
  - name: provider-service-account
    expression: request.userInfo.username == {{ $provider | squote }}
  variables:
  - name: secret
    expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
  - expression: >-
      has(variables.secret.type) && variables.secret.type == 'kubernetes.io/tls' &&
      variables.secret.metadata.name.startsWith('executor-tls-') &&
      has(variables.secret.metadata.labels) &&
      'execution.mecatl.dev/executor-tls' in variables.secret.metadata.labels &&
      variables.secret.metadata.labels['execution.mecatl.dev/executor-tls'] == 'true'
    message: the execution provider may only create or delete executor certificate Secrets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
