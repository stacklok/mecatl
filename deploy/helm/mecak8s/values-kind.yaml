# Disposable Kind/offline qualification only. This is the sole profile allowed
# to use a loaded ko.local image and an in-chart plaintext Redis fixture.
image:
  repository: ko.local/mecak8s
  digest: ""
  tag: dev
  pullPolicy: IfNotPresent

mockProvider: true

redis:
  endpoint: redis:6379
  credentialsSecret: ""
  local:
    enabled: true

oidc:
  enabled: true
  issuer: https://dex.mecatl-vmcp.svc.cluster.local:5556
  audience: mecatui-kind
  allowPrivateHTTPSIssuer: true
  caSecret: dex-fixture-ca
  caKey: tls.crt

service:
  type: NodePort
  grpcPort: 8080
  httpPort: 8081
  nodePorts:
    grpc: 30081

tls:
  enabled: true
  secretName: mecak8s-tls
  certKey: tls.crt
  keyKey: tls.key
