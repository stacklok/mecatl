{{- include "mecak8s.validateImage" . -}}
{{- include "mecak8s.validateRedis" . -}}
{{- include "mecak8s.validateOIDC" . -}}
{{- include "mecak8s.validateTLS" . -}}
{{- include "mecak8s.validateLearningStore" . -}}
{{- include "mecak8s.validateProviderSecurity" . -}}
{{- $learningStoreEnabled := ne .Values.learning.store.endpoint "" -}}
{{- $learningStoreTokenConfigured := and .Values.learning.store.tokenSecret .Values.learning.store.tokenKey -}}
{{- include "mecak8s.validateMCP" . -}}
{{- $mcpOAuth := false -}}
{{- range .Values.mcp.servers -}}{{- if eq .auth.mode "oauth" -}}{{- $mcpOAuth = true -}}{{- end -}}{{- end -}}
{{- $mcpSettings := or $mcpOAuth (not .Values.mcp.servers) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecak8s.fullname" . }}
  labels: {{- include "mecak8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $mcpOAuth }}
    # Broker mode: session/grant/authorization state is process-local. A surge
    # rollout (the RollingUpdate default) would briefly run a second, empty
    # broker incarnation alongside the old one before it drains, which can
    # receive traffic bound to the old pod's in-flight state. Recreate retires
    # the old pod completely before starting the new one — a real downtime
    # window, but the only correct choice until broker state is shared.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
    {{- end }}
  selector:
    matchLabels: {{- include "mecak8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mecak8s.selectorLabels" . | nindent 8 }}
      {{- $chartAnnotations := dict }}
      {{- if and (not .Values.mockProvider) .Values.security.allowUnsafeRealProvider }}
      {{- $_ := set $chartAnnotations "mecatl.stacklok.com/unsafe-real-provider" "true" }}
      {{- end }}
      {{- if and (not .Values.mockProvider) (not .Values.security.allowUnsafeRealProvider) .Values.security.tlsTerminatedUpstream }}
      {{- $_ := set $chartAnnotations "mecatl.stacklok.com/tls-terminated-upstream" "true" }}
      {{- end }}
      {{- if .Values.telemetry.installationID }}
      {{- $_ := set $chartAnnotations "checksum/telemetry-installation-id" (.Values.telemetry.installationID | sha256sum) }}
      {{- end }}
      {{- if $mcpSettings }}
      {{- $_ := set $chartAnnotations "checksum/mcp-profile" (include "mecak8s.mcpOAuthSettings" . | sha256sum) }}
      {{- end }}
      {{- $userAnnotations := omit (deepCopy .Values.podAnnotations) "mecatl.stacklok.com/unsafe-real-provider" "mecatl.stacklok.com/tls-terminated-upstream" "checksum/mcp-profile" "checksum/telemetry-installation-id" }}
      {{- if or $userAnnotations $chartAnnotations }}
      annotations:
        {{- with $userAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $chartAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      annotations: {}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mecak8s.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        {{- $constraint := deepCopy . }}
        {{- if not (hasKey $constraint "labelSelector") }}
        {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (include "mecak8s.selectorLabels" $ | fromYaml)) }}
        {{- end }}
        - {{ toYaml $constraint | nindent 10 | trim }}
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ default (printf "v%s" .Chart.Version) .Values.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --grpc-addr=0.0.0.0:8080
            - --http-addr=0.0.0.0:8081
            - --drain-addr=0.0.0.0:8082
            - {{ printf "--redis-url=%s" .Values.redis.endpoint | quote }}
            - {{ printf "--redis-follow-pool-size=%d" (int64 .Values.redis.follow.poolSize) | quote }}
            - {{ printf "--redis-max-followers=%d" (int64 .Values.redis.follow.maxFollowers) | quote }}
            {{- if .Values.redis.filesystem.enabled }}
            - --redis-filesystem
            {{- end }}
            {{- if .Values.redis.readLedger.enabled }}
            - --redis-read-ledger
            {{- end }}
            - {{ printf "--session-lease-k8s-namespace=%s" .Release.Namespace | quote }}
            - --headless=true
            - --posture=auto
            {{- if .Values.logging.level }}
            - {{ printf "--log-level=%s" .Values.logging.level | quote }}
            {{- end }}
            {{- if .Values.defaultProvider }}
            - {{ printf "--default-provider=%s" .Values.defaultProvider | quote }}
            {{- end }}
            {{- if .Values.model }}
            - {{ printf "--model=%s" .Values.model | quote }}
            {{- end }}
            {{- if ne .Values.maxRunTokens nil }}
            - {{ printf "--max-run-tokens=%v" .Values.maxRunTokens | quote }}
            {{- end }}
            {{- if ne .Values.maxTeamTokens nil }}
            - {{ printf "--max-team-tokens=%v" .Values.maxTeamTokens | quote }}
            {{- end }}
            {{- if .Values.workspace }}
            - {{ printf "--workspace=%s" .Values.workspace | quote }}
            {{- end }}
            {{- if .Values.mockProvider }}
            - --mock
            {{- end }}
            {{- if .Values.redis.local.enabled }}
            - --redis-allow-plaintext
            {{- else }}
            {{- if .Values.redis.usernameKey }}
            - {{ printf "--redis-username-file=/var/run/secrets/redis/%s" .Values.redis.usernameKey | quote }}
            {{- end }}
            {{- if .Values.redis.passwordKey }}
            - {{ printf "--redis-password-file=/var/run/secrets/redis/%s" .Values.redis.passwordKey | quote }}
            {{- end }}
            {{- if .Values.redis.caKey }}
            - {{ printf "--redis-tls-ca=/var/run/secrets/redis/%s" .Values.redis.caKey | quote }}
            {{- else }}
            - --redis-tls
            {{- end }}
            {{- end }}
            {{- if $learningStoreEnabled }}
            - {{ printf "--learning-store-url=%s" .Values.learning.store.endpoint | quote }}
            {{- if .Values.learning.store.tls.enabled }}
            - --driver-tls
            {{- end }}
            {{- if .Values.learning.store.tls.caSecret }}
            - {{ printf "--driver-tls-ca=/var/run/secrets/learning-store-ca/%s" .Values.learning.store.tls.caKey | quote }}
            {{- end }}
            {{- if .Values.learning.store.tls.mtlsSecret }}
            - {{ printf "--driver-tls-cert=/var/run/secrets/learning-store-mtls/%s" .Values.learning.store.tls.certKey | quote }}
            - {{ printf "--driver-tls-key=/var/run/secrets/learning-store-mtls/%s" .Values.learning.store.tls.keyKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - {{ printf "--oidc-issuer=%s" .Values.oidc.issuer | quote }}
            - {{ printf "--oidc-audience=%s" .Values.oidc.audience | quote }}
            {{- if .Values.oidc.jwksURI }}
            - {{ printf "--oidc-jwks-uri=%s" .Values.oidc.jwksURI | quote }}
            {{- end }}
            {{- if .Values.oidc.caSecret }}
            - {{ printf "--oidc-ca-cert-file=/var/run/secrets/oidc-ca/%s" .Values.oidc.caKey | quote }}
            {{- end }}
            {{- if .Values.oidc.allowPrivateHTTPSIssuer }}
            - --oidc-allow-private-https-issuer
            {{- end }}
            - {{ printf "--oidc-max-jwks-staleness=%s" .Values.oidc.maxJWKSStaleness | quote }}
            {{- if .Values.oidc.resource }}
            - {{ printf "--oidc-resource=%s" .Values.oidc.resource | quote }}
            - {{ printf "--oidc-client-id=%s" .Values.oidc.clientID | quote }}
            {{- if .Values.oidc.scopes }}
            - {{ printf "--oidc-scopes=%s" (join "," .Values.oidc.scopes) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - {{ printf "--tls-cert=/var/run/secrets/tls/%s" .Values.tls.certKey | quote }}
            - {{ printf "--tls-key=/var/run/secrets/tls/%s" .Values.tls.keyKey | quote }}
            {{- end }}
            {{- if .Values.skills.autoDiscover }}
            - --skills-conventional=true
            {{- end }}
            {{- range $server := .Values.mcp.servers }}
            {{- if and (ne $server.auth.mode "oauth") (not (and $mcpOAuth (eq $server.auth.mode "none"))) }}
            - {{ printf "--mcp-server=%s=%s" $server.name $server.url | quote }}
            {{- end }}
            {{- if $server.insecureHTTP }}
            - {{ printf "--mcp-server-insecure-http=%s" $server.name | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $mcpSettings }}
            - --permission-config=/etc/mecatl-mcp/settings.yaml
            {{- end }}
          env:
            - name: MECATL_INSTALLATION_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mecak8s.telemetryConfigMapName" . }}
                  key: installation-id
            {{- if $learningStoreTokenConfigured }}
            - name: MECATL_DRIVER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.learning.store.tokenSecret | quote }}
                  key: {{ .Values.learning.store.tokenKey | quote }}
            {{- end }}
            {{- range $server := .Values.mcp.servers }}
            {{- if eq $server.auth.mode "staticBearer" }}
            - name: {{ printf "MCP_%s_TOKEN" (upper $server.name) }}
              valueFrom:
                secretKeyRef: {{- toYaml $server.auth.staticBearer.secretKeyRef | nindent 18 }}
            {{- else if eq $server.auth.mode "oauth" }}
            {{- if eq $server.auth.oauth.client.mode "preregistered" }}
            - name: {{ printf "MECATL_MCP_%s_CLIENT_SECRET" (upper $server.name) }}
              valueFrom:
                secretKeyRef: {{- toYaml $server.auth.oauth.client.preregistered.secretKeyRef | nindent 18 }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: grpc, containerPort: 8080}
            - {name: http, containerPort: 8081}
            - {name: drain, containerPort: 8082}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          startupProbe:
            httpGet:
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              path: /healthz
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              httpGet:
                scheme: HTTP
                path: /drain
                port: drain
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if include "mecak8s.redisSecretMounted" . }}
            - {name: redis-credentials, mountPath: /var/run/secrets/redis, readOnly: true}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /var/run/secrets/tls, readOnly: true}
            {{- end }}
            {{- if .Values.oidc.caSecret }}
            - {name: oidc-ca, mountPath: /var/run/secrets/oidc-ca, readOnly: true}
            {{- end }}
            {{- if .Values.learning.store.tls.caSecret }}
            - {name: learning-store-ca, mountPath: /var/run/secrets/learning-store-ca, readOnly: true}
            {{- end }}
            {{- if .Values.learning.store.tls.mtlsSecret }}
            - {name: learning-store-mtls, mountPath: /var/run/secrets/learning-store-mtls, readOnly: true}
            {{- end }}
            {{- if $mcpSettings }}
            - {name: mcp-profile, mountPath: /etc/mecatl-mcp, readOnly: true}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if include "mecak8s.redisSecretMounted" . }}
        - name: redis-credentials
          secret:
            secretName: {{ .Values.redis.credentialsSecret }}
            defaultMode: 0440
            items:
              {{- if .Values.redis.caKey }}
              - {key: {{ .Values.redis.caKey | quote }}, path: {{ .Values.redis.caKey | quote }}}
              {{- end }}
              {{- if .Values.redis.passwordKey }}
              - {key: {{ .Values.redis.passwordKey | quote }}, path: {{ .Values.redis.passwordKey | quote }}}
              {{- end }}
              {{- if .Values.redis.usernameKey }}
              - {key: {{ .Values.redis.usernameKey | quote }}, path: {{ .Values.redis.usernameKey | quote }}}
              {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.tls.certKey | quote }}, path: {{ .Values.tls.certKey | quote }}}
              - {key: {{ .Values.tls.keyKey | quote }}, path: {{ .Values.tls.keyKey | quote }}}
        {{- end }}
        {{- if .Values.oidc.caSecret }}
        - name: oidc-ca
          secret:
            secretName: {{ .Values.oidc.caSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.oidc.caKey | quote }}, path: {{ .Values.oidc.caKey | quote }}}
        {{- end }}
        {{- if .Values.learning.store.tls.caSecret }}
        - name: learning-store-ca
          secret:
            secretName: {{ .Values.learning.store.tls.caSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.learning.store.tls.caKey | quote }}, path: {{ .Values.learning.store.tls.caKey | quote }}}
        {{- end }}
        {{- if .Values.learning.store.tls.mtlsSecret }}
        - name: learning-store-mtls
          secret:
            secretName: {{ .Values.learning.store.tls.mtlsSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.learning.store.tls.certKey | quote }}, path: {{ .Values.learning.store.tls.certKey | quote }}}
              - {key: {{ .Values.learning.store.tls.keyKey | quote }}, path: {{ .Values.learning.store.tls.keyKey | quote }}}
        {{- end }}
        {{- if $mcpSettings }}
        - name: mcp-profile
          configMap:
            name: {{ include "mecak8s.fullname" . }}-mcp
            defaultMode: 0444
            items:
              - {key: settings.yaml, path: settings.yaml}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
