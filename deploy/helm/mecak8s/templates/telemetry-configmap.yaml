{{- $name := include "mecak8s.telemetryConfigMapName" . -}}
{{- $installationID := .Values.telemetry.installationID -}}
{{- if not $installationID -}}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $name -}}
{{- if and $existing $existing.data (hasKey $existing.data "installation-id") -}}
{{- $installationID = index $existing.data "installation-id" -}}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $installationID) -}}
{{- fail (printf "existing telemetry ConfigMap %q has an invalid installation-id; set telemetry.installationID to a canonical lowercase UUID to repair it" $name) -}}
{{- end -}}
{{- else -}}
{{- $installationID = uuidv4 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "mecak8s.labels" . | nindent 4 }}
data:
  installation-id: {{ $installationID | quote }}
