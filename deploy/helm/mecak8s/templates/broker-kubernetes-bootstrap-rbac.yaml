apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mecak8s.brokerBootstrapRBACName" . }}
  labels: {{- include "mecak8s.brokerLabels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/.well-known/openid-configuration", "/openid/v1/jwks"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mecak8s.brokerBootstrapRBACName" . }}
  labels: {{- include "mecak8s.brokerLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mecak8s.brokerFullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mecak8s.brokerBootstrapRBACName" . }}
