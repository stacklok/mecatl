{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mecak8s.brokerFullname" . }}
  labels: {{- include "mecak8s.brokerLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mecak8s.brokerLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "mecak8s.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: public}]
    {{- with .Values.networkPolicy.publicFrom }}
    - from: {{- toYaml . | nindent 8 }}
      ports: [{protocol: TCP, port: public}]
    {{- end }}
{{- end }}
