{{- if and .Values.broker.credentialStore.managedRedis.enabled (gt (int (include "mecak8s.brokerOAuthCount" .)) 0) }}
{{- $cs := .Values.broker.credentialStore }}
{{- $name := include "mecak8s.credentialRedisFullname" . }}
# Chart-managed singleton Redis for encrypted broker credential custody. It is
# durable (AOF everysec on a retained PVC) but not HA and not zero-loss.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "mecak8s.credentialRedisLabels" . | nindent 4 }}
spec:
  # One headless Service is the StatefulSet governing Service and the broker's
  # address/SNI; the TLS certificate SAN must contain <name>.<namespace>.svc.
  clusterIP: None
  selector: {{- include "mecak8s.credentialRedisLabels" . | nindent 4 }}
  ports:
    - {name: redis-tls, port: 6379, targetPort: redis-tls}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "mecak8s.credentialRedisLabels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels: {{- include "mecak8s.credentialRedisLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mecak8s.credentialRedisLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ $cs.managedRedis.image.repository }}@{{ $cs.managedRedis.image.digest }}
          command: ["redis-server"]
          args:
            - "--port"
            - "0"
            - "--tls-port"
            - "6379"
            - "--tls-cert-file"
            - "/var/run/mecabroker-redis/tls/tls.crt"
            - "--tls-key-file"
            - "/var/run/mecabroker-redis/tls/tls.key"
            - "--tls-ca-cert-file"
            - "/var/run/mecabroker-redis/tls/ca.crt"
            - "--tls-auth-clients"
            - "no"
            - "--aclfile"
            - "/var/run/mecabroker-redis/acl/users.acl"
            - "--save"
            - ""
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
            - "--maxmemory"
            - "384mb"
            - "--maxmemory-policy"
            - "noeviction"
            - "--dir"
            - "/data"
          ports:
            - {name: redis-tls, containerPort: 6379}
          # TCP probes prove only socket availability; the broker performs the
          # authenticated TLS/ACL checks at startup, readiness, and every operation.
          startupProbe:
            tcpSocket: {port: redis-tls}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: redis-tls}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis-tls}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /var/run/mecabroker-redis/tls, readOnly: true}
            - {name: acl, mountPath: /var/run/mecabroker-redis/acl, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: {{ $cs.managedRedis.tlsSecret | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
        - name: acl
          secret:
            secretName: {{ $cs.managedRedis.aclSecret | quote }}
            defaultMode: 0440
            items:
              - {key: users.acl, path: users.acl}
  # Kubernetes' default StatefulSet PVC behaviour retains the claim on deletion
  # and scale-down; deleting it (and any backup) is operator-owned.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $cs.managedRedis.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $cs.managedRedis.persistence.size }}
---
# Only this release's broker may reach managed credential Redis, and only on TLS 6379.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "mecak8s.credentialRedisLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mecak8s.credentialRedisLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "mecak8s.brokerLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 6379}
{{- end }}
