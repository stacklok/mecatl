suite: Secret reference contracts
templates:
  - templates/deployment.yaml
release:
  name: unit
  namespace: test
set:
  redis.endpoint: redis.example.internal:6379
  redis.credentialsSecret: redis-credentials
  redis.caKey: redis-ca.crt
  redis.passwordKey: password
  redis.usernameKey: username
  mockProvider: true
  oidc.enabled: true
  oidc.issuer: https://idp.example.com
  oidc.audience: mecatl
  oidc.allowPrivateHTTPSIssuer: true
  oidc.caSecret: oidc-ca
  oidc.caKey: issuer-ca.crt
  tls.enabled: true
  tls.secretName: serving-tls
  tls.certKey: server.crt
  tls.keyKey: server.key
tests:
  - it: projects Redis TLS and OIDC Secret keys read-only
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "redis-credentials")].secret.secretName
          value: redis-credentials
      - equal:
          path: spec.template.spec.volumes[?(@.name == "redis-credentials")].secret.defaultMode
          value: 288
      - equal:
          path: spec.template.spec.volumes[?(@.name == "tls")].secret.secretName
          value: serving-tls
      - equal:
          path: spec.template.spec.volumes[?(@.name == "tls")].secret.items
          value:
            - key: server.crt
              path: server.crt
            - key: server.key
              path: server.key
      - equal:
          path: spec.template.spec.volumes[?(@.name == "oidc-ca")].secret.secretName
          value: oidc-ca
      - equal:
          path: spec.template.spec.volumes[?(@.name == "oidc-ca")].secret.items[0]
          value:
            key: issuer-ca.crt
            path: issuer-ca.crt
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "redis-credentials")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "tls")].readOnly
          value: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "oidc-ca")].readOnly
          value: true

  - it: projects a provider credential by Secret reference
    set:
      extraEnv:
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: provider-credentials
              key: api-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OPENROUTER_API_KEY")]
          value:
            name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: provider-credentials
                key: api-key

  - it: projects an MCP bearer by Secret reference
    set:
      mcp:
        broker:
          callbackURL: ""
        servers:
          - name: github
            url: https://mcp.example.com/mcp
            auth:
              mode: staticBearer
              staticBearer:
                secretKeyRef:
                  name: mcp-credentials
                  key: bearer
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "MCP_GITHUB_TOKEN")]
          value:
            name: MCP_GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: mcp-credentials
                key: bearer
