# What an upgrade with `helm upgrade --reuse-values` leaves a broker release
# that names only the agent issuer key: the previous release's values plus the
# overrides on the command line, with none of the newer chart's defaults. The
# nulls remove the brokerClient, as1Signing, fallbacks, and settings defaults
# the same way.
identityBroker:
  enabled: true
  trustDomain: agents.example.com
  audience: https://broker.example.com
  keys:
    agentIssuer:
      secretName: ib-agent
      key: key.pem
      fallbacks: null
    brokerClient: null
    as1Signing: null
  settings: null
