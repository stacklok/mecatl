suite: identity broker values kept from an earlier release
templates:
  - templates/deployment.yaml
release:
  name: unit
  namespace: test
values:
  - fixtures/identity-broker-previous-values.yaml
set:
  guardrails.fromSettings: true
  redis.endpoint: redis.example.internal:6379
  redis.credentialsSecret: redis-credentials
  mockProvider: true
tests:
  - it: renders a broker-disabled release without trustDomain, audience, or keys
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enable-identity-broker
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "identity-broker-keys")]

  - it: still requires them once the broker is enabled
    set:
      identityBroker.enabled: true
      replicaCount: 1
      extraArgs: [--no-shell]
    asserts:
      - failedTemplate:
          errorPattern: "missing properties 'trustDomain', 'audience', 'keys'|identityBroker: trustDomain is required"
