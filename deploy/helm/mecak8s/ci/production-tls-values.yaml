# task deploy:check fixture: server TLS from an operator-created Secret. The mock
# provider isolates the TLS rendering contract; production real-provider posture
# is covered by production-values.yaml. Helm and kubeconform validate the
# reference only; the Secret is not rendered or looked up by the chart.
image:
  tag: v0.0.0
mockProvider: true
# The mock provider has no guardrails checker, and auto refuses to start
# without one.
permissionMode: yolo
redis:
  endpoint: redis.example.internal:6379
  credentialsSecret: redis-credentials
tls:
  enabled: true
  secretName: mecak8s-tls
