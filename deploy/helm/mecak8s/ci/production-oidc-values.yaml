# task deploy:check fixture: a second secure real-provider profile using system
# trust for Redis and the minimum in-pod TLS + OIDC controls.
image:
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  tag: ""
defaultProvider: openrouter
model: anthropic/claude-sonnet-4-6
extraEnv:
  # The chart references this operator-provisioned Secret; it never creates it.
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: provider-credentials
        key: openrouter-api-key
redis:
  endpoint: redis.example.internal:6379
  caKey: ""
oidc:
  enabled: true
  issuer: https://idp.example.com
  audience: mecatl
tls:
  enabled: true
  secretName: mecak8s-tls
