# task deploy:check production fixture: real provider, caller identity, encrypted
# server transport, finite spend ceilings, verified external Redis, and hostname
# spreading. Placeholder references are schema/render inputs only.
image:
  tag: v0.0.0
mockProvider: false
defaultProvider: openrouter
model: anthropic/claude-sonnet-4-6
maxRunTokens: 200000
maxTeamTokens: 800000
redis:
  endpoint: redis.example.internal:6379
  credentialsSecret: redis-credentials
oidc:
  enabled: true
  issuer: https://idp.example.com
  audience: mecatl
tls:
  enabled: true
  secretName: mecak8s-tls
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
extraEnv:
  # The chart references this operator-provisioned Secret; it never creates it.
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: provider-credentials
        key: openrouter-api-key
