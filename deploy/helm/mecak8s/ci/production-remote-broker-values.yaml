# task deploy:check fixture: remote singleton broker client with projected token.
image:
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  tag: ""
mockProvider: false
defaultProvider: openrouter
model: anthropic/claude-sonnet-4-6
redis:
  endpoint: redis.example.internal:6379
  credentialsSecret: redis-credentials
oidc:
  enabled: true
  issuer: https://idp.example.com
  audience: mecatl
tls:
  enabled: true
  secretName: mecak8s-tls
remoteBroker:
  address: mecabroker.mecatl.svc:8443
  caSecret: mecabroker-ca
  caKey: ca.pem
  serverName: mecabroker.mecatl.svc
  tokenAudience: mecabroker
  tokenLifetimeSeconds: 600
extraEnv:
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: provider-credentials
        key: openrouter-api-key
