# Deployment for mecated, the mecatl server.
#
# The image field is the ko placeholder `ko://<import-path>`; `ko resolve`
# (or `ko apply`) replaces it with the built+pushed image ref. The Pod follows
# the Pod Security Standards "restricted" profile in full.
#
# SECURITY: the mecated API is UNAUTHENTICATED — it exposes command/file execution
# with no caller identity check. Inside the pod we bind 0.0.0.0 (the pod netns is
# isolated); reachability is gated entirely by the Service and (recommended) a
# NetworkPolicy. Deploy only inside a trusted network / behind external auth.
# See deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecated
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/component: mecated
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mecatl
      app.kubernetes.io/component: mecated
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mecatl
        app.kubernetes.io/component: mecated
    spec:
      # Pod-level securityContext. UID/GID 65532 matches the nonroot user baked
      # into the chainguard static base image (.ko.yaml). fsGroup makes any
      # mounted Secret readable by the process.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # mecated does not talk to the Kubernetes API, so it has no need for a
      # mounted ServiceAccount token. Disabling automount removes a blast-radius
      # amplifier if the (unauthenticated) workload is ever compromised.
      automountServiceAccountToken: false
      containers:
        - name: mecated
          # ko substitutes this placeholder with the built image ref on
          # `ko resolve` / `ko apply`.
          image: ko://github.com/stacklok/mecatl/cmd/mecated
          args:
            # The network daemon runs under the canonical `serve` command word.
            - serve
            # Bind 0.0.0.0 inside the pod (the in-code default is loopback).
            - --grpc-addr=0.0.0.0:8080
            - --http-addr=0.0.0.0:8081
            # Use the real OpenAI Responses provider; key comes from the Secret.
            - --openai
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mecated-openai
                  key: OPENAI_API_KEY
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          # Container-level securityContext: PSS "restricted" in full.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # HTTP health endpoints are mounted OUTSIDE the auth boundary, so
          # these probes work regardless of --auth-token. /readyz gates Service
          # traffic; /healthz detects a hung process. Both hit the `http` port.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem: true means the only writable path must be
            # an explicit volume. The Go runtime, the OpenAI client, and SSE
            # buffering all need scratch space under /tmp. sizeLimit caps a
            # runaway write so it can't fill the node's ephemeral storage.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
