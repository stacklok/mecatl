version: '3'

# Disposable, operator-run mecak8s Kind baseline. It intentionally owns only
# Kind, the local chart/image, and in-chart local Redis.
vars:
  CLUSTER: mecatl-dev
  CONTEXT: kind-mecatl-dev
  NAMESPACE: mecatl
  RELEASE: mecak8s
  STATE: .scratch/kind/mecatl-dev
  KUBECONFIG: deploy/mecak8s-kind/kconfig.yaml
  SETUP_LOCK: .scratch/kind/mecatl-dev.setup-lock
  BROKER_IMAGE: ko.local/mecabroker:dev
  PROVIDER_SECRET: mecak8s-openrouter

tasks:
  kind-setup:
    desc: Recreate the local mecak8s Kind baseline with local Redis
    cmds:
      - task: reset-state
      - task: cluster-create
      - task: namespace-apply
      - task: image-build-load
      - task: broker-tls-apply
      - task: chart-apply

  kind-keycloak-apply:
    desc: Idempotently apply the optional Keycloak, certificate, and OIDC/TLS layer
    cmds:
      - task: cert-manager-install
      - task: certificate-apply
      - task: keycloak-apply
      - task: chart-keycloak-apply

  kind-keycloak-setup:
    desc: Recreate the Kind baseline then apply its optional Keycloak identity layer
    cmds:
      - task: kind-setup
      - task: kind-keycloak-apply

  # kind-fixture-ca-refresh waits for the three direct loopback mappings and
  # (re)writes .scratch/kind/mecatl-dev/fixture-ca.crt from the cluster's
  # CURRENT fixture-ca Secret. cert-manager mints a fresh self-signed CA on
  # every kind-destroy + recreate, so this file goes silently stale across a
  # teardown/recreate cycle unless re-run — a stale CA fails TLS verification
  # against the new cluster and surfaces as mecatui's generic
  # "clientauth: OIDC discovery rejected", with no hint that the cause is a
  # rotated CA rather than a real server-side rejection. kind-login and
  # kind-connect below always refresh it first, so that whole failure class
  # can't occur through them.
  kind-fixture-ca-refresh:
    internal: true
    preconditions:
      - sh: command -v nc >/dev/null 2>&1
        msg: nc is required to wait for the loopback mappings
    cmds:
      - task: cluster-ready
      - cmd: |
          # Delegated to a real bash subprocess, not run inline under Task's
          # embedded shell interpreter (mvdan.cc/sh), whose `trap` builtin
          # rejects any signal name but EXIT outright.
          bash <<'BASHEOF'
          set -eu
          state={{.STATE}}
          ca="$state/fixture-ca.crt"
          encoded="$state/fixture-ca.b64.$$"
          decoded="$ca.tmp.$$"
          mkdir -p "$state"
          trap 'rm -f "$encoded" "$decoded"' EXIT

          wait_port() {
            name=$1
            port=$2
            attempt=0
            while [ "$attempt" -lt 30 ]; do
              if nc -z 127.0.0.1 "$port"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
            echo "$name direct loopback mapping did not accept connections" >&2
            return 1
          }

          wait_port Keycloak 8443
          wait_port mecak8s-gRPC 18080
          wait_port mecak8s-HTTPS 18081
          kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} get secret fixture-ca -o jsonpath='{.data.tls\.crt}' >"$encoded"
          # A positional filename argument is GNU-only; BSD/macOS base64
          # rejects it ("invalid argument") unless given via -i or stdin.
          # Piping through stdin is accepted by both implementations.
          if base64 -d <"$encoded" >"$decoded" 2>/dev/null; then
            :
          elif base64 -D <"$encoded" >"$decoded" 2>/dev/null; then
            :
          else
            echo "failed to decode fixture CA" >&2
            exit 1
          fi
          chmod 0600 "$decoded"
          mv -f "$decoded" "$ca"
          BASHEOF

  kind-keycloak-demo:
    desc: Wait for direct loopback mappings and print the remote OIDC quickstart (requires kind-keycloak-setup and kind-hosts-add)
    cmds:
      - task: kind-fixture-ca-refresh
      - cmd: |
          set -eu
          ca={{.STATE}}/fixture-ca.crt
          printf '\nFixture direct mappings are ready. In another terminal, run:\n\n'
          # NOT localhost:18080 -- mecatui's client treats a "localhost"-named
          # target as co-located and defaults its workspace field to the
          # CALLER's own cwd; this deployment sets --workspace and rejects
          # any client-supplied value, so that combination fails with
          # codes.InvalidArgument. The DNS alias below is not cosmetic.
          printf '%s\n' "mecatui login mecak8s-mecak8s.mecatl.svc.cluster.local:18080 --issuer https://keycloak.mecatl.svc.cluster.local:8443/realms/mecatl --client-id mecatui-kind --audience mecak8s --tls-ca $ca --private-issuer --scopes openid,profile,mecak8s:access,offline_access"
          printf '%s\n' "mecatui connect mecak8s-mecak8s.mecatl.svc.cluster.local:18080 --tls --tls-ca $ca"
          printf '\nOr just run: task mecak8s:kind-login && task mecak8s:kind-connect\n'
          printf '\nThe CA is at %s. Kind maps container NodePorts directly to loopback host ports; this task exits after readiness checks.\n' "$ca"

  kind-login:
    desc: >-
      Shorthand for the Keycloak login journey: add the /etc/hosts aliases
      (may prompt for sudo once), refresh the fixture CA, and run `mecatui
      login` with this fixture's fixed issuer/client/audience/scopes.
      Requires kind-keycloak-setup and ./bin/mecatui (task build).
    preconditions:
      - sh: test -x ./bin/mecatui
        msg: ./bin/mecatui not found — run `task build` first
    cmds:
      - task: kind-hosts-add
      - task: kind-fixture-ca-refresh
      - ./bin/mecatui login mecak8s-mecak8s.mecatl.svc.cluster.local:18080 --issuer https://keycloak.mecatl.svc.cluster.local:8443/realms/mecatl --client-id mecatui-kind --audience mecak8s --tls-ca {{.STATE}}/fixture-ca.crt --private-issuer --scopes openid,profile,mecak8s:access,offline_access

  kind-connect:
    desc: >-
      Shorthand to connect: add the /etc/hosts aliases (may prompt for sudo
      once), refresh the fixture CA, and run `mecatui connect`. Run
      kind-login first (or have a still-valid stored token).
    preconditions:
      - sh: test -x ./bin/mecatui
        msg: ./bin/mecatui not found — run `task build` first
    cmds:
      - task: kind-hosts-add
      - task: kind-fixture-ca-refresh
      - ./bin/mecatui connect mecak8s-mecak8s.mecatl.svc.cluster.local:18080 --tls --tls-ca {{.STATE}}/fixture-ca.crt

  kind-status:
    desc: Show the local mecak8s Kind baseline
    cmds:
      - task: cluster-ready
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} get pods,services,statefulsets -n {{.NAMESPACE}}
      - helm status {{.RELEASE}} --namespace={{.NAMESPACE}} --kubeconfig={{.KUBECONFIG}} --kube-context={{.CONTEXT}}

  kind-hosts-show:
    desc: Show the temporary loopback aliases required for the issuer and mecak8s target
    cmds:
      - cmd: |
          printf '%s\n' '127.0.0.1 keycloak.mecatl.svc.cluster.local'
          printf '%s\n' '127.0.0.1 mecak8s-mecak8s.mecatl.svc.cluster.local'

  kind-hosts-add:
    desc: Add the temporary Keycloak issuer and mecak8s target aliases to /etc/hosts (loopback only)
    cmds:
      - cmd: |
          set -eu
          # Both entries are needed, not only Keycloak's. mecatui's client treats
          # a "localhost"-named target as co-located and defaults its workspace
          # field to the CALLER's own cwd (IsLoopbackHost); this deployment sets
          # --workspace and rejects any client-supplied value, so a mecatui
          # login/connect run against plain `localhost` fails with
          # codes.InvalidArgument. A DNS name is never treated as loopback by
          # that check, so the mecak8s alias below -- resolving to the SAME
          # 127.0.0.1 the Kind mapping already exposes -- is the fix, not a
          # cosmetic alternative to `localhost`.
          for entry in \
            '127.0.0.1 keycloak.mecatl.svc.cluster.local' \
            '127.0.0.1 mecak8s-mecak8s.mecatl.svc.cluster.local'; do
            sudo sh -c 'grep -Fqx "$1" /etc/hosts || printf "%s\\n" "$1" >> /etc/hosts' sh "$entry"
          done
          echo 'Added (or already present):'
          task mecak8s:kind-hosts-show

  kind-hosts-remove:
    desc: Remove only the temporary Keycloak issuer and mecak8s target aliases from /etc/hosts
    cmds:
      - cmd: |
          set -eu
          sudo sed -i.bak \
            -e '\|^127\.0\.0\.1 keycloak\.mecatl\.svc\.cluster\.local$|d' \
            -e '\|^127\.0\.0\.1 mecak8s-mecak8s\.mecatl\.svc\.cluster\.local$|d' \
            /etc/hosts
          echo 'Removed exact temporary entries (backup: /etc/hosts.bak).'

  kind-destroy:
    desc: Delete the named Kind baseline and its local state
    cmds:
      - kind delete cluster --name={{.CLUSTER}}
      - rm -rf {{.STATE}}
      - rm -f {{.KUBECONFIG}} {{.SETUP_LOCK}}

  reset-state:
    internal: true
    preconditions:
      - sh: command -v kind >/dev/null 2>&1
        msg: kind is required
    cmds:
      - cmd: |
          set -eu
          kind delete cluster --name={{.CLUSTER}} 2>/dev/null || true
          rm -rf {{.STATE}}
          rm -f {{.KUBECONFIG}} {{.SETUP_LOCK}}
          mkdir -p .scratch/kind deploy/mecak8s-kind
          : > {{.SETUP_LOCK}}

  cluster-ready:
    internal: true
    preconditions:
      - sh: command -v kind >/dev/null 2>&1
        msg: kind is required
      - sh: command -v kubectl >/dev/null 2>&1
        msg: kubectl is required
    cmds:
      - cmd: |
          set -eu
          kind get clusters 2>/dev/null | grep -Fxq '{{.CLUSTER}}' || { echo "cluster {{.CLUSTER}} not found"; exit 1; }
          [ -f {{.KUBECONFIG}} ] || { echo "kubeconfig {{.KUBECONFIG}} not found"; exit 1; }
          [ "$(kubectl --kubeconfig={{.KUBECONFIG}} config current-context)" = '{{.CONTEXT}}' ] || { echo "kubeconfig context mismatch"; exit 1; }

  cluster-create:
    internal: true
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: kubectl is required
    cmds:
      - cmd: |
          set -eu
          trap 'status=$?; deploy/mecak8s-kind/cleanup-on-failure.sh "$status"' EXIT
          mkdir -p {{.STATE}}
          chmod 0700 {{.STATE}}
          kind create cluster --name={{.CLUSTER}} --config=deploy/mecak8s-kind/kind-config.yaml
          kubeconfig={{.STATE}}/kconfig.yaml
          kind get kubeconfig --name={{.CLUSTER}} > "$kubeconfig"
          chmod 0600 "$kubeconfig"
          mv -f "$kubeconfig" {{.KUBECONFIG}}

  namespace-apply:
    internal: true
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: kubectl is required
    cmds:
      - task: cluster-ready
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} apply -f -
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} label namespace {{.NAMESPACE}} pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/audit=restricted pod-security.kubernetes.io/warn=restricted --overwrite

  image-build-load:
    internal: true
    preconditions:
      - sh: command -v ko >/dev/null 2>&1
        msg: ko is required
    cmds:
      - task: cluster-ready
      - cmd: |
          set -eu
          trap 'status=$?; deploy/mecak8s-kind/cleanup-on-failure.sh "$status"' EXIT
          runtime=docker
          [ "${KIND_EXPERIMENTAL_PROVIDER:-}" != podman ] || runtime=podman
          command -v "$runtime" >/dev/null 2>&1 || { echo "$runtime is required"; exit 1; }
          KO_DOCKER_REPO=ko.local/mecak8s ko build --local --bare --tags=dev ./cmd/mecak8s >/dev/null
          KO_DOCKER_REPO=ko.local/mecabroker ko build --local --bare --tags=dev ./cmd/mecabroker >/dev/null
          archive={{.STATE}}/mecak8s.tar
          "$runtime" save {{.IMAGE}} {{.BROKER_IMAGE}} -o "$archive"
          kind load image-archive "$archive" --name={{.CLUSTER}}
          rm -f "$archive"

  image-refresh:
    desc: >-
      Rebuild the mecak8s image from the current source tree, load it straight into
      the running mecatl-dev Kind cluster's node, and restart the deployment to pick
      it up — for iterating on code without tearing the cluster down.
      `image-build-load` (above) is `internal: true` and is only reachable via the
      destructive `kind-setup` chain (reset-state → cluster-create → ... ), so there
      was previously no safe way to just refresh the image — this task exists to
      close that gap.
    preconditions:
      - sh: command -v ko >/dev/null 2>&1
        msg: ko is required
    cmds:
      - task: cluster-ready
      - cmd: |
          set -eu
          runtime=docker
          [ "${KIND_EXPERIMENTAL_PROVIDER:-}" != podman ] || runtime=podman
          command -v "$runtime" >/dev/null 2>&1 || { echo "$runtime is required"; exit 1; }
          KO_DOCKER_REPO=ko.local/mecak8s ko build --local --bare --tags=dev ./cmd/mecak8s >/dev/null
          archive={{.STATE}}/mecak8s.tar
          "$runtime" save {{.IMAGE}} -o "$archive"
          kind load image-archive "$archive" --name={{.CLUSTER}}
          rm -f "$archive"
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} rollout restart deployment/{{.RELEASE}}-mecak8s
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} rollout status deployment/{{.RELEASE}}-mecak8s --timeout=240s

  broker-tls-apply:
    internal: true
    preconditions:
      - sh: command -v openssl >/dev/null 2>&1
        msg: openssl is required to create disposable Kind broker credentials
    cmds:
      - task: cluster-ready
      - cmd: |
          set -eu
          dir={{.STATE}}/broker-tls
          rm -rf "$dir"
          mkdir -p "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$dir/tls.key" -out "$dir/tls.crt" \
            -subj '/CN={{.RELEASE}}-mecak8s-broker.{{.NAMESPACE}}.svc' \
            -addext 'subjectAltName=DNS:{{.RELEASE}}-mecak8s-broker.{{.NAMESPACE}}.svc' >/dev/null 2>&1
          kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} create secret tls mecabroker-tls --cert="$dir/tls.crt" --key="$dir/tls.key" --dry-run=client -o yaml | kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} apply -f -
          kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} create secret generic mecabroker-ca --from-file=ca.pem="$dir/tls.crt" --dry-run=client -o yaml | kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} apply -f -

  cert-manager-install:
    internal: true
    preconditions:
      - sh: command -v helm >/dev/null 2>&1
        msg: helm is required
    cmds:
      - task: cluster-ready
      - helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager --version=v1.17.2 --namespace=cert-manager --create-namespace --set crds.enabled=true --kubeconfig={{.KUBECONFIG}} --kube-context={{.CONTEXT}} --wait --timeout=4m

  certificate-apply:
    internal: true
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: kubectl is required
    cmds:
      - task: cluster-ready
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} apply -f deploy/mecak8s-kind/fixture-tls.yaml
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} wait --for=condition=Ready certificate/fixture-ca --timeout=120s
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} wait --for=condition=Ready certificate/mecak8s-tls --timeout=120s
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} wait --for=condition=Ready certificate/keycloak-tls --timeout=120s

  keycloak-apply:
    internal: true
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: kubectl is required
    cmds:
      - task: cluster-ready
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} apply -f deploy/mecak8s-kind/keycloak.yaml
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} rollout status deployment/keycloak -n {{.NAMESPACE}} --timeout=240s

  chart-keycloak-apply:
    internal: true
    preconditions:
      - sh: command -v helm >/dev/null 2>&1
        msg: helm is required
    cmds:
      - task: cluster-ready
      - cmd: |
          set -eu
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            provider_values=deploy/mecak8s-kind/kind-provider-real.yaml
          else
            provider_values=deploy/mecak8s-kind/kind-provider-mock.yaml
          fi
          helm upgrade --install {{.RELEASE}} deploy/helm/mecak8s --namespace={{.NAMESPACE}} --kubeconfig={{.KUBECONFIG}} --kube-context={{.CONTEXT}} --values=deploy/helm/mecak8s/values-kind.yaml --values=deploy/mecak8s-kind/kind-nodeports.yaml --values=deploy/helm/mecak8s/values-kind-keycloak.yaml --values="$provider_values" --wait --timeout=4m
      - kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} rollout status deployment/{{.RELEASE}}-mecak8s -n {{.NAMESPACE}} --timeout=240s

  chart-apply:
    internal: true
    preconditions:
      - sh: command -v helm >/dev/null 2>&1
        msg: helm is required
    cmds:
      - task: cluster-ready
      - cmd: |
          set -eu
          trap 'status=$?; deploy/mecak8s-kind/cleanup-on-failure.sh "$status"' EXIT
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} --namespace={{.NAMESPACE}} create secret generic {{.PROVIDER_SECRET}} --from-file=OPENROUTER_API_KEY=/dev/stdin --dry-run=client -o yaml | kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} apply -f -
            provider_values=deploy/mecak8s-kind/kind-provider-real.yaml
          else
            kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} delete secret {{.PROVIDER_SECRET}} --namespace={{.NAMESPACE}} --ignore-not-found
            provider_values=deploy/mecak8s-kind/kind-provider-mock.yaml
          fi
          helm upgrade --install {{.RELEASE}} deploy/helm/mecak8s --namespace={{.NAMESPACE}} --kubeconfig={{.KUBECONFIG}} --kube-context={{.CONTEXT}} --values=deploy/helm/mecak8s/values-kind.yaml --values=deploy/mecak8s-kind/kind-nodeports.yaml --values="$provider_values" --set broker.image.repository=ko.local/mecabroker,broker.image.tag=dev,broker.clientCA.serverName={{.RELEASE}}-mecak8s-broker.{{.NAMESPACE}}.svc --wait --timeout=4m
          kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} rollout status statefulset/redis -n {{.NAMESPACE}} --timeout=240s
          kubectl --kubeconfig={{.KUBECONFIG}} --context={{.CONTEXT}} rollout status deployment/{{.RELEASE}}-mecak8s -n {{.NAMESPACE}} --timeout=240s
