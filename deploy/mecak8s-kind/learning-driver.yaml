# kind_e2e-only learning repository driver. The referenced TLS Secret is
# generated by the test harness; no fixture key material is committed.
apiVersion: v1
kind: Service
metadata:
  name: learning-driver
  labels:
    app.kubernetes.io/name: learning-driver
    app.kubernetes.io/part-of: mecak8s-kind-e2e
    app.kubernetes.io/component: fixture
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: learning-driver
    app.kubernetes.io/part-of: mecak8s-kind-e2e
  ports:
    - name: grpc
      port: 8443
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-driver
  labels:
    app.kubernetes.io/name: learning-driver
    app.kubernetes.io/part-of: mecak8s-kind-e2e
    app.kubernetes.io/component: fixture
spec:
  # The emptyDir is durable only across mecak8s pod replacement. This
  # single-replica fixture makes no driver-HA or driver-restart claim.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: learning-driver
      app.kubernetes.io/part-of: mecak8s-kind-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learning-driver
        app.kubernetes.io/part-of: mecak8s-kind-e2e
        app.kubernetes.io/component: fixture
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: learning-driver
          image: ko.local/mecatl-learning-driver:e2e
          imagePullPolicy: IfNotPresent
          args:
            - --listen=0.0.0.0:8443
            - --data-dir=/data
            - --tls-cert=/var/run/secrets/learning-driver/tls.crt
            - --tls-key=/var/run/secrets/learning-driver/tls.key
          ports:
            - {name: grpc, containerPort: 8443}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /var/run/secrets/learning-driver, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: learning-driver-tls
            defaultMode: 0400
