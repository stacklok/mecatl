# Disposable local-only identity provider for the mecak8s Kind integration
# fixture. It intentionally uses in-memory state and deterministic credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
data:
  config.yaml: |
    issuer: https://dex.mecatl-vmcp.svc.cluster.local:5556
    storage:
      type: memory
    web:
      https: 0.0.0.0:5556
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    oauth2:
      passwordConnector: local
      skipApprovalScreen: true
    staticClients:
      # The embedded vMCP authorization server is the OAuth client that completes
      # this upstream browser flow. It has no configured client secret, so Dex
      # must register the exact public client and callback vMCP uses.
      - id: vmcp-browser
        name: vMCP browser client
        public: true
        redirectURIs:
          - http://127.0.0.1:18080/oauth/callback
      # Reserved for a normal-terminal loopback PKCE journey to the mecak8s
      # gRPC endpoint. It is intentionally distinct from vmcp-browser; no
      # mecatui login or credential storage is implemented by this fixture.
      - id: mecatui-kind
        name: mecatui Kind client
        public: true
        redirectURIs:
          - http://127.0.0.1:18473/oauth/callback
    enablePasswordDB: true
    staticPasswords:
      # These are deliberately public, local-only fixture logins. They are not
      # deployment, provider, or user credentials.
      - email: alice@example.com
        hash: "$2a$10$YP94gGXYuj/LZ.SZ8mFpr.DwVZyUQE1bagEnAkfIJuw1B0aaxyBhK"
        username: alice
        userID: alice-uid
      - email: bob@example.com
        hash: "$2a$10$YP94gGXYuj/LZ.SZ8mFpr.DwVZyUQE1bagEnAkfIJuw1B0aaxyBhK"
        username: bob
        userID: bob-uid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        app.kubernetes.io/part-of: mecak8s
        app.kubernetes.io/component: idp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.44.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: https
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: dex-config
        - name: tls
          secret:
            secretName: dex-tls
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: mecak8s
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: https
      port: 5556
      targetPort: https
      nodePort: 30556
