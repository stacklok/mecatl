apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: mecak8s
        app.kubernetes.io/component: idp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
            # Keycloak builds EVERY url it emits -- issuer, token endpoint, login form
            # action, redirects -- from this value. It must be the one name that
            # resolves both from the host (/etc/hosts alias + kind port mapping) and
            # in-cluster (service DNS), or the browser leg breaks in confusing ways.
            - --hostname=https://keycloak.mecatl-vmcp.svc.cluster.local:8443
            - --https-certificate-file=/etc/keycloak/tls/tls.crt
            - --https-certificate-key-file=/etc/keycloak/tls/tls.key
            - --https-port=8443
            - --http-enabled=false
          env:
            # Admin console is for debugging only; the realm arrives via import.
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports:
            - {name: https, containerPort: 8443}
            - {name: management, containerPort: 9000}
          volumeMounts:
            - {name: tls, mountPath: /etc/keycloak/tls, readOnly: true}
            # data must be writable (H2 + transient state); the realm import dir is
            # nested inside it. Kubernetes orders mounts by path depth, so `data`
            # lands before `data/import`.
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            # Deliberately NOT readOnlyRootFilesystem, unlike the other fixture pods.
            # `start-dev` runs a Quarkus augmentation step on every boot that writes
            # into the image tree (/opt/keycloak/lib/quarkus/transformed-bytecode.jar),
            # so a read-only root fails the build outright. An emptyDir there would
            # mask the image's own libs rather than fix it. The production answer is a
            # pre-augmented image (`kc.sh build` + `start --optimized`), which is not
            # worth a custom image build for a disposable fixture.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # scheme HTTPS: configuring --https-certificate-file puts the management
            # interface on HTTPS too, so a plain-HTTP probe is refused and the pod
            # never becomes Ready even though Keycloak booted fine.
            httpGet: {path: /health/ready, port: management, scheme: HTTPS}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
      volumes:
        - name: tls
          secret:
            secretName: keycloak-tls
        - name: realm
          configMap:
            name: keycloak-realm
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: mecak8s
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30843
