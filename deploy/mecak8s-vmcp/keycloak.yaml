# Disposable local-only Keycloak for the mecak8s Kind integration fixture.
#
# Replaces Dex as the fixture IdP so the EXTERNAL-issuer token-exchange path can be
# exercised: Dex's JWT carries no scope/scp and its id_token carries at_hash, so a
# Dex token can never be a usable RFC 8693 subject token. Keycloak emits `scope` on
# its access tokens and can shape `aud` via an audience mapper.
#
# The realm is IMPORTED FROM THIS CONFIGMAP ON EVERY POD START (`--import-realm`).
# That is deliberate: Keycloak's dev-mode H2 database is ephemeral and is wiped on
# restart, so an imperatively-configured realm would have to be rebuilt by hand every
# time. Importing on start makes a restart free and keeps the fixture declarative,
# matching the shape dex.yaml had.
#
# Credentials here are deliberately public, local-only fixture logins. They are not
# deployment, provider, or user credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  # GENERATED by keycloak-realm-generate.sh -- do not hand-edit.
  #
  # Filtered down from Keycloak's full ~2700-line partial-export to the four client
  # scopes this fixture needs, its two clients, and its two users. Everything else in
  # that export -- authenticationFlows, roles, components, the six built-in clients --
  # is Keycloak's own defaults, recreated for any fresh realm.
  #
  # The three BUILT-IN scopes are carried verbatim rather than omitted: a realm import
  # that declares a `clientScopes` array REPLACES Keycloak's built-ins instead of
  # merging, and losing `basic` silently drops the `sub` claim from every access token.
  realm.json: |
    {
      "accessTokenLifespan": 900,
      "clientScopes": [
