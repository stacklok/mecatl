apiVersion: v1
kind: Service
metadata:
  name: toolhive-redis
  labels:
    app.kubernetes.io/name: toolhive-redis
    app.kubernetes.io/part-of: mecak8s-vmcp
spec:
  selector:
    app.kubernetes.io/name: toolhive-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: toolhive-redis
  labels:
    app.kubernetes.io/name: toolhive-redis
    app.kubernetes.io/part-of: mecak8s-vmcp
spec:
  serviceName: toolhive-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toolhive-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolhive-redis
        app.kubernetes.io/part-of: mecak8s-vmcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"${REDIS_PASSWORD}\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: vmcp-redis-auth, key: password}
          ports:
            - {name: redis, containerPort: 6379}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          startupProbe:
            exec: {command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" -h 127.0.0.1 ping"]}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" -h 127.0.0.1 ping"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" -h 127.0.0.1 ping"]}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
