# Dex, AS-1's upstream IdP, for the disposable mecatl-idbroker Kind profile.
# It serves HTTPS with the cert-manager dex-tls certificate. Its Service port
# equals its host port (5557), so AS-1 (server-side, in the cluster) and the
# browser (on the host, through the hosts-add alias) use the same issuer URL.
#
# The static users are dev-only: both passwords are the literal "password"
# (the bcrypt hash below). AS-1's client secret is not here: kind-setup
# generates the dex-as1-client Secret, which Dex reads through secretEnv and
# mecak8s mounts as identityBroker.as1.upstream.clientSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  labels:
    app.kubernetes.io/name: dex
data:
  config.yaml: |
    issuer: https://dex.mecatl-idbroker.svc.cluster.local:5557
    storage:
      type: memory
    web:
      https: 0.0.0.0:5557
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
    oauth2:
      skipApprovalScreen: true
    staticClients:
      - id: mecak8s-as1
        name: mecak8s AS-1
        secretEnv: DEX_AS1_CLIENT_SECRET
        redirectURIs:
          - https://mecak8s-mecak8s.mecatl-idbroker.svc.cluster.local:18091/as1/oauth/callback
    enablePasswordDB: true
    staticPasswords:
      - email: alice@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: alice
        userID: alice-uid
      - email: bob@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: bob
        userID: bob-uid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.44.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/cfg/config.yaml"]
          env:
            - name: DEX_AS1_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-as1-client
                  key: client-secret
          ports:
            - name: https
              containerPort: 5557
          volumeMounts:
            - name: cfg
              mountPath: /etc/dex/cfg
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5557
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: cfg
          configMap:
            name: dex-config
        - name: tls
          secret:
            secretName: dex-tls
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: https
      port: 5557
      targetPort: https
      nodePort: 30557
