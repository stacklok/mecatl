apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: mecatl-idbroker
nodes:
  - role: control-plane
    extraPortMappings:
      # mecak8s gRPC
      - containerPort: 30090
        hostPort: 18090
        listenAddress: 127.0.0.1
        protocol: TCP
      # mecak8s HTTPS, including the hosted AS-1 under /as1
      - containerPort: 30091
        hostPort: 18091
        listenAddress: 127.0.0.1
        protocol: TCP
      # Dex, AS-1's upstream IdP
      - containerPort: 30557
        hostPort: 5557
        listenAddress: 127.0.0.1
        protocol: TCP
