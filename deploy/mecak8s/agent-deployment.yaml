# mecak8s agent Deployment — STORAGE-FREE pods (ADR 0048).
#
# THE CLOUD-NATIVE PROOF: these pods hold ZERO durable state. No PVC, no
# volumeMounts for state, no --store-dir. Every piece of state is a managed
# service the agent talks to over the network:
#   - session snapshots + event log + retention → Redis (--redis-url)
#   - single-writer lease → k8s API server (--session-lease-k8s-namespace)
#
# replicas:2 demonstrates the multi-replica posture: the per-session lease
# (coordination.k8s.io) guarantees two replicas never write one session. Pod
# failover = release-on-shutdown (drain gate + bounded GracefulStop) → survivor
# acquires the lease → resumes from Redis. Pure compute.
#
# Rolling update: maxSurge:1, maxUnavailable:0 so there is always a ready
# survivor during the update. The drain gate (armed on SIGTERM + preStop /drain)
# rejects new run-entries (503) so traffic steers to the new pod; the bounded
# GracefulStop cancels in-flight runs (Recover-able on the successor, issue #51)
# within terminationGracePeriodSeconds: 60.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecak8s-agent
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mecatl
      app.kubernetes.io/part-of: mecak8s
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mecatl
        app.kubernetes.io/part-of: mecak8s
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: mecak8s-agent  # for coordination.k8s.io Lease access
      automountServiceAccountToken: true  # the agent needs the token to hold leases
      terminationGracePeriodSeconds: 60   # bounded GracefulStop window
      securityContext:
        # PSS restricted in full. UID/GID 65532 matches the chainguard static
        # base image (.ko.yaml).
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mecak8s-agent
          image: ko://github.com/stacklok/mecatl/cmd/mecak8s
          # IfNotPresent: the image is loaded into the kind node via `kind load
          # docker-image` (not pulled from a registry). ko.local is a local-only
          # repo, so Always would fail trying to resolve it as a DNS name.
          imagePullPolicy: IfNotPresent
          args:
            - --grpc-addr=0.0.0.0:8080
            - --http-addr=0.0.0.0:8081
            # STORAGE-FREE: state goes to Redis, not a local dir.
            - --redis-url=redis:6379
            # This base is the DISPOSABLE offline fixture (ko.local image, --mock
            # provider, in-cluster Redis StatefulSet with no auth), so it takes the
            # explicit plaintext opt-in ADR 0233 requires. A production deployment
            # must NOT copy this line: use --redis-tls or --redis-tls-ca instead.
            - --redis-allow-plaintext
            # The lease is a managed service (coordination.k8s.io Lease per
            # session via the k8s API server).
            - --session-lease-k8s-namespace=mecatl
            # k8s-native defaults: headless + auto posture.
            - --headless=true
            - --posture=auto
            # e2e uses the mock provider (fully offline, no API key). For prod,
            # swap to --openai and provide OPENAI_API_KEY from a Secret.
            - --mock
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Probes: startup gates the first readiness; readiness is DYNAMIC
          # (ReadyFunc = !draining && redisOK) so a draining pod leaves the
          # endpoints; liveness detects a hung process.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # preStop triggers the drain gate via /drain (distroless-safe: an
          # httpGet, not an exec). /drain blocks ~3s for endpoint propagation
          # before returning, so kubelet removes the pod from endpoints BEFORE
          # the SIGTERM cancel window starts.
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: http
          volumeMounts:
            # STORAGE-FREE: the ONLY mount is /tmp scratch (the Go runtime /
            # SSE buffering need it under readOnlyRootFilesystem). There is NO
            # state volume — no PVC, no --store-dir. This is the proof.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
