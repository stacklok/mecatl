# NetworkPolicy for the mecak8s agent — default-deny + explicit egress.
#
# This is LOAD-BEARING (risk #5 in MECAK8S-PLAN): the agent pod is storage-free,
# so EVERY feature depends on its egress reaching a managed service. Missing
# any of these egress rules kills a feature:
#   - DNS (UDP/TCP 53 to kube-dns)      → nothing resolves (Redis, API server)
#   - k8s API (TCP 443)                 → lease acquire fails → no single-writer
#   - Redis (TCP 6379)                  → session store/event log fail → no runs
#   - LLM provider (TCP 443)            → no model calls (under --openai/--anthropic)
#
# Ingress is default-deny: the agent is reached via the mecak8s-agent Service,
# so only pods in this namespace (or an explicit client allow) may connect.
# The health probes (/readyz, /healthz) and /drain are served by kubelet on the
# node, which is NOT subject to NetworkPolicy, so they keep working. /drain is
# deliberately unauthenticated for the preStop hook; do not grant general
# clients ingress unless they are also allowed to put the pod into drain mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mecak8s-agent
  namespace: mecatl
  labels:
    app.kubernetes.io/name: mecatl
    app.kubernetes.io/part-of: mecak8s
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mecatl
      app.kubernetes.io/part-of: mecak8s
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
    - Egress
  # Default-deny ingress: only explicit clients may connect. Uncomment the
  # placeholder block to allow a specific client namespace/pod.
  ingress: []
  # ---------------------------------------------------------------------------
  # PLACEHOLDER — to allow a specific client, replace `ingress: []` above with:
  #
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: trusted-clients
  #         podSelector:
  #           matchLabels:
  #             role: mecak8s-client
  #     ports:
  #       - protocol: TCP
  #         port: 8080   # grpc
  #       - protocol: TCP
  #         port: 8081   # http / SSE
  # ---------------------------------------------------------------------------
  egress:
    # 1. DNS — kube-dns in kube-system. Without this nothing resolves.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. k8s API server + LLM provider egress — TCP 443 to any destination IP.
    #    The API server is a Service ClusterIP (not a pod peer), and the LLM
    #    provider is an external public HTTPS endpoint; a NetworkPolicy
    #    pod/namespace selector cannot match either. An egress rule with ONLY a
    #    port (no `to:` selector) allows egress to ANY IP on that port — which
    #    is exactly what an external endpoint and the API server Service need.
    #    (An operator hardening for production may replace this with a tighter
    #    ipBlock CIDR for the API server's ClusterIP and the provider's ranges,
    #    but the broad 443 rule is the portable default.) Without this the lease
    #    fails (no single-writer) and under --openai/--anthropic the model calls
    #    fail. Under --mock (e2e) the LLM half is inert.
    #
    #    NOTE: a bare port-only rule is NOT `namespaceSelector: {}` (which would
    #    open 443 to every POD in the cluster — an east-west lateral-movement
    #    surface a default-deny posture is meant to close). No `to:` selector =
    #    any destination IP, the correct form for an external endpoint.
    - ports:
        - protocol: TCP
          port: 443
    # 3. Redis — the managed stateful backing service. Without this the session
    #    store + event log fail → no runs.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: mecak8s
      ports:
        - protocol: TCP
          port: 6379
