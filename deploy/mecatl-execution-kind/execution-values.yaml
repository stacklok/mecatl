    memoryLimit: 512Mi
    ephemeralStorageRequest: 64Mi
    ephemeralStorageLimit: 1Gi
    tmpSizeLimit: 256Mi
    runtimeClassName: qualification-runc
    maxFileBytes: 5242880
    maxCommandBytes: 1048576
    maxCommandDuration: 5m
    maxEnvironments: 1
  quota-kube:
    image: placeholder.invalid/workload@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    storageClass: standard
    storageSize: 1Gi
    cpuRequest: 50m
    memoryRequest: 64Mi
    cpuLimit: "1"
    memoryLimit: 512Mi
