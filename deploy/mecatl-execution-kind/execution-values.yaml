provider:
  clientIngressSelectors:
    - namespaceLabels:
        kubernetes.io/metadata.name: execution-qualification
      podLabels:
        app.kubernetes.io/name: mecak8s
  apiServerCIDRs: [172.16.0.0/12]
  dnsCIDRs: [10.96.0.10/32]
resourceGovernance:
  pods: "30"
  persistentVolumeClaims: "25"
  executionEnvironments: "25"
  requestsCPU: "5"
  requestsMemory: 8Gi
  requestsStorage: 30Gi
  requestsEphemeralStorage: 8Gi
  limitsCPU: "25"
  limitsMemory: 30Gi
  limitsEphemeralStorage: 30Gi
networkPolicy:
  workloadProfiles: {}
