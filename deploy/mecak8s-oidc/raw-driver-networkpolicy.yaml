# Raw gRPC drivers predate caller propagation (ADR 0213).  They are trusted
# infrastructure, not tenant-facing services: only the mecak8s agent may reach
# a pod that opts into this label.  A tenant pod must not receive the `agent`
# component label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mecak8s-raw-driver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: raw-driver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: 9090
