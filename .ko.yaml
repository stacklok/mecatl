# ko configuration for mecatl (https://ko.build).
#
# mecatl ships its server, mecated, as a single static Go binary. ko builds it
# straight from source (no Dockerfile) onto a minimal distroless base. The
# resulting image runs as the non-root UID/GID baked into the chainguard static
# base (65532) — see deploy/ for the matching Pod securityContext.
#
# The base image is pinned by digest for reproducibility. `cgr.dev/chainguard/static`
# is a ~static, shell-less, scratch-like image: no package manager, no shell,
# nonroot by default — the smallest sane home for a CGO_ENABLED=0 Go binary.
# (Equivalent alternative: gcr.io/distroless/static-debian12:nonroot.)
#
# Build:   KO_DOCKER_REPO=ko.local ko build --local ./cmd/mecated   (or `task ko:build`)
# Publish: KO_DOCKER_REPO=<registry> ko build --push ./cmd/mecated  (or `task ko:publish`)
# `task build`, `task install`, and Taskfile-driven ko builds set VERSION from the
# rooted build-time `git describe --tags --match 'v[0-9]*' --always --dirty` result.
# Direct ko builds may leave VERSION unset; then runtime uses only embedded VCS metadata.
# Release workflows set VERSION explicitly.

defaultBaseImage: cgr.dev/chainguard/static@sha256:d6a97eb401cbc7c6d48be76ad81d7899b94303580859d396b52b67bc84ea7345

# mecatui needs a full OS base (wolfi) rather than the distroless static base:
# brood-box connects to the VM via SSH and requires a shell, neither of which
# is present in cgr.dev/chainguard/static. Pinned by digest like the default
# base above — bump deliberately when brood-box ships a new base.
baseImageOverrides:
  github.com/stacklok/mecatl/cmd/mecatui: ghcr.io/stacklok/brood-box/base@sha256:f3ec852de36b81cf8fa612fdb8721c05dcc295944114bda3c2c9f10f4345d9bb

builds:
  - id: mecated
    main: ./cmd/mecated
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - '{{with index .Env "VERSION"}}-X github.com/stacklok/mecatl/internal/buildinfo.BuildID={{.}}{{end}}'
      - '{{with index .Env "MECATL_METRICS_INGEST_KEY"}}-X github.com/stacklok/mecatl/internal/adapter/productmetrics.bakedKey={{.}}{{end}}'
      - -X main.microVMReleaseVersion={{.Env.VERSION}}
      - -X main.microVMReleaseDefaultsB64={{.Env.MICROVM_RELEASE_DEFAULTS_B64}}
  # mecak8s (ADR 0048): the storage-free k8s-native agent binary. Same distroless
  # base + build flags as mecated — it is a thin peer of mecated that composes
  # app.Build with k8s-native defaults (Redis store + k8s lease + drain gate).
  - id: mecak8s
    main: ./cmd/mecak8s
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - '{{with index .Env "VERSION"}}-X github.com/stacklok/mecatl/internal/buildinfo.BuildID={{.}}{{end}}'
      - '{{with index .Env "MECATL_METRICS_INGEST_KEY"}}-X github.com/stacklok/mecatl/internal/adapter/productmetrics.bakedKey={{.}}{{end}}'
  # mecatui (issue #302): the optional Bubble Tea TUI binary. It overrides the
  # distroless base with the brood-box wolfi base (see baseImageOverrides above —
  # brood-box connects over SSH and needs a shell) and ships a kodata/agent.yaml
  # brood-box manifest alongside the binary. VERSION, when nonempty, is retained
  # verbatim as the explicit linker stamp.
  #
  # MECATL_METRICS_INGEST_KEY (all three builds above and below): the plain
  # product-metrics ingest key the release workflow extracts from the
  # MECATL_METRICS_KEY secret's {"mecatl": "<key>"} JSON blob (see
  # .github/workflows/release.yml) before invoking `ko build`. Absent/empty
  # (any non-release build) omits the ldflag entirely, matching Taskfile.yml's
  # local-build posture: NewProvider refuses to construct on an empty bakedKey.
  - id: mecatui
    main: ./cmd/mecatui
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - '{{with index .Env "VERSION"}}-X github.com/stacklok/mecatl/internal/buildinfo.BuildID={{.}}{{end}}'
      - '{{with index .Env "MECATL_METRICS_INGEST_KEY"}}-X github.com/stacklok/mecatl/internal/adapter/productmetrics.bakedKey={{.}}{{end}}'
      - -X main.version={{.Env.VERSION}}
      - -X main.microVMReleaseDefaultsB64={{.Env.MICROVM_RELEASE_DEFAULTS_B64}}
