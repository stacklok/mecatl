// mecatl public API surface (WP10).
//
// HarnessService is the network surface over the WP8 agent loop. The
// primary RPC is the bidi `Converse` stream: the client sends a mandatory
// first `Prompt` frame, then zero or more `ResumeApproval` / `Cancel`
// control frames, while the server streams typed `Event` envelopes for the
// lifetime of the run, terminating in a `result` event.
//
// The `Event` message mirrors the domain `session.Event` taxonomy
// (engine/session/event.go) one-for-one: a string `type` plus the
// structured submessages (ToolCall, ToolResult, PermissionAsk, Result,
// Usage). It is the single, provider-neutral event schema shared by the
// gRPC and HTTP/SSE adapters; it is never an OpenAI type.
//
// Validation: required-field annotations are authored with
// `buf.validate.field` for documentation and future runtime enforcement.
// V1 enforces the required-field checks in the Go server (see
// internal/adapter/server); wiring the protovalidate runtime is a deferred
// follow-up and is not required for the WP10 milestone.

syntax = "proto3";

package mecatl.v1;

import "buf/validate/validate.proto";

// HarnessService is the mecatl API: unary session setup/inspection plus
// the bidi Converse stream that drives one agent run.
service HarnessService {
  // CreateSession allocates a new server-side session and returns its id.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // GetSession returns a snapshot of an existing session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // SetMode changes an existing session's permission posture. The session aggregate
  // remains authoritative: a mid-turn change is rejected with InvalidArgument, so
  // clients that want "next prompt" semantics must defer and retry once idle.
  rpc SetMode(SetModeRequest) returns (SetModeResponse);

  // CloseSession ends a session and releases its server-side resources (per-session
  // learned permission rules, per-session engine/workspace). Idempotent: closing an
  // unknown or already-closed session via the wire returns NotFound only for a
  // never-created id; an already-released session succeeds.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // ForkSession creates a new peer session whose conversation history is a
  // snapshot of an existing session's, inheriting the source's mode, workspace,
  // limits, and provider/model/profile labels. Same provider and model only;
  // the ONE permitted selector delta is an OPTIONAL reasoning-effort override
  // (ADR 0068). The source must be at a turn boundary (idle/terminal); a
  // running/awaiting source is rejected. No streaming.
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);

  // Converse drives one run. The first frame MUST be `prompt`; subsequent
  // frames are zero or more `resume_approval` / `cancel` control frames. The
  // server streams `Event` envelopes until the terminal `result` event, then
  // closes the stream. A context cancel from the client aborts the run.
  rpc Converse(stream ConverseRequest) returns (stream ConverseResponse);

  // ListMcpResources returns the static resource snapshots advertised by the
  // connected MCP servers. An empty `server` returns the union across every
  // server; a specific name returns just that server's. Catalog-level
  // inspection: unrelated to any in-flight Converse run.
  rpc ListMcpResources(ListMcpResourcesRequest) returns (ListMcpResourcesResponse);

  // ReadMcpResource reads a single resource by URI from the named server.
  rpc ReadMcpResource(ReadMcpResourceRequest) returns (ReadMcpResourceResponse);

  // ListMcpPrompts returns the static prompt snapshots advertised by the
  // connected MCP servers. An empty `server` returns the union across every
  // server.
  rpc ListMcpPrompts(ListMcpPromptsRequest) returns (ListMcpPromptsResponse);

  // GetMcpPrompt expands a named prompt with the given arguments on the named
  // server and returns the rendered messages.
  rpc GetMcpPrompt(GetMcpPromptRequest) returns (GetMcpPromptResponse);

  // ListMcpSources returns the resolved MCP source inventory snapshot: each
  // configured source (static / ToolHive), the servers it contributed, and any
  // diagnostics it raised. Derived from the resolution snapshot taken at
  // startup; it performs no live discovery.
  rpc ListMcpSources(ListMcpSourcesRequest) returns (ListMcpSourcesResponse);

  // ListToolHiveGroups returns the distinct, non-empty ToolHive groups present
  // in the resolved source inventory. Derived from the snapshot — it does NOT
  // call ToolHive.
  rpc ListToolHiveGroups(ListToolHiveGroupsRequest) returns (ListToolHiveGroupsResponse);

  // ListAgents returns the resolved agent-definition registry snapshot: each
  // discovered agent def's routing metadata (name/description), its resolved
  // model, its effective read-only tool scope, permission mode, and UX color.
  // Derived from the snapshot taken at startup; it performs no live discovery.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // ListCommands returns the available slash commands (name + short
  // description) discovered under the configured command directories of the
  // requested workspace. It powers the client's in-input command palette; it is
  // DISCOVERY only — expanding a command remains a run-path concern (the server's
  // CommandExpander handles it when a "/<cmd> args" prompt is submitted). An
  // empty workspace, or a server with no command expander, returns an empty list.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);

  // ListWorktrees returns the git worktrees of the repo rooted at the requested
  // workspace (issue #102). It powers the client's /worktrees overlay — the
  // first-class operator workflow for binding a session to an EXISTING sibling
  // worktree (a new session rooted there, not a live-session switch). It is
  // DISCOVERY only, composition-injected (nil-safe: a no-FS/cloud server, or an
  // untrusted workspace, returns an empty list); it never performs a live
  // model/network call and never mutates anything. An empty workspace or a server
  // with no worktree lister also returns an empty list.
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);

  // StreamSessionEvents replays a session's durable event log as a server stream
  // of `Event` envelopes (cloud-native Phase 3a read-back). It is the client-tier
  // surface over the SAME `port.EventLog.Read` the operator-tier 3c
  // EventLogService.Read serves; the loop itself stays storage-agnostic (it only
  // emits — persistence lives at the relay, never in `engine/agent`). The log
  // stores ALREADY-REDACTED events and inherits the stream's redaction, so this
  // path adds none (gauntlet #7: no raw args/deny-reason bodies/child content
  // ever cross).
  //
  // UNLIKE the live `Converse` relay — which SKIPS the three log-only event kinds
  // (`approval`/`compaction_archive`/`user_prompt`) on the client wire because they
  // are persistence-only — StreamSessionEvents relays ALL events, including those
  // three: a client opening a PAST session wants the verdicts and user prompts, as
  // they ARE the transcript. They are metadata-only/redacted by construction, so no
  // extra filter applies here.
  //
  // Read-only: no live model call, no mutation, no Converse run is started. An
  // unknown session id yields an EMPTY stream (absence is data — a never-created or
  // pruned id is indistinguishable, by design). A server with NO durable EventLog
  // wired returns `UNIMPLEMENTED` (HTTP 501). There is intentionally NO
  // ServerCapabilities bit for this feature: the capability is RPC-discoverable
  // (UNIMPLEMENTED vs. an empty stream degrade honestly).
  rpc StreamSessionEvents(StreamSessionEventsRequest) returns (stream Event);

  // StreamSessionLive is the LIVE per-session event stream (ADR 0075
  // fire-result-delivery Scenario 6 / Wave 3): a server-streaming RPC backed by
  // the in-process per-session subscription registry (Service.Subscribe /
  // PublishSessionEvent, List 1 row 35). It is the UNIFIED transport for BOTH
  // embedded and remote clients — the embedded mecatui dials its in-process
  // server over a real gRPC UNIX socket, so the in-process Subscribe registry is
  // unreachable from the TUI without a wire transport; this RPC is that
  // transport, and it serves a remote mecated identically (ONE proto, ONE TUI
  // consumption path).
  //
  // UNLIKE StreamSessionEvents (the durable-log READ-BACK, which relays ALL
  // events including the three log-only kinds), StreamSessionLive is a LIVE
  // stream and applies the SAME live-wire relay discipline as the live
  // `Converse` relay, with ONE narrow exception: a fire-result delivery note
  // (an EvUserPrompt whose text starts with the renderFireDelivery provenance
  // header "[scheduled task ") is RELAYED so the connected client renders the
  // delivery card as it happens (AC6.2). The other two log-only kinds
  // (EvApproval, EvCompactionArchive) stay SKIPPED on the live wire (they are
  // persistence-only; a client holds its own verdict/compaction view); a
  // non-delivery EvUserPrompt stays SKIPPED too (the client already holds its
  // own prompt). The delivery note is metadata-only/redacted by construction
  // (gauntlet #7 — it is the fenced-untrusted harness note the engine recorded).
  //
  // The stream stays open until the client cancels or disconnects. The handler
  // is drain-to-discard: a dead client never wedges the delivery run (a full
  // subscriber channel drops the event, AC6.3). The durable log records the
  // tail regardless (it is appended by the relay/loop, independent of this
  // stream). There is intentionally NO ServerCapabilities bit — the capability is
  // RPC-discoverable (UNIMPLEMENTED on an older server, an empty stream on a
  // server with no subscribers). An unknown session id yields an empty stream
  // (absence is data — a never-created id is indistinguishable from a session
  // with no live events yet).
  rpc StreamSessionLive(StreamSessionLiveRequest) returns (stream Event);

  // ListSessions returns the stored-session inventory — the picker metadata a
  // client renders to let an operator open an EXISTING session by id (issue #245
  // Phase 1). It is backed by `port.PrunableStore.List` (type-asserted on the
  // configured store); a store that does not implement `PrunableStore`, or one that
  // returns `ErrPruneUnsupported`, degrades to an EMPTY list — never an error — so
  // a no-persistence/cloud server honestly reports "no sessions". Each row carries
  // only picker metadata (id, timestamps, state, turn count, model id); NO
  // conversation content is loaded. Rows are sorted most-recently-active first
  // (modified_at descending). Read-only. There is intentionally NO
  // ServerCapabilities bit — see StreamSessionEvents for the rationale.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // ListSkills returns the resolved skills inventory snapshot: each discovered
  // skill's name + one-line description. Derived from the snapshot taken at
  // startup (skills are discovered once at build time and immutable for the
  // process lifetime); it performs no live discovery. Metadata only — activating
  // a skill remains a run-path concern (the Skill tool reads the body).
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);

  // GetSoul returns the resolved soul (user-scoped persona) BUILD-TIME SNAPSHOT:
  // the selected soul's content + size/hash + provenance (user/project) + trust
  // and drift state. The soul is selected once at startup (USER-wins precedence,
  // project trust gate, drift check — issue #14 Phase 3 Items 1+2), so this is a
  // pure read of that snapshot, never a live re-read. Read-only inspection: it
  // never mutates the soul (the agent-read-only invariant).
  rpc GetSoul(GetSoulRequest) returns (GetSoulResponse);

  // GetUserModel returns the CURRENT user-model entries (durable FACTS about the
  // operator): each entry's key + one-line description, plus an aggregate size +
  // hash. Unlike GetSoul (a startup snapshot) this is a LIVE read of the
  // user-model store's index, so it reflects entries the agent has saved since
  // startup. Metadata only — the per-entry values are omitted (Recall loads them).
  rpc GetUserModel(GetUserModelRequest) returns (GetUserModelResponse);

  // ListModels returns the selectable-model inventory: every AVAILABLE provider's
  // catalog models, projected to public metadata only (no secrets). It powers the
  // client /models picker (multi-provider Phase 0, S3). Derived from the build-time
  // registry+catalog snapshot; it performs no live discovery and never reveals an
  // unavailable provider.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // --- Agent teams (experimental) -----------------------------------------
  //
  // A team is a set of long-lived member sessions that coordinate through a
  // shared task list and mailbox (see docs/adr/0014-agent-teams.md). Unlike
  // a Converse run (one session) or a Task/Fork subagent (one-shot, drained),
  // team members are re-driven across rounds and their events stream to the
  // client tagged with the producing member — the headless analogue of
  // Claude Code's split-pane teammates.

  // CreateTeam allocates a new agent team and returns its id, optionally enrolling
  // an initial roster in the same atomic call. Members may also be added afterwards
  // with SpawnTeammate; the team is then driven with RunTeam.
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);

  // SpawnTeammate enrols a member in an existing team (before RunTeam). A
  // read-only member shares the base workspace; a mutating member runs in an
  // isolated fork so parallel writes are safe.
  rpc SpawnTeammate(SpawnTeammateRequest) returns (SpawnTeammateResponse);

  // SendTeammateMessage posts a message into a member's inbox (e.g. from the
  // operator), delivered at that member's next turn boundary.
  rpc SendTeammateMessage(SendTeammateMessageRequest) returns (SendTeammateMessageResponse);

  // CancelTeammate cancels ONE member of a RUNNING team mid-round (the headless
  // RunTeam-path analogue of the Converse-path CancelChild frame). The member
  // de-schedules with the cancelled stop reason, its claimed tasks release back
  // to pending, and the team run continues — the lead still synthesises and the
  // RunTeam stream still delivers its terminal outcome frame. A team that is not
  // running (created but never run, or already done) is rejected with
  // FailedPrecondition; an unknown member name with NotFound.
  rpc CancelTeammate(CancelTeammateRequest) returns (CancelTeammateResponse);

  // RunTeam drives the team to quiescence, streaming every member's events —
  // each tagged with the member name — until the team finishes. The stream ends
  // with a single terminal frame carrying TeamEvent.outcome (rounds, stop,
  // budget_exhausted, usage, dispositions, findings); no member events follow it.
  rpc RunTeam(RunTeamRequest) returns (stream TeamEvent);

  // ListTeam returns a snapshot of the team roster, the shared task list, and
  // whether the team has reached quiescence.
  rpc ListTeam(ListTeamRequest) returns (ListTeamResponse);

  // CleanupTeam tears down a finished team and releases its resources.
  rpc CleanupTeam(CleanupTeamRequest) returns (CleanupTeamResponse);

  // ApprovePlan atomically resolves a parked plan-approval ask (a PresentPlan
  // call surfaced in plan mode, issue #206) and — on an ALLOW verdict — starts a
  // fresh continuation run carrying the harness proceed message, streaming BOTH
  // the resumed run's and the continuation run's events on the one response
  // stream. It composes EXISTING seams (Service.resumeFromAwaiting +
  // StartRunContent over the engine's ResumeApproval): the resumed run applies
  // the verdict, sets the plan-approved target mode, terminates with
  // StopPlanApproved, and flips the session mode at the terminal boundary; the
  // continuation run then drives the model on the FLIPPED mode (default /
  // accept-edits) with the proceed message as ordinary recorded history.
  //
  // target_mode → verdict mapping:
  //   - PERMISSION_MODE_DEFAULT  → allow-once (the session flips to DEFAULT).
  //   - PERMISSION_MODE_ACCEPT_EDITS → allow-always (the session flips to
  //     ACCEPT_EDITS).
  //   - PERMISSION_MODE_PLAN / UNSPECIFIED → deny (the run stays in plan mode;
  //     no continuation run starts — the model iterates on the plan on the next
  //     prompt).
  //
  // `note` is an OPTIONAL operator remark appended to the proceed message
  // injected into the continuation run's first user message (allow paths only).
  //
  // Preconditions (else FailedPrecondition): the session must NOT have a live
  // in-flight run (an approve mid-run is rejected — use the Converse
  // ResumeApproval frame for a live run), and it MUST be in the awaiting state
  // parked on a PLAN-ORIGINATED ask (not a generic tool-permission ask). An
  // unknown session yields NotFound. The stream ends with the terminal `result`
  // event of whichever run ran last (the continuation run on an allow path; the
  // resumed run on a deny path).
  rpc ApprovePlan(ApprovePlanRequest) returns (stream Event);
}

// PermissionMode is the session-wide permission posture, mirroring
// session.PermissionMode. Plan mode exposes a read-only toolset; acceptEdits
// auto-accepts edits.
enum PermissionMode {
  // PERMISSION_MODE_UNSPECIFIED defaults to DEFAULT at the server boundary.
  PERMISSION_MODE_UNSPECIFIED = 0;
  // PERMISSION_MODE_DEFAULT is the standard deny -> ask -> allow posture.
  PERMISSION_MODE_DEFAULT = 1;
  // PERMISSION_MODE_PLAN enforces a read-only toolset.
  PERMISSION_MODE_PLAN = 2;
  // PERMISSION_MODE_ACCEPT_EDITS auto-accepts edits.
  PERMISSION_MODE_ACCEPT_EDITS = 3;
}

// Limits are the configured stop conditions for a session. A zero value in
// any field disables that particular limit.
message Limits {
  // max_turns caps the number of model calls; 0 disables.
  int32 max_turns = 1;
  // max_tool_calls caps the total tool invocations; 0 disables.
  int32 max_tool_calls = 2;
  // max_consecutive_failures caps back-to-back tool failures; 0 disables.
  int32 max_consecutive_failures = 3;
}

// CreateSessionRequest opens a new session.
message CreateSessionRequest {
  // workspace is the absolute session root tools operate against.
  //
  // CROSS-FIELD RULE (profile-aware, enforced by the server — which is why this
  // field no longer carries a wire-level min_len): the DEFAULT profile
  // (profile == "") REQUIRES a non-empty workspace, exactly as before; the
  // "no-fs" profile REQUIRES an EMPTY workspace — a no-fs request that also
  // names a workspace is a loud InvalidArgument (the combination is
  // contradictory: a no-FS session has no filesystem to root), never a silent
  // drop of either field.
  string workspace = 1;
  // mode is the permission posture; unspecified defaults to DEFAULT.
  PermissionMode mode = 2;
  // limits are the optional stop conditions.
  Limits limits = 3;

  // provider_id selects which configured provider backs this session, by its
  // stable registry id ("openai" / "openrouter"). Empty => the server default
  // provider (today's behaviour). An unknown/unavailable id is a loud
  // InvalidArgument, never a silent fallback. The provider is FIXED for the
  // session lifetime (reasoning-replay + byte-stable prefix are provider-private);
  // "switch provider" = new session. Keys are NEVER on the wire — only this id.
  // (multi-provider Phase 0, S3.)
  string provider_id = 4;

  // model_id is the opaque model selector within provider_id. Empty => the
  // provider's default model. An id ListModels did not advertise is passed
  // through to the provider VERBATIM (a power-user escape hatch for a model the
  // embedded catalog doesn't yet know). NOT slash-joined with provider_id —
  // two distinct fields by design. Setting model_id WITHOUT provider_id is a loud
  // InvalidArgument (a bare model on an env-derived default provider is ambiguous).
  string model_id = 5;

  // profile selects the session's TOOL-SURFACE profile, enum-as-string (the
  // Event.type / Result.stop idiom — no proto enum, additive values):
  //
  //   - "" (default): the full filesystem profile — today's behaviour,
  //     byte-identical. REQUIRES a non-empty workspace.
  //   - "no-fs": a session with NO filesystem at all — no workspace, no
  //     Read/Edit/Write/Grep/Glob/Bash, no Parallel, no SkillDraft; the agent
  //     works through MCP tools, memory, web fetch, Skill bodies, and
  //     delegation (Subagent/Team with the same file-less surface). REQUIRES an
  //     EMPTY workspace (see the workspace cross-field rule above).
  //
  // Any other value is a loud InvalidArgument, never a silent fallback to the
  // default profile. The profile is FIXED for the session lifetime.
  string profile = 6;

  // reasoning_effort sets this session's reasoning-effort tier, enum-as-string
  // (the profile / Result.stop idiom — NO proto enum, additive values):
  //
  //   - "" or "auto": UNSET — do not send a reasoning-effort field; the
  //     operator default (and ultimately the provider default) applies.
  //   - "low" / "medium" / "high" / "xhigh" / "max": the neutral effort tiers.
  //
  // The server NORMALISES and per-provider CLAMPS the value (OpenAI supports
  // low/medium/high only, so xhigh/max clamp DOWN to high; Anthropic maps all
  // five) and CAPABILITY-GATES it (a model with no reasoning support drops it).
  // An unknown value falls back to the operator default with a WARN (it never
  // 400s the request). It OUT-RANKS the operator default; unlike model_id it is
  // meaningful WITHOUT a provider_id (it rides the server-default provider). The
  // EFFECTIVE resolved value is echoed back on resolved_model.reasoning_effort.
  string reasoning_effort = 7;

  // source_session_id, when non-empty, seeds the NEW session's conversation
  // history from the source session's (via session.ForkSnapshot + SeedHistory).
  // Carryover is ALWAYS allowed across providers: a model switch must never
  // drop the conversation. A SAME-provider carryover replays the history
  // VERBATIM (provider-private replay blobs intact, warm cache); a
  // CROSS-provider carryover seeds a PROVIDER-NEUTRAL copy — Reasoning /
  // ProviderPhase / ToolCall.ItemID are stripped (session.StripProviderState),
  // so the history replays safely to any provider (the new session's
  // thinking/reasoning config is derived from the NEW model, not the history).
  // The source must be at a turn boundary (idle/completed/cancelled/failed —
  // the run-entry funnel recovers terminal states); a running/awaiting source
  // is rejected with FailedPrecondition. Empty means no carryover
  // (byte-identical default).
  string source_session_id = 8;
}

// ServerCapabilities reports which optional features this server has ENABLED,
// so a client can present an honest UI (advertise only reachable features, and
// explain an empty inventory as "not enabled" vs "enabled but empty"). Each
// field reflects the BUILT service state (registered tools / wired seams), never
// a static guess — see internal/adapter/server.Service.capabilities(). All
// fields default false, so a client talking to an OLDER server (no caps field)
// degrades safely to "nothing advertised" rather than over-promising. The set is
// designed to grow additively: a new feature adds a new `bool field = N;` that
// old clients ignore and new clients reading an old server see as false.
message ServerCapabilities {
  // mcp is true when MCP inventory/resources/prompts are available (an MCP
  // provider is wired). Gates ctrl+o / ctrl+r / ctrl+p.
  bool mcp = 1;
  // slash_commands is true when slash-command discovery is available (a command
  // lister is wired). Gates the / palette.
  bool slash_commands = 2;
  // memory is true when cross-session memory tools (Remember/Recall) are
  // registered. Agent-side: no overlay, surfaced as prose only.
  bool memory = 3;
  // skills is true when the Skill tool is registered. Gates the /skills
  // inventory browser (the read-only ListSkills snapshot). Activation stays the
  // model's concern — the panel is discovery only.
  bool skills = 4;
  // teams is true when agent teams are enabled (a member-engine factory is
  // wired). Gates the ctrl+a deep view's relevance.
  bool teams = 5;
  // bash is true when the Bash tool is registered (i.e. NOT --no-bash).
  bool bash = 6;
  // image is true when the wired LLM provider consumes image prompt parts.
  // Gates the @-mention file-attach UX for images (a client refuses to send an
  // image part to a server whose provider cannot read it).
  bool image = 7;
  // audio is true when the wired LLM provider consumes audio prompt parts.
  // Gates the @-mention file-attach UX for audio.
  bool audio = 8;
  // agents is true when the agent-definition registry is resolvable and served
  // (ListAgents returns the resolved snapshot). Independent of `teams` (the
  // run-path member-engine): defs can be browsable without teams enabled.
  // Gates the /agents definition-inventory panel.
  bool agents = 9;
  // soul is true when a soul source is wired (a soul was selected at startup, so
  // GetSoul returns its snapshot). Gates the /soul read-only inspection panel.
  bool soul = 10;
  // user_model is true when the user-model store is wired (GetUserModel reads its
  // live index). Gates the /usermodel read-only inspection panel.
  bool user_model = 11;
  // model_selection is true when >=1 provider is available (ListModels would return
  // >0). Gates the client's /models picker the same way `agents` gates /agents.
  // Additive: an older server leaves it false and the client hides the picker.
  // (multi-provider Phase 0, S3.)
  bool model_selection = 12;
  // posture is the SERVER-WIDE operator posture-ladder tier ("strict"/"trusted"/
  // "auto"/"yolo"). It is CHROME ONLY — a client renders an honest "⚠ auto"/"⚠ yolo"
  // badge so an operator can see the daemon's automation posture at a glance — and is
  // NEVER session state (it does not change per session; permission MODE is the
  // per-session knob). String passthrough, no enum on the wire (the EvNoProgress /
  // StopBudget discipline). Additive: an older server leaves it empty and the client
  // shows no badge (strict/trusted also show no badge).
  string posture = 13;
  // worktrees is true when a WorktreeLister is wired (ListWorktrees may return a
  // non-empty list for a real git repo). Gates the client's /worktrees overlay —
  // the first-class operator workflow for binding a session to an EXISTING sibling
  // git worktree (issue #102). Additive: an older server leaves it false and the
  // client hides the overlay. A no-FS/cloud server (no lister wired) also yields
  // false, so the feature is honestly absent there.
  bool worktrees = 14;
  // scheduling is true when a ScheduleStore is reachable (the schedule RPCs are
  // functional: Create/List/Get/Pause/Resume/Delete/FireNow/GetFire/ListFires).
  // Gates the client's /schedule overlay. Independent of the scheduler tick
  // loop (--scheduler): the store-backed RPCs work without the tick loop.
  // Additive: an older server leaves it false and the client hides the overlay.
  bool scheduling = 15;
}

// CreateSessionResponse carries the newly-allocated session id.
message CreateSessionResponse {
  // session_id is the id of the created session.
  string session_id = 1;
  // capabilities reports which optional features this server has enabled, for an
  // honest client UI. Nil/absent from an older server → treat as all-false.
  ServerCapabilities capabilities = 2;

  // session_capabilities reports the multimodal input capability of the
  // provider+model THIS session actually resolved to — the INTERSECTION of the
  // catalog's per-model modalities and the wired adapter's transmit capability,
  // computed once in composition (internal/app). It MAY differ from `capabilities`
  // (the server-wide shared-engine view) when the request carried
  // provider_id/model_id selecting a NON-default engine. Clients gate per-session
  // @-attach UX on THIS, not the server-wide bits. Nil/absent from an older server
  // → fall back to `capabilities`. (multi-provider Phase 0, S5.)
  SessionCapabilities session_capabilities = 3;

  // resolved_model reports the EFFECTIVE provider+model THIS session actually
  // resolved to, plus its context window — the single value computed once in
  // composition (internal/app), the SAME composition-computed single-source
  // discipline as session_capabilities (NEVER recomputed in a handler). It is
  // echoed VERBATIM: the server owns the resolution (the empty-selector default,
  // an env-derived provider, a passthrough model), so a client must read THIS
  // rather than the model_id it sent (which is empty for a default session and
  // ambiguous for passthrough). The model is FIXED per TURN; it is re-resolved
  // BETWEEN turns when the session's permission mode changes the effective model
  // (the plan-slot / opusplan pattern, ADR 0030 Layer 3) — re-read it from
  // GetSession after a mode change. Nil/absent from an older server → the client
  // falls back to today's behavior (no model segment in the header).
  ResolvedModel resolved_model = 4;
}

// ResolvedModel is the per-session EFFECTIVE model: the provider+model id this
// session resolved to and its context window. Composition-computed and echoed
// verbatim (see CreateSessionResponse.resolved_model); the model is FIXED per TURN
// and re-resolved between turns when the permission mode changes the effective
// model (plan-slot / opusplan, ADR 0030 Layer 3). The client resolves a human
// display name from its ListModels inventory by (provider_id, model_id) — no
// display_name is carried here.
message ResolvedModel {
  // provider_id is the resolved provider (e.g. "openai", "anthropic").
  string provider_id = 1;
  // model_id is the resolved model id (the opaque id the adapter was given).
  string model_id = 2;
  // context_window is the resolved model's context window in tokens (0 = unknown).
  int64 context_window = 3;
  // reasoning_effort is the EFFECTIVE reasoning-effort tier this session resolved
  // to, enum-as-string (the same neutral vocabulary as
  // CreateSessionRequest.reasoning_effort, NO proto enum): "" when unset (the
  // provider default applies), else the normalised + per-provider-CLAMPED token
  // actually wired into the adapter — e.g. an OpenAI session that requested "max"
  // echoes "high". The client renders it (e.g. in the model footer) and never
  // recomputes it.
  string reasoning_effort = 4;
}

// SessionCapabilities is the per-session resolved input capability: ONLY the
// model-varying input bits (image/audio). A dedicated message (not a reuse of
// ServerCapabilities) keeps the per-session surface MINIMAL — the other
// ServerCapabilities bits (mcp/skills/teams/...) are server-wide and would be
// misleading per session. Reasoning is intentionally EXCLUDED: it is discoverable
// via ListModels for the selected id and is not a per-session input-gating
// concern (no adapter "can replay reasoning" authority bit exists). The value is
// the catalog ∩ adapter intersection computed in composition. (Phase 0, S5.)
message SessionCapabilities {
  // image is true when the resolved provider+model can consume image prompt parts.
  bool image = 1;
  // audio is true when the resolved provider+model can consume audio prompt parts.
  bool audio = 2;
}

// GetSessionRequest looks up an existing session by id.
message GetSessionRequest {
  // session_id is the id to look up.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetSessionResponse wraps the session snapshot returned by GetSession.
message GetSessionResponse {
  // session is the snapshot of the requested session.
  Session session = 1;
}

// StreamSessionEventsRequest names the session whose durable event log is replayed.
message StreamSessionEventsRequest {
  // session_id is the id of the session to replay. An unknown id yields an empty
  // stream (absence is data); a server with no durable EventLog returns
  // UNIMPLEMENTED.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// StreamSessionLiveRequest names the session whose LIVE event stream is opened.
message StreamSessionLiveRequest {
  // session_id is the id of the session to subscribe to. An unknown id yields an
  // empty stream (absence is data — a never-created id is indistinguishable from
  // a session with no live events yet).
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListSessionsRequest is the empty unary request for the stored-session inventory.
message ListSessionsRequest {}

// SessionSummary is one stored session's picker metadata — id, timestamps, state,
// turn count, and the resolved model id. It carries NO conversation content: it is
// the cheap row a client renders in an "open existing session" picker (issue #245
// Phase 1). `model_id` is a bare opaque string (NOT a full ResolvedModel) to keep
// the picker row cheap and provider-neutral — the client resolves a display name
// from its ListModels inventory by (provider_id, model_id) if it needs one.
message SessionSummary {
  // session_id is the stored session's id.
  string session_id = 1;
  // modified_at_unix is the last-write timestamp in Unix seconds (the
  // PrunableStore row mtime; the sort key for the picker).
  int64 modified_at_unix = 2;
  // state is the persisted lifecycle state (idle/running/awaiting/completed/...).
  // Empty when the snapshot could not be loaded (a corrupt store row still
  // surfaces its id/mtime).
  string state = 3;
  // turns is the persisted model-call count. Zero when the snapshot could not be
  // loaded.
  int32 turns = 4;
  // model_id is the resolved model id this session ran on (bare string, no
  // provider context). Empty when the session never resolved a model or the
  // snapshot could not be loaded.
  string model_id = 5;
  // created_at_unix is the creation timestamp in Unix seconds. Zero when the
  // snapshot could not be loaded.
  int64 created_at_unix = 6;
  // title is the human-readable session label seeded from the first genuine user
  // prompt (clamped to 120 runes). Empty for a session with no label (a client
  // may derive a fallback). Populated from the snapshot Title (or the lazy
  // fallback) by ListSessions.
  string title = 7;
}

// ListSessionsResponse carries the stored-session inventory, sorted by
// modified_at descending (most-recently-active first).
message ListSessionsResponse {
  // sessions are the (possibly empty) stored-session summaries.
  repeated SessionSummary sessions = 1;
}

// SetModeRequest changes a session's permission posture.
message SetModeRequest {
  // session_id is the session to update.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // mode is the desired permission posture; unspecified defaults to DEFAULT.
  PermissionMode mode = 2;
}

// SetModeResponse wraps the updated session snapshot returned by SetMode.
message SetModeResponse {
  // session is the updated session snapshot.
  Session session = 1;
}

// CloseSessionRequest names the session to end.
message CloseSessionRequest {
  // session_id is the session to close.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CloseSessionResponse is the empty acknowledgement.
message CloseSessionResponse {}

// ForkSessionRequest names the source session to fork from.
message ForkSessionRequest {
  // source_session_id is the session whose conversation history is snapshotted
  // into the new peer session.
  string source_session_id = 1 [(buf.validate.field).string.min_len = 1];
  // title is an OPTIONAL override for the forked session's title. Empty (the
  // default) inherits the source's title verbatim; a non-empty value overrides
  // it so the operator can distinguish "implement feature X" from "fix the bug
  // first" in ListSessions without a separate rename RPC.
  string title = 2;
  // reasoning_effort is an OPTIONAL override for the forked session's
  // reasoning-effort tier (ADR 0068). Empty (the default) inherits the source's
  // effort verbatim; provider and model ALWAYS inherit — the effort is the ONE
  // selector delta a fork may carry.
  string reasoning_effort = 3;
}

// ForkSessionResponse carries the new forked session's id.
message ForkSessionResponse {
  // session_id is the id of the newly-created forked session.
  string session_id = 1;
}

// Session is a snapshot of server-side session state.
message Session {
  // session_id is the session's id.
  string session_id = 1;
  // state is the lifecycle state (idle/running/awaiting/completed/...).
  string state = 2;
  // mode is the permission posture.
  PermissionMode mode = 3;
  // workspace is the session root.
  string workspace = 4;
  // limits are the configured stop conditions.
  Limits limits = 5;
  // turns is the number of model calls begun.
  int32 turns = 6;
  // tool_calls is the total number of tool invocations recorded.
  int32 tool_calls = 7;
  // created_at_unix is the creation timestamp in Unix seconds.
  int64 created_at_unix = 8;
  // resolved_model is the EFFECTIVE provider+model this session resolved to
  // (composition-computed, echoed verbatim; FIXED per TURN, re-resolved between
  // turns on a permission-mode change — plan-slot / opusplan, ADR 0030 Layer 3).
  // Mirrors CreateSessionResponse.resolved_model so a snapshot reader (GetSession)
  // sees the same effective model the create response carried — and is the canonical
  // place a client re-reads the model AFTER a mode change. Nil/absent from an older
  // server → client falls back to today's behavior.
  ResolvedModel resolved_model = 9;
  // title is the human-readable session label seeded from the first genuine user
  // prompt (clamped to 120 runes). Empty for a session with no label (a client
  // may derive a fallback). Populated from the snapshot Title (or the lazy
  // fallback in GetSession) — the loop seeds it once via session.SetTitle.
  string title = 10;
}

// ConverseRequest is a client-to-server frame on the Converse stream. The
// first frame MUST be `prompt`. Field numbers 1-9 are reserved for the
// start family; 10+ for the gate/cancellation family.
message ConverseRequest {
  oneof kind {
    // prompt is the mandatory first frame; it names the session and the text.
    Prompt prompt = 1;
    // resume_approval resolves a paused permission.ask.
    ResumeApproval resume_approval = 10;
    // cancel aborts the in-flight run.
    Cancel cancel = 11;
    // cancel_child cancels ONE child run (a subagent) of the in-flight run,
    // leaving the run itself (and any sibling children) untouched.
    CancelChild cancel_child = 12;
  }
}

// ConverseResponse is a server-to-client frame: one Event envelope per
// domain event, emitted in sequence order until the terminal result.
message ConverseResponse {
  // event is the domain event for this frame.
  Event event = 1;
}

// Content is one non-text part of a multimodal user prompt. EXACTLY ONE of
// data/url is set: data carries inline bytes, url a remote reference. mime_type
// is the IANA media type (e.g. "image/png", "audio/wav"). The "data XOR url" and
// "kind != UNSPECIFIED" rules are enforced by the server (the mapper rejects a
// malformed part), not at the wire layer.
message Content {
  // Kind discriminates the media kind of the part.
  enum Kind {
    // KIND_UNSPECIFIED is rejected by the server: every part must name its kind.
    KIND_UNSPECIFIED = 0;
    // KIND_IMAGE is an image part.
    KIND_IMAGE = 1;
    // KIND_AUDIO is an audio part.
    KIND_AUDIO = 2;
  }
  // kind is the media kind (image / audio); UNSPECIFIED is rejected.
  Kind kind = 1;
  // mime_type is the IANA media type of the part.
  string mime_type = 2;
  // data is the inline content bytes; empty when url-sourced.
  bytes data = 3;
  // url is the remote reference; empty when inline.
  string url = 4;
}

// ContentBlock is a typed content block on a tool result (mirrors
// session.Content for tool-result Parts). A sum-type over Kind.
message ContentBlock {
  // Kind discriminates the block kind.
  enum Kind {
    // KIND_UNSPECIFIED is the zero value; consumers treat it as absent.
    KIND_UNSPECIFIED = 0;
    // KIND_TEXT is a text block.
    KIND_TEXT = 1;
    // KIND_IMAGE is an inline image block.
    KIND_IMAGE = 2;
    // KIND_AUDIO is an inline audio block.
    KIND_AUDIO = 3;
    // KIND_RESOURCE_LINK is a reference to an MCP resource by URI.
    KIND_RESOURCE_LINK = 4;
    // KIND_EMBEDDED_RESOURCE is an embedded MCP resource (text or blob).
    KIND_EMBEDDED_RESOURCE = 5;
    // KIND_STRUCTURED_CONTENT is a JSON structured-content block.
    KIND_STRUCTURED_CONTENT = 6;
  }
  // kind is the block kind.
  Kind kind = 1;
  // mime_type is the IANA media type of inline bytes (image/audio/blob).
  string mime_type = 2;
  // data is the inline content bytes (image/audio/blob).
  bytes data = 3;
  // url is the remote reference (resource-link URI, or URL-sourced media).
  string url = 4;
  // text is the text payload (BlockText, BlockEmbeddedResource text, or
  // BlockStructuredContent JSON).
  string text = 5;
  // name is the resource-link name.
  string name = 6;
  // title is the resource-link title.
  string title = 7;
  // description is the resource-link description.
  string description = 8;
  // size is the resource-link size in bytes.
  int64 size = 9;
  // audience is advisory display routing only (CWE-345: untrusted).
  repeated string audience = 10;
  // priority is the advisory display priority.
  double priority = 11;
  // last_modified is the resource-link last-modified timestamp (RFC 3339).
  string last_modified = 12;
}

// Prompt is the mandatory first Converse frame. It names the session the run
// executes against and the user prompt to process. The prompt is text and/or
// media: at least one of text/parts must be non-empty. The "text or parts
// non-empty" rule is a CROSS-FIELD constraint enforced by the server (the proto
// only carries per-field constraints), which is why text no longer carries a
// min_len — it is optional when parts is set.
message Prompt {
  // session_id is the session this run belongs to.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // text is the flattened user prompt text; optional when parts is set.
  string text = 2;
  // parts carries non-text media (image/audio) alongside the text.
  repeated Content parts = 3;
}

// ResumeApproval releases a paused permission.ask, allowing or denying the
// proposed tool call. The ask_id echoes the PermissionAsk.ask_id from the
// event stream.
message ResumeApproval {
  // ask_id correlates the resolution with the paused ask.
  string ask_id = 1 [(buf.validate.field).string.min_len = 1];
  // allow permits the tool when true, denies it when false. LEGACY: kept for
  // back-compat with clients that predate `verdict`. When `verdict` is set
  // (!= APPROVAL_VERDICT_UNSPECIFIED) it takes precedence and this bool is
  // ignored; otherwise true maps to ALLOW_ONCE and false to DENY.
  bool allow = 2;
  // verdict is the three-way resolution: deny, allow this call once, or allow
  // always (which additionally LEARNS a per-session allow rule for the matching
  // tool + exact pattern). Preferred over `allow`; UNSPECIFIED falls back to it.
  ApprovalVerdict verdict = 3;
}

// ApprovalVerdict is the client's three-way resolution of a permission.ask,
// mirroring session.ApprovalVerdict. ALLOW_ALWAYS both permits the current call
// and asks the harness to learn a per-session allow rule for the same tool +
// exact canonical pattern; it NEVER overrides a deny and NEVER bypasses plan-mode
// mutation denial.
enum ApprovalVerdict {
  // APPROVAL_VERDICT_UNSPECIFIED falls back to the legacy `allow` bool at the
  // server boundary (true -> ALLOW_ONCE, false -> DENY).
  APPROVAL_VERDICT_UNSPECIFIED = 0;
  // APPROVAL_VERDICT_DENY refuses the proposed tool call.
  APPROVAL_VERDICT_DENY = 1;
  // APPROVAL_VERDICT_ALLOW_ONCE permits this call only; nothing is learned.
  APPROVAL_VERDICT_ALLOW_ONCE = 2;
  // APPROVAL_VERDICT_ALLOW_ALWAYS permits this call and learns a per-session
  // allow rule for the matching tool + exact pattern.
  APPROVAL_VERDICT_ALLOW_ALWAYS = 3;
}

// Cancel aborts the in-flight run. The loop observes the cancellation and
// terminates with a result carrying stop = "cancelled".
message Cancel {}

// CancelChild cancels ONE child of the in-flight run, addressed by its child
// SESSION id — the same handle the model reads on the Subagent result's
// "agentId:" line and clients read on subagent.start's child_id (no derivation;
// one handle everywhere). The child unwinds (mid-drive, mid-gate-wait, or parked
// on a surfaced permission.ask — the server then emits a permission.retract for
// each withdrawn ask), ends StopCancelled, is persisted, and stays resumable;
// the parent run keeps streaming. Unknown or already-finished ids are ignored on
// the stream (the finished-as-you-pressed race is benign); the HTTP mirror
// (POST /v1/sessions/{id}/cancel-child) reports them as 404.
message CancelChild {
  // child_id is the child session id, verbatim (e.g. "subagent-<callID>").
  string child_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Event mirrors the domain session.Event one-for-one. `type` is the string
// event kind; the structured submessages are populated per kind.
message Event {
  // type is the event kind (mirrors session.EventType: session.init,
  // turn.start, turn.end, message.delta, reasoning.delta, tool.call,
  // tool.result, permission.ask, hook, compaction, result).
  string type = 1;
  // seq is the monotonically increasing sequence number within a run.
  int64 seq = 2;
  // turn is the 0-based turn index this event belongs to (mirrors
  // session.Event.Turn; clients add 1 for a human-facing "turn N").
  int32 turn = 3;
  // text carries streamed or final text where applicable.
  string text = 4;
  // tool_call is set on tool.call events.
  ToolCall tool_call = 5;
  // tool_result is set on tool.result events.
  ToolResult tool_result = 6;
  // ask is set on permission.ask events; ask_id is echoed in ResumeApproval.
  PermissionAsk ask = 7;
  // result is set on the terminal result event.
  Result result = 8;
  // usage is set on usage-bearing events. On the result event it is the
  // cumulative run total; turn.end carries its per-turn usage in turn_end.
  Usage usage = 9;
  // turn_end is set on turn.end events (this turn's usage + elapsed time).
  TurnEnd turn_end = 10;
  // hook is set on hook events: the structured phase/tool/decision so clients
  // render hook notices distinctly (and colour blocked ones) instead of parsing
  // the free-text `text` field.
  Hook hook = 11;
  // subagent is set on the three subagent.* events (subagent.start /
  // subagent.tool / subagent.end): a REDACTED, metadata-only projection of a Task
  // child run. It NEVER carries child content (no message text, tool args, or
  // result bodies) — only ids, a goal label, tool names/counts, usage, stop, and
  // duration — so the context-isolation guarantee is preserved.
  Subagent subagent = 12;
  // team is set on the three team.* events (team.start / team.member / team.end):
  // a BOUNDED projection of an in-process Team tool run. Unlike subagent (metadata
  // only), it is fuller — team.member carries member message text and CAPPED
  // tool-call/result previews — but it is STILL bounded (every preview is capped)
  // and a member's permission.ask is DROPPED, never forwarded. The per-member
  // transcripts never enter the parent conversation (only the joined summary does).
  Team team = 13;
  // parallel is set on the three parallel.* events (parallel.start /
  // parallel.branch / parallel.end): a REDACTED, metadata-only projection of a
  // Parallel fork-join run. Like subagent it NEVER carries branch content (no
  // message text, tool args, or result bodies) — only ids, a goal label, tool
  // names/counts, usage, stop, duration, the join strategy, the winner index, and
  // the per-branch / winner fork-root PATHS (a handle already in the result text,
  // not branch content). The branch summaries fold into the parent conversation
  // only via the Parallel tool result.
  Parallel parallel = 14;
  // schedule.* — the scheduler lifecycle (EvScheduleFired/Skipped/Failed). For v1
  // delivered to the fire session's durable EventLog ONLY (pull-only via
  // GetFire/ListFires); a live broadcast stream is a future phase. Emitted from
  // composition (the scheduler), NOT the loop. String-passthrough kind/stop/err,
  // no enum.
  SchedulePayload schedule = 15;
  // approval is set on approval events (EvApproval — the verdict half of a
  // permission ask). LOG-ONLY on the live Converse wire (the relay skips them:
  // the client holds its own verdict; this is audit history). StreamSessionEvents
  // (the read-back of the durable log) relays them so a transcript replay shows
  // the verdicts. Metadata-only by construction (gauntlet #7): tool NAME + verdict
  // string + askID, NEVER raw args.
  Approval approval = 16;
  // user_prompt is set on user_prompt events (EvUserPrompt — the recorded user
  // message). LOG-ONLY on the live Converse wire; StreamSessionEvents relays them
  // so a transcript replay shows what the user asked.
  UserPrompt user_prompt = 17;
  // compaction_archive is set on compaction.archive events (EvCompactionArchive —
  // the pre-compaction conversation). LOG-ONLY on the live Converse wire;
  // StreamSessionEvents relays them so a transcript replay recovers dropped turns.
  CompactionArchive compaction_archive = 18;
}

// Approval is the proto projection of session.ApprovalPayload (EvApproval):
// the verdict half of a permission ask. Metadata-only (gauntlet #7): tool NAME +
// verdict string + askID + the opaque gated-call id + the allow-always flag.
// NEVER raw args. LOG-ONLY on the live Converse wire; surfaced only by the
// StreamSessionEvents replay.
message Approval {
  // ask_id is the id of the resolved permission ask (mirrors PermissionAsk.ask_id).
  string ask_id = 1;
  // verdict is the resolution string (allow_once / allow_always / deny) — a
  // passthrough of session.VerdictString*, no enum.
  string verdict = 2;
  // tool is the NAME of the tool the ask gated. It is the tool name ALONE — never
  // the call's args.
  string tool = 3;
  // call_id is the opaque id of the gated ToolCall (the durable, grammar-free
  // correlation handle a 3b consumer uses to find the call in the conversation).
  string call_id = 4;
  // allow_always mirrors (Verdict == allow_always): the verdict asked the harness
  // to learn a per-session allow rule. It honestly reflects the VERDICT, not the
  // policy outcome (Policy.Learn may no-op on an unlearnable call).
  bool allow_always = 5;
}

// UserPrompt is the proto projection of session.UserPromptPayload (EvUserPrompt):
// the recorded user message (Text + non-text media Parts). It is the durable
// record of what the user asked. LOG-ONLY on the live Converse wire; surfaced only
// by the StreamSessionEvents replay.
message UserPrompt {
  // text is the flattened user-message text (the prompt body, or a harness-authored
  // continuation/notice).
  string text = 1;
  // parts carries any non-text media (image/audio) that rode alongside the text on
  // the user message; nil for a text-only prompt.
  repeated Content parts = 2;
}

// CompactionArchive is the proto projection of session.CompactionArchivePayload
// (EvCompactionArchive): the pre-compaction conversation that ReplaceHistory
// replaced. It carries the full pre-compaction Messages slice so a replay recovers
// the dropped turns. The parent's OWN conversation (gauntlet #7 — no child content).
// LOG-ONLY on the live Converse wire; surfaced only by the StreamSessionEvents
// replay.
message CompactionArchive {
  // replaced is the pre-compaction message slice (each message is a
  // ConversationMessage).
  repeated ConversationMessage replaced = 1;
}

// ConversationMessage is the proto projection of one session.Message (an immutable
// entry in the model-visible conversation history). It exists so the
// CompactionArchive payload can carry a message slice — the live Converse wire has
// no message-slice surface (the relay streams events, not history), so this type is
// introduced here for the replay path. It mirrors the Message value object: Role +
// Text + the assistant's ToolCalls + an optional tool-role ToolResult + the opaque
// provider replay blobs (Reasoning / ProviderPhase) + the user-role media Parts.
message ConversationMessage {
  // role is the author (user / assistant / tool / system).
  string role = 1;
  // text is the message body (assistant text, user prompt, etc.).
  string text = 2;
  // tool_calls holds the tool invocations requested by an assistant message.
  repeated ToolCall tool_calls = 3;
  // tool_result holds the result carried by a tool-role message; nil otherwise.
  ToolResult tool_result = 4;
  // reasoning is the provider's opaque reasoning REPLAY blob, replayed back
  // verbatim and never interpreted/displayed by the harness.
  string reasoning = 5;
  // provider_phase is the OpenAI Responses opaque phase marker on an assistant
  // message, replayed verbatim and never interpreted/displayed.
  string provider_phase = 6;
  // parts carries non-text media (image/audio) on a USER message; nil otherwise.
  repeated Content parts = 7;
}

// SchedulePayload is the structured detail carried by the schedule.* events

// SchedulePayload is the structured detail carried by the schedule.* events
// (EvScheduleFired / EvScheduleSkipped / EvScheduleFailed). Mirrors
// session.SchedulePayload. Emitted from composition (the scheduler) at fire
// time, NOT the agent loop. For v1 delivered to the fire session's durable
// EventLog ONLY (pull-only via GetFire/ListFires); a live broadcast stream is a
// future phase. kind / stop / err are STRING passthroughs (the EvNoProgress /
// StopBudget discipline — no proto enum). Defined here (not schedule.proto)
// because it is the Event.schedule projection — Event lives in harness.proto,
// and a cross-file reference back from harness.proto into schedule.proto would
// form a circular import (schedule.proto imports harness.proto for the shared
// Content/PermissionMode/Limits). Colocating the projection with Event breaks
// the cycle cleanly.
message SchedulePayload {
  // schedule_name is the schedule that fired / was skipped / failed.
  string schedule_name = 1;
  // fire_id is the per-fire session id (the same id ScheduleFire.id /
  // ScheduleFire.session_id carry).
  string fire_id = 2;
  // session_id is the session the fire ran as (== fire_id for a fired fire;
  // empty for a skipped fire).
  string session_id = 3;
  // kind is the event kind: "fired" / "skipped" / "failed". String passthrough,
  // no proto enum.
  string kind = 4;
  // stop is the terminal stop reason of the fire's run (a session.StopReason
  // string passthrough). Empty for a skipped fire.
  string stop = 5;
  // err is the error string if the fire's run failed, empty otherwise.
  string err = 6;
}

// HookDecision is the outcome a hook fire produced. Mirrors
// session.HookDecision; lets a client colour/rank a hook notice without parsing
// its prose.
enum HookDecision {
  // HOOK_DECISION_UNSPECIFIED defaults to INFO at the boundary.
  HOOK_DECISION_UNSPECIFIED = 0;
  // HOOK_DECISION_INFO is a benign, informational hook notice.
  HOOK_DECISION_INFO = 1;
  // HOOK_DECISION_BLOCKED means the hook vetoed the action (can abort a run).
  HOOK_DECISION_BLOCKED = 2;
  // HOOK_DECISION_MODIFIED means the hook rewrote the action's payload.
  HOOK_DECISION_MODIFIED = 3;
  // HOOK_DECISION_ADVISORY means the hook flagged content as a finding but did
  // not alter the call/result (advisory guardrail). Client-visible warning,
  // model-invisible.
  HOOK_DECISION_ADVISORY = 4;
}

// Hook is the structured payload carried by a hook event, in addition to the
// human-readable Event.text. Mirrors session.HookPayload.
message Hook {
  // phase is the lifecycle point the hook fired at (e.g. "PreToolUse"); empty
  // when not applicable.
  string phase = 1;
  // tool is the tool the hook relates to for per-tool phases; empty otherwise.
  string tool = 2;
  // decision is the hook outcome (info / blocked / modified).
  HookDecision decision = 3;
  // call_id is the id of the tool call this hook fired against, for the per-tool
  // phases (PreToolUse / PostToolUse); empty otherwise. Lets a client address the
  // hook notice to the originating tool card. Mirrors session.HookPayload.CallID.
  string call_id = 4;
}

// Subagent is the REDACTED observability projection carried by the three
// subagent.* events. Mirrors session.SubagentPayload. It carries metadata ONLY —
// no child message text, tool args, or result bodies — so a client can render a
// Task subagent's activity (a goal title, a trace of tool names, and final stats)
// without ever seeing the child's content, preserving context isolation.
//
// Which fields are set depends on the event kind:
//   - subagent.start: parent_call_id, child_id, goal, routed_category, routed_model, model.
//   - subagent.tool:  parent_call_id, child_id, tool_name, is_error, tool_count.
//   - subagent.end:   parent_call_id, child_id, tool_count, usage, stop, duration_ms.
message Subagent {
  // parent_call_id is the parent's Task tool-call id, attributing the event to
  // the originating Task card.
  string parent_call_id = 1;
  // child_id is the child session id, distinguishing concurrent subagents.
  string child_id = 2;
  // goal is a short, plain-text label for the delegated task (subagent.start).
  string goal = 3;
  // tool_name is the name of a child tool that just ran (subagent.tool) — the
  // name alone, never the child's args or result.
  string tool_name = 4;
  // is_error reports whether that child tool call failed (subagent.tool).
  bool is_error = 5;
  // tool_count is the running (subagent.tool) or final (subagent.end) child
  // tool-call count.
  int32 tool_count = 6;
  // usage is the child run's cumulative token accounting (subagent.end).
  Usage usage = 7;
  // stop is the child run's terminal stop reason (subagent.end).
  string stop = 8;
  // duration_ms is the child run's wall-clock duration in milliseconds
  // (subagent.end; best-effort).
  int64 duration_ms = 9;
  // background reports a background (detached-delivery) child on subagent.start:
  // the Subagent call returned an immediate started-result and the child keeps
  // working while the parent run continues (its result is collected via the
  // SubagentStatus tool).
  bool background = 10;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label
  // for this delegation (subagent.start only), set when the router was wired AND
  // classified this delegation (empty otherwise — no router, or a fail-soft miss
  // that inherited the default model). BARE METADATA — a label, never the task
  // prompt or classifier reasoning — so it is context-isolation safe (gauntlet
  // #7: no child content crosses). Mirrors session.SubagentPayload.RoutedCategory.
  string routed_category = 11;
  // routed_model is the concrete MODEL id the routed child was minted on
  // (subagent.start only), paired with routed_category. BARE METADATA — a model
  // id, never model-influenced free text — so it is context-isolation safe
  // (gauntlet #7). Mirrors session.SubagentPayload.RoutedModel.
  string routed_model = 12;
  // model is the concrete MODEL id this child ACTUALLY ran on (subagent.start
  // only), regardless of how it was chosen — inherited default, agent-def pin,
  // per-call `model` override, or the opt-in router. BARE METADATA — a model id,
  // never child content — so it is context-isolation safe (gauntlet #7: no child
  // content crosses). When the router classified this delegation, model ==
  // routed_model. Mirrors session.SubagentPayload.Model.
  string model = 13;
}

// TeamMemberSpec is one roster entry forwarded on team.start. Mirrors
// session.TeamMemberSpec. It carries ONLY model-supplied metadata about the team's
// shape — never any member content (no prompt body, no transcript).
message TeamMemberSpec {
  // name is the member's unique handle.
  string name = 1;
  // role is the member's short role label.
  string role = 2;
  // mutating reports whether the member runs in an isolated fork with
  // workspace-mutating tools (true) or shares the base read-only (false).
  bool mutating = 3;
  // lead marks the coordinating member.
  bool lead = 4;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label for
  // this member (team.start roster only), set when the router was wired AND classified
  // this member (empty otherwise — no router, a fail-soft miss that inherited the
  // default member model, or a DEFINED member whose agent def pinned its own model so
  // the router never fired). BARE METADATA — a label, never the member's role/prompt or
  // classifier reasoning — so it is context-isolation safe (gauntlet #7: no member
  // content crosses). Mirrors session.TeamMemberSpec.RoutedCategory.
  string routed_category = 5;
  // routed_model is the concrete MODEL id the routed member's engine was minted on
  // (team.start roster only), paired with routed_category. BARE METADATA — a model id,
  // never model-influenced free text — so it is context-isolation safe (gauntlet #7).
  // Mirrors session.TeamMemberSpec.RoutedModel.
  string routed_model = 6;
  // model is the concrete MODEL id this member's engine ACTUALLY runs on
  // (team.start roster only), regardless of how it was chosen — inherited default
  // member model, agent-def pin, or the opt-in router. BARE METADATA — a model id,
  // never member content — so it is context-isolation safe (gauntlet #7: no member
  // content crosses). When the router classified this member, model == routed_model.
  // Mirrors session.TeamMemberSpec.Model.
  string model = 7;
}

// Team is the BOUNDED observability projection carried by the three team.* events.
// Mirrors session.TeamPayload. Unlike Subagent (metadata only), it is deliberately
// FULLER — a team is meant to be watched — so team.member carries the member's
// message text and CAPPED previews of its tool calls/results. It is STILL bounded:
// every preview (text/detail) is capped, and a member's permission.ask is DROPPED
// entirely (never projected). The per-member transcripts never enter the parent
// conversation — only the Team tool's joined-summary result does.
//
// Which fields are set depends on the event kind:
//   - team.start:  parent_call_id, team_id, roster.
//   - team.member: parent_call_id, team_id, member, inner_kind, and the subset of
//     {text, tool_name, detail, is_error, usage} relevant to inner_kind.
//   - team.end:    parent_call_id, team_id, rounds, stop, usage (cumulative).
message Team {
  // parent_call_id is the parent's Team tool-call id, attributing the event to the
  // originating Team card.
  string parent_call_id = 1;
  // team_id is the team id, distinguishing concurrent teams.
  string team_id = 2;
  // roster is the team's membership as the model formed it (team.start). Metadata
  // only, never member content.
  repeated TeamMemberSpec roster = 3;
  // member is the name of the member whose activity this event projects
  // (team.member).
  string member = 4;
  // inner_kind is the member's underlying session event kind being projected —
  // e.g. message.delta, tool.call, tool.result, turn.end, result (team.member).
  // permission.ask is never projected.
  string inner_kind = 5;
  // text is the member's message/result text or a CAPPED preview of it
  // (team.member, for message.delta / result inner kinds).
  string text = 6;
  // tool_name is the name of a member tool that was called (team.member, for
  // tool.call / tool.result inner kinds).
  string tool_name = 7;
  // detail is a CAPPED preview of a member tool call's args (tool.call) or result
  // body (tool.result) — never the raw, unbounded body (team.member).
  string detail = 8;
  // is_error reports whether a member tool.result failed (team.member).
  bool is_error = 9;
  // rounds is the number of scheduling rounds that ran work (team.end).
  int32 rounds = 10;
  // stop is the team run's terminal stop reason (team.end).
  string stop = 11;
  // usage is the member's per-event usage (team.member turn.end/result) or, on
  // team.end, the TEAM TOTAL — the sum of every member's per-turn usage.
  Usage usage = 12;
  // context_used is the member's CURRENT context occupancy — the most recent
  // turn's input-token count (team.member turn.end). It is the numerator of the
  // per-member context meter in the ctrl+a agents overlay; 0 when unknown.
  int64 context_used = 13;
  // context_window is the producing member engine's context window in tokens —
  // the meter's denominator (team.member turn.end). 0 when unknown (no meter is
  // drawn in that case).
  int64 context_window = 14;
  // tasks is a snapshot of the team's SHARED TASK LIST in creation order. It is
  // set on a first-class team.tasks event (a team-wide event with no member, emitted
  // on change, de-duped) and on team.end (the terminal snapshot). It feeds the
  // ctrl+a agents task sub-view; it carries only task metadata, never member content.
  // Reuses the existing TeamTask message.
  repeated TeamTask tasks = 15;
  // findings is a snapshot of the team's SHARED FINDINGS LEDGER in append order. It
  // is set on a first-class team.findings event (a team-wide event with no member,
  // emitted on change, de-duped) and on team.end (the terminal snapshot). Each entry
  // carries the recording member's name and a CAPPED body preview, never the raw
  // finding.
  repeated TeamFinding findings = 16;
  // dispositions is the per-member TERMINAL disposition snapshot, set ONLY on team.end
  // (parallel to the terminal tasks/findings snapshots). Lets a client render a stopped
  // member distinctly from a clean "done" instead of recomputing it. Closed-enum
  // supervisor verdicts only, never member content.
  repeated TeamMemberDisposition dispositions = 17;
  // member_session_id is the member's child SESSION id ("team-<teamID>-<member>")
  // on member-tagged (team.member) events — the CancelChild handle, carried
  // explicitly so a client never derives ids from the (internal) id grammar.
  // (17 is taken by dispositions.)
  string member_session_id = 18;
}

// Parallel is the REDACTED observability projection carried by the three parallel.*
// events (parallel.start / parallel.branch / parallel.end). Mirrors
// session.ParallelPayload. Like Subagent it carries metadata ONLY — no branch message
// text, tool args, or result bodies — so a client can render a Parallel fork-join run's
// activity (a join strategy, a grouped roster of branches with tool traces, a winner
// highlight, and fork paths) without ever seeing branch content, preserving context
// isolation. The fork-root paths it carries are the no-auto-merge handles already
// surfaced in the Parallel tool result, not branch content.
//
// Unlike the FLAT Subagent fleet, a Parallel run is a GROUP: N branches of ONE call
// (keyed by parent_call_id) sharing a join strategy + a single winner + preserved
// per-branch fork paths. Those are RUN-LEVEL facts on the start/end events; the
// per-branch events carry per-branch metadata keyed by branch_index.
//
// Which fields are set depends on the event kind:
//   - parallel.start:                  parent_call_id, join, branch_count.
//   - parallel.branch (branch_start):  parent_call_id, kind, branch_index, branch_label, goal, routed_category, routed_model, model.
//   - parallel.branch (branch_tool):   parent_call_id, kind, branch_index, tool_name, is_error, tool_count.
//   - parallel.branch (branch_end):    parent_call_id, kind, branch_index, tool_count, stop, usage, duration_ms, failed, workspace.
//   - parallel.end:                    parent_call_id, join, branch_count, winner, winner_workspace, usage (run total), stop.
message Parallel {
  // parent_call_id is the parent's Parallel tool-call id and the GROUP key (one
  // Parallel call = one group); attributes the event to the originating card.
  string parent_call_id = 1;
  // kind discriminates the per-branch lifecycle transition on a parallel.branch event
  // (branch_start / branch_tool / branch_end); empty on the run-level start/end events.
  string kind = 2;
  // join is the normalized join strategy (all / first / judge); set on
  // parallel.start and parallel.end.
  string join = 3;
  // branch_count is the number of branches in the run; set on parallel.start and
  // parallel.end.
  int32 branch_count = 4;
  // branch_index is the 0-based stable per-branch group key; set on every
  // parallel.branch kind.
  int32 branch_index = 5;
  // branch_label is the humanized 1-based branch label ("branch-1" …); set on
  // branch_start.
  string branch_label = 6;
  // goal is a short, plain-text label for the branch task (a truncation of the
  // model-authored branch prompt — the parent's own instruction, never branch
  // content); set on branch_start.
  string goal = 7;
  // tool_name is the name of a branch's child tool that just ran (branch_tool) — the
  // name alone, never branch args or result.
  string tool_name = 8;
  // is_error reports whether that branch tool call failed (branch_tool).
  bool is_error = 9;
  // tool_count is the running (branch_tool) or final (branch_end) child tool-call
  // count for the branch.
  int32 tool_count = 10;
  // failed reports whether the branch's child run failed (branch_end).
  bool failed = 11;
  // workspace is the branch's forked workspace ROOT path — the no-auto-merge handle
  // (branch_end). Server-side path text, not branch content.
  string workspace = 12;
  // stop is the branch's terminal stop reason (branch_end) or the run-level stop
  // (parallel.end; the winner's stop for first/judge, empty for all).
  string stop = 13;
  // usage is the branch's cumulative usage (branch_end) or the run TOTAL summed across
  // branches (parallel.end).
  Usage usage = 14;
  // duration_ms is the branch's wall-clock duration in milliseconds (branch_end).
  int64 duration_ms = 15;
  // winner is the branch index of the selected winner on parallel.end — a real
  // branch_index for first/judge, or -1 for all / none-succeeded.
  int32 winner = 16;
  // winner_workspace is the PRESERVED winner fork root on parallel.end (the deliverable
  // handle for first/judge); empty for all / none-succeeded.
  string winner_workspace = 17;
  // child_id is the branch's child SESSION id ("parallel-<callID>-<i>") on
  // branch_start/branch_end — the CancelChild handle, carried explicitly so a
  // client never derives ids from the (internal) id grammar.
  string child_id = 18;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label for
  // this branch (branch_start only), set when the router was wired AND classified this
  // branch (empty otherwise — no router, a fail-soft miss that inherited the default
  // branch model, or a branch cancelled before it started). BARE METADATA — a label,
  // never the branch prompt or classifier reasoning — so it is context-isolation safe
  // (gauntlet #7: no branch content crosses). Mirrors session.ParallelPayload.RoutedCategory.
  string routed_category = 19;
  // routed_model is the concrete MODEL id the routed branch was minted on (branch_start
  // only), paired with routed_category. BARE METADATA — a model id, never
  // model-influenced free text — so it is context-isolation safe (gauntlet #7).
  // Mirrors session.ParallelPayload.RoutedModel.
  string routed_model = 20;
  // model is the concrete MODEL id this branch ACTUALLY ran on (branch_start only),
  // regardless of how it was chosen — inherited default branch model or the opt-in
  // router. BARE METADATA — a model id, never branch content — so it is
  // context-isolation safe (gauntlet #7: no branch content crosses). When the router
  // classified this branch, model == routed_model. Mirrors session.ParallelPayload.Model.
  string model = 21;
}

// ToolCall is a request from the model to invoke a named tool. Mirrors
// session.ToolCall.
message ToolCall {
  // id pairs this call with its tool_result.
  string id = 1;
  // name is the tool name as registered in the catalog.
  string name = 2;
  // args is the raw, tool-specific JSON argument payload.
  string args = 3;
}

// ToolResult is the outcome of executing a ToolCall. Mirrors
// session.ToolResult.
message ToolResult {
  // call_id is the id of the ToolCall this result answers.
  string call_id = 1;
  // content is the legacy/default model-facing string result body, already
  // token-shaped by the tool.
  string content = 2;
  // is_error reports whether the tool failed.
  bool is_error = 3;
  // blocks are the typed content blocks (text/image/audio/resource-link/
  // embedded-resource/structured-content) mirroring session.ToolResult.Parts.
  // Both content and blocks may be present; consumers prefer blocks when
  // non-empty, falling back to content.
  repeated ContentBlock blocks = 4;
  // structured_content is the JSON-stringified structured payload (the
  // TextContent mirror of a structured-content block).
  string structured_content = 5;
}

// PermissionAsk describes a permission prompt the loop is blocked on. The
// client resolves it by sending ResumeApproval with the matching ask_id.
// Mirrors session.PendingAsk.
message PermissionAsk {
  // ask_id correlates the ask with the client's resolution.
  string ask_id = 1;
  // tool is the name of the tool awaiting approval.
  string tool = 2;
  // args is the proposed tool-call argument payload (raw JSON).
  string args = 3;
  // reason explains why approval is required.
  string reason = 4;
}

// Result is the terminal payload carried by a result event. Mirrors
// session.ResultPayload.
message Result {
  // stop is the reason the run ended (end_turn, max_turns, cancelled, ...).
  string stop = 1;
  // text is the final assistant text, if any.
  string text = 2;
  // usage is the cumulative token accounting for the run.
  Usage usage = 3;
  // error carries the failure detail when stop is "error" (empty otherwise).
  string error = 4;
}

// TurnEnd is the payload carried by a turn.end event. Mirrors
// session.TurnEndPayload. A typed envelope (like Result) so turn.end owns its
// own usage semantics and can grow (finish reason, model id, retries) without
// overloading the shared Event fields.
message TurnEnd {
  // usage is THIS turn's model-call token accounting (not the run total).
  Usage usage = 1;
  // duration_ms is the elapsed milliseconds for the turn's model call; 0 when
  // the server had no clock.
  int64 duration_ms = 2;
}

// Usage accounts for the token cost of a model call (or an aggregate).
// Mirrors session.Usage.
message Usage {
  // input_tokens is the number of prompt tokens billed (including cache).
  int64 input_tokens = 1;
  // output_tokens is the number of completion tokens generated.
  int64 output_tokens = 2;
  // cache_read_tokens is the number of input tokens served from cache.
  int64 cache_read_tokens = 3;
  // cache_write_tokens is the number of input tokens written into the cache.
  int64 cache_write_tokens = 4;
  // reasoning_tokens is the number of output tokens spent on internal reasoning
  // (a subset of output_tokens; providers bill reasoning as part of the
  // inclusive output total). 0 when the provider reports no breakdown.
  int64 reasoning_tokens = 5;
}

// --- MCP inspection surface --------------------------------------------------
//
// These messages back the catalog-level inspection RPCs. They mirror the
// adapter value objects in internal/adapter/mcp (Resource, ResourceContents,
// Prompt, PromptArgument, PromptResult, PromptMessage) and internal/adapter/
// mcp/source (SourceInfo, ServerInfo) one-for-one; they are never SDK types.

// McpResource is a single resource advertised by a connected MCP server.
// Mirrors mcp.Resource.
message McpResource {
  // server is the connected server that owns the resource.
  string server = 1;
  // uri identifies the resource on its server.
  string uri = 2;
  // name is the resource's programmatic name.
  string name = 3;
  // title is the resource's human-facing title.
  string title = 4;
  // description summarizes the resource.
  string description = 5;
  // mime_type is the resource's media type.
  string mime_type = 6;
  // size is the resource size in bytes (0 when unknown).
  int64 size = 7;
  // read_only is always true: reading a resource never mutates the server.
  bool read_only = 8;
}

// ListMcpResourcesRequest lists resource snapshots; an empty server returns the
// union across every connected server.
message ListMcpResourcesRequest {
  // server scopes the listing to one connected server; empty returns all.
  string server = 1;
}

// ListMcpResourcesResponse carries the resource snapshots.
message ListMcpResourcesResponse {
  // resources are the (possibly empty) resource snapshots.
  repeated McpResource resources = 1;
}

// McpResourceContents is one chunk of a read resource's body. Text holds UTF-8
// text; blob holds raw binary bytes. Mirrors mcp.ResourceContents.
message McpResourceContents {
  // uri identifies the chunk's resource.
  string uri = 1;
  // mime_type is the chunk's media type.
  string mime_type = 2;
  // text is the UTF-8 textual content, when the chunk is textual.
  string text = 3;
  // blob is the raw binary content, when the chunk is binary.
  bytes blob = 4;
}

// ReadMcpResourceRequest reads one resource by URI from a named server.
message ReadMcpResourceRequest {
  // server is the connected server to read from.
  string server = 1 [(buf.validate.field).string.min_len = 1];
  // uri is the resource URI to read.
  string uri = 2 [(buf.validate.field).string.min_len = 1];
}

// ReadMcpResourceResponse carries the read resource's content chunks.
message ReadMcpResourceResponse {
  // contents are the resource's content chunks.
  repeated McpResourceContents contents = 1;
}

// McpPromptArgument describes one templating argument a prompt accepts.
// Mirrors mcp.PromptArgument.
message McpPromptArgument {
  // name is the argument's programmatic name.
  string name = 1;
  // title is the argument's human-facing title.
  string title = 2;
  // description summarizes the argument.
  string description = 3;
  // required reports whether the argument must be supplied.
  bool required = 4;
}

// McpPrompt is a prompt template advertised by a connected server. Mirrors
// mcp.Prompt.
message McpPrompt {
  // server is the connected server that owns the prompt.
  string server = 1;
  // name is the prompt's programmatic name.
  string name = 2;
  // title is the prompt's human-facing title.
  string title = 3;
  // description summarizes the prompt.
  string description = 4;
  // arguments are the templating arguments the prompt accepts.
  repeated McpPromptArgument arguments = 5;
}

// ListMcpPromptsRequest lists prompt snapshots; an empty server returns the
// union across every connected server.
message ListMcpPromptsRequest {
  // server scopes the listing to one connected server; empty returns all.
  string server = 1;
}

// ListMcpPromptsResponse carries the prompt snapshots.
message ListMcpPromptsResponse {
  // prompts are the (possibly empty) prompt snapshots.
  repeated McpPrompt prompts = 1;
}

// GetMcpPromptRequest expands a named prompt with arguments on a named server.
message GetMcpPromptRequest {
  // server is the connected server that owns the prompt.
  string server = 1 [(buf.validate.field).string.min_len = 1];
  // name is the prompt to expand.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // arguments are the templating values keyed by argument name.
  map<string, string> arguments = 3;
}

// McpPromptMessage is one role-tagged message of an expanded prompt. Mirrors
// mcp.PromptMessage.
message McpPromptMessage {
  // role is the MCP role string ("user"/"assistant").
  string role = 1;
  // text is the flattened textual content of the message.
  string text = 2;
}

// GetMcpPromptResponse carries the expanded prompt.
message GetMcpPromptResponse {
  // description is the prompt's optional description.
  string description = 1;
  // messages are the rendered, role-tagged messages.
  repeated McpPromptMessage messages = 2;
}

// McpServerInfo is one resolved MCP server candidate within a source. Mirrors
// source.ServerInfo.
message McpServerInfo {
  // name is the server's configured name.
  string name = 1;
  // url is the server's proxy/base URL.
  string url = 2;
  // transport is the wire transport (e.g. "streamable-http").
  string transport = 3;
  // group is the ToolHive group (empty for the static source).
  string group = 4;
}

// McpSource is the inventory for one resolved MCP source. Mirrors
// source.SourceInfo.
message McpSource {
  // name is the source's identity, e.g. "static" or "toolhive(default)".
  string name = 1;
  // kind is the coarse source kind: "static" or "toolhive".
  string kind = 2;
  // enabled reports whether the source was active in the resolution.
  bool enabled = 3;
  // group is the ToolHive group (empty for the static source).
  string group = 4;
  // servers are the configs this source contributed.
  repeated McpServerInfo servers = 5;
  // diagnostics are this source's per-server skip reasons.
  repeated string diagnostics = 6;
}

// ListMcpSourcesRequest requests the resolved source inventory snapshot.
message ListMcpSourcesRequest {}

// ListMcpSourcesResponse carries the resolved source inventory.
message ListMcpSourcesResponse {
  // sources are the (possibly empty) resolved sources.
  repeated McpSource sources = 1;
}

// ListToolHiveGroupsRequest requests the distinct ToolHive groups in the
// resolved inventory.
message ListToolHiveGroupsRequest {}

// ListToolHiveGroupsResponse carries the distinct, non-empty ToolHive groups.
message ListToolHiveGroupsResponse {
  // groups are the distinct, non-empty ToolHive groups in the inventory.
  repeated string groups = 1;
}

// AgentInfo is the inventory for one resolved agent definition. It mirrors the
// resolved registry snapshot (see internal/adapter/agents.AgentDef and the
// composition-layer resolution in internal/app): the model and tools fields are
// the RESOLVED outcome (model alias resolved, tool scope filtered to the
// read-only Task call site), not the raw frontmatter.
message AgentInfo {
  // name is the def's stable routing identifier (the value passed to Task's
  // `agent` arg).
  string name = 1;
  // description is the always-in-context one-line routing summary.
  string description = 2;
  // model is the resolved provider model id (empty means "inherit the parent").
  string model = 3;
  // tools is the def's effective read-only tool scope at the Task call site.
  repeated string tools = 4;
  // permission_mode is the raw frontmatter permission mode (empty / "default").
  string permission_mode = 5;
  // color is the optional UX hint; it never affects execution.
  string color = 6;
}

// ListAgentsRequest requests the resolved agent-definition snapshot.
message ListAgentsRequest {}

// ListAgentsResponse carries the resolved agent definitions.
message ListAgentsResponse {
  // agents are the (possibly empty) resolved agent definitions, name-sorted.
  repeated AgentInfo agents = 1;
}

// --- Slash command discovery -------------------------------------------------

// Command is one discovered slash command's listing metadata. Mirrors
// prompt.Command: the invocation name (without the leading "/") and a short,
// human-facing description for the palette. It carries NO body — discovery is
// metadata-only; expansion (which reads the body) is a separate run-path concern.
message Command {
  // name is the command's invocation name (the "<name>" of "/<name>").
  string name = 1;
  // description is a short one-line summary derived from the command file (a
  // frontmatter description: field, else the first non-blank body line), capped.
  string description = 2;
}

// ListCommandsRequest requests the available slash commands for a workspace.
message ListCommandsRequest {
  // workspace is the session root whose command directories are scanned. Empty
  // returns an empty list (there is no workspace to discover commands under).
  string workspace = 1;
}

// ListCommandsResponse carries the discovered slash commands.
message ListCommandsResponse {
  // commands are the (possibly empty) discovered commands, name-sorted.
  repeated Command commands = 1;
}

// --- Worktree discovery (issue #102) -----------------------------------------

// Worktree is one discovered git worktree of a repo, mirroring a
// `git worktree list --porcelain` record. Path is the absolute working-tree path
// (the value handed to CreateSessionRequest.workspace to bind a session there);
// branch is empty for a detached HEAD; head is the commit SHA the worktree is at.
message Worktree {
  // path is the absolute working-tree path; required.
  string path = 1;
  // branch is the checked-out ref name; empty for a detached HEAD.
  string branch = 2;
  // head is the commit SHA the worktree is at.
  string head = 3;
  // bare is true for a bare worktree.
  bool bare = 4;
}

// ListWorktreesRequest names the workspace whose repo's worktrees are listed.
message ListWorktreesRequest {
  // workspace is the session root whose repo's worktrees are enumerated. Empty
  // returns an empty list (there is no repo to enumerate).
  string workspace = 1;
}

// ListWorktreesResponse carries the discovered worktrees.
message ListWorktreesResponse {
  // worktrees are the (possibly empty) discovered worktrees, in `git worktree
  // list` order (the main worktree first).
  repeated Worktree worktrees = 1;
}

// --- Skills inventory discovery ---------------------------------------------

// SkillInfo is one discovered skill's listing metadata: the activation name and
// a short, human-facing description for the inventory panel. It carries NO body
// — discovery is metadata-only; activation (which reads the body) is a separate
// run-path concern handled by the Skill tool.
message SkillInfo {
  // name is the skill's stable activation identifier (the value passed to the
  // Skill tool).
  string name = 1;
  // description is the one-line frontmatter summary that steers WHEN to activate.
  string description = 2;
}

// ListSkillsRequest requests the resolved skills inventory snapshot.
message ListSkillsRequest {}

// ListSkillsResponse carries the resolved skills inventory.
message ListSkillsResponse {
  // skills are the (possibly empty) discovered skills, name-sorted.
  repeated SkillInfo skills = 1;
}

// --- Soul (persona) inspection ----------------------------------------------

// SoulProvenance records WHERE the selected soul originated, mirroring the
// composition-layer soulProvenance. It is a read-only attribution for the /soul
// inspection panel; it never affects execution.
enum SoulProvenance {
  // SOUL_PROVENANCE_UNSPECIFIED means no soul was selected (none present, an
  // untrusted project soul was dropped, or --no-soul).
  SOUL_PROVENANCE_UNSPECIFIED = 0;
  // SOUL_PROVENANCE_USER is the user-scoped soul (always trusted).
  SOUL_PROVENANCE_USER = 1;
  // SOUL_PROVENANCE_PROJECT is the project-scoped <workspace>/.mecatl/soul.md
  // (selected only with --trust-project).
  SOUL_PROVENANCE_PROJECT = 2;
  // SOUL_PROVENANCE_DRIVER is a remote soul-source driver (--soul-source-url;
  // mecatl.driver.v1.SoulSourceService). Operator-configured infrastructure:
  // it occupies the USER slot in the selection precedence and is always
  // trusted. Client-inspection only, NOT model-facing.
  SOUL_PROVENANCE_DRIVER = 3;
}

// SoulInfo is the BUILD-TIME SNAPSHOT of the resolved soul: the selected soul's
// content plus its provenance/trust/drift metadata. It mirrors the
// composition-layer soulMeta + the loaded body. It carries NO write path — the
// soul is agent-read-only; this is purely for the /soul inspection panel. When
// no soul was selected (present=false) the content/hash are empty but provenance
// may still report a DROPPED untrusted project soul (trusted=false).
message SoulInfo {
  // content is the selected soul's clean body (the bytes that reach the prompt),
  // capped server-side at the soul byte ceiling (20 KiB). Empty when none.
  string content = 1;
  // size_bytes is the byte length of content, or 0 for none.
  int64 size_bytes = 2;
  // sha256 is the lowercase-hex SHA-256 of content, or "" for none.
  string sha256 = 3;
  // present is true when a soul fragment WILL be contributed this run.
  bool present = 4;
  // provenance is where the selected (or dropped) soul came from.
  SoulProvenance provenance = 5;
  // trusted reflects whether the soul's provenance is trusted (a user soul always
  // is; a project soul only with --trust-project).
  bool trusted = 6;
  // drifted is true when the selected soul's content hash differs from its
  // recorded baseline (informational; a drifted soul still loads unless strict).
  bool drifted = 7;
}

// GetSoulRequest requests the resolved soul snapshot.
message GetSoulRequest {}

// GetSoulResponse carries the resolved soul snapshot.
message GetSoulResponse {
  // soul is the resolved soul snapshot. Never nil; present=false when no soul was
  // selected.
  SoulInfo soul = 1;
}

// --- User-model inspection --------------------------------------------------

// UserModelEntry is one user-model fact's listing metadata: its key + a one-line
// description. The per-entry VALUE is omitted (Recall loads it) — discovery is
// metadata only.
message UserModelEntry {
  // key is the entry's stable key.
  string key = 1;
  // description is the entry's one-line description (explicit, else derived).
  string description = 2;
}

// GetUserModelRequest requests the current user-model index.
message GetUserModelRequest {}

// GetUserModelResponse carries the current user-model entries plus aggregate
// metadata. The entries reflect the LIVE store index at request time.
message GetUserModelResponse {
  // entries are the current user-model entries, key-sorted.
  repeated UserModelEntry entries = 1;
  // size_bytes is the aggregate byte length of the rendered entries (key +
  // description), an at-a-glance footprint indicator.
  int64 size_bytes = 2;
  // sha256 is the lowercase-hex SHA-256 over the rendered entries, so a client
  // can tell at a glance whether the user model changed between fetches.
  string sha256 = 3;
}

// --- Model inventory discovery ----------------------------------------------

// ModelInfo is one selectable model in the resolved inventory. It mirrors the
// composition-layer projection of the provider registry's AVAILABLE providers
// joined to the embedded models.dev catalog. It carries NO secret material
// (no key, no env var name, no base URL) — only public model metadata. The
// modality/reasoning bits gate the client picker's affordances; context_limit
// informs the picker's display only (the server is the cap authority).
message ModelInfo {
  // id is the opaque model selector (the value sent as CreateSession.model_id).
  string id = 1;
  // provider_id is the registry id this model is served by (CreateSession.provider_id).
  string provider_id = 2;
  // display_name is the human-facing model name from the catalog (falls back to id).
  string display_name = 3;
  // image is true when the model accepts image prompt input (catalog modality).
  bool image = 4;
  // reasoning is true when the model emits reasoning/thinking (catalog flag).
  bool reasoning = 5;
  // context_limit is the model's total context window in tokens (0 when unknown).
  int64 context_limit = 6;
}

// ListModelsRequest requests the selectable-model inventory.
message ListModelsRequest {}

// ProviderStatus is one provider's last live-listing outcome, for client
// surfacing (issue #262). state is a STRING passthrough (no enum — the
// EvNoProgress/StopBudget discipline): "ok" | "unreachable" | "unauthorized" | "empty".
//
// model_count and available_not_default are scoped to INTENT-DRIVEN providers
// ONLY (the v1 invariant: a key-driven openrouter/anthropic live-listing blip
// never grows this list). They are additive (fields 5/6) and carry 0/false for
// every deployment without an intent-driven provider — byte-identical to before
// this wave.
message ProviderStatus {
  string provider_id = 1;
  string state = 2;
  string hint = 3; // short human remediation, e.g. "start it with `thv llm proxy start`"
  // default_model_auto_selected is true ONLY when provider_id is the DEFAULT
  // provider AND the server AUTO-selected its default model (a first-listed
  // heal/probe pick, issue #262 R2.4) — never true when an operator
  // configured --model/--default-model. A client uses this (rather than a
  // vendor-name check) to label the current model "(auto-selected)" honestly
  // for ANY intent-driven provider, present or future.
  bool default_model_auto_selected = 4;
  // model_count is the count of models this intent-driven provider's last
  // successful live listing returned (derived from the outcome store's
  // last-known-good snapshot). 0 on empty/unreachable/unrecorded — so a client
  // cannot distinguish "0 models" from "never probed" by this field alone
  // (state disambiguates: state=="empty" with model_count==0 is a genuine
  // empty list; state=="unreachable" with model_count==0 is a probe failure).
  int32 model_count = 5;
  // available_not_default is true ONLY when this intent-driven provider is
  // registered, reachable (state == "ok"), AND is NOT the active default
  // provider (a key-driven provider outranks it on the precedence ladder).
  // Named for the CONDITION (vendor-neutral, matching the
  // default_model_auto_selected discipline) so a client can surface "the
  // gateway is available, set a key to use it" for ANY intent-driven provider,
  // present or future — without a vendor-name check. False whenever the
  // provider IS the default (so the sole-provider case does not advertise
  // itself as "available but not default").
  bool available_not_default = 6;
}

// ListModelsResponse carries the selectable models across AVAILABLE providers
// only (a provider with no resolved credentials is omitted entirely — its
// availability is itself sensitive, CWE-200). Sorted by (provider_id, id) for a
// deterministic picker. Empty when zero providers are available (the zero-keys
// case) — the client renders that as "no models; set a provider key".
message ListModelsResponse {
  // models are the (possibly empty) selectable models, (provider_id, id)-sorted.
  repeated ModelInfo models = 1;
  // provider_status surfaces live-listing outcomes for intent-driven providers
  // (issue #262: e.g. the ToolHive LLM gateway) so a client can render a
  // remediation hint even when the provider contributes zero models.
  repeated ProviderStatus provider_status = 2;
}

// --- Agent team messages ----------------------------------------------------

// CreateTeamRequest creates a new agent team over a base workspace, optionally
// with an initial roster enrolled in the same atomic call.
message CreateTeamRequest {
  // workspace is the base workspace root the team operates against.
  string workspace = 1 [(buf.validate.field).string.min_len = 1];
  // name is an optional human label; the server assigns the canonical id.
  string name = 2;
  // members is the optional initial roster, enrolled atomically: if any member
  // fails to enrol the whole team is abandoned. It may be empty (the client can
  // still SpawnTeammate before RunTeam).
  repeated TeammateSpec members = 3;
  // goal is the team's optional top-level objective. It is threaded into the lead's
  // round-0 turn and the lead's synthesis prompt as a TRUSTED instruction by default
  // (framing-neutralised, but not fenced; the server's TeamGoalUntrusted config opts a
  // relay/multi-tenant deployment back into the UNTRUSTED fence). Empty preserves the
  // historical behaviour (no goal briefing on the gRPC path).
  string goal = 4;
  // max_team_tokens is the per-request team-wide cumulative token budget
  // (input + output, summed across all members and rounds). TIGHTEN-ONLY: a
  // positive value may only LOWER the server-configured --max-team-tokens
  // ceiling, never raise it; 0 / absent inherits the server's budget. The fold
  // is lower-of-the-two with 0 meaning unlimited: when the server has NO
  // configured budget (--max-team-tokens unset/0), a positive value therefore
  // IMPOSES a budget rather than being capped to "unlimited". Crossed
  // at a round boundary (the in-flight round and the lead's synthesis still
  // complete) → the terminal TeamEvent.outcome frame reports budget_exhausted.
  // Mirrors the in-loop Team tool's per-call max_team_tokens arg. Issue #36.
  int32 max_team_tokens = 5;
}

// CreateTeamResponse returns the new team's id and the enrolled initial roster.
message CreateTeamResponse {
  // team_id identifies the team in subsequent calls.
  string team_id = 1;
  // members is the enrolled initial roster in enrolment order, so the caller need
  // not follow up with ListTeam to see who was added.
  repeated TeamMember members = 2;
}

// TeammateSpec describes a member to enrol — the per-member fields shared by
// CreateTeamRequest's initial roster and SpawnTeammateRequest (minus team_id).
message TeammateSpec {
  // name is the unique member handle peers address messages to.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // agent_type is the optional agent-definition name this member adopts.
  string agent_type = 2;
  // lead marks the coordinating member (it is not auto-assigned tasks).
  bool lead = 3;
  // mutating requests an isolated forked workspace (the member may edit/write).
  bool mutating = 4;
  // initial_prompt is the member's first-turn input, run in round 0.
  string initial_prompt = 5;
}

// SpawnTeammateRequest enrols a member in a team before it runs.
message SpawnTeammateRequest {
  // team_id is the team to add the member to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // name is the unique member handle peers address messages to.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // agent_type is the optional agent-definition name this member adopts.
  string agent_type = 3;
  // lead marks the coordinating member (it is not auto-assigned tasks).
  bool lead = 4;
  // mutating requests an isolated forked workspace (the member may edit/write).
  bool mutating = 5;
  // initial_prompt is the member's first-turn input, run in round 0.
  string initial_prompt = 6;
}

// SpawnTeammateResponse returns the enrolled member.
message SpawnTeammateResponse {
  // member is the newly enrolled member.
  TeamMember member = 1;
}

// SendTeammateMessageRequest posts a message into a member's inbox.
message SendTeammateMessageRequest {
  // team_id is the team the recipient belongs to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // to is the recipient member name.
  string to = 2 [(buf.validate.field).string.min_len = 1];
  // from is the sender label (e.g. "operator"); empty defaults to "operator".
  string from = 3;
  // body is the message text.
  string body = 4 [(buf.validate.field).string.min_len = 1];
}

// SendTeammateMessageResponse is the empty acknowledgement.
message SendTeammateMessageResponse {}

// CancelTeammateRequest cancels one member of a running team.
message CancelTeammateRequest {
  // team_id is the team the member belongs to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // member is the name of the member to cancel.
  string member = 2 [(buf.validate.field).string.min_len = 1];
}

// CancelTeammateResponse is the empty acknowledgement.
message CancelTeammateResponse {}

// RunTeamRequest drives a team to quiescence, streaming member events.
message RunTeamRequest {
  // team_id is the team to run.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// TeamEvent is one member's session Event, tagged with the producing member —
// the multiplexed team stream the client observes.
message TeamEvent {
  // member is the name of the member whose session produced the event.
  string member = 1;
  // event is the underlying session event.
  Event event = 2;
  // outcome is the team's terminal outcome, set ONLY on the single final frame
  // of a RunTeam stream (after every member event). On that frame member is
  // empty and event is nil; on every other frame outcome is nil. Issue #36.
  TeamOutcome outcome = 3;
}

// TeamOutcome is the terminal result of a RunTeam drive — the wire projection of
// the supervisor's agent.TeamOutcome, carried on the single final TeamEvent frame
// of the RunTeam stream (gRPC and HTTP SSE alike). It reuses the existing Usage /
// TeamFinding / TeamMemberDisposition shapes; member content beyond the capped
// finding previews never rides it. Issue #36.
message TeamOutcome {
  // rounds is the number of scheduling rounds that ran work.
  int32 rounds = 1;
  // quiescent reports genuine completion (all tasks done, mailboxes empty, no
  // member still working) versus stopping on a round cap / stuck dependency /
  // budget.
  bool quiescent = 2;
  // budget_exhausted reports that the team-wide token budget crossed at a round
  // boundary and no further round was scheduled (the in-flight round and the
  // lead's synthesis still completed). false when no budget was set or it never
  // crossed.
  bool budget_exhausted = 3;
  // stop is the team's terminal stop reason — a STRING passthrough of
  // session.StopReason (no enum): "end_turn" for a quiescent team, "budget" for
  // a budget-stopped one, "max_turns" for a round-cap / stuck-dependency stop.
  string stop = 4;
  // usage is the supervisor-accumulated team token total across all members and
  // rounds, synthesis included.
  Usage usage = 5;
  // dispositions holds each member's terminal disposition in enrolment order.
  repeated TeamMemberDisposition dispositions = 6;
  // findings is the team's findings ledger at the end of the run, in append
  // order, bodies capped exactly like the event-stream projection.
  repeated TeamFinding findings = 7;
}

// ListTeamRequest names the team to snapshot.
message ListTeamRequest {
  // team_id is the team to snapshot.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListTeamResponse is the team roster, task list, and completion state.
message ListTeamResponse {
  // members is the roster in enrolment order.
  repeated TeamMember members = 1;
  // tasks is the shared task list in creation order.
  repeated TeamTask tasks = 2;
  // quiescent reports whether the team has reached completion.
  bool quiescent = 3;
}

// TeamMember mirrors a team roster entry.
message TeamMember {
  // name is the member handle.
  string name = 1;
  // agent_type is the adopted agent-definition name, if any.
  string agent_type = 2;
  // state mirrors team.MemberState: spawning / working / idle / stopped.
  string state = 3;
  // session_id is the backing session's id.
  string session_id = 4;
}

// TeamTask mirrors a shared task-list entry.
message TeamTask {
  // id is the stable task identifier.
  string id = 1;
  // description is the work to do.
  string description = 2;
  // state mirrors team.TaskState: pending / in_progress / completed.
  string state = 3;
  // assignee is the member that claimed the task, or empty.
  string assignee = 4;
  // deps are the task ids that must complete before this task is claimable.
  repeated string deps = 5;
}

// TeamFinding mirrors a shared findings-ledger entry, projected onto the team event
// stream. It carries only the recording member's name and a CAPPED body preview,
// never the raw finding.
message TeamFinding {
  // member is the name of the member that recorded the finding.
  string member = 1;
  // body is a CAPPED preview of the finding text.
  string body = 2;
}

// TeamMemberStopReason is WHY a stopped member stopped (team.end disposition snapshot).
// Closed enum: a supervisor verdict, never member-authored text.
enum TeamMemberStopReason {
  // a done member, or an unknown/future reason.
  TEAM_MEMBER_STOP_REASON_UNSPECIFIED = 0;
  // the member's run failed or its session could not be re-opened.
  TEAM_MEMBER_STOP_REASON_ERROR = 1;
  // the member was ended by ctx cancellation.
  TEAM_MEMBER_STOP_REASON_CANCELLED = 2;
  // the member exhausted its lifetime turn budget.
  TEAM_MEMBER_STOP_REASON_BUDGET = 3;
}

// TeamMemberDisposition is one member's TERMINAL disposition (team.end). Mirrors
// session.TeamMemberDisposition. Closed-enum supervisor verdicts only — no member
// content. A bool stopped + enum reason keeps the done/stopped split a closed
// two-state (a done member has no reason, so (done, error) is non-representable).
message TeamMemberDisposition {
  // name matches a roster entry by name.
  string name = 1;
  // stopped reports whether the member ended non-resumably / budget-exhausted (true)
  // or cleanly (false).
  bool stopped = 2;
  // reason is WHY a stopped member stopped; UNSPECIFIED for a done member.
  TeamMemberStopReason reason = 3;
}

// CleanupTeamRequest names the finished team to tear down.
message CleanupTeamRequest {
  // team_id is the team to clean up.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CleanupTeamResponse is the empty acknowledgement.
message CleanupTeamResponse {}

// ApprovePlanRequest resolves a parked plan-approval ask (issue #206). See the
// ApprovePlan rpc doc above for the target_mode → verdict mapping and the
// atomic resume + continuation contract.
message ApprovePlanRequest {
  // session_id is the session parked awaiting a plan-approval ask.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // target_mode selects the verdict / resulting posture: DEFAULT → allow-once
  // (flip to default), ACCEPT_EDITS → allow-always (flip to accept-edits),
  // PLAN/UNSPECIFIED → deny (iterate, no flip, no continuation run).
  PermissionMode target_mode = 2;
  // note is an OPTIONAL operator remark appended to the proceed message
  // injected into the continuation run's first user message (allow paths only).
  string note = 3;
}
