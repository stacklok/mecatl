// --- Agent team messages ----------------------------------------------------

// CreateTeamRequest creates a team owned by an existing session.
message CreateTeamRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // name is an optional human label; the server assigns the canonical id.
  string name = 2;
  // members is the optional initial roster, enrolled atomically: if any member
  // fails to enrol the whole team is abandoned. It may be empty (the client can
  // still SpawnTeammate before RunTeam).
  repeated TeammateSpec members = 3;
  // goal is the team's optional top-level objective. It is threaded into the lead's
  // round-0 turn and the lead's synthesis prompt as a TRUSTED instruction by default
  // (framing-neutralised, but not fenced; the server's TeamGoalUntrusted config opts a
  // relay/multi-tenant deployment back into the UNTRUSTED fence). Empty preserves the
  // historical behaviour (no goal briefing on the gRPC path).
  string goal = 4;
  // max_team_tokens is the per-request team-wide cumulative token budget
  // (input + output, summed across all members and rounds). TIGHTEN-ONLY: a
  // positive value may only LOWER the server-configured --max-team-tokens
  // ceiling, never raise it; 0 / absent inherits the server's budget. The fold
  // is lower-of-the-two with 0 meaning unlimited: when the server has NO
  // configured budget (--max-team-tokens unset/0), a positive value therefore
  // IMPOSES a budget rather than being capped to "unlimited". Crossed
  // at a round boundary (the in-flight round and the lead's synthesis still
  // complete) → the terminal TeamEvent.outcome frame reports budget_exhausted.
  // Mirrors the in-loop Team tool's per-call max_team_tokens arg. Issue #36.
  int32 max_team_tokens = 5;
}

// CreateTeamResponse returns the new team's id and the enrolled initial roster.
message CreateTeamResponse {
  // team_id identifies the team in subsequent calls.
  string team_id = 1;
  // members is the enrolled initial roster in enrolment order, so the caller need
  // not follow up with ListTeam to see who was added.
  repeated TeamMember members = 2;
}

// TeammateSpec describes a member to enrol — the per-member fields shared by
// CreateTeamRequest's initial roster and SpawnTeammateRequest (minus team_id).
message TeammateSpec {
  // name is the unique member handle peers address messages to.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // agent_type is the optional agent-definition name this member adopts.
  string agent_type = 2;
  // lead marks the coordinating member (it is not auto-assigned tasks).
  bool lead = 3;
  // mutating requests an isolated forked workspace (the member may edit/write).
  bool mutating = 4;
  // initial_prompt is the member's first-turn input, run in round 0.
  string initial_prompt = 5;
}

// SpawnTeammateRequest enrols a member in a team before it runs.
message SpawnTeammateRequest {
  // team_id is the team to add the member to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // name is the unique member handle peers address messages to.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // agent_type is the optional agent-definition name this member adopts.
  string agent_type = 3;
  // lead marks the coordinating member (it is not auto-assigned tasks).
  bool lead = 4;
  // mutating requests an isolated forked workspace (the member may edit/write).
  bool mutating = 5;
  // initial_prompt is the member's first-turn input, run in round 0.
  string initial_prompt = 6;
}

// SpawnTeammateResponse returns the enrolled member.
message SpawnTeammateResponse {
  // member is the newly enrolled member.
  TeamMember member = 1;
}

// SendTeammateMessageRequest posts a message into a member's inbox.
message SendTeammateMessageRequest {
  // team_id is the team the recipient belongs to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // to is the recipient member name.
  string to = 2 [(buf.validate.field).string.min_len = 1];
  // from is the sender label (e.g. "operator"); empty defaults to "operator".
  string from = 3;
  // body is the message text.
  string body = 4 [(buf.validate.field).string.min_len = 1];
}

// SendTeammateMessageResponse is the empty acknowledgement.
message SendTeammateMessageResponse {}

// CancelTeammateRequest cancels one member of a running team.
message CancelTeammateRequest {
  // team_id is the team the member belongs to.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
  // member is the name of the member to cancel.
  string member = 2 [(buf.validate.field).string.min_len = 1];
}

// CancelTeammateResponse is the empty acknowledgement.
message CancelTeammateResponse {}

// RunTeamRequest drives a team to quiescence, streaming member events.
message RunTeamRequest {
  // team_id is the team to run.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// TeamEvent is one member's session Event, tagged with the producing member —
// the multiplexed team stream the client observes.
message TeamEvent {
  // member is the name of the member whose session produced the event.
  string member = 1;
  // event is the underlying session event.
  Event event = 2;
  // outcome is the team's terminal outcome, set ONLY on the single final frame
  // of a RunTeam stream (after every member event). On that frame member is
  // empty and event is nil; on every other frame outcome is nil. Issue #36.
  TeamOutcome outcome = 3;
}

// TeamOutcome is the terminal result of a RunTeam drive — the wire projection of
// the supervisor's agent.TeamOutcome, carried on the single final TeamEvent frame
// of the RunTeam stream (gRPC and HTTP SSE alike). It reuses the existing Usage /
// TeamFinding / TeamMemberDisposition shapes; member content beyond the capped
// finding previews never rides it. Issue #36.
message TeamOutcome {
  // rounds is the number of scheduling rounds that ran work.
  int32 rounds = 1;
  // quiescent reports genuine completion (all tasks done, mailboxes empty, no
  // member still working) versus stopping on a round cap / stuck dependency /
  // budget.
  bool quiescent = 2;
  // budget_exhausted reports that the team-wide token budget crossed at a round
  // boundary and no further round was scheduled (the in-flight round and the
  // lead's synthesis still completed). false when no budget was set or it never
  // crossed.
  bool budget_exhausted = 3;
  // stop is the team's terminal stop reason — a STRING passthrough of
  // session.StopReason (no enum): "end_turn" for a quiescent team, "budget" for
  // a budget-stopped one, "max_turns" for a round-cap / stuck-dependency stop.
  string stop = 4;
  // usage is the supervisor-accumulated team token total across all members and
  // rounds, synthesis included.
  Usage usage = 5;
  // dispositions holds each member's terminal disposition in enrolment order.
  repeated TeamMemberDisposition dispositions = 6;
  // findings is the team's findings ledger at the end of the run, in append
  // order, bodies capped exactly like the event-stream projection.
  repeated TeamFinding findings = 7;
}

// ListTeamRequest names the team to snapshot.
message ListTeamRequest {
  // team_id is the team to snapshot.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListTeamResponse is the team roster, task list, and completion state.
message ListTeamResponse {
  // members is the roster in enrolment order.
  repeated TeamMember members = 1;
  // tasks is the shared task list in creation order.
  repeated TeamTask tasks = 2;
  // quiescent reports whether the team has reached completion.
  bool quiescent = 3;
}

// TeamMember mirrors a team roster entry.
message TeamMember {
  // name is the member handle.
  string name = 1;
  // agent_type is the adopted agent-definition name, if any.
  string agent_type = 2;
  // state mirrors team.MemberState: spawning / working / idle / stopped.
  string state = 3;
  // session_id is the backing session's id.
  string session_id = 4;
}

// TeamTask mirrors a shared task-list entry.
message TeamTask {
  // id is the stable task identifier.
  string id = 1;
  // description is the work to do.
  string description = 2;
  // state mirrors team.TaskState: pending / in_progress / completed.
  string state = 3;
  // assignee is the member that claimed the task, or empty.
  string assignee = 4;
  // deps are the task ids that must complete before this task is claimable.
  repeated string deps = 5;
}

// TeamFinding mirrors a shared findings-ledger entry, projected onto the team event
// stream. It carries only the recording member's name and a CAPPED body preview,
// never the raw finding.
message TeamFinding {
  // member is the name of the member that recorded the finding.
  string member = 1;
  // body is a CAPPED preview of the finding text.
  string body = 2;
}

// TeamMemberStopReason is WHY a stopped member stopped (team.end disposition snapshot).
// Closed enum: a supervisor verdict, never member-authored text.
enum TeamMemberStopReason {
  // a done member, or an unknown/future reason.
  TEAM_MEMBER_STOP_REASON_UNSPECIFIED = 0;
  // the member's run failed or its session could not be re-opened.
  TEAM_MEMBER_STOP_REASON_ERROR = 1;
  // the member was ended by ctx cancellation.
  TEAM_MEMBER_STOP_REASON_CANCELLED = 2;
  // the member exhausted its lifetime turn budget.
  TEAM_MEMBER_STOP_REASON_BUDGET = 3;
}

// TeamMemberDisposition is one member's TERMINAL disposition (team.end). Mirrors
// session.TeamMemberDisposition. Closed-enum supervisor verdicts only — no member
// content. A bool stopped + enum reason keeps the done/stopped split a closed
// two-state (a done member has no reason, so (done, error) is non-representable).
message TeamMemberDisposition {
  // name matches a roster entry by name.
  string name = 1;
  // stopped reports whether the member ended non-resumably / budget-exhausted (true)
  // or cleanly (false).
  bool stopped = 2;
  // reason is WHY a stopped member stopped; UNSPECIFIED for a done member.
  TeamMemberStopReason reason = 3;
  // error_rounds is how many of this member's rounds ended in a run-level error,
  // whether it was retried through them or finally stopped by them (issue #318). A
  // member's errored round is now bounded-retried rather than always terminal, so a
  // member can fail a round and still finish stopped=false / reason=UNSPECIFIED — this
  // count is then the ONLY signal a client has that the run was not clean. It is a
  // count of supervisor verdicts, never member content.
  int32 error_rounds = 4;
}

// CleanupTeamRequest names the finished team to tear down.
message CleanupTeamRequest {
  // team_id is the team to clean up.
  string team_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CleanupTeamResponse is the empty acknowledgement.
message CleanupTeamResponse {}

// ApprovePlanRequest resolves a parked plan-approval ask (issue #206). See the
// ApprovePlan rpc doc above for the target_mode → verdict mapping and the
// atomic resume + continuation contract.
message ApprovePlanRequest {
  // session_id is the session parked awaiting a plan-approval ask.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // target_mode selects the verdict / resulting posture: DEFAULT → allow-once
  // (flip to default), ACCEPT_EDITS → allow-always (flip to accept-edits),
  // PLAN/UNSPECIFIED → deny (iterate, no flip, no continuation run).
  PermissionMode target_mode = 2;
  // note is an OPTIONAL operator remark appended to the proceed message
  // injected into the continuation run's first user message (allow paths only).
  string note = 3;
}

// ManualDreamCapabilities reports manual generation/decision availability for
// each closed target independently.
message ManualDreamCapabilities {
  DreamTargetCapability project_memory = 1;
  DreamTargetCapability user_model = 2;
}

message DreamTargetCapability {
  bool generate = 1;
  bool decide = 2;
  string unavailable_reason = 3;
}

message GenerateDreamPlanRequest {
  // target must be exactly "project_memory" or "user_model".
  string target = 1;
}

message GenerateDreamPlanResponse {
  DreamReviewPlan plan = 1;
}

message DecideDreamPlanRequest {
  string plan_id = 1;
  // decision must be exactly "apply" or "dismiss".
  string decision = 2;
}

message DecideDreamPlanResponse {
  DreamReceipt receipt = 1;
}

message DreamReviewPlan {
  string id = 1;
  string target = 2;
  google.protobuf.Timestamp expires_at = 3;
  int32 planned_operation_count = 4;
  int32 planned_source_count = 5;
  repeated DreamOperation operations = 6;
}

message DreamOperation {
  string kind = 1;
  DreamParticipant survivor = 2;
  repeated DreamParticipant sources = 3;
  DreamReplacement replacement = 4;
  string reason = 5;
  bool exact_duplicate_eligible = 6;
}

message DreamParticipant {
  string key = 1;
  string value = 2;
  string description = 3;
}

message DreamReplacement {
  string value = 1;
  string description = 2;
}

message DreamReceipt {
  string id = 1;
  string target = 2;
  string disposition = 3;
  int32 planned_source_count = 4;
  int32 applied_source_count = 5;
  int32 conflicted_source_count = 6;
  int32 skipped_source_count = 7;
  int32 failed_source_count = 8;
}

// CompactSessionRequest identifies the owned main-chat session to compact.
message CompactSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CompactSessionResponse reports whether the compactor reduced model history.
message CompactSessionResponse {
  bool compacted = 1;
}

// WorkspaceEnrollmentConnectRequest starts or observes the caller-owned bundle.
message WorkspaceEnrollmentConnectRequest {
  string session_id = 1;
}

// WorkspaceEnrollmentControlRequest targets one exact whole-bundle correlation.
// There is deliberately no backend/provider field.
message WorkspaceEnrollmentControlRequest {
  string session_id = 1;
  string enrollment_id = 2;
}

// WorkspaceEnrollment is the safe bundle-level client projection. presentation_url
// is an ephemeral launch value; clients must not render, persist, or log it.
message WorkspaceEnrollment {
  string enrollment_id = 1;
  string status = 2;
  uint32 required_services = 3;
  string presentation_url = 4;
}
