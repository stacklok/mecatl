// Session is a snapshot of server-side session state.
message Session {
  // session_id is the session's id.
  string session_id = 1;
  // state is the lifecycle state (idle/running/awaiting/completed/...).
  string state = 2;
  // mode is the permission posture.
  PermissionMode mode = 3;
  reserved 4, 13;
  reserved "workspace", "adoption_source_session_id";
  // limits are the configured stop conditions.
  Limits limits = 5;
  // turns is the number of model calls begun.
  int32 turns = 6;
  // tool_calls is the total number of tool invocations recorded.
  int32 tool_calls = 7;
  // created_at_unix is the creation timestamp in Unix seconds.
  int64 created_at_unix = 8;
  // resolved_model is the EFFECTIVE provider+model this session resolved to
  // (composition-computed, echoed verbatim; FIXED per TURN, re-resolved between
  // turns on a permission-mode change — plan-slot / opusplan, ADR 0030 Layer 3).
  // Mirrors CreateSessionResponse.resolved_model so a snapshot reader (GetSession)
  // sees the same effective model the create response carried — and is the canonical
  // place a client re-reads the model AFTER a mode change. Nil/absent from an older
  // server → client falls back to today's behavior.
  ResolvedModel resolved_model = 9;
  // title is the deprecated compatibility title; use title_metadata.title.
  string title = 10 [deprecated = true];
  // title_provenance is deprecated compatibility provenance; use title_metadata.provenance.
  // Allowed values: "first-prompt", "operator", "generated", or empty for legacy/unknown.
  string title_provenance = 12 [deprecated = true];
  // capabilities is the server's feature-advertisement snapshot (the SAME value
  // CreateSessionResponse carries). It rides the Session snapshot so a client
  // that reloads or switches to a persisted session (continue, /effort fork,
  // /clear successor) can re-derive its affordances in ONE round-trip (GetSession)
  // instead of creating another session. An older server omits the field, so the
  // client sees a zero value
  // and keeps its current caps untouched (fail-conservative).
  ServerCapabilities capabilities = 11;
  // kind and relationship preserve the durable trusted-producer identity.
  string kind = 14;
  SessionRelationship relationship = 15;
  // Selected global server names and the exact creation-time direct-tool ceiling.
  // These contain no URLs, headers, credentials, or inline MCP configuration.
  repeated string debug_mcp_servers = 16;
  repeated string debug_mcp_tools = 17;
  PlacementMetadata placement = 18;
  // title_metadata is the canonical bounded, source-free title lifecycle projection.
  SessionTitle title_metadata = 19;
  // token_usage is the canonical durable session token accounting. Map keys identify
  // usage types; `main` is ordinary main-session agent usage. Other keys are
  // server-defined and are not enumerated here.
  map<string, TokenUsage> token_usage = 20;
}

// SessionTitle is the canonical durable, source-free title lifecycle projection.
// It never carries title-source prompts, provider error text, or token usage.
message SessionTitle {
  // title is the authoritative human-readable session label.
  string title = 1;
  // provenance is "first-prompt", "operator", "generated", or empty for legacy/unknown.
  string provenance = 2;
  // generation_state is "disabled", "pending", "generated", or "exhausted".
  string generation_state = 3;
  // latest_attempt is the latest durable attempt without provider error detail.
  TitleAttemptSummary latest_attempt = 4;
  // revision advances on each effective durable title metadata mutation; zero is legacy.
  uint64 revision = 5;
}

// TitleAttemptSummary is the latest durable title attempt without provider error detail.
message TitleAttemptSummary {
  // id is a server-minted opaque attempt identifier.
  string id = 1;
  // outcome is "succeeded", "deferred", "failed", "interrupted", or empty while claimed.
  string outcome = 2;
  reserved 3;
}

// TokenUsage is one canonical usage bucket. models maps opaque server-produced
// provider/model attribution strings (or "unknown" for legacy data) to Usage;
// total always equals the element-wise sum of models. In token_usage, each bucket
// is part of the durable session accounting, not a per-run or per-turn report.
message TokenUsage {
  Usage total = 1;
  map<string, Usage> models = 2;
}

// ConverseRequest is a client-to-server frame on the Converse stream. The
// first frame MUST be `prompt` or `retry`; later frames are controls. A received
// second `prompt` or `retry` is rejected with INVALID_ARGUMENT, but controls in
// transit when the server completes the run may observe normal stream completion.
// Field numbers 1-9 are reserved for the start family; 10+ for the
// gate/cancellation family.
message ConverseRequest {
  oneof kind {
    // prompt starts a normal run with a new user message.
    Prompt prompt = 1;
    // retry starts a prompt-free retry of an eligible failed model step.
    RetryStart retry = 2;
    // resume_approval resolves a paused permission.ask.
    ResumeApproval resume_approval = 10;
    // cancel aborts the in-flight run.
    Cancel cancel = 11;
    // cancel_child cancels ONE child run (a subagent) of the in-flight run,
    // leaving the run itself (and any sibling children) untouched.
    CancelChild cancel_child = 12;
    // steer injects an operator instruction mid-run (steer-while-running,
    // issue #512): the run's steer inbox parks it and the loop drains it at
    // the next turn boundary, recording it as an ordinary user continuation.
    // The server echoes the authoritative outcome back on the stream as a
    // steer.outcome event. gRPC-only in v1 (the HTTP/SSE surface has no
    // client→server mid-run channel).
    Steer steer = 13;
    // steer_cancel retracts the run's PENDING (un-drained) steer, if any.
    // The authoritative outcome rides back as a steer.outcome event
    // (retracted / none_pending).
    SteerCancel steer_cancel = 14;
  }
}

// ConverseResponse is a server-to-client frame: one Event envelope per
// domain event, emitted in sequence order until the terminal result.
message ConverseResponse {
  // event is the domain event for this frame.
  Event event = 1;
}

// Content is one non-text part of a multimodal user prompt. EXACTLY ONE of
// data/url is set: data carries inline bytes, url a remote reference. mime_type
// is the IANA media type (e.g. "image/png", "audio/wav"). The "data XOR url" and
// "kind != UNSPECIFIED" rules are enforced by the server (the mapper rejects a
// malformed part), not at the wire layer.
message Content {
  // Kind discriminates the media kind of the part.
  enum Kind {
    // KIND_UNSPECIFIED is rejected by the server: every part must name its kind.
    KIND_UNSPECIFIED = 0;
    // KIND_IMAGE is an image part.
    KIND_IMAGE = 1;
    // KIND_AUDIO is an audio part.
    KIND_AUDIO = 2;
  }
  // kind is the media kind (image / audio); UNSPECIFIED is rejected.
  Kind kind = 1;
  // mime_type is the IANA media type of the part.
  string mime_type = 2;
  // data is the inline content bytes; empty when url-sourced.
  bytes data = 3;
  // url is the remote reference; empty when inline.
  string url = 4;
}

// ContentBlock is a typed content block on a tool result (mirrors
// session.Content for tool-result Parts). A sum-type over Kind.
message ContentBlock {
  // Kind discriminates the block kind.
  enum Kind {
    // KIND_UNSPECIFIED is the zero value; consumers treat it as absent.
    KIND_UNSPECIFIED = 0;
    // KIND_TEXT is a text block.
    KIND_TEXT = 1;
    // KIND_IMAGE is an inline image block.
    KIND_IMAGE = 2;
    // KIND_AUDIO is an inline audio block.
    KIND_AUDIO = 3;
    // KIND_RESOURCE_LINK is a reference to an MCP resource by URI.
    KIND_RESOURCE_LINK = 4;
    // KIND_EMBEDDED_RESOURCE is an embedded MCP resource (text or blob).
    KIND_EMBEDDED_RESOURCE = 5;
    // KIND_STRUCTURED_CONTENT is a JSON structured-content block.
    KIND_STRUCTURED_CONTENT = 6;
  }
  // kind is the block kind.
  Kind kind = 1;
  // mime_type is the IANA media type of inline bytes (image/audio/blob).
  string mime_type = 2;
  // data is the inline content bytes (image/audio/blob).
  bytes data = 3;
  // url is the remote reference (resource-link URI, or URL-sourced media).
  string url = 4;
  // text is the text payload (BlockText, BlockEmbeddedResource text, or
  // BlockStructuredContent JSON).
  string text = 5;
  // name is the resource-link name.
  string name = 6;
  // title is the resource-link title.
  string title = 7;
  // description is the resource-link description.
  string description = 8;
  // size is the resource-link size in bytes.
  int64 size = 9;
  // audience is advisory display routing only (CWE-345: untrusted).
  repeated string audience = 10;
  // priority is the advisory display priority.
  double priority = 11;
  // last_modified is the resource-link last-modified timestamp (RFC 3339).
  string last_modified = 12;
}

message RetryStart {
  // session_id is the failed session whose exact model step should be retried.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Prompt is a normal Converse start frame. It names the session the run
// executes against and the user prompt to process. The prompt is text and/or
// media: at least one of text/parts must be non-empty. The "text or parts
// non-empty" rule is a CROSS-FIELD constraint enforced by the server (the proto
// only carries per-field constraints), which is why text no longer carries a
// min_len — it is optional when parts is set.
message Prompt {
  // session_id is the session this run belongs to.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  // text is the flattened user prompt text; optional when parts is set.
  string text = 2;
  // parts carries non-text media (image/audio) alongside the text.
  repeated Content parts = 3;
}

// ResumeApproval releases a paused permission.ask, allowing or denying the
// proposed tool call. The ask_id echoes the PermissionAsk.ask_id from the
// event stream.
message ResumeApproval {
  // ask_id correlates the resolution with the paused ask.
  string ask_id = 1 [(buf.validate.field).string.min_len = 1];
  // allow permits the tool when true, denies it when false. LEGACY: kept for
  // back-compat with clients that predate `verdict`. When `verdict` is set
  // (!= APPROVAL_VERDICT_UNSPECIFIED) it takes precedence and this bool is
  // ignored; otherwise true maps to ALLOW_ONCE and false to DENY.
  bool allow = 2;
  // verdict is the three-way resolution: deny, allow this call once, or allow
  // always (which additionally LEARNS a per-session allow rule for the matching
  // tool + exact pattern). Preferred over `allow`; UNSPECIFIED falls back to it.
  ApprovalVerdict verdict = 3;
  // expected_run_id, when set, scopes this control to ONE run: the server
  // refuses it if the session's current run is a different one, and the newer
  // run is left untouched.
  //
  // It closes a real race, not a hypothetical one. Controls are addressed at a
  // SESSION, so a control still in flight when a run ends would otherwise land
  // on whatever run started next — approving a tool call the user never saw, or
  // cancelling work they did not ask to stop. `seq` cannot distinguish the two
  // runs (it restarts each run), so before run ids there was no way to express
  // "this one".
  //
  // EMPTY is the legacy behaviour exactly: the control applies to whatever run
  // is current. Existing clients are unaffected; a client that knows the run id
  // it is acting on should always send it.
  string expected_run_id = 4;
}

// ApprovalVerdict is the client's three-way resolution of a permission.ask,
// mirroring session.ApprovalVerdict. ALLOW_ALWAYS both permits the current call
// and asks the harness to learn a per-session allow rule for the same tool +
// exact canonical pattern; it NEVER overrides a deny and NEVER bypasses plan-mode
// mutation denial.
enum ApprovalVerdict {
  // APPROVAL_VERDICT_UNSPECIFIED falls back to the legacy `allow` bool at the
  // server boundary (true -> ALLOW_ONCE, false -> DENY).
  APPROVAL_VERDICT_UNSPECIFIED = 0;
  // APPROVAL_VERDICT_DENY refuses the proposed tool call.
  APPROVAL_VERDICT_DENY = 1;
  // APPROVAL_VERDICT_ALLOW_ONCE permits this call only; nothing is learned.
  APPROVAL_VERDICT_ALLOW_ONCE = 2;
  // APPROVAL_VERDICT_ALLOW_ALWAYS permits this call and learns a per-session
  // allow rule for the matching tool + exact pattern.
  APPROVAL_VERDICT_ALLOW_ALWAYS = 3;
}

// Cancel aborts the in-flight run. The loop observes the cancellation and
// terminates with a result carrying stop = "cancelled".
message Cancel {
  // expected_run_id, when set, scopes the cancel to ONE run: the server refuses
  // it if the session's current run is a different one. Cancelling the wrong run
  // is the most costly stale-control outcome — it destroys work rather than
  // merely permitting it — so a client that knows which run it is stopping
  // should always send this. Empty keeps the legacy "cancel whatever is running"
  // behaviour.
  string expected_run_id = 1;
}

// CancelChild cancels ONE child of the in-flight run, addressed by its child
// SESSION id — the same handle the model reads on the Subagent result's
// "agentId:" line and clients read on subagent.start's child_id (no derivation;
// one handle everywhere). The child unwinds (mid-drive, mid-gate-wait, or parked
// on a surfaced permission.ask — the server then emits a permission.retract for
// each withdrawn ask), ends StopCancelled, is persisted, and stays resumable;
// the parent run keeps streaming. Unknown or already-finished ids are ignored on
// the stream (the finished-as-you-pressed race is benign); the HTTP mirror
// (POST /v1/sessions/{id}/cancel-child) reports them as 404.
message CancelChild {
  // child_id is the child session id, verbatim (e.g. "subagent-<callID>").
  string child_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Steer injects an operator instruction into the IN-FLIGHT run
// (steer-while-running, issue #512). It never preempts or aborts the in-flight
// model call: the run's steer inbox parks the text (a SINGLE slot — a second
// steer while one is pending APPENDS into the pending bundle, merged with a
// blank-line separator; the merged bundle still drains as ONE user message.
// Replacing a pending bundle is explicit steer_cancel-then-resend) and the
// loop drains it at the next turn boundary, recording it as an ordinary user
// continuation. The server echoes the authoritative outcome on the stream
// (steer.outcome); when the run's inbox is closed (the run went terminal
// behind the client's "still running" belief) the text is PROMOTED to a fresh
// follow-up run, never silently dropped.
message Steer {
  // text and parts form the operator instruction to inject at the next turn
  // boundary. At least one must be non-empty.
  string text = 1;
  // message_id is the CLIENT-MINTED correlation key for THIS frame (unique per
  // send; empty means uncorrelated). The server echoes the frame's own id
  // verbatim on its steer.outcome ack. On the EvSteer drain echo it carries a
  // WATERMARK: the LATEST (tail) contributing send's id of the bundle that
  // just drained — sends up to and including the watermark drained, sends
  // after it are still pending, so the client splits its ordered queue on it.
  // text is NOT a safe correlation key (two sends can carry the same text).
  string message_id = 2;
  // parts carries image/audio content alongside text, using the same validated
  // wire shape as Prompt.parts. A media-only steer is valid.
  repeated Content parts = 3;
  // expected_run_id, when set, scopes this control to ONE run: the server
  // refuses it if the session's current run is a different one, and the newer
  // run is left untouched.
  //
  // It closes a real race, not a hypothetical one. Controls are addressed at a
  // SESSION, so a control still in flight when a run ends would otherwise land
  // on whatever run started next — approving a tool call the user never saw, or
  // cancelling work they did not ask to stop. `seq` cannot distinguish the two
  // runs (it restarts each run), so before run ids there was no way to express
  // "this one".
  //
  // EMPTY is the legacy behaviour exactly: the control applies to whatever run
  // is current. Existing clients are unaffected; a client that knows the run id
  // it is acting on should always send it.
  //
  // On a steer it is additionally STRICT: supplying it means "steer this run or
  // nothing". A steer that loses the terminal race is normally PROMOTED into a
  // fresh follow-up run; with expected_run_id set it is refused instead, because
  // a caller naming a specific run did not ask to start a different one.
  string expected_run_id = 4;
}

// SteerCancel retracts the run's PENDING (un-drained) steer, if any. It is
// idempotent: a cancel with nothing pending reports none_pending. A steer that
// already drained at a turn boundary is ordinary recorded history and cannot
// be retracted (the cancel reports none_pending then — the drain won).
message SteerCancel {
  // message_id is the CLIENT-MINTED correlation key, echoed verbatim on the
  // steer.outcome ack (same contract as Steer.message_id).
  string message_id = 1;
  // expected_run_id, when set, scopes this control to ONE run: the server
  // refuses it if the session's current run is a different one, and the newer
  // run is left untouched.
  //
  // It closes a real race, not a hypothetical one. Controls are addressed at a
  // SESSION, so a control still in flight when a run ends would otherwise land
  // on whatever run started next — approving a tool call the user never saw, or
  // cancelling work they did not ask to stop. `seq` cannot distinguish the two
  // runs (it restarts each run), so before run ids there was no way to express
  // "this one".
  //
  // EMPTY is the legacy behaviour exactly: the control applies to whatever run
  // is current. Existing clients are unaffected; a client that knows the run id
  // it is acting on should always send it.
  string expected_run_id = 2;
}

// SteerOutcome is the AUTHORITATIVE result of a steer inbox transition,
// mirroring the engine's closed-enum agent.SteerOutcome. The client cannot
// observe the exact drain moment across stream latency, so the engine reports
// what actually happened to the steer rather than letting the client guess.
enum SteerOutcome {
  // STEER_OUTCOME_UNSPECIFIED is the zero value; the server never sends it.
  STEER_OUTCOME_UNSPECIFIED = 0;
  // STEER_OUTCOME_ACCEPTED: the steer parked in the (empty) pending slot; it
  // drains at the next turn boundary unless retracted first.
  STEER_OUTCOME_ACCEPTED = 1;
  // STEER_OUTCOME_APPENDED: the steer found the pending slot OCCUPIED and was
  // MERGED into it (append is the default for a second steer): the pending
  // bundle's text grew by a blank-line separator + text, and it still drains as
  // ONE bundle. Distinguished from ACCEPTED (a NEW pending bundle) so the client
  // can render "merged onto pending" honestly. Replacing the pending bundle is
  // explicit: steer_cancel, then resend with a fresh message_id.
  STEER_OUTCOME_APPENDED = 2;
  // STEER_OUTCOME_RETRACTED: a steer_cancel found a pending steer and
  // retracted it; the run drains nothing for it.
  STEER_OUTCOME_RETRACTED = 3;
  // STEER_OUTCOME_NONE_PENDING: a steer_cancel found the slot EMPTY — there
  // was nothing to retract (no steer pending, or the run terminal).
  STEER_OUTCOME_NONE_PENDING = 4;
  // STEER_OUTCOME_TOO_LATE: the steer arrived after the run went terminal
  // (the inbox was closed). The server promoted the text to a fresh follow-up
  // run (promoted=true on the event) rather than dropping it.
  STEER_OUTCOME_TOO_LATE = 5;
}

// GetMcpAuthorizationPresentationRequest carries only owner-scoped correlation.
// It has no status, OAuth code, credential, private binding, or tool arguments,
// so a client cannot assert authorization success.
message GetMcpAuthorizationPresentationRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  string authorization_id = 2 [(buf.validate.field).string.min_len = 1];
}

// GetMcpAuthorizationPresentationResponse exposes a live browser URL only as the
// response to the owner-authorized presentation control. It is never an event
// payload and must not be persisted in a session snapshot or event log.
message GetMcpAuthorizationPresentationResponse {
  string url = 1;
}

// RecheckMcpAuthorizationRequest is one client frame. The mandatory first
// frame carries only owner-scoped correlation in session_id/authorization_id;
// subsequent frames leave those fields empty and carry one control.
message RecheckMcpAuthorizationRequest {
  string session_id = 1;
  string authorization_id = 2;
  oneof control {
    ResumeApproval resume_approval = 10;
    Cancel cancel = 11;
  }
}

// RecheckMcpAuthorizationResponse wraps one authoritative status or continuation event.
message RecheckMcpAuthorizationResponse {
  Event event = 1;
}

// CancelMcpAuthorizationRequest uses the same grammar while keeping the two RPC
// request envelopes method-specific.
message CancelMcpAuthorizationRequest {
  string session_id = 1;
  string authorization_id = 2;
  oneof control {
    ResumeApproval resume_approval = 10;
    Cancel cancel = 11;
  }
}

// CancelMcpAuthorizationResponse wraps one authoritative resolution or continuation event.
message CancelMcpAuthorizationResponse {
  Event event = 1;
}

// Authorization is the safe event projection of an external authorization
// lifecycle. Status is a closed string passthrough: pending, granted, denied,
// cancelled, expired, interrupted, failed, or closed. display_name is optional
// bounded human-facing authority/service text. The payload deliberately has no
// URL, OAuth code, credential, private binding, topology, or tool arguments.
message Authorization {
  string authorization_id = 1;
  string call_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  string status = 4;
  string display_name = 5;
}

// Event mirrors the domain session.Event one-for-one. `type` is the string
// event kind; the structured submessages are populated per kind.
message Event {
  // type is the event kind (mirrors session.EventType: session.init,
  // turn.start, turn.end, message.delta, reasoning.delta, tool.call,
  // tool.result, permission.ask, hook, compaction, result).
  string type = 1;
  // seq is the monotonically increasing sequence number within a run.
  int64 seq = 2;
  // turn is the 0-based turn index this event belongs to (mirrors
  // session.Event.Turn; clients add 1 for a human-facing "turn N").
  int32 turn = 3;
  // text carries streamed or final text where applicable.
  string text = 4;
  // tool_call is set on tool.call events.
  ToolCall tool_call = 5;
  // tool_result is set on tool.result events.
  ToolResult tool_result = 6;
  // ask is set on permission.ask events; ask_id is echoed in ResumeApproval.
  PermissionAsk ask = 7;
  // result is set on the terminal result event.
  Result result = 8;
  // usage is set on usage-bearing events. On the result event it is the
  // cumulative run total; turn.end carries its per-turn usage in turn_end.
  Usage usage = 9;
  // turn_end is set on turn.end events (this turn's usage + elapsed time).
  TurnEnd turn_end = 10;
  // hook is set on hook events: the structured phase/tool/decision so clients
  // render hook notices distinctly (and colour blocked ones) instead of parsing
  // the free-text `text` field.
  Hook hook = 11;
  // subagent is set on the three subagent.* events (subagent.start /
  // subagent.tool / subagent.end): a REDACTED, metadata-only projection of a Task
  // child run. It NEVER carries child content (no message text, tool args, or
  // result bodies) — only ids, a goal label, tool names/counts, usage, stop, and
  // duration — so the context-isolation guarantee is preserved.
  Subagent subagent = 12;
  // team is set on the three team.* events (team.start / team.member / team.end):
  // a BOUNDED projection of an in-process Team tool run. Unlike subagent (metadata
  // only), it is fuller — team.member carries member message text and CAPPED
  // tool-call/result previews — but it is STILL bounded (every preview is capped)
  // and a member's permission.ask is DROPPED, never forwarded. The per-member
  // transcripts never enter the parent conversation (only the joined summary does).
  Team team = 13;
  // parallel is set on the three parallel.* events (parallel.start /
  // parallel.branch / parallel.end): a REDACTED, metadata-only projection of a
  // Parallel fork-join run. Like subagent it NEVER carries branch content (no
  // message text, tool args, or result bodies) — only ids, a goal label, tool
  // names/counts, usage, stop, duration, the join strategy, and the winner index.
  // Physical fork roots and reusable placement authority are never projected. The
  // branch summaries fold into the parent conversation
  // only via the Parallel tool result.
  Parallel parallel = 14;
  // schedule.* — the scheduler lifecycle (EvScheduleFired/Skipped/Failed). For v1
  // delivered to the fire session's durable EventLog ONLY (pull-only via
  // GetFire/ListFires); a live broadcast stream is a future phase. Emitted from
  // composition (the scheduler), NOT the loop. String-passthrough kind/stop/err,
  // no enum.
  SchedulePayload schedule = 15;
  // approval is set on approval events (EvApproval — the verdict half of a
  // permission ask). LOG-ONLY on the live Converse wire (the relay skips them:
  // the client holds its own verdict; this is audit history). StreamSessionEvents
  // (the read-back of the durable log) relays them so a transcript replay shows
  // the verdicts. Metadata-only by construction (gauntlet #7): tool NAME + verdict
  // string + askID, NEVER raw args.
  Approval approval = 16;
  // user_prompt is set on user_prompt events (EvUserPrompt — the recorded user
  // message). LOG-ONLY on the live Converse wire; StreamSessionEvents relays them
  // so a transcript replay shows what the user asked.
  UserPrompt user_prompt = 17;
  // compaction_archive is set on compaction.archive events (EvCompactionArchive —
  // the pre-compaction conversation). LOG-ONLY on the live Converse wire;
  // StreamSessionEvents relays them so a transcript replay recovers dropped turns.
  CompactionArchive compaction_archive = 18;
  // steer is set on steer events (EvSteer — the run's steer-inbox DRAIN echo):
  // the COMMITTED operator steer just recorded into the conversation as an
  // ordinary user continuation. CLIENT-VISIBLE and AUTHORITATIVE: the engine is
  // the sole authority on which steer won the slot, so the client renders THIS
  // text. Byte-identical to the recorded user message replayed to the model
  // (recorded == streamed == model-view).
  SteerEcho steer = 19;
  // steer_outcome is set on steer.outcome events: the AUTHORITATIVE ack for a
  // steer / steer_cancel frame the client sent on this stream (accepted /
  // accepted / appended / retracted / none_pending / too_late). CLIENT-VISIBLE, one per
  // steer frame, sequenced in send order.
  SteerAck steer_outcome = 20;
  // model_retry carries the typed failed terminal consumed by a model.retry
  // lifecycle boundary. Clients and event-source hosts must not parse text.
  ModelRetry model_retry = 21;
  // run_id is the opaque, server-minted identity of the run that emitted this
  // event (ADR 0249). It is stamped by the agent loop, so every event a run
  // emits carries it on both the gRPC and HTTP/SSE surfaces.
  //
  // It is OPAQUE: it encodes nothing and exists only to be compared for
  // equality. A client uses it to know which run an event belongs to — `seq` is
  // monotonic WITHIN a run and restarts each run, so it cannot distinguish two
  // runs of one session — and to address controls at a specific run rather than
  // "whatever is running now".
  //
  // EMPTY IS MEANINGFUL, not missing: it means the event is SESSION-scoped
  // rather than run-scoped. The schedule.* lifecycle events are emitted outside
  // any run and legitimately carry no id. A client following one run filters on
  // an exact match and so never sees them; a client showing a session timeline
  // includes them.
  string run_id = 22;
  // title is set on session.title events. It is the authoritative, source-free
  // title lifecycle projection after a persisted title state change.
  SessionTitle title = 23;
  // authorization is set on authorization.required and authorization.resolved
  // events. It is safe durable correlation only; the live presentation URL and
  // private continuation state never enter this payload.
  Authorization authorization = 24;
}

// ModelRetry identifies the failed-step retry intent being driven.
message ModelRetry {
  RetryDisposition retry_disposition = 1;
  StreamProgress stream_progress = 2;
}

// SteerEcho is the proto projection of session.SteerPayload (EvSteer): the
// committed operator steer the turn-boundary drain just recorded. See Event.steer.
message SteerEcho {
  // text is the committed steer text, byte-identical to the user message
  // recorded into history and replayed to the model.
  string text = 1;
  // message_id carries the WATERMARK of the drained bundle — the client-minted
  // Steer.message_id of the LATEST (tail) send that contributed to this drain
  // (empty when the sender supplied none). The client splits its ordered queue
  // on it: sends up to and including the watermark drained (they land in
  // context here), sends after it are still pending.
  string message_id = 2;
  // parts is the committed media bundle, byte-identical to the user message
  // recorded into history and replayed to the model.
  repeated Content parts = 3;
}

// SteerAck is the proto projection of a steer-frame outcome: the server's
// authoritative report of what happened to a steer / steer_cancel frame.
message SteerAck {
  // outcome is the closed-enum result (mirrors agent.SteerOutcome).
  SteerOutcome outcome = 1;
  // text echoes the steer text the outcome is about (empty for steer_cancel).
  string text = 2;
  // promoted is true when a too_late steer was promoted to a fresh follow-up
  // run through the run-entry funnel (the text drives a new run instead of
  // draining into the finished one) — never silently dropped.
  bool promoted = 3;
  // message_id echoes the client-minted id of the Steer / SteerCancel frame
  // this ack answers (empty when the frame supplied none), so the client
  // correlates the authoritative outcome with its send and ignores stale acks.
  string message_id = 4;
}

// Approval is the proto projection of session.ApprovalPayload (EvApproval):
// the verdict half of a permission ask. Metadata-only (gauntlet #7): tool NAME +
// verdict string + askID + the opaque gated-call id + the allow-always flag.
// NEVER raw args. LOG-ONLY on the live Converse wire; surfaced only by the
// StreamSessionEvents replay.
message Approval {
  // ask_id is the id of the resolved permission ask (mirrors PermissionAsk.ask_id).
  string ask_id = 1;
  // verdict is the resolution string (allow_once / allow_always / deny) — a
  // passthrough of session.VerdictString*, no enum.
  string verdict = 2;
  // tool is the NAME of the tool the ask gated. It is the tool name ALONE — never
  // the call's args.
  string tool = 3;
  // call_id is the opaque id of the gated ToolCall (the durable, grammar-free
  // correlation handle a 3b consumer uses to find the call in the conversation).
  string call_id = 4;
  // allow_always mirrors (Verdict == allow_always): the verdict asked the harness
  // to learn a per-session allow rule. It honestly reflects the VERDICT, not the
  // policy outcome (Policy.Learn may no-op on an unlearnable call).
  bool allow_always = 5;
}

// UserPrompt is the proto projection of session.UserPromptPayload (EvUserPrompt):
// the recorded user message (Text + non-text media Parts). It is the durable
// record of what the user asked. LOG-ONLY on the live Converse wire; surfaced only
// by the StreamSessionEvents replay.
message UserPrompt {
  // text is the flattened user-message text (the prompt body, or a harness-authored
  // continuation/notice).
  string text = 1;
  // parts carries any non-text media (image/audio) that rode alongside the text on
  // the user message; nil for a text-only prompt.
  repeated Content parts = 2;
}

// CompactionArchive is the proto projection of session.CompactionArchivePayload
// (EvCompactionArchive): the pre-compaction conversation that ReplaceHistory
// replaced. It carries the full pre-compaction Messages slice so a replay recovers
// the dropped turns. The parent's OWN conversation (gauntlet #7 — no child content).
// LOG-ONLY on the live Converse wire; surfaced only by the StreamSessionEvents
// replay.
message CompactionArchive {
  // replaced is the pre-compaction message slice (each message is a
  // ConversationMessage).
  repeated ConversationMessage replaced = 1;
}

// ConversationMessage is the proto projection of one session.Message (an immutable
// entry in the model-visible conversation history). It exists so the
// CompactionArchive payload can carry a message slice — the live Converse wire has
// no message-slice surface (the relay streams events, not history), so this type is
// introduced here for the replay path. It mirrors the Message value object: Role +
// Text + the assistant's ToolCalls + an optional tool-role ToolResult + the opaque
// provider replay blobs (Reasoning / ProviderPhase) + the user-role media Parts.
message ConversationMessage {
  // role is the author (user / assistant / tool / system).
  string role = 1;
  // text is the message body (assistant text, user prompt, etc.).
  string text = 2;
  // tool_calls holds the tool invocations requested by an assistant message.
  repeated ToolCall tool_calls = 3;
  // tool_result holds the result carried by a tool-role message; nil otherwise.
  ToolResult tool_result = 4;
  // reasoning is the provider's opaque reasoning REPLAY blob, replayed back
  // verbatim and never interpreted/displayed by the harness.
  string reasoning = 5;
  // provider_phase is the OpenAI Responses opaque phase marker on an assistant
  // message, replayed verbatim and never interpreted/displayed.
  string provider_phase = 6;
  // parts carries non-text media (image/audio) on a USER message; nil otherwise.
  repeated Content parts = 7;
  // reasoning_item_id is the OpenAI Responses reasoning-item id carrier
  // (session.Message.ReasoningItemID), replayed verbatim and never
  // interpreted/displayed by the harness. Opaque, provider-private.
  string reasoning_item_id = 8;
}

// SchedulePayload is the structured detail carried by the schedule.* events

// SchedulePayload is the structured detail carried by the schedule.* events
// (EvScheduleFired / EvScheduleSkipped / EvScheduleFailed). Mirrors
// session.SchedulePayload. Emitted from composition (the scheduler) at fire
// time, NOT the agent loop. For v1 delivered to the fire session's durable
// EventLog ONLY (pull-only via GetFire/ListFires); a live broadcast stream is a
// future phase. kind / stop / err are STRING passthroughs (the EvNoProgress /
// StopBudget discipline — no proto enum). Defined here (not schedule.proto)
// because it is the Event.schedule projection — Event lives in harness.proto,
// and a cross-file reference back from harness.proto into schedule.proto would
// form a circular import (schedule.proto imports harness.proto for the shared
// Content/PermissionMode/Limits). Colocating the projection with Event breaks
// the cycle cleanly.
message SchedulePayload {
  // schedule_name is the schedule that fired / was skipped / failed.
  string schedule_name = 1;
  // fire_id is the per-fire session id (the same id ScheduleFire.id /
  // ScheduleFire.session_id carry).
  string fire_id = 2;
  // session_id is the session the fire ran as (== fire_id for a fired fire;
  // empty for a skipped fire).
  string session_id = 3;
  // kind is the event kind: "fired" / "skipped" / "failed". String passthrough,
  // no proto enum.
  string kind = 4;
  // stop is the terminal stop reason of the fire's run (a session.StopReason
  // string passthrough). Empty for a skipped fire.
  string stop = 5;
  // err is the error string if the fire's run failed, empty otherwise.
  string err = 6;
}

// HookDecision is the outcome a hook fire produced. Mirrors
// session.HookDecision; lets a client colour/rank a hook notice without parsing
// its prose.
enum HookDecision {
  // HOOK_DECISION_UNSPECIFIED defaults to INFO at the boundary.
  HOOK_DECISION_UNSPECIFIED = 0;
  // HOOK_DECISION_INFO is a benign, informational hook notice.
  HOOK_DECISION_INFO = 1;
  // HOOK_DECISION_BLOCKED means the hook vetoed the action (can abort a run).
  HOOK_DECISION_BLOCKED = 2;
  // HOOK_DECISION_MODIFIED means the hook rewrote the action's payload.
  HOOK_DECISION_MODIFIED = 3;
  // HOOK_DECISION_ADVISORY means the hook flagged content as a finding but did
  // not alter the call/result (advisory guardrail). Client-visible warning,
  // model-invisible.
  HOOK_DECISION_ADVISORY = 4;
}

// Hook is the structured payload carried by a hook event, in addition to the
// human-readable Event.text. Mirrors session.HookPayload.
message Hook {
  // phase is the lifecycle point the hook fired at (e.g. "PreToolUse"); empty
  // when not applicable.
  string phase = 1;
  // tool is the tool the hook relates to for per-tool phases; empty otherwise.
  string tool = 2;
  // decision is the hook outcome (info / blocked / modified).
  HookDecision decision = 3;
  // call_id is the id of the tool call this hook fired against, for the per-tool
  // phases (PreToolUse / PostToolUse); empty otherwise. Lets a client address the
  // hook notice to the originating tool card. Mirrors session.HookPayload.CallID.
  string call_id = 4;
}

// Subagent is the REDACTED observability projection carried by the three
// subagent.* events. Mirrors session.SubagentPayload. It carries metadata ONLY —
// no child message text, tool args, or result bodies — so a client can render a
// Task subagent's activity (a goal title, a trace of tool names, and final stats)
// without ever seeing the child's content, preserving context isolation.
//
// Which fields are set depends on the event kind:
//   - subagent.start: parent_call_id, child_id, goal, routed_category, routed_model, model.
//   - subagent.tool:  parent_call_id, child_id, tool_name, is_error, tool_count.
//   - subagent.end:   parent_call_id, child_id, tool_count, usage, stop, duration_ms.
message Subagent {
  // parent_call_id is the parent's Task tool-call id, attributing the event to
  // the originating Task card.
  string parent_call_id = 1;
  // child_id is the child session id, distinguishing concurrent subagents.
  string child_id = 2;
  // goal is a short, plain-text label for the delegated task (subagent.start).
  string goal = 3;
  // tool_name is the name of a child tool that just ran (subagent.tool) — the
  // name alone, never the child's args or result.
  string tool_name = 4;
  // is_error reports whether that child tool call failed (subagent.tool).
  bool is_error = 5;
  // tool_count is the running (subagent.tool) or final (subagent.end) child
  // tool-call count.
  int32 tool_count = 6;
  // usage is the child run's cumulative token accounting (subagent.end).
  Usage usage = 7;
  // stop is the child run's terminal stop reason (subagent.end).
  string stop = 8;
  // duration_ms is the child run's wall-clock duration in milliseconds
  // (subagent.end; best-effort).
  int64 duration_ms = 9;
  // background reports a background (detached-delivery) child on subagent.start:
  // the Subagent call returned an immediate started-result and the child keeps
  // working while the parent run continues (its result is collected via the
  // SubagentStatus tool).
  bool background = 10;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label
  // for this delegation (subagent.start only), set when the router was wired AND
  // classified this delegation (empty otherwise — no router, or a fail-soft miss
  // that inherited the default model). BARE METADATA — a label, never the task
  // prompt or classifier reasoning — so it is context-isolation safe (gauntlet
  // #7: no child content crosses). Mirrors session.SubagentPayload.RoutedCategory.
  string routed_category = 11;
  // routed_model is the concrete MODEL id the routed child was minted on
  // (subagent.start only), paired with routed_category. BARE METADATA — a model
  // id, never model-influenced free text — so it is context-isolation safe
  // (gauntlet #7). Mirrors session.SubagentPayload.RoutedModel.
  string routed_model = 12;
  // model is the concrete MODEL id this child ACTUALLY ran on (subagent.start
  // only), regardless of how it was chosen — inherited default, agent-def pin,
  // per-call `model` override, or the opt-in router. BARE METADATA — a model id,
  // never child content — so it is context-isolation safe (gauntlet #7: no child
  // content crosses). When the router classified this delegation, model ==
  // routed_model. Mirrors session.SubagentPayload.Model.
  string model = 13;
  // inner_kind discriminates which inner child event kind the preview came from
  // (message.delta / tool.call / tool.result / result); set on subagent.tool
  // alongside text / detail (ADR 0079 bounded previews). A child's permission.ask
  // is never projected. STRING passthrough, mirroring Team.inner_kind.
  string inner_kind = 14;
  // text is a BOUNDED preview of the child's message/result text (subagent.tool,
  // for the message.delta / result inner kinds) — control-byte scrubbed and
  // rune-capped upstream in engine/agent, never the raw, unbounded body.
  string text = 15;
  // detail is a BOUNDED preview of a child tool call's args (tool.call) or a tool
  // result's body (tool.result) — control-byte scrubbed and rune-capped upstream,
  // never the raw, unbounded args/result body (subagent.tool).
  string detail = 16;
  // cause is the child run's FAILURE DETAIL (subagent.end only, and only when
  // stop is "error" — empty otherwise): the harness/provider error the loop
  // recorded on the terminal result. METADATA about how the delegation failed —
  // a transport/loop error string, never child-authored model output — so it is
  // context-isolation safe (gauntlet #7: no child content crosses). Clamped at
  // the emit site. Mirrors session.SubagentPayload.Cause.
  string cause = 17;
  // routing_reason is a BOUNDED harness/composition reason string explaining WHY
  // this delegation was NOT routed by the semantic model router (subagent.start
  // only) — empty on a routed HIT (routed_category/routed_model carry the hit).
  // A short label (e.g. "pinned-model", "agent-def-pinned-model", "resume",
  // "fork", "router-disabled", "route-target-unavailable", "breaker-open",
  // "aborted", "empty-model", or a RouterMiss* classifier miss) — BARE METADATA,
  // never the task prompt or classifier
  // reasoning — so it is context-isolation safe (gauntlet #7). Clamped at the
  // emit site. Mirrors session.SubagentPayload.RoutingReason.
  string routing_reason = 18;
}

// TeamMemberSpec is one roster entry forwarded on team.start. Mirrors
// session.TeamMemberSpec. It carries ONLY model-supplied metadata about the team's
// shape — never any member content (no prompt body, no transcript).
message TeamMemberSpec {
  // name is the member's unique handle.
  string name = 1;
  // role is the member's short role label.
  string role = 2;
  // mutating reports whether the member runs in an isolated fork with
  // workspace-mutating tools (true) or shares the base read-only (false).
  bool mutating = 3;
  // lead marks the coordinating member.
  bool lead = 4;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label for
  // this member (team.start roster only), set when the router was wired AND classified
  // this member (empty otherwise — no router, a fail-soft miss that inherited the
  // default member model, or a DEFINED member whose agent def pinned its own model so
  // the router never fired). BARE METADATA — a label, never the member's role/prompt or
  // classifier reasoning — so it is context-isolation safe (gauntlet #7: no member
  // content crosses). Mirrors session.TeamMemberSpec.RoutedCategory.
  string routed_category = 5;
  // routed_model is the concrete MODEL id the routed member's engine was minted on
  // (team.start roster only), paired with routed_category. BARE METADATA — a model id,
  // never model-influenced free text — so it is context-isolation safe (gauntlet #7).
  // Mirrors session.TeamMemberSpec.RoutedModel.
  string routed_model = 6;
  // model is the concrete MODEL id this member's engine ACTUALLY runs on
  // (team.start roster only), regardless of how it was chosen — inherited default
  // member model, agent-def pin, or the opt-in router. BARE METADATA — a model id,
  // never member content — so it is context-isolation safe (gauntlet #7: no member
  // content crosses). When the router classified this member, model == routed_model.
  // Mirrors session.TeamMemberSpec.Model.
  string model = 7;
  // routing_reason is a BOUNDED harness/composition reason string explaining WHY
  // this member was NOT routed by the semantic model router (team.start roster
  // only) — empty on a routed HIT (routed_category/routed_model carry the hit).
  // A short label (e.g. "agent-def-pinned-model", "router-disabled", or a
  // RouterMiss* classifier miss) — BARE METADATA, never the member's role/prompt
  // or classifier reasoning — so it is context-isolation safe (gauntlet #7: no
  // member content crosses). Clamped at the emit site. Mirrors
  // session.TeamMemberSpec.RoutingReason.
  string routing_reason = 8;
}

// Team is the BOUNDED observability projection carried by the three team.* events.
// Mirrors session.TeamPayload. Unlike Subagent (metadata only), it is deliberately
// FULLER — a team is meant to be watched — so team.member carries the member's
// message text and CAPPED previews of its tool calls/results. It is STILL bounded:
// every preview (text/detail) is capped, and a member's permission.ask is DROPPED
// entirely (never projected). The per-member transcripts never enter the parent
// conversation — only the Team tool's joined-summary result does.
//
// Which fields are set depends on the event kind:
//   - team.start:  parent_call_id, team_id, roster.
//   - team.member: parent_call_id, team_id, member, inner_kind, and the subset of
//     {text, tool_name, detail, is_error, usage} relevant to inner_kind.
//   - team.end:    parent_call_id, team_id, rounds, stop, usage (cumulative).
message Team {
  // parent_call_id is the parent's Team tool-call id, attributing the event to the
  // originating Team card.
  string parent_call_id = 1;
  // team_id is the team id, distinguishing concurrent teams.
  string team_id = 2;
  // roster is the team's membership as the model formed it (team.start). Metadata
  // only, never member content.
  repeated TeamMemberSpec roster = 3;
  // member is the name of the member whose activity this event projects
  // (team.member).
  string member = 4;
  // inner_kind is the member's underlying session event kind being projected —
  // e.g. message.delta, tool.call, tool.result, turn.end, result (team.member).
  // permission.ask is never projected.
  string inner_kind = 5;
  // text is the member's message/result text or a CAPPED preview of it
  // (team.member, for message.delta / result inner kinds).
  string text = 6;
  // tool_name is the name of a member tool that was called (team.member, for
  // tool.call / tool.result inner kinds).
  string tool_name = 7;
  // detail is a CAPPED preview of a member tool call's args (tool.call) or result
  // body (tool.result) — never the raw, unbounded body (team.member).
  string detail = 8;
  // is_error reports whether a member tool.result failed (team.member).
  bool is_error = 9;
  // rounds is the number of scheduling rounds that ran work (team.end).
  int32 rounds = 10;
  // stop is the team run's terminal stop reason (team.end).
  string stop = 11;
  // usage is the member's per-event usage (team.member turn.end/result) or, on
  // team.end, the TEAM TOTAL — the sum of every member's per-turn usage.
  Usage usage = 12;
  // context_used is the member's CURRENT context occupancy — the most recent
  // turn's input-token count (team.member turn.end). It is the numerator of the
  // per-member context meter in the f6 agents overlay; 0 when unknown.
  int64 context_used = 13;
  // context_window is the producing member engine's context window in tokens —
  // the meter's denominator (team.member turn.end). 0 when unknown (no meter is
  // drawn in that case).
  int64 context_window = 14;
  // tasks is a snapshot of the team's SHARED TASK LIST in creation order. It is
  // set on a first-class team.tasks event (a team-wide event with no member, emitted
  // on change, de-duped) and on team.end (the terminal snapshot). It feeds the
  // f6 agents task sub-view; it carries only task metadata, never member content.
  // Reuses the existing TeamTask message.
  repeated TeamTask tasks = 15;
  // findings is a snapshot of the team's SHARED FINDINGS LEDGER in append order. It
  // is set on a first-class team.findings event (a team-wide event with no member,
  // emitted on change, de-duped) and on team.end (the terminal snapshot). Each entry
  // carries the recording member's name and a CAPPED body preview, never the raw
  // finding.
  repeated TeamFinding findings = 16;
  // dispositions is the per-member TERMINAL disposition snapshot, set ONLY on team.end
  // (parallel to the terminal tasks/findings snapshots). Lets a client render a stopped
  // member distinctly from a clean "done" instead of recomputing it. Closed-enum
  // supervisor verdicts only, never member content.
  repeated TeamMemberDisposition dispositions = 17;
  // member_session_id is the member's child SESSION id ("team-<teamID>-<member>")
  // on member-tagged (team.member) events — the CancelChild handle, carried
  // explicitly so a client never derives ids from the (internal) id grammar.
  // (17 is taken by dispositions.)
  string member_session_id = 18;
  // cause is the member run's per-round FAILURE DETAIL (team.member, result
  // inner kind only) when that round ended in StopError — the harness/provider
  // error string, never member-authored output (gauntlet #7, same footing as
  // stop). LINE-ORIENTED: whitespace-collapsed and rune-clamped at the emit site
  // so a client renders it as-is. Empty on every other team.member inner kind and
  // on team.end (the terminal disposition stays the closed-enum reason). Mirrors
  // Subagent.cause (field 17).
  string cause = 19;
}

// Parallel is the BOUNDED observability projection carried by the three parallel.*
// events (parallel.start / parallel.branch / parallel.end). Mirrors
// session.ParallelPayload. Like Subagent it now forwards BOUNDED previews (ADR 0079)
// on branch_tool events — text is a rune-capped preview of the branch's message
// text, detail a rune-capped preview of a branch tool call's args or result body —
// so a client can render a Parallel fork-join run's activity (a join strategy, a
// grouped roster of branches with tool traces and a winner highlight) without ever
// seeing unbounded branch content, preserving context isolation. Physical fork roots,
// exact environment refs, and reusable placement authority are never projected.
//
// Unlike the FLAT Subagent fleet, a Parallel run is a GROUP: N branches of ONE call
// (keyed by parent_call_id) sharing a join strategy and a single winner. The
// per-branch events carry metadata keyed by branch_index.
//
// Which fields are set depends on the event kind:
//   - parallel.start:                  parent_call_id, join, branch_count.
//   - parallel.branch (branch_start):  parent_call_id, kind, branch_index, branch_label, goal, routed_category, routed_model, model.
//   - parallel.branch (branch_tool):   parent_call_id, kind, branch_index, tool_name, is_error, tool_count,
//                                      and — when a preview is available — text / detail / inner_kind.
//   - parallel.branch (branch_end):    parent_call_id, kind, branch_index, tool_count, stop, usage, duration_ms, failed.
//   - parallel.end:                    parent_call_id, join, branch_count, winner, usage (run total), stop.
message Parallel {
  // parent_call_id is the parent's Parallel tool-call id and the GROUP key (one
  // Parallel call = one group); attributes the event to the originating card.
  string parent_call_id = 1;
  // kind discriminates the per-branch lifecycle transition on a parallel.branch event
  // (branch_start / branch_tool / branch_end); empty on the run-level start/end events.
  string kind = 2;
  // join is the normalized join strategy (all / first / judge); set on
  // parallel.start and parallel.end.
  string join = 3;
  // branch_count is the number of branches in the run; set on parallel.start and
  // parallel.end.
  int32 branch_count = 4;
  // branch_index is the 0-based stable per-branch group key; set on every
  // parallel.branch kind.
  int32 branch_index = 5;
  // branch_label is the humanized 1-based branch label ("branch-1" …); set on
  // branch_start.
  string branch_label = 6;
  // goal is a short, plain-text label for the branch task (a truncation of the
  // model-authored branch prompt — the parent's own instruction, never branch
  // content); set on branch_start.
  string goal = 7;
  // tool_name is the name of a branch's child tool that just ran (branch_tool) —
  // the name alone, never branch args or result (the bounded previews ride the
  // text / detail fields).
  string tool_name = 8;
  // is_error reports whether that branch tool call failed (branch_tool).
  bool is_error = 9;
  // tool_count is the running (branch_tool) or final (branch_end) child tool-call
  // count for the branch.
  int32 tool_count = 10;
  // failed reports whether the branch's child run failed (branch_end).
  bool failed = 11;
  reserved 12, 17;
  reserved "workspace", "winner_workspace";
  // stop is the branch's terminal stop reason (branch_end) or the run-level stop
  // (parallel.end; the winner's stop for first/judge, empty for all).
  string stop = 13;
  // usage is the branch's cumulative usage (branch_end) or the run TOTAL summed across
  // branches (parallel.end).
  Usage usage = 14;
  // duration_ms is the branch's wall-clock duration in milliseconds (branch_end).
  int64 duration_ms = 15;
  // winner is the branch index of the selected winner on parallel.end — a real
  // branch_index for first/judge, or -1 for all / none-succeeded.
  int32 winner = 16;
  // child_id is the branch's child SESSION id ("parallel-<callID>-<i>") on
  // branch_start/branch_end — the CancelChild handle, carried explicitly so a
  // client never derives ids from the (internal) id grammar.
  string child_id = 18;
  // routed_category is the OPT-IN semantic model router's chosen CATEGORY label for
  // this branch (branch_start only), set when the router was wired AND classified this
  // branch (empty otherwise — no router, a fail-soft miss that inherited the default
  // branch model, or a branch cancelled before it started). BARE METADATA — a label,
  // never the branch prompt or classifier reasoning — so it is context-isolation safe
  // (gauntlet #7: no branch content crosses). Mirrors session.ParallelPayload.RoutedCategory.
  string routed_category = 19;
  // routed_model is the concrete MODEL id the routed branch was minted on (branch_start
  // only), paired with routed_category. BARE METADATA — a model id, never
  // model-influenced free text — so it is context-isolation safe (gauntlet #7).
  // Mirrors session.ParallelPayload.RoutedModel.
  string routed_model = 20;
  // model is the concrete MODEL id this branch ACTUALLY ran on (branch_start only),
  // regardless of how it was chosen — inherited default branch model or the opt-in
  // router. BARE METADATA — a model id, never branch content — so it is
  // context-isolation safe (gauntlet #7: no branch content crosses). When the router
  // classified this branch, model == routed_model. Mirrors session.ParallelPayload.Model.
  string model = 21;
  // inner_kind discriminates which inner branch event kind the preview came from
  // (message.delta / tool.call / tool.result / result); set on branch_tool
  // alongside text / detail (ADR 0079 bounded previews). A branch's permission.ask
  // is never projected. STRING passthrough, mirroring Team.inner_kind.
  string inner_kind = 22;
  // text is a BOUNDED preview of the branch's message/result text (branch_tool,
  // for the message.delta / result inner kinds) — control-byte scrubbed and
  // rune-capped upstream in engine/agent, never the raw, unbounded body.
  string text = 23;
  // detail is a BOUNDED preview of a branch tool call's args (tool.call) or a tool
  // result's body (tool.result) — control-byte scrubbed and rune-capped upstream,
  // never the raw, unbounded args/result body (branch_tool).
  string detail = 24;
  // routing_reason is a BOUNDED harness/composition reason string explaining WHY
  // this branch was NOT routed by the semantic model router (branch_start only)
  // — empty on a routed HIT (routed_category/routed_model carry the hit). A
  // short label (e.g. "router-disabled", "route-target-unavailable", "aborted",
  // or a RouterMiss* classifier miss) — BARE METADATA, never the branch prompt or
  // classifier reasoning — so
  // it is context-isolation safe (gauntlet #7: no branch content crosses).
  // Clamped at the emit site. Mirrors session.ParallelPayload.RoutingReason.
  string routing_reason = 25;
}

// ToolCall is a request from the model to invoke a named tool. Mirrors
// session.ToolCall.
message ToolCall {
  // id pairs this call with its tool_result.
  string id = 1;
  // name is the tool name as registered in the catalog.
  string name = 2;
  // args is the raw, tool-specific JSON argument payload.
  string args = 3;
}

// ToolResult is the outcome of executing a ToolCall. Mirrors
// session.ToolResult.
message ToolResult {
  // call_id is the id of the ToolCall this result answers.
  string call_id = 1;
  // content is the legacy/default model-facing string result body, already
  // token-shaped by the tool.
  string content = 2;
  // is_error reports whether the tool failed.
  bool is_error = 3;
  // blocks are the typed content blocks (text/image/audio/resource-link/
  // embedded-resource/structured-content) mirroring session.ToolResult.Parts.
  // Both content and blocks may be present; consumers prefer blocks when
  // non-empty, falling back to content.
  repeated ContentBlock blocks = 4;
  // structured_content is the JSON-stringified structured payload (the
  // TextContent mirror of a structured-content block).
  string structured_content = 5;
}

// PermissionAsk describes a permission prompt the loop is blocked on. The
// client resolves it by sending ResumeApproval with the matching ask_id.
// Mirrors session.PendingAsk.
message PermissionAsk {
  // ask_id correlates the ask with the client's resolution.
  string ask_id = 1;
  // tool is the name of the tool awaiting approval.
  string tool = 2;
  // args is the proposed tool-call argument payload (raw JSON).
  string args = 3;
  // reason explains why approval is required.
  string reason = 4;
}

// RetryDisposition is the neutral causal retry classification of a failed model
// stream. UNKNOWN is an explicit conservative classification, distinct from an
// absent optional field sent by an older server.
enum RetryDisposition {
  RETRY_DISPOSITION_UNSPECIFIED = 0;
  RETRY_DISPOSITION_UNKNOWN = 1;
  RETRY_DISPOSITION_RETRYABLE = 2;
  RETRY_DISPOSITION_PERMANENT = 3;
}

// StreamProgress records the semantic commit boundary reached by a model stream.
enum StreamProgress {
  STREAM_PROGRESS_UNSPECIFIED = 0;
  STREAM_PROGRESS_UNKNOWN = 1;
  STREAM_PROGRESS_PRECOMMIT = 2;
  STREAM_PROGRESS_VISIBLE = 3;
  STREAM_PROGRESS_COMPLETE = 4;
}

// Result is the terminal payload carried by a result event. Mirrors
// session.ResultPayload.
message Result {
  // stop is the reason the run ended (end_turn, max_turns, cancelled, ...).
  string stop = 1;
  // text is the final assistant text, if any.
  string text = 2;
  // usage is the token accounting accumulated during THIS run; it is not the
  // durable session total and is distinct from per-turn TurnEnd.usage.
  Usage usage = 3;
  // error carries the failure detail when stop is "error" (empty otherwise).
  string error = 4;
  // permanent is true when an error stop is a PERMANENT provider rejection —
  // replaying the identical request cannot succeed (e.g. a 4xx other than
  // 408/429). Absent/false means transient or unclassified (fail-open).
  bool permanent = 5;
  // retry_disposition is always present on terminal results from new servers;
  // absence identifies an older server, while explicit UNKNOWN is conservative.
  optional RetryDisposition retry_disposition = 6;
  // stream_progress is presence-aware for the same old-server distinction.
  optional StreamProgress stream_progress = 7;
}

// TurnEnd is the payload carried by a turn.end event. Mirrors
// session.TurnEndPayload. A typed envelope (like Result) so turn.end owns its
// own usage semantics and can grow (finish reason, model id, retries) without
// overloading the shared Event fields.
message TurnEnd {
  // usage is THIS turn's model-call token accounting (not the run total or the
  // durable session total).
  Usage usage = 1;
  // duration_ms is the elapsed milliseconds for the turn's model call; 0 when
  // the server had no clock.
  int64 duration_ms = 2;
}

// Usage accounts for the token cost of a model call (or an aggregate).
// Mirrors session.Usage.
message Usage {
  // input_tokens is the number of prompt tokens billed (including cache).
  int64 input_tokens = 1;
  // output_tokens is the number of completion tokens generated.
  int64 output_tokens = 2;
  // cache_read_tokens is the number of input tokens served from cache.
  int64 cache_read_tokens = 3;
  // cache_write_tokens is the number of input tokens written into the cache.
  int64 cache_write_tokens = 4;
  // reasoning_tokens is the number of output tokens spent on internal reasoning
  // (a subset of output_tokens; providers bill reasoning as part of the
  // inclusive output total). 0 when the provider reports no breakdown.
  int64 reasoning_tokens = 5;
}

// --- MCP inspection surface --------------------------------------------------
//
// These messages back the catalog-level inspection RPCs. They mirror the
// adapter value objects in internal/adapter/mcp (Resource, ResourceContents,
// Prompt, PromptArgument, PromptResult, PromptMessage) and internal/adapter/
// mcp/source (SourceInfo, ServerInfo) one-for-one; they are never SDK types.

// McpResource is a single resource advertised by a connected MCP server.
// Mirrors mcp.Resource.
message McpResource {
  // server is the connected server that owns the resource.
  string server = 1;
  // uri identifies the resource on its server.
  string uri = 2;
  // name is the resource's programmatic name.
  string name = 3;
  // title is the resource's human-facing title.
  string title = 4;
  // description summarizes the resource.
  string description = 5;
  // mime_type is the resource's media type.
  string mime_type = 6;
  // size is the resource size in bytes (0 when unknown).
  int64 size = 7;
  // read_only is always true: reading a resource never mutates the server.
  bool read_only = 8;
}

// ListMcpResourcesRequest lists resource snapshots; an empty server returns the
// union across every connected server.
message ListMcpResourcesRequest {
  // server scopes the listing to one connected server; empty returns all.
  string server = 1;
}

// ListMcpResourcesResponse carries the resource snapshots.
message ListMcpResourcesResponse {
  // resources are the (possibly empty) resource snapshots.
  repeated McpResource resources = 1;
}

// McpResourceContents is one chunk of a read resource's body. Text holds UTF-8
// text; blob holds raw binary bytes. Mirrors mcp.ResourceContents.
message McpResourceContents {
  // uri identifies the chunk's resource.
  string uri = 1;
  // mime_type is the chunk's media type.
  string mime_type = 2;
  // text is the UTF-8 textual content, when the chunk is textual.
  string text = 3;
  // blob is the raw binary content, when the chunk is binary.
  bytes blob = 4;
}

// ReadMcpResourceRequest reads one resource by URI from a named server.
message ReadMcpResourceRequest {
  // server is the connected server to read from.
  string server = 1 [(buf.validate.field).string.min_len = 1];
  // uri is the resource URI to read.
  string uri = 2 [(buf.validate.field).string.min_len = 1];
}

// ReadMcpResourceResponse carries the read resource's content chunks.
message ReadMcpResourceResponse {
  // contents are the resource's content chunks.
  repeated McpResourceContents contents = 1;
}

// McpPromptArgument describes one templating argument a prompt accepts.
// Mirrors mcp.PromptArgument.
message McpPromptArgument {
  // name is the argument's programmatic name.
  string name = 1;
  // title is the argument's human-facing title.
  string title = 2;
  // description summarizes the argument.
  string description = 3;
  // required reports whether the argument must be supplied.
  bool required = 4;
}

// McpPrompt is a prompt template advertised by a connected server. Mirrors
// mcp.Prompt.
message McpPrompt {
  // server is the connected server that owns the prompt.
  string server = 1;
  // name is the prompt's programmatic name.
  string name = 2;
  // title is the prompt's human-facing title.
  string title = 3;
  // description summarizes the prompt.
  string description = 4;
  // arguments are the templating arguments the prompt accepts.
  repeated McpPromptArgument arguments = 5;
}

// ListMcpPromptsRequest lists prompt snapshots; an empty server returns the
// union across every connected server.
message ListMcpPromptsRequest {
  // server scopes the listing to one connected server; empty returns all.
  string server = 1;
}

// ListMcpPromptsResponse carries the prompt snapshots.
message ListMcpPromptsResponse {
  // prompts are the (possibly empty) prompt snapshots.
  repeated McpPrompt prompts = 1;
}

// GetMcpPromptRequest expands a named prompt with arguments on a named server.
message GetMcpPromptRequest {
  // server is the connected server that owns the prompt.
  string server = 1 [(buf.validate.field).string.min_len = 1];
  // name is the prompt to expand.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // arguments are the templating values keyed by argument name.
  map<string, string> arguments = 3;
}

// McpPromptMessage is one role-tagged message of an expanded prompt. Mirrors
// mcp.PromptMessage.
message McpPromptMessage {
  // role is the MCP role string ("user"/"assistant").
  string role = 1;
  // text is the flattened textual content of the message.
  string text = 2;
}

// GetMcpPromptResponse carries the expanded prompt.
message GetMcpPromptResponse {
  // description is the prompt's optional description.
  string description = 1;
  // messages are the rendered, role-tagged messages.
  repeated McpPromptMessage messages = 2;
}

// McpServerInfo is one resolved MCP server candidate within a source. Mirrors
// source.ServerInfo.
message McpServerInfo {
  // name is the server's configured name.
  string name = 1;
  // url is the server's proxy/base URL.
  string url = 2;
  // transport is the wire transport (e.g. "streamable-http").
  string transport = 3;
  // group is the ToolHive group (empty for the static source).
  string group = 4;
}

// McpSource is the inventory for one resolved MCP source. Mirrors
// source.SourceInfo.
message McpSource {
  // name is the source's identity, e.g. "static" or "toolhive(default)".
  string name = 1;
  // kind is the coarse source kind: "static" or "toolhive".
  string kind = 2;
  // enabled reports whether the source was active in the resolution.
  bool enabled = 3;
  // group is the ToolHive group (empty for the static source).
  string group = 4;
  // servers are the configs this source contributed.
  repeated McpServerInfo servers = 5;
  // diagnostics are this source's per-server skip reasons.
  repeated string diagnostics = 6;
}

// ListMcpSourcesRequest requests the resolved source inventory snapshot.
message ListMcpSourcesRequest {}

// ListMcpSourcesResponse carries the resolved source inventory.
message ListMcpSourcesResponse {
  // sources are the (possibly empty) resolved sources.
  repeated McpSource sources = 1;
}

// ListToolHiveGroupsRequest requests the distinct ToolHive groups in the
// resolved inventory.
message ListToolHiveGroupsRequest {}

// ListToolHiveGroupsResponse carries the distinct, non-empty ToolHive groups.
message ListToolHiveGroupsResponse {
  // groups are the distinct, non-empty ToolHive groups in the inventory.
  repeated string groups = 1;
}

// AgentInfo is the inventory for one resolved agent definition. It mirrors the
// resolved registry snapshot (see internal/adapter/agents.AgentDef and the
// composition-layer resolution in internal/app): the model and tools fields are
// the RESOLVED outcome (model alias resolved, tool scope filtered to the
// read-only Task call site), not the raw frontmatter.
message AgentInfo {
  // name is the def's stable routing identifier (the value passed to Task's
  // `agent` arg).
  string name = 1;
  // description is the always-in-context one-line routing summary.
  string description = 2;
  // model is the resolved provider model id (empty means "inherit the parent").
  string model = 3;
  // tools is the def's effective read-only tool scope at the Task call site.
  repeated string tools = 4;
  // permission_mode is the raw frontmatter permission mode (empty / "default").
  string permission_mode = 5;
  // color is the optional UX hint; it never affects execution.
  string color = 6;
}

// ListAgentsRequest requests the resolved agent-definition snapshot.
message ListAgentsRequest {}

// ListAgentsResponse carries the resolved agent definitions.
message ListAgentsResponse {
  // agents are the (possibly empty) resolved agent definitions, name-sorted.
  repeated AgentInfo agents = 1;
}

// --- Slash command discovery -------------------------------------------------

// Command is one discovered slash command's listing metadata. Mirrors
// prompt.Command: the invocation name (without the leading "/") and a short,
// human-facing description for the palette. It carries NO body — discovery is
// metadata-only; expansion (which reads the body) is a separate run-path concern.
message Command {
  // name is the command's invocation name (the "<name>" of "/<name>").
  string name = 1;
  // description is a short one-line summary derived from the command file (a
  // frontmatter description: field, else the first non-blank body line), capped.
  string description = 2;
}

message ListCommandsRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListCommandsResponse carries the discovered slash commands.
message ListCommandsResponse {
  // commands are the (possibly empty) discovered commands, name-sorted.
  repeated Command commands = 1;
}

// --- Worktree discovery (issue #102) -----------------------------------------

// Worktree is one display-safe eligible placement choice. Selector is opaque,
// caller/source scoped, and accepted only by ClearSession or ForkSession.
message Worktree {
  string selector = 1;
  string kind = 2;
  string label = 3;
  string branch = 4;
  string revision = 5;
  bool bare = 6;
}

message ListWorktreesRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListWorktreesResponse carries the discovered worktrees.
message ListWorktreesResponse {
  // worktrees are the (possibly empty) discovered worktrees, in `git worktree
  // list` order (the main worktree first).
  repeated Worktree worktrees = 1;
}

// --- Skills inventory discovery ---------------------------------------------

// SkillInfo is one discovered skill's listing metadata: the activation name and
// a short, human-facing description for the inventory panel. It carries NO body
// — discovery is metadata-only; activation (which reads the body) is a separate
// run-path concern handled by the Skill tool.
message SkillInfo {
  // name is the skill's stable activation identifier (the value passed to the
  // Skill tool).
  string name = 1;
  // description is the one-line frontmatter summary that steers WHEN to activate.
  string description = 2;
  // learned lifecycle metadata is absent for immutable external skills.
  bool agent_owned = 3;
  string owner_agent = 4;
  string active_version = 5;
}

// ListSkillsRequest requests the resolved skills inventory snapshot.
message ListSkillsRequest {}

// ListSkillsResponse carries the resolved skills inventory.
message ListSkillsResponse {
  // skills are the (possibly empty) discovered skills, name-sorted.
  repeated SkillInfo skills = 1;
}

// --- Soul (persona) inspection ----------------------------------------------

// SoulProvenance records WHERE the selected soul originated, mirroring the
// composition-layer soulProvenance. It is a read-only attribution for the /soul
// inspection panel; it never affects execution.
enum SoulProvenance {
  // SOUL_PROVENANCE_UNSPECIFIED means no soul was selected (none present, an
  // untrusted project soul was dropped, or --no-soul).
  SOUL_PROVENANCE_UNSPECIFIED = 0;
  // SOUL_PROVENANCE_USER is the user-scoped soul (always trusted).
  SOUL_PROVENANCE_USER = 1;
  // SOUL_PROVENANCE_PROJECT is the project-scoped <workspace>/.mecatl/soul.md
  // (selected only with --trust-project).
  SOUL_PROVENANCE_PROJECT = 2;
  // SOUL_PROVENANCE_DRIVER is a remote soul-source driver (--soul-source-url;
  // mecatl.driver.v1.SoulSourceService). Operator-configured infrastructure:
  // it occupies the USER slot in the selection precedence and is always
  // trusted. Client-inspection only, NOT model-facing.
  SOUL_PROVENANCE_DRIVER = 3;
}

// SoulInfo is the BUILD-TIME SNAPSHOT of the resolved soul: the selected soul's
// content plus its provenance/trust/drift metadata. It mirrors the
// composition-layer soulMeta + the loaded body. It carries NO write path — the
// soul is agent-read-only; this is purely for the /soul inspection panel. When
// no soul was selected (present=false) the content/hash are empty but provenance
// may still report a DROPPED untrusted project soul (trusted=false).
message SoulInfo {
  // content is the selected soul's clean body (the bytes that reach the prompt),
  // capped server-side at the soul byte ceiling (20 KiB). Empty when none.
  string content = 1;
  // size_bytes is the byte length of content, or 0 for none.
  int64 size_bytes = 2;
  // sha256 is the lowercase-hex SHA-256 of content, or "" for none.
  string sha256 = 3;
  // present is true when a soul fragment WILL be contributed this run.
  bool present = 4;
  // provenance is where the selected (or dropped) soul came from.
  SoulProvenance provenance = 5;
  // trusted reflects whether the soul's provenance is trusted (a user soul always
  // is; a project soul only with --trust-project).
  bool trusted = 6;
  // drifted is true when the selected soul's content hash differs from its
  // recorded baseline (informational; a drifted soul still loads unless strict).
  bool drifted = 7;
}

// GetSoulRequest requests the resolved soul snapshot.
message GetSoulRequest {}

// GetSoulResponse carries the resolved soul snapshot.
message GetSoulResponse {
  // soul is the resolved soul snapshot. Never nil; present=false when no soul was
  // selected.
  SoulInfo soul = 1;
}

// --- User-model inspection --------------------------------------------------

// UserModelEntry is one user-model fact's listing metadata: its key + a one-line
// description. The per-entry VALUE is omitted (Recall loads it) — discovery is
// metadata only.
message UserModelEntry {
  // key is the entry's stable key.
  string key = 1;
  // description is the entry's one-line description (explicit, else derived).
  string description = 2;
}

// GetUserModelRequest requests the current user-model index. When key is set,
// the server also returns exact-entry detail when the backing store can read it.
message GetUserModelRequest {
  string key = 1;
}

// UserModelRevision is one read-only lifecycle revision for detail inspection.
message UserModelRevision {
  string key = 1;
  string value = 2;
  string description = 3;
  string version = 4;
  string status = 5;
  string writer = 6;
  string origin = 7;
  string source_session_id = 8;
  string source_proposal_id = 9;
  reserved 10;
  reserved "source_event_id", "source_message_id";
  google.protobuf.Timestamp updated_at = 11;
}

message UserModelDetail {
  UserModelRevision current = 1;
  repeated UserModelRevision history = 2;
  // false means the store supplied only the current legacy value.
  bool history_available = 3;
}

// GetUserModelResponse carries the current user-model entries plus aggregate
// metadata. The entries reflect the LIVE store index at request time.
message GetUserModelResponse {
  // entries are the current user-model entries, key-sorted.
  repeated UserModelEntry entries = 1;
  // size_bytes is the aggregate byte length of the rendered entries (key +
  // description), an at-a-glance footprint indicator.
  int64 size_bytes = 2;
  // sha256 is the lowercase-hex SHA-256 over the rendered entries, so a client
  // can tell at a glance whether the user model changed between fetches.
  string sha256 = 3;
  // detail is populated only when request.key exactly matches an entry.
  UserModelDetail detail = 4;
}

// --- Model inventory discovery ----------------------------------------------

// ModelInfo is one selectable model in the resolved inventory. It mirrors the
// composition-layer projection of the provider registry's AVAILABLE providers
// joined to the embedded models.dev catalog. It carries NO secret material
// (no key, no env var name, no base URL) — only public model metadata. The
// modality/reasoning bits gate the client picker's affordances; context_limit
// informs the picker's display only (the server is the cap authority).
message ModelInfo {
  // id is the opaque model selector (the value sent as CreateSession.model_id).
  string id = 1;
  // provider_id is the registry id this model is served by (CreateSession.provider_id).
  string provider_id = 2;
  // display_name is the human-facing model name from the catalog (falls back to id).
  string display_name = 3;
  // image is true when the model accepts image prompt input (catalog modality).
  bool image = 4;
  // reasoning is true when the model emits reasoning/thinking (catalog flag).
  bool reasoning = 5;
  // context_limit is the model's total context window in tokens (0 when unknown).
  int64 context_limit = 6;
}

// ListModelsRequest requests the selectable-model inventory.
message ListModelsRequest {}

// ProviderStatus is one provider's last live-listing outcome, for client
// surfacing (issue #262). state is a STRING passthrough (no enum — the
// EvNoProgress/StopBudget discipline): "ok" | "unreachable" | "unauthorized" | "empty".
//
// Rows are scoped to OPERATOR-ACTIONABLE live-inventory providers: currently
// config-detected intent gateways and the manually configured openai-codex
// entitlement boundary. A keyed openrouter/anthropic live-listing blip never
// grows this list. The additive fields carry 0/false for every deployment
// without a surfaced provider — byte-identical to before this wave.
message ProviderStatus {
  string provider_id = 1;
  string state = 2;
  string hint = 3; // short human remediation, e.g. "start it with `thv llm proxy start`"
  // default_model_auto_selected is true ONLY when provider_id is the DEFAULT
  // provider AND the server AUTO-selected its default model (a first-listed
  // heal/probe pick, issue #262 R2.4) — never true when an operator
  // configured --model/--default-model. A client uses this (rather than a
  // vendor-name check) to label the current model "(auto-selected)" honestly
  // for ANY surfaced provider, present or future.
  bool default_model_auto_selected = 4;
  // model_count is the count of models this surfaced provider's last
  // successful live listing returned (derived from the outcome store's
  // last-known-good snapshot). 0 on empty/unreachable/unrecorded — so a client
  // cannot distinguish "0 models" from "never probed" by this field alone
  // (state disambiguates: state=="empty" with model_count==0 is a genuine
  // empty list; state=="unreachable" with model_count==0 is a probe failure).
  int32 model_count = 5;
  // available_not_default is true ONLY when this intent-driven provider is
  // registered, reachable (state == "ok"), AND is NOT the active default
  // provider (a key-driven provider outranks it on the precedence ladder).
  // Named for the CONDITION (vendor-neutral, matching the
  // default_model_auto_selected discipline) so a client can surface "the
  // gateway is available, set a key to use it" for ANY intent-driven provider,
  // present or future — without a vendor-name check. False whenever the
  // provider IS the default (so the sole-provider case does not advertise
  // itself as "available but not default").
  bool available_not_default = 6;
}

// ListModelsResponse carries the selectable models across AVAILABLE providers
// only (a provider with no resolved credentials is omitted entirely — its
// availability is itself sensitive, CWE-200). Sorted by (provider_id, id) for a
// deterministic picker. Empty when zero providers are available (the zero-keys
// case) — the client renders that as "no models; set a provider key".
message ListModelsResponse {
  // models are the (possibly empty) selectable models, (provider_id, id)-sorted.
  repeated ModelInfo models = 1;
  // provider_status surfaces operator-actionable live-inventory outcomes for
  // intent-driven gateways and openai-codex, so a client can render a
  // provider-specific remediation hint even when it contributes zero models.
  repeated ProviderStatus provider_status = 2;
}

// --- Learning reflection and proposal review --------------------------------

message ReflectSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  reserved 2;
  reserved "async";
}

message ReflectionReceipt {
  string reflection_id = 1;
  string disposition = 2;
  int32 queued = 3;
  bool abstained = 4;
  int32 staged = 5;
  int32 promoted = 6;
  int32 conflicted = 7;
  // reason is one closed materialization reason when abstained is true.
  string reason = 8;
  // message is stable harness-authored display text for that closed reason.
  string message = 9;
}

message ReflectSessionResponse { ReflectionReceipt receipt = 1; }

// LearningAttempt is deliberately content-free. It contains only the closed
// lifecycle vocabulary, opaque versions/identifiers, bounded generations, and
// authorized proposal/skill links from the caller's private attempt partition.
message LearningAttempt {
  string id = 1;
  string version = 2;
  string state = 3;
  string outcome = 4;
  string failure_code = 5;
  uint64 attempt_generation = 6;
  uint64 claim_generation = 7;
  google.protobuf.Timestamp claim_expires_at = 8;
  string checkpoint_stage = 9;
  string proposal_id = 10;
  string skill_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GetLearningAttemptRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetLearningAttemptResponse { LearningAttempt attempt = 1; }

message ListLearningAttemptsRequest {
  string state = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListLearningAttemptsResponse {
  repeated LearningAttempt attempts = 1;
  string next_cursor = 2;
}

message MutateLearningAttemptRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string expected_version = 2 [(buf.validate.field).string.min_len = 1];
}
message MutateLearningAttemptResponse { LearningAttempt attempt = 1; }

message ListLearningProposalsRequest {
  string status = 1;
  string cursor = 2;
  int32 limit = 3;
  // project selects the project-scoped partition; empty selects operator scope.
  string project = 4;
}

message LearningEvidenceRef {
  string session_id = 1;
  string locator = 2;
  int32 ordinal = 3;
  int64 event_seq = 4;
  string tool_call_id = 5;
  string digest = 6;
  // available is true only when the authorized source still resolves to this digest.
  bool available = 7;
  string availability = 8;
  // preview is the bounded canonical content re-read after ownership and digest checks.
  string preview = 9;
}

message LearningDecision {
  string kind = 1;
  string actor = 2;
  string reason = 3;
  google.protobuf.Timestamp at = 4;
}

message LearningPromotionReceipt {
  string memory_key = 1;
  bool previous_exists = 2;
  string previous_version = 3;
  string result_version = 4;
}

message LearningProposal {
  string id = 1;
  string version = 2;
  string status = 3;
  string kind = 4;
  string key = 5;
  string value = 6;
  string description = 7;
  string title = 8;
  string body = 9;
  repeated LearningEvidenceRef evidence = 10;
  repeated string triggers = 11;
  repeated LearningDecision decisions = 12;
  LearningPromotionReceipt promotion = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  bool project_scoped = 16;
  // promotion_available is true when this partition has an exact trusted,
  // convergence-capable memory target.
  bool promotion_available = 17;
  // promotion_unavailable_reason explains why approve/undo are disabled.
  string promotion_unavailable_reason = 18;
  // learned_skill_id links a materialized procedure to its agent-owned skill.
  string learned_skill_id = 19;
}

message ListLearningProposalsResponse {
  repeated LearningProposal proposals = 1;
  string next_cursor = 2;
}

message GetLearningProposalRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string project = 2;
