// mecatl public API surface (WP10).
//
// HarnessService is the network surface over the WP8 agent loop. The
// primary RPC is the bidi `Converse` stream: the client sends a mandatory
// first `Prompt` or `RetryStart` frame, then zero or more `ResumeApproval` / `Cancel`
// control frames, while the server streams typed `Event` envelopes for the
// lifetime of the run, terminating in a `result` event.
//
// The `Event` message mirrors the domain `session.Event` taxonomy
// (engine/session/event.go) one-for-one: a string `type` plus the
// structured submessages (ToolCall, ToolResult, PermissionAsk, Result,
// Usage). It is the single, provider-neutral event schema shared by the
// gRPC and HTTP/SSE adapters; it is never an OpenAI type.
//
// Validation: required-field annotations are authored with
// `buf.validate.field` for documentation and future runtime enforcement.
// V1 enforces the required-field checks in the Go server (see
// internal/adapter/server); wiring the protovalidate runtime is a deferred
// follow-up and is not required for the WP10 milestone.

syntax = "proto3";

package mecatl.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// HarnessService is the mecatl API: unary session setup/inspection plus
// the bidi Converse stream that drives one agent run.
service HarnessService {
  // GetCompatibilityInfo returns the deployment's compatibility descriptor: the
  // API major, the operator-enabled ServerCapabilities, the build's supported
  // feature identifiers, and an optional operator-set deployment label. It is
  // the FIRST call a client makes — it answers "what may I do with this
  // server?" WITHOUT creating a probe session (the ServerCapabilities echo
  // otherwise rides CreateSessionResponse only).
  //
  // DISTINCT FROM GetServerInfo below, deliberately. That RPC answers "which
  // BUILD is this?" and ADR 0245 draws an explicit privacy boundary around it:
  // its response must never carry capabilities, configuration, or auth details.
  // This one is exactly those things — negotiation input, not identity — so
  // folding the two would either breach that boundary or overload one message
  // with two audiences. Build identity therefore lives ONLY on GetServerInfo,
  // and a client that wants both makes both calls.
  //
  // A server that does not implement this RPC (UNIMPLEMENTED) is below the
  // SDK compatibility floor; a client fails loudly rather than inferring a
  // legacy mode. Authenticated like every other RPC, so UNAUTHENTICATED and
  // UNIMPLEMENTED stay distinguishable. See ADR 0248.
  rpc GetCompatibilityInfo(GetCompatibilityInfoRequest) returns (GetCompatibilityInfoResponse);

  // CreateSession allocates a new server-side session and returns its id.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // GetServerInfo returns only the composed server build identity. It is authenticated
  // like every HarnessService operation and does not inspect configuration or state.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // GetSession returns a snapshot of an existing session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // GetSessionTranscript returns the authoritative, snapshot-derived human
  // transcript for one owned session. It is read-only and does not use EventLog.
  rpc GetSessionTranscript(GetSessionTranscriptRequest) returns (GetSessionTranscriptResponse);

  // SetMode changes an existing session's permission posture. The session aggregate
  // remains authoritative: a mid-turn change is rejected with InvalidArgument, so
  // clients that want "next prompt" semantics must defer and retry once idle.
  rpc SetMode(SetModeRequest) returns (SetModeResponse);

  // CloseSession ends a session and releases its server-side resources (learned
  // permission rules, bound placement, and any per-session engine). Idempotent:
  // closing an unknown or already-closed session via the wire returns NotFound only
  // for a never-created id; an already-released session succeeds.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // RenameSession explicitly replaces an idle main session's title.
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);

  // DeleteSession physically removes an idle main session and its sidecars.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // CompactSession applies one manual compaction pass to an owned main-chat
  // session at a turn boundary. It creates no model turn.
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse);

  // ClearSession creates a distinct empty-history successor that inherits the
  // source session's placement unless a fresh source-scoped selector is supplied.
  rpc ClearSession(ClearSessionRequest) returns (ClearSessionResponse);

  // ForkSession creates a history-carrying successor with optional placement and
  // model-routing overrides.
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);

  // Converse drives one run. The first frame MUST be `prompt` or `retry`; later
  // frames may carry controls. A received second `prompt` or `retry` is rejected
  // with INVALID_ARGUMENT. The server streams `Event` envelopes until the terminal
  // `result` event, then closes the stream; controls still in transit may instead
  // observe normal stream completion. A context cancel from the client aborts the run.
  rpc Converse(stream ConverseRequest) returns (stream ConverseResponse);

  // ListMcpResources returns the static resource snapshots advertised by the
  // connected MCP servers. An empty `server` returns the union across every
  // server; a specific name returns just that server's. Catalog-level
  // inspection: unrelated to any in-flight Converse run.
  rpc ListMcpResources(ListMcpResourcesRequest) returns (ListMcpResourcesResponse);

  // ReadMcpResource reads a single resource by URI from the named server.
  rpc ReadMcpResource(ReadMcpResourceRequest) returns (ReadMcpResourceResponse);

  // ListMcpPrompts returns the static prompt snapshots advertised by the
  // connected MCP servers. An empty `server` returns the union across every
  // server.
  rpc ListMcpPrompts(ListMcpPromptsRequest) returns (ListMcpPromptsResponse);

  // GetMcpPrompt expands a named prompt with the given arguments on the named
  // server and returns the rendered messages.
  rpc GetMcpPrompt(GetMcpPromptRequest) returns (GetMcpPromptResponse);

  // ListMcpSources returns the resolved MCP source inventory snapshot: each
  // configured source (static / ToolHive), the servers it contributed, and any
  // diagnostics it raised. Derived from the resolution snapshot taken at
  // startup; it performs no live discovery.
  rpc ListMcpSources(ListMcpSourcesRequest) returns (ListMcpSourcesResponse);

  // ListToolHiveGroups returns the distinct, non-empty ToolHive groups present
  // in the resolved source inventory. Derived from the snapshot — it does NOT
  // call ToolHive.
  rpc ListToolHiveGroups(ListToolHiveGroupsRequest) returns (ListToolHiveGroupsResponse);

  // ListAgents returns the resolved agent-definition registry snapshot: each
  // discovered agent def's routing metadata (name/description), its resolved
  // model, its effective read-only tool scope, permission mode, and UX color.
  // Derived from the snapshot taken at startup; it performs no live discovery.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // ListCommands returns slash commands discovered for one owned session's exact
  // server-bound placement. It authorizes and reattaches that session before
  // discovery and accepts no workspace/root input. It powers the client's command
  // palette; command expansion remains a run-path concern. A no-FS session or a
  // server with no command expander returns an empty list.
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);

  // ListWorktrees discovers eligible alternatives for one owned source session's
  // exactly reattached placement. Results carry bounded display metadata and an
  // opaque source-scoped selector accepted only by ClearSession or ForkSession.
  // The server re-enumerates and matches current choices on use; selectors are not
  // paths, are not persisted, and expire on restart. A no-FS session or a server
  // with no worktree lister returns an empty list.
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);

  // StreamSessionEvents replays a session's durable event log as a server stream
  // of `Event` envelopes (cloud-native Phase 3a read-back). It is the client-tier
  // surface over the SAME `port.EventLog.Read` the operator-tier 3c
  // EventLogService.Read serves; the loop itself stays storage-agnostic (it only
  // emits — persistence lives at the relay, never in `engine/agent`). The log
  // stores ALREADY-REDACTED events and inherits the stream's redaction, so this
  // path adds none (gauntlet #7: no raw args/deny-reason bodies/child content
  // ever cross).
  //
  // UNLIKE the live `Converse` relay — which SKIPS the three log-only event kinds
  // (`approval`/`compaction_archive`/`user_prompt`) on the client wire because they
  // are persistence-only — StreamSessionEvents relays ALL events, including those
  // three: a client opening a PAST session wants the verdicts and user prompts, as
  // they ARE the transcript. They are metadata-only/redacted by construction, so no
  // extra filter applies here.
  //
  // Read-only: no live model call, no mutation, no Converse run is started. An
  // unknown session id yields an EMPTY stream (absence is data — a never-created or
  // pruned id is indistinguishable, by design). A server with NO durable EventLog
  // wired returns `UNIMPLEMENTED` (HTTP 501). There is intentionally NO
  // ServerCapabilities bit for this feature: the capability is RPC-discoverable
  // (UNIMPLEMENTED vs. an empty stream degrade honestly).
  rpc StreamSessionEvents(StreamSessionEventsRequest) returns (stream Event);

  // StreamSessionLive is the LIVE per-session event stream (ADR 0075
  // fire-result-delivery Scenario 6 / Wave 3): a server-streaming RPC backed by
  // the in-process per-session subscription registry (Service.Subscribe /
  // PublishSessionEvent, List 1 row 35). It is the UNIFIED transport for BOTH
  // embedded and remote clients — the embedded mecatui dials its in-process
  // server over a real gRPC UNIX socket, so the in-process Subscribe registry is
  // unreachable from the TUI without a wire transport; this RPC is that
  // transport, and it serves a remote mecated identically (ONE proto, ONE TUI
  // consumption path).
  //
  // UNLIKE StreamSessionEvents (the durable-log READ-BACK, which relays ALL
  // events including the three log-only kinds), StreamSessionLive is a LIVE
  // stream and applies the SAME live-wire relay discipline as the live
  // `Converse` relay, with ONE narrow exception: a fire-result delivery note
  // (an EvUserPrompt whose text starts with the renderFireDelivery provenance
  // header "[scheduled task ") is RELAYED so the connected client renders the
  // delivery card as it happens (AC6.2). The other two log-only kinds
  // (EvApproval, EvCompactionArchive) stay SKIPPED on the live wire (they are
  // persistence-only; a client holds its own verdict/compaction view); a
  // non-delivery EvUserPrompt stays SKIPPED too (the client already holds its
  // own prompt). The delivery note is metadata-only/redacted by construction
  // (gauntlet #7 — it is the fenced-untrusted harness note the engine recorded).
  //
  // The stream stays open until the client cancels or disconnects. The handler
  // is drain-to-discard: a dead client never wedges the delivery run (a full
  // subscriber channel drops the event, AC6.3). The durable log records the
  // tail regardless (it is appended by the relay/loop, independent of this
  // stream). There is intentionally NO ServerCapabilities bit — the capability is
  // RPC-discoverable (UNIMPLEMENTED on an older server, an empty stream on a
  // server with no subscribers). An unknown session id yields an empty stream
  // (absence is data — a never-created id is indistinguishable from a session
  // with no live events yet).
  rpc StreamSessionLive(StreamSessionLiveRequest) returns (stream Event);

  // WatchSessionEvents is the DURABLE replay-then-follow stream: one operation
  // that replays a session's durable event log from a position, transitions to
  // live, and keeps following as the run appends (issue #821, ADR 0250).
  //
  // It exists because neither existing read path can do this. StreamSessionEvents
  // is a complete, ordered replay with NO position and NO follow — it reads the
  // whole log and stops, so a client that wants to catch up and then watch must
  // read everything and THEN subscribe, and any event appended between those two
  // steps is silently lost. StreamSessionLive is live but process-local,
  // in-memory, and non-durable: a second replica sees nothing, a reconnecting tab
  // sees nothing that happened while it was away, and a slow subscriber has its
  // events DROPPED. Both remain, unchanged, for the callers that want exactly
  // their semantics.
  //
  // CURSOR. `cursor` is an OPAQUE resume token meaning "I have durably received
  // everything up to here". Treat it as bytes to hand back — never parse, build,
  // or edit one. An EMPTY cursor means THE BEGINNING OF THE LOG, which is a real
  // value and the common case (a client attaching for the first time wants
  // replay-then-follow). A cursor from a superseded log generation returns
  // `cursor_expired` (the log was deleted and recreated); one that cannot be
  // decoded returns `cursor_malformed`. Neither is ever coerced to a position:
  // resuming from approximately the right place is indistinguishable from
  // resuming from the right place until data is already lost.
  //
  // PHASE is an OPEN STRING, not an enum — `replay`, `live`, `gap` today, and a
  // client must tolerate a value it does not know (the same discipline the event
  // `type`/`stop` fields already carry). `replay` records were already durable
  // when the watch attached; `live` records arrived after it caught up. Exactly
  // one PHASE-ONLY `live` frame (no `event`, cursor set) marks the replay to live
  // boundary, so a client can render the transcript and then show a live view
  // WITHOUT waiting for the next event to arrive — on an idle session that event
  // may never come. `gap` marks a position where a durable append is KNOWN to
  // have failed; it too carries no `event`, because a gap is a fact about
  // DELIVERY rather than something that happened in the run (ADR 0250 decision
  // 5 — this is why neither `session.Event` nor the `Event` message gains a gap
  // field).
  //
  // RELAY DISCIPLINE mirrors StreamSessionEvents, NOT the live wire: this is the
  // READ-BACK of the durable log, so it relays ALL events including the three
  // log-only kinds (`approval`/`compaction_archive`/`user_prompt`) — a client
  // replaying a session wants the verdicts and prompts, as they ARE the
  // transcript. They are metadata-only/redacted by construction.
  //
  // `run_id` optionally narrows delivery to ONE run (ADR 0249). Gap frames are
  // delivered regardless of the filter: a failed append leaves nothing to
  // attribute to a run, so suppressing it would hide a real gap.
  //
  // TERMINATION. A watch ends when the client cancels, or with an error that says
  // what to do next. A client that falls too far behind is TERMINATED with
  // `watch_lagging` rather than having its events dropped — the cursor exists
  // precisely so that termination is recoverable: reconnect with the last cursor
  // received and nothing is lost. A durable append failure terminates the
  // watchers in that process with `activity_gap` and never advances their cursor.
  // In BOTH cases the run continues normally: a broken or slow watch must never
  // break a live run, and a watcher never backpressures one.
  //
  // A server with no durable EventLog returns `no_event_log`; one whose log does
  // not implement the cursor seam returns `watch_unsupported` — never a silent
  // degrade to replaying the whole transcript, because a client asking to resume
  // from a position and being handed everything is a correctness problem dressed
  // as a performance one. Ownership is enforced exactly as on GetSession.
  rpc WatchSessionEvents(WatchSessionEventsRequest) returns (stream WatchSessionEventsResponse);
  // GetMcpAuthorizationPresentation returns the live browser URL for one owned,
  // still-pending authorization. The request carries correlation only; the URL
  // is returned only by this live control and never enters an Event or snapshot.
  rpc GetMcpAuthorizationPresentation(GetMcpAuthorizationPresentationRequest) returns (GetMcpAuthorizationPresentationResponse);

  // RecheckMcpAuthorization is a bidirectional authorization-control stream.
  // Its first frame MUST carry owned session/authorization correlation;
  // subsequent frames may resolve permission asks or cancel the continuation.
  rpc RecheckMcpAuthorization(stream RecheckMcpAuthorizationRequest) returns (stream RecheckMcpAuthorizationResponse);

  // CancelMcpAuthorization is the cancellation counterpart with the same
  // first-frame and continuation-control grammar.
  rpc CancelMcpAuthorization(stream CancelMcpAuthorizationRequest) returns (stream CancelMcpAuthorizationResponse);

  // ListSessions returns the stored-session inventory — the picker metadata a
  // client renders to let an operator open an EXISTING session by id (issue #245
  // Phase 1). It is backed by `port.PrunableStore.List` (type-asserted on the
  // configured store); a store that does not implement `PrunableStore`, or one that
  // returns `ErrPruneUnsupported`, degrades to an EMPTY list — never an error — so
  // a no-persistence/cloud server honestly reports "no sessions". Each row carries
  // only picker metadata (id, timestamps, state, turn count, model id); NO
  // conversation content is loaded. Rows are sorted most-recently-active first
  // (modified_at descending). Read-only. There is intentionally NO
  // ServerCapabilities bit — see StreamSessionEvents for the rationale.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // GetStorageHealth returns authenticated, content-free aggregate storage
  // status. It never returns session ids, owners, paths, or transcript content.
  rpc GetStorageHealth(GetStorageHealthRequest) returns (GetStorageHealthResponse);

  // Session migration is authenticated, semantics-preserving physical
  // maintenance. Plan is read-only; apply/resume process bounded batches.
  rpc PlanSessionMigration(PlanSessionMigrationRequest) returns (SessionMigrationPlan);
  rpc ApplySessionMigration(ApplySessionMigrationRequest) returns (SessionMigrationJob);
  rpc ResumeSessionMigration(ResumeSessionMigrationRequest) returns (SessionMigrationJob);
  rpc CancelSessionMigration(CancelSessionMigrationRequest) returns (SessionMigrationJob);
  rpc GetSessionMigrationJob(GetSessionMigrationJobRequest) returns (SessionMigrationJob);

  // Session cleanup is an authenticated plan/apply maintenance workflow. Plan is
  // read-only; apply requires its caller-bound opaque confirmation token.
  rpc PlanSessionCleanup(PlanSessionCleanupRequest) returns (PlanSessionCleanupResponse);
  rpc ApplySessionCleanup(ApplySessionCleanupRequest) returns (CleanupJob);
  rpc CancelSessionCleanup(CancelSessionCleanupRequest) returns (CleanupJob);
  rpc GetSessionCleanupJob(GetSessionCleanupJobRequest) returns (CleanupJob);

  // ListSkills returns the resolved skills inventory snapshot: each discovered
  // skill's name + one-line description. Derived from the snapshot taken at
  // startup (skills are discovered once at build time and immutable for the
  // process lifetime); it performs no live discovery. Metadata only — activating
  // a skill remains a run-path concern (the Skill tool reads the body).
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);

  // GetSoul returns the resolved soul (user-scoped persona) BUILD-TIME SNAPSHOT:
  // the selected soul's content + size/hash + provenance (user/project) + trust
  // and drift state. The soul is selected once at startup (USER-wins precedence,
  // project trust gate, drift check — issue #14 Phase 3 Items 1+2), so this is a
  // pure read of that snapshot, never a live re-read. Read-only inspection: it
  // never mutates the soul (the agent-read-only invariant).
  rpc GetSoul(GetSoulRequest) returns (GetSoulResponse);

  // GetUserModel returns the CURRENT user-model entries (durable FACTS about the
  // operator): each entry's key + one-line description, plus an aggregate size +
  // hash. Unlike GetSoul (a startup snapshot) this is a LIVE read of the
  // user-model store's index, so it reflects entries the agent has saved since
  // startup. Metadata only — the per-entry values are omitted (Recall loads them).
  rpc GetUserModel(GetUserModelRequest) returns (GetUserModelResponse);

  // ReflectSession explicitly reflects one completed, caller-owned session. It
  // remains available when automatic learning is off if reflection is configured.
  rpc ReflectSession(ReflectSessionRequest) returns (ReflectSessionResponse);

  // Learning attempts expose content-free lifecycle metadata from only the
  // verified caller's private partition. Pagination cursors are opaque IDs.
  rpc GetLearningAttempt(GetLearningAttemptRequest) returns (GetLearningAttemptResponse);
  rpc ListLearningAttempts(ListLearningAttemptsRequest) returns (ListLearningAttemptsResponse);
  // Retry and abandon are opaque-version CAS controls over only the attempt.
  // Abandon is non-compensating and does not promise downstream rollback.
  rpc RetryLearningAttempt(MutateLearningAttemptRequest) returns (MutateLearningAttemptResponse);
  rpc AbandonLearningAttempt(MutateLearningAttemptRequest) returns (MutateLearningAttemptResponse);

  // GenerateDreamPlan creates a bounded-lifetime manual consolidation review for
  // one closed, deployment-owned target. The request carries no mutation material.
  // Unavailable deployments return Unimplemented (HTTP parity: 501).
  rpc GenerateDreamPlan(GenerateDreamPlanRequest) returns (GenerateDreamPlanResponse);

  // DecideDreamPlan applies or dismisses the exact retained plan identified by
  // plan_id. The caller cannot replace any operation or memory content.
  rpc DecideDreamPlan(DecideDreamPlanRequest) returns (DecideDreamPlanResponse);

  // ListLearningProposals returns a bounded, caller/project-partitioned page.
  rpc ListLearningProposals(ListLearningProposalsRequest) returns (ListLearningProposalsResponse);

  // GetLearningProposal returns one proposal with digest-verified evidence status.
  rpc GetLearningProposal(GetLearningProposalRequest) returns (GetLearningProposalResponse);

  // DecideLearningProposal approves or rejects a staged proposal using CAS.
  rpc DecideLearningProposal(DecideLearningProposalRequest) returns (DecideLearningProposalResponse);

  // UndoLearningPromotion commits a compensating revision only while the promoted
  // revision is still current, also guarded by proposal-version CAS.
  rpc UndoLearningPromotion(UndoLearningPromotionRequest) returns (UndoLearningPromotionResponse);

  // Learned-skill lifecycle inspection and CAS mutations. These methods are
  // caller/project partitioned and are unimplemented when no lifecycle store exists.
  rpc ListLearnedSkills(ListLearnedSkillsRequest) returns (ListLearnedSkillsResponse);
  rpc GetLearnedSkill(GetLearnedSkillRequest) returns (GetLearnedSkillResponse);
  rpc DiffLearnedSkillVersions(DiffLearnedSkillVersionsRequest) returns (DiffLearnedSkillVersionsResponse);
  rpc ActivateLearnedSkill(MutateLearnedSkillRequest) returns (MutateLearnedSkillResponse);
  rpc RejectLearnedSkill(MutateLearnedSkillRequest) returns (MutateLearnedSkillResponse);
  rpc ArchiveLearnedSkill(MutateLearnedSkillRequest) returns (MutateLearnedSkillResponse);
  rpc RollbackLearnedSkill(RollbackLearnedSkillRequest) returns (MutateLearnedSkillResponse);
  rpc ListSkillChanges(ListSkillChangesRequest) returns (ListSkillChangesResponse);

  // ListModels returns the selectable-model inventory: every AVAILABLE provider's
  // catalog models, projected to public metadata only (no secrets). It powers the
  // client /models picker (multi-provider Phase 0, S3). Derived from the build-time
  // registry+catalog snapshot; it performs no live discovery and never reveals an
  // unavailable provider.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // --- Agent teams (experimental) -----------------------------------------
  //
  // A team is a set of long-lived member sessions that coordinate through a
  // shared task list and mailbox (see docs/adr/0014-agent-teams.md). Unlike
  // a Converse run (one session) or a Task/Fork subagent (one-shot, drained),
  // team members are re-driven across rounds and their events stream to the
  // client tagged with the producing member — the headless analogue of
  // Claude Code's split-pane teammates.

  // CreateTeam allocates a new agent team and returns its id, optionally enrolling
  // an initial roster in the same atomic call. Members may also be added afterwards
  // with SpawnTeammate; the team is then driven with RunTeam.
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);

  // SpawnTeammate enrols a member in an existing team (before RunTeam). A
  // read-only member shares the base workspace; a mutating member runs in an
  // isolated fork so parallel writes are safe.
  rpc SpawnTeammate(SpawnTeammateRequest) returns (SpawnTeammateResponse);

  // SendTeammateMessage posts a message into a member's inbox (e.g. from the
  // operator), delivered at that member's next turn boundary.
  rpc SendTeammateMessage(SendTeammateMessageRequest) returns (SendTeammateMessageResponse);

  // CancelTeammate cancels ONE member of a RUNNING team mid-round (the headless
  // RunTeam-path analogue of the Converse-path CancelChild frame). The member
  // de-schedules with the cancelled stop reason, its claimed tasks release back
  // to pending, and the team run continues — the lead still synthesises and the
  // RunTeam stream still delivers its terminal outcome frame. A team that is not
  // running (created but never run, or already done) is rejected with
  // FailedPrecondition; an unknown member name with NotFound.
  rpc CancelTeammate(CancelTeammateRequest) returns (CancelTeammateResponse);

  // RunTeam drives the team to quiescence, streaming every member's events —
  // each tagged with the member name — until the team finishes. The stream ends
  // with a single terminal frame carrying TeamEvent.outcome (rounds, stop,
  // budget_exhausted, usage, dispositions, findings); no member events follow it.
  rpc RunTeam(RunTeamRequest) returns (stream TeamEvent);

  // ListTeam returns a snapshot of the team roster, the shared task list, and
  // whether the team has reached quiescence.
  rpc ListTeam(ListTeamRequest) returns (ListTeamResponse);

  // CleanupTeam tears down a finished team and releases its resources.
  rpc CleanupTeam(CleanupTeamRequest) returns (CleanupTeamResponse);

  // ApprovePlan atomically resolves a parked plan-approval ask (a PresentPlan
  // call surfaced in plan mode, issue #206) and — on an ALLOW verdict — starts a
  // fresh continuation run carrying the harness proceed message, streaming BOTH
  // the resumed run's and the continuation run's events on the one response
  // stream. It composes EXISTING seams (Service.resumeFromAwaiting +
  // StartRunContent over the engine's ResumeApproval): the resumed run applies
  // the verdict, sets the plan-approved target mode, terminates with
  // StopPlanApproved, and flips the session mode at the terminal boundary; the
  // continuation run then drives the model on the FLIPPED mode (default /
  // accept-edits) with the proceed message as ordinary recorded history.
  //
  // target_mode → verdict mapping:
  //   - PERMISSION_MODE_DEFAULT  → allow-once (the session flips to DEFAULT).
  //   - PERMISSION_MODE_ACCEPT_EDITS → allow-always (the session flips to
  //     ACCEPT_EDITS).
  //   - PERMISSION_MODE_PLAN / UNSPECIFIED → deny (the run stays in plan mode;
  //     no continuation run starts — the model iterates on the plan on the next
  //     prompt).
  //
  // `note` is an OPTIONAL operator remark appended to the proceed message
  // injected into the continuation run's first user message (allow paths only).
  //
  // Preconditions (else FailedPrecondition): the session must NOT have a live
  // in-flight run (an approve mid-run is rejected — use the Converse
  // ResumeApproval frame for a live run), and it MUST be in the awaiting state
  // parked on a PLAN-ORIGINATED ask (not a generic tool-permission ask). An
  // unknown session yields NotFound. The stream ends with the terminal `result`
  // event of whichever run ran last (the continuation run on an allow path; the
  // resumed run on a deny path).
  rpc ApprovePlan(ApprovePlanRequest) returns (stream Event);

  // Workspace enrollment is a client-owned pre-prompt bundle. These unary
  // controls carry only whole-bundle correlation; no backend selector exists.
  rpc ConnectWorkspaceServices(WorkspaceEnrollmentConnectRequest) returns (WorkspaceEnrollment);
  rpc RetryWorkspaceEnrollment(WorkspaceEnrollmentControlRequest) returns (WorkspaceEnrollment);
  rpc CancelWorkspaceEnrollment(WorkspaceEnrollmentControlRequest) returns (WorkspaceEnrollment);
}

// PermissionMode is the session-wide permission posture, mirroring
// session.PermissionMode. Plan mode exposes a read-only toolset; acceptEdits
// auto-accepts edits.
enum PermissionMode {
  // PERMISSION_MODE_UNSPECIFIED defaults to DEFAULT at the server boundary.
  PERMISSION_MODE_UNSPECIFIED = 0;
  // PERMISSION_MODE_DEFAULT is the standard deny -> ask -> allow posture.
  PERMISSION_MODE_DEFAULT = 1;
  // PERMISSION_MODE_PLAN enforces a read-only toolset.
  PERMISSION_MODE_PLAN = 2;
  // PERMISSION_MODE_ACCEPT_EDITS auto-accepts edits.
  PERMISSION_MODE_ACCEPT_EDITS = 3;
}

// Limits are the configured stop conditions for a session. A zero value in
// any field disables that particular limit.
message Limits {
  // max_turns caps the number of model calls; 0 disables.
  int32 max_turns = 1;
  // max_tool_calls caps the total tool invocations; 0 disables.
  int32 max_tool_calls = 2;
  // max_consecutive_failures caps back-to-back tool failures; 0 disables.
  int32 max_consecutive_failures = 3;
}

// CreateSessionRequest opens a new session.
message CreateSessionRequest {
  reserved 1, 8;
  reserved "workspace", "source_session_id";
  // mode is the permission posture; unspecified defaults to DEFAULT.
  PermissionMode mode = 2;
  // limits are the optional stop conditions.
  Limits limits = 3;

  // provider_id selects which configured provider backs this session, by its
  // stable registry id ("openai" / "openrouter"). Empty => the server default
  // provider (today's behaviour). An unknown/unavailable id is a loud
  // InvalidArgument, never a silent fallback. The provider is FIXED for the
  // session lifetime (reasoning-replay + byte-stable prefix are provider-private);
  // "switch provider" = new session. Keys are NEVER on the wire — only this id.
  // (multi-provider Phase 0, S3.)
  string provider_id = 4;

  // model_id is the opaque model selector within provider_id. Empty => the
  // provider's default model. An id ListModels did not advertise is passed
  // through to the provider VERBATIM (a power-user escape hatch for a model the
  // embedded catalog doesn't yet know). NOT slash-joined with provider_id —
  // two distinct fields by design. Setting model_id WITHOUT provider_id is a loud
  // InvalidArgument (a bare model on an env-derived default provider is ambiguous).
  string model_id = 5;

  // profile selects the session's TOOL-SURFACE profile. Empty binds the
  // deployment default; "no-fs" explicitly attenuates filesystem access.
  string profile = 6;

  // reasoning_effort sets this session's reasoning-effort tier, enum-as-string
  // (the profile / Result.stop idiom — NO proto enum, additive values):
  //
  //   - "" or "auto": UNSET — do not send a reasoning-effort field; the
  //     operator default (and ultimately the provider default) applies.
  //   - "low" / "medium" / "high" / "xhigh" / "max": the neutral effort tiers.
  //
  // The server NORMALISES and per-provider CLAMPS the value (OpenAI supports
  // low/medium/high only, so xhigh/max clamp DOWN to high; Anthropic maps all
  // five) and CAPABILITY-GATES it (a model with no reasoning support drops it).
  // An unknown value falls back to the operator default with a WARN (it never
  // 400s the request). It OUT-RANKS the operator default; unlike model_id it is
  // meaningful WITHOUT a provider_id (it rides the server-default provider). The
  // EFFECTIVE resolved value is echoed back on resolved_model.reasoning_effort.
  string reasoning_effort = 7;

  // debug_target_session_id creates a separate diagnostic no-FS session.
  string debug_target_session_id = 9;

  // debug_mcp_servers explicitly selects already-configured server-global
  // streaming-HTTP MCP servers for this debug session. Legal only with a debug
  // target; names are bounded and unique. No URL, header, or inline MCP config is
  // accepted, and selection never implies publication authority.
  repeated string debug_mcp_servers = 10;

  // mcp_servers are CLIENT-PROVIDED streaming-HTTP MCP servers to mount for the
  // lifetime of this session, via a per-session engine. Empty (the default) is
  // byte-identical to today: the session takes the shared-engine path.
  //
  // LISTENER-SCOPED (ADR 0237 / ADR 0248): accepting an MCP endpoint plus its
  // auth headers from an API caller combines a remote principal with the
  // server's ambient outbound network authority, so it is a DEPLOYMENT policy,
  // not an inference from the request. A deployment whose API listeners are all
  // local (a UNIX socket, a disabled HTTP listener) permits this field; a
  // deployment with any network-facing API listener refuses every non-empty
  // value with the typed `client_mcp_unsupported` error (UNIMPLEMENTED / 501)
  // rather than mounting it. The refusal is the SERVER's, so it holds against a
  // client that never checked. A client discovers whether the field is usable
  // from `mcp_servers_on_create` in GetCompatibilityInfo.features.
  //
  // Transport is streaming-HTTP ONLY, on EVERY listener and regardless of that
  // policy: a stdio entry and an sse entry are hard-rejected as such (AGENTS.md:
  // "No stdio MCP, ever" — mecatl never spawns an MCP server process).
  repeated McpServerSpec mcp_servers = 11;
}

// McpServerSpec is one client-provided MCP server on CreateSessionRequest. It
// mirrors the ACP session/new mcpServers entry shape so both surfaces classify
// through the same validator.
message McpServerSpec {
  // name is the short, stable identifier that becomes the <server> segment of
  // every wrapped tool's namespaced name.
  string name = 1;
  // url is the server's streaming-HTTP endpoint. It must be absolute with a
  // host, and https — or http only to an explicit loopback host.
  string url = 2;
  // type is the transport discriminant: "http" (or empty with a url) is the only
  // accepted value. "stdio" and "sse" are hard-rejected on every listener.
  string type = 3;
  // command is carried ONLY so a command-shaped entry is classified as stdio and
  // rejected AS stdio. It is never executed — mecatl spawns no MCP process.
  string command = 4;
  // headers are extra HTTP headers sent to this server, typically an
  // Authorization bearer. Values are SECRET-SHAPED: the server never logs them,
  // never projects them into an event, and never includes them in an error.
  map<string, string> headers = 5;
}

// GetServerInfoRequest asks for the sanitized diagnostic display endpoint of the
// caller's already-known active provider. An absent or unknown provider_id leaves
// llm_provider_display_endpoint unavailable; the server never infers it from a
// default or session state.
message GetServerInfoRequest {
  string provider_id = 1;
}

// GetServerInfoResponse contains server build/composition identities and sanitized
// diagnostic display projections, never connection instructions.
message GetServerInfoResponse {
  string build_id = 1;
  // server_implementation is the stable composition family only (for example,
  // "mecated"). It never identifies an instance, deployment, topology,
  // configuration, capabilities, or authentication.
  string server_implementation = 2;
  // llm_provider_display_endpoint is sanitized diagnostic display data for the
  // requested provider_id only when that provider is already known to composition.
  // It is never connection configuration or a connection instruction. It contains
  // only scheme, host, optional port, and an escaped clean path; userinfo, query,
  // fragment, controls, and invalid or oversized values are omitted.
  string llm_provider_display_endpoint = 3;
}

// GetCompatibilityInfoRequest is empty: the descriptor is deployment-wide and
// identical for every caller. It exists so the RPC can grow request fields
// additively without a signature change.
message GetCompatibilityInfoRequest {}

// GetCompatibilityInfoResponse is the deployment's compatibility descriptor (ADR 0248).
//
// It deliberately carries TWO different vocabularies side by side, because they
// answer different questions and conflating them is a bug:
//
//   - `capabilities` answers "what has this OPERATOR enabled?" — it changes with
//     operator config. `bash: false` means the operator ran --no-bash.
//   - `features` answers "what does this BUILD implement?" — it changes when
//     mecatl is upgraded.
//
// A client that reads a disabled capability as version skew will reject a
// correctly-configured deployment; a client that infers protocol support from an
// operator toggle will call an RPC the server has never heard of.
message GetCompatibilityInfoResponse {
  // api_major is the wire-contract major version. It starts at 1 and bumps ONLY
  // on a genuine break; additive changes are announced through `features`
  // instead. A client gates on api_major + feature identifiers, NEVER on a
  // server/package semver comparison.
  int32 api_major = 1;
  // capabilities is the SAME ServerCapabilities projection CreateSessionResponse
  // echoes — the operator-enabled feature set — served here so a client can read
  // it without creating a probe session. Media (image/audio) here is a
  // SERVER-WIDE hint for UI chrome only: the per-session
  // CreateSessionResponse.session_capabilities echo remains authoritative for
  // whether a given session may send media.
  ServerCapabilities capabilities = 2;
  // features are the build's supported feature identifiers as OPEN STRINGS, not
  // an enum — the EvNoProgress/StopBudget string-passthrough discipline. An
  // unrecognised identifier is ignored by an older client; a new one is a minor
  // release, never a wire-compat event. Identifiers are stable once published.
  //
  // A feature that is only reachable on some listeners is advertised only on a
  // listener that permits it, so this set is "what this build implements AND
  // this listener permits" (see ADR 0237 / ADR 0248).
  repeated string features = 3;
  // deployment is an OPTIONAL, opaque, bounded, operator-set label for this
  // deployment. It is empty by default and is NEVER derived from hostname, pod
  // name, or environment — infrastructure topology is not something an
  // authenticated caller is owed, and a label the operator did not choose is a
  // leak with no consenting author. Set via mecated --deployment-id.
  string deployment = 4;
}

// ServerCapabilities reports which optional features this server has ENABLED,
// so a client can present an honest UI (advertise only reachable features, and
// explain an empty inventory as "not enabled" vs "enabled but empty"). Each
// field reflects the BUILT service state (registered tools / wired seams), never
// a static guess — see internal/adapter/server.Service.capabilities(). All
// fields default false, so a client talking to an OLDER server (no caps field)
// degrades safely to "nothing advertised" rather than over-promising. The set is
// designed to grow additively: a new feature adds a new `bool field = N;` that
// old clients ignore and new clients reading an old server see as false.
message ServerCapabilities {
  // mcp is true when MCP inventory/resources/prompts are available (an MCP
  // provider is wired). Gates ctrl+o / ctrl+r / f8.
  bool mcp = 1;
  // slash_commands is true when slash-command discovery is available (a command
  // lister is wired). Gates the / palette.
  bool slash_commands = 2;
  // memory is true when cross-session memory tools (Remember/Recall) are
  // registered. Agent-side: no overlay, surfaced as prose only.
  bool memory = 3;
  // skills is true when the Skill tool is registered. Gates the /skills
  // inventory browser (the read-only ListSkills snapshot). Activation stays the
  // model's concern — the panel is discovery only.
  bool skills = 4;
  // teams is true when agent teams are enabled (a member-engine factory is
  // wired). Gates the f6 deep view's relevance.
  bool teams = 5;
  // bash is true when the Bash tool is registered (i.e. NOT --no-bash).
  bool bash = 6;
  // image is true when the wired LLM provider consumes image prompt parts.
  // Gates the @-mention file-attach UX for images (a client refuses to send an
  // image part to a server whose provider cannot read it).
  bool image = 7;
  // audio is true when the wired LLM provider consumes audio prompt parts.
  // Gates the @-mention file-attach UX for audio.
  bool audio = 8;
  // agents is true when the agent-definition registry is resolvable and served
  // (ListAgents returns the resolved snapshot). Independent of `teams` (the
  // run-path member-engine): defs can be browsable without teams enabled.
  // Gates the /agents definition-inventory panel.
  bool agents = 9;
  // soul is true when a soul source is wired (a soul was selected at startup, so
  // GetSoul returns its snapshot). Gates the /soul read-only inspection panel.
  bool soul = 10;
  // user_model is true when the user-model store is wired (GetUserModel reads its
  // live index). Gates the /usermodel read-only inspection panel.
  bool user_model = 11;
  // model_selection is true when >=1 provider is available (ListModels would return
  // >0). Gates the client's /models picker the same way `agents` gates /agents.
  // Additive: an older server leaves it false and the client hides the picker.
  // (multi-provider Phase 0, S3.)
  bool model_selection = 12;
  // posture is the SERVER-WIDE operator posture-ladder tier ("strict"/"trusted"/
  // "auto"/"yolo"). It is CHROME ONLY — a client renders an honest "⚠ auto"/"⚠ yolo"
  // badge so an operator can see the daemon's automation posture at a glance — and is
  // NEVER session state (it does not change per session; permission MODE is the
  // per-session knob). String passthrough, no enum on the wire (the EvNoProgress /
  // StopBudget discipline). Additive: an older server leaves it empty and the client
  // shows no badge (strict/trusted also show no badge).
  string posture = 13;
  // worktrees is true when a WorktreeLister is wired (ListWorktrees may return a
  // non-empty list for a real git repo). Gates the client's /worktrees overlay —
  // the first-class operator workflow for binding a session to an EXISTING sibling
  // git worktree (issue #102). Additive: an older server leaves it false and the
  // client hides the overlay. A no-FS/cloud server (no lister wired) also yields
  // false, so the feature is honestly absent there.
  bool worktrees = 14;
  // scheduling is true when a ScheduleStore is reachable (the schedule RPCs are
  // functional: Create/List/Get/Pause/Resume/Delete/FireNow/GetFire/ListFires).
  // Gates the client's /schedule overlay. Independent of the scheduler tick
  // loop (--scheduler): the store-backed RPCs work without the tick loop.
  // Additive: an older server leaves it false and the client hides the overlay.
  bool scheduling = 15;
  // reflection is true when explicit completed-session reflection is available.
  bool reflection = 16;
  // learning_proposals is true when proposal review and promotion are available.
  bool learning_proposals = 17;
  // learned_skills is true when the caller-partitioned lifecycle API is available.
  bool learned_skills = 18;
  reserved 20;
  reserved "legacy_adoption";
  // storage_migration is true only when the backend implements durable bounded
  // v1-to-v2 maintenance, a management authorizer is configured, and destructive
  // mutation has cross-process lease exclusion (or explicitly proven private
  // embedded single-writer composition).
  bool storage_migration = 21;
  // storage_cleanup advertises the authenticated plan/apply/job maintenance API
  // only under the same destructive-mutation exclusion as storage_migration.
  bool storage_cleanup = 22;
  // manual_dream is the composition-time availability snapshot for the two
  // deployment-owned manual consolidation targets. An older server leaves it
  // absent; unavailable reasons are bounded, content-free operator categories.
  ManualDreamCapabilities manual_dream = 19;
  // storage_health is true only when the backend implements bounded indexed
  // health and this deployment has a management authorizer.
  bool storage_health = 23;
  // steer is true when the server's engines arm the mid-run steer inbox
  // (steer-while-running, issue #512): a client may then send multimodal
  // `steer` / `steer_cancel` frames on the live Converse stream and render the
  // EvSteer drain echo. When false because steer is disabled in composition,
  // the client keeps its local merge-queue behaviour — a steer frame sent to
  // such a server is promoted to a fresh follow-up run (the engine reports
  // too_late on its disarmed inbox), never silently dropped.
  bool steer = 24;
  // manual_compaction is true when the server can apply an out-of-band
  // session compaction pass to an idle owned session. Gates the client's
  // /compact action.
  bool manual_compaction = 25;
  // session_debug is true when this server can create and rehydrate dedicated
  // no-filesystem debug sessions.
  bool session_debug = 26;
  // debug_mcp is true when debug sessions may explicitly borrow selected direct
  // tools from configured server-global streaming-HTTP MCP servers.
  bool debug_mcp = 27;
  // workspace_enrollment is true when protected workspace services must be
  // admitted as one complete bundle before the first prompt.
  bool workspace_enrollment = 28;
}

// CreateSessionResponse carries the newly-allocated session id.
message CreateSessionResponse {
  // session_id is the id of the created session.
  string session_id = 1;
  // capabilities reports which optional features this server has enabled, for an
  // honest client UI. Nil/absent from an older server → treat as all-false.
  ServerCapabilities capabilities = 2;

  // session_capabilities reports the multimodal input capability of the
  // provider+model THIS session actually resolved to — the INTERSECTION of the
  // catalog's per-model modalities and the wired adapter's transmit capability,
  // computed once in composition (internal/app). It MAY differ from `capabilities`
  // (the server-wide shared-engine view) when the request carried
  // provider_id/model_id selecting a NON-default engine. Clients gate per-session
  // @-attach UX on THIS, not the server-wide bits. Nil/absent from an older server
  // → fall back to `capabilities`. (multi-provider Phase 0, S5.)
  SessionCapabilities session_capabilities = 3;

  // resolved_model reports the EFFECTIVE provider+model THIS session actually
  // resolved to, plus its context window — the single value computed once in
  // composition (internal/app), the SAME composition-computed single-source
  // discipline as session_capabilities (NEVER recomputed in a handler). It is
  // echoed VERBATIM: the server owns the resolution (the empty-selector default,
  // an env-derived provider, a passthrough model), so a client must read THIS
  // rather than the model_id it sent (which is empty for a default session and
  // ambiguous for passthrough). The model is FIXED per TURN; it is re-resolved
  // BETWEEN turns when the session's permission mode changes the effective model
  // (the plan-slot / opusplan pattern, ADR 0030 Layer 3) — re-read it from
  // GetSession after a mode change. Nil/absent from an older server → the client
  // falls back to today's behavior (no model segment in the header).
  ResolvedModel resolved_model = 4;
  // placement is bounded display-only metadata, never reusable authority.
  PlacementMetadata placement = 5;
}

// PlacementMetadata is safe display data. It never contains a filesystem path,
// backend locator, exact EnvironmentRef, or reusable selector.
message PlacementMetadata {
  string kind = 1;
  string label = 2;
  string branch = 3;
  string revision = 4;
}

// ResolvedModel is the per-session EFFECTIVE model: the provider+model id this
// session resolved to and its context window. Composition-computed and echoed
// verbatim (see CreateSessionResponse.resolved_model); the model is FIXED per TURN
// and re-resolved between turns when the permission mode changes the effective
// model (plan-slot / opusplan, ADR 0030 Layer 3). The client resolves a human
// display name from its ListModels inventory by (provider_id, model_id) — no
// display_name is carried here.
message ResolvedModel {
  // provider_id is the resolved provider (e.g. "openai", "anthropic").
  string provider_id = 1;
  // model_id is the resolved model id (the opaque id the adapter was given).
  string model_id = 2;
  // context_window is the resolved model's context window in tokens (0 = unknown).
  int64 context_window = 3;
  // reasoning_effort is the EFFECTIVE reasoning-effort tier this session resolved
  // to, enum-as-string (the same neutral vocabulary as
  // CreateSessionRequest.reasoning_effort, NO proto enum): "" when unset (the
  // provider default applies), else the normalised + per-provider-CLAMPED token
  // actually wired into the adapter — e.g. an OpenAI session that requested "max"
  // echoes "high". The client renders it (e.g. in the model footer) and never
  // recomputes it.
  string reasoning_effort = 4;
}

// SessionCapabilities is the per-session resolved input capability: ONLY the
// model-varying input bits (image/audio). A dedicated message (not a reuse of
// ServerCapabilities) keeps the per-session surface MINIMAL — the other
// ServerCapabilities bits (mcp/skills/teams/...) are server-wide and would be
// misleading per session. Reasoning is intentionally EXCLUDED: it is discoverable
// via ListModels for the selected id and is not a per-session input-gating
// concern (no adapter "can replay reasoning" authority bit exists). The value is
// the catalog ∩ adapter intersection computed in composition. (Phase 0, S5.)
message SessionCapabilities {
  // image is true when the resolved provider+model can consume image prompt parts.
  bool image = 1;
  // audio is true when the resolved provider+model can consume audio prompt parts.
  bool audio = 2;
}

// GetSessionRequest looks up an existing session by id.
message GetSessionRequest {
  // session_id is the id to look up.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetSessionResponse wraps the session snapshot returned by GetSession.
message GetSessionResponse {
  // session is the snapshot of the requested session.
  Session session = 1;
}

// GetSessionTranscriptRequest names the owned session whose current aggregate
// conversation is requested.
message GetSessionTranscriptRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ActivityReplayStatus describes the optional EventLog activity plane. It is
// deliberately independent of transcript completeness: EventLog append can gap,
// read can fail, and EOF carries no completeness attestation.
message ActivityReplayStatus {
  // available reports whether this deployment configured an EventLog reader.
  bool available = 1;
  // complete is false in v1 because EventLog has no completeness attestation.
  bool complete = 2;
  // authoritative is always false: activity never attests model context.
  bool authoritative = 3;
}

// GetSessionTranscriptResponse is one coherent SessionStore snapshot projection.
// messages are the loaded aggregate's current Conversation.Messages in order.
message GetSessionTranscriptResponse {
  // session_id is copied from the same loaded aggregate as messages.
  string session_id = 1;
  // messages contains human-displayable message fields. Provider-private replay
  // fields on ConversationMessage are always omitted from this surface.
  repeated ConversationMessage messages = 2;
  // complete is true even for a genuinely empty conversation: a successful load
  // is the completeness attestation, never EventLog EOF.
  bool complete = 3;
  // activity reports the separate, optional, non-authoritative replay plane.
  ActivityReplayStatus activity = 4;
  // kind and relationship come from the same authoritative snapshot as messages.
  string kind = 5;
  SessionRelationship relationship = 6;
}

// StreamSessionEventsRequest names the session whose durable event log is replayed.
message StreamSessionEventsRequest {
  // session_id is the id of the session to replay. An unknown id yields an empty
  // stream (absence is data); a server with no durable EventLog returns
  // UNIMPLEMENTED.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// StreamSessionLiveRequest names the session whose LIVE event stream is opened.
message StreamSessionLiveRequest {
  // session_id is the id of the session to subscribe to. An unknown id yields an
  // empty stream (absence is data — a never-created id is indistinguishable from
  // a session with no live events yet).
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// WatchSessionEventsRequest opens a durable replay-then-follow watch (ADR 0250).
message WatchSessionEventsRequest {
  // session_id is the id of the session to watch. An unknown id yields a watch
  // that replays nothing and then follows — absence is data, and a session
  // created a moment from now is indistinguishable from one that never existed.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];

  // cursor is an OPAQUE resume token from a previous response. EMPTY means the
  // beginning of the log, which is the normal first attachment rather than an
  // edge case.
  //
  // Hand back a value the server issued, verbatim. The encoding is stateless and
  // therefore inspectable, but it is not a contract: a decoded, hand-edited
  // cursor gets `cursor_expired` or `cursor_malformed`, never silently wrong
  // data.
  string cursor = 2;

  // run_id, when set, narrows delivery to the events one run emitted (ADR 0249).
  // Empty delivers every run's events. Gap frames are delivered either way.
  //
  // A cursor is SCOPED to the run_id it was issued under: resume with the same
  // value you watched with. Changing it — or dropping it — replays from a
  // position that already advanced past the other runs' records, which skips
  // them silently.
  string run_id = 3;
}

// WatchSessionEventsResponse is ONE delivery envelope: what happened, where the
// client now is, and which phase of the watch it arrived in.
message WatchSessionEventsResponse {
  // event is the recorded event. It is ABSENT on a phase-only frame — the single
  // replay-to-live transition marker, and every gap frame.
  Event event = 1;

  // cursor is the OPAQUE resume token positioned AFTER this envelope. A client
  // that persists it once per processed envelope gets at-least-once delivery
  // across a reconnect: hand the last one back and the watch continues from
  // exactly the next record.
  //
  // That guarantee is scoped to the run_id the cursor was issued under. Under a
  // run filter the watch's position advances over the records it dropped, so the
  // cursor sits past events another filter would have delivered; resuming with a
  // different run_id, or none, skips them with no signal. Resume with the same
  // filter, or start from the beginning.
  string cursor = 2;

  // phase is an OPEN STRING: `replay` (already durable when the watch attached),
  // `live` (appended while the watch was following), or `gap` (a position whose
  // append is known to have failed). Tolerate an unknown value rather than
  // treating it as an error — this is deliberately not an enum, so that adding a
  // phase is a minor SDK release rather than a wire-compat event.
  string phase = 3;
}

// ListSessionsRequest asks for one bounded keyset page of stored-session inventory.
message ListSessionsRequest {
  // page_size is clamped by the server. Zero selects the server default.
  int32 page_size = 1;
  // cursor is the opaque continuation token returned by the previous page.
  string cursor = 2;
}

// Principal is the verified caller an object is attributed to (ADR 0204 — caller
// identity, threaded). Identity is the (issuer, subject) PAIR, never subject alone:
// two IdPs or realms collide on `sub`. It carries NO scopes, NO credentials and NO
// claims map — attribution only; enforcement is the isolation track's.
//
// An ABSENT principal is an ABSENT message (a nil owner), never a present-but-empty
// one — "nobody" must never be renderable as an anonymous somebody.
message Principal {
  // issuer is the IdP that minted the token (the canonical `iss` claim).
  string issuer = 1;
  // subject is the caller id within that issuer (the `sub` claim).
  string subject = 2;
  // grant_type is how the caller authenticated: "user", "client_credentials" or
  // "system". A bare string passthrough (no enum) — the domain owns the closed set.
  string grant_type = 3;
  // name is an optional human-readable display label. It is NEVER part of
  // identity — display only.
  string name = 4;
}

// SessionSummary is one stored session's picker metadata — id, timestamps, state,
// turn count, and the resolved model id. It carries NO conversation content: it is
// the cheap row a client renders in an "open existing session" picker (issue #245
// Phase 1). `model_id` is a bare opaque string (NOT a full ResolvedModel) to keep
// the picker row cheap and provider-neutral — the client resolves a display name
// from its ListModels inventory by (provider_id, model_id) if it needs one.
message SessionSummary {
  // session_id is the stored session's id.
  string session_id = 1;
  // modified_at_unix is the last-write timestamp in Unix seconds (the
  // PrunableStore row mtime; the sort key for the picker).
  int64 modified_at_unix = 2;
  // state is the persisted lifecycle state (idle/running/awaiting/completed/...).
  // Empty when the snapshot could not be loaded (a corrupt store row still
  // surfaces its id/mtime).
  string state = 3;
  // turns is the persisted model-call count. Zero when the snapshot could not be
  // loaded.
  int32 turns = 4;
  // model_id is the resolved model id this session ran on (bare string, no
  // provider context). Empty when the session never resolved a model or the
  // snapshot could not be loaded.
  string model_id = 5;
  // created_at_unix is the creation timestamp in Unix seconds. Zero when the
  // snapshot could not be loaded.
  int64 created_at_unix = 6;
  // title is the deprecated compatibility title; use title_metadata.title.
  string title = 7 [deprecated = true];
  // owner is the verified caller the session is attributed to (ADR 0204), stamped
  // write-once at CreateSession from the validated token — never from the request
  // body. UNSET for an ownerless session (a no-auth deployment, or a session
  // persisted before the owner label existed; nothing backfills it).
  Principal owner = 8;
  // kind and relationship are the durable trusted-producer taxonomy.
  string kind = 9;
  SessionRelationship relationship = 10;
  // capabilities state which public actions are valid for this row.
  SessionInventoryCapabilities capabilities = 11;
  // reason_code explains why a capability is unavailable. Empty means no denial.
  string reason_code = 12;
  reserved 13;
  reserved "workspace";
  // title_provenance is deprecated compatibility provenance; use title_metadata.provenance.
  // Allowed values: "first-prompt", "operator", "generated", or empty for legacy/unknown.
  string title_provenance = 14 [deprecated = true];
  PlacementMetadata placement = 15;
  // title_metadata is the canonical bounded, source-free title lifecycle projection.
  SessionTitle title_metadata = 16;
  // token_usage is the canonical durable session token accounting. Map keys identify
  // usage types; `main` is ordinary main-session agent usage. Other keys are
  // server-defined and are not enumerated here.
  map<string, TokenUsage> token_usage = 17;
}

