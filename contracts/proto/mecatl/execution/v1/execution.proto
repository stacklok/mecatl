// Private, mutually authenticated execution-provider protocol. This is not part
// of the public Harness API.
syntax = "proto3";

package mecatl.execution.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/stacklok/mecatl/contracts/gen/go/mecatl/execution/v1;executionv1";

// File and command calls use mecatl.executor.v1 FileService and CommandService
// on the same endpoint.
service ExecutionProviderService {
  rpc ListExecutionTemplates(ListExecutionTemplatesRequest) returns (ListExecutionTemplatesResponse);
  rpc ValidateTemplate(ValidateTemplateRequest) returns (ValidateTemplateResponse);
  rpc EnsureTemplate(EnsureTemplateRequest) returns (EnsureEnvironmentResponse);
  rpc AttachEnvironment(AttachEnvironmentRequest) returns (AttachEnvironmentResponse);
  rpc AcquireRun(AcquireRunRequest) returns (RunClaimResponse);
  rpc RenewRun(RenewRunRequest) returns (RunClaimResponse);
  rpc ReleaseRun(ReleaseRunRequest) returns (google.protobuf.Empty);
  rpc CommitReference(ReferenceMutationRequest) returns (google.protobuf.Empty);
  rpc AbortReference(ReferenceMutationRequest) returns (google.protobuf.Empty);
  rpc ReserveSuccessor(ReserveSuccessorRequest) returns (ReferenceReservationResponse);
  rpc PrepareReferenceDelete(ReferenceMutationRequest) returns (google.protobuf.Empty);
  rpc ConfirmReferenceDelete(ReferenceMutationRequest) returns (google.protobuf.Empty);
  rpc CancelReferenceDelete(ReferenceMutationRequest) returns (google.protobuf.Empty);
  rpc ListReferenceIntents(ListReferenceIntentsRequest) returns (ListReferenceIntentsResponse);
  rpc ReleaseReference(ReleaseReferenceRequest) returns (google.protobuf.Empty);
  rpc RetireEnvironment(RetireEnvironmentRequest) returns (google.protobuf.Empty);
  rpc ReplaceExecutor(ReplaceExecutorRequest) returns (google.protobuf.Empty);
  rpc RecoverEnvironment(RecoverEnvironmentRequest) returns (google.protobuf.Empty);
  rpc DeleteRetiredEnvironment(DeleteRetiredEnvironmentRequest) returns (google.protobuf.Empty);
  rpc RevokeEnvironment(RevokeEnvironmentRequest) returns (RevokeEnvironmentResponse);
}

message EnvironmentRef { string id = 1; string revision = 2; }
message Owner { string issuer = 1; string subject = 2; }
message RequestContext {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string binding_id = 3;
  uint64 epoch = 4;
  reserved 5;
  reserved "grant";
  string run_id = 6;
  string claim_id = 7;
  uint64 grant_generation = 8;
}

message TemplateSelector { string id = 1; string revision = 2; }
message TemplateCatalogItem {
  TemplateSelector template = 1;
  string name = 2;
  string description = 3;
  string display_token = 4;
  map<string, string> extensions = 5; // namespace/key -> inert value
  // Declared provider affordances, not effective session authority.
  repeated string capabilities = 6;
}
message ListExecutionTemplatesRequest {}
message ListExecutionTemplatesResponse {
  repeated TemplateCatalogItem items = 1;
  string inventory_revision = 2;
}
message ValidateTemplateRequest { TemplateSelector template = 1; }
message ValidateTemplateResponse {
  TemplateSelector template = 1;
  repeated string capabilities = 2;
  int64 max_file_bytes = 3;
  int64 max_command_bytes = 4;
  int64 max_command_duration_millis = 5;
}
message EnsureTemplateRequest {
  string binding_id = 1;
  TemplateSelector template = 2;
  Owner owner = 3;
  string operation_id = 4;
  // As mecatl.v1.ExecutionTemplate.capabilities.
  repeated string capabilities = 5;
}

message EnsureEnvironmentResponse {
  EnvironmentRef environment = 1;
  uint64 epoch = 2;
  bool ready = 3;
  reserved 4, 5;
  reserved "grant", "grant_expires_at";
  uint64 grant_generation = 6;
  // Mandatory.
  repeated string admitted_capabilities = 7;
}
message AttachEnvironmentRequest { RequestContext context = 1; string purpose = 2; }
message AttachEnvironmentResponse {
  EnvironmentRef environment = 1;
  uint64 epoch = 2;
  bool ready = 3;
  reserved 4, 5;
  reserved "grant", "grant_expires_at";
  uint64 grant_generation = 6;
  // Mandatory.
  repeated string admitted_capabilities = 7;
}
message AcquireRunRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string binding_id = 3;
  string run_id = 4;
  string operation_id = 5;
  int64 ttl_millis = 6;
}
message RenewRunRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string binding_id = 3;
  string run_id = 4;
  string claim_id = 5;
  uint64 epoch = 6;
  string operation_id = 7;
  int64 ttl_millis = 8;
  uint64 grant_generation = 9;
}
message ReleaseRunRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string binding_id = 3;
  string run_id = 4;
  string claim_id = 5;
  uint64 epoch = 6;
  string operation_id = 7;
  uint64 grant_generation = 8;
}
message RunClaimResponse {
  EnvironmentRef environment = 1;
  string binding_id = 2;
  string run_id = 3;
  string claim_id = 4;
  uint64 epoch = 5;
  uint64 grant_generation = 6;
  reserved 7;
  reserved "grant";
  google.protobuf.Timestamp expires_at = 8;
}
message ReferenceMutationRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string binding_id = 3;
  string operation_id = 4;
}
message ReserveSuccessorRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string source_binding_id = 3;
  string destination_binding_id = 4;
  string operation_id = 5;
}
message ReferenceReservationResponse {
  EnvironmentRef environment = 1;
  // Mandatory; the source environment's set.
  repeated string admitted_capabilities = 2;
}
message ListReferenceIntentsRequest {
  Owner owner = 1;
  int32 limit = 2;
  EnvironmentRef environment = 3;
  string binding_id = 4;
}
message ReferenceIntent {
  EnvironmentRef environment = 1;
  string binding_id = 2;
  string state = 3;
  string operation_id = 4;
  string source_binding_id = 5;
  google.protobuf.Timestamp created_at = 6;
  Owner owner = 7;
}
message ListReferenceIntentsResponse { repeated ReferenceIntent intents = 1; }
message ReleaseReferenceRequest { RequestContext context = 1; }
message RetireEnvironmentRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  uint64 expected_execution_epoch = 3;
  string expected_pod_uid = 4;
  string expected_pvc_uid = 5;
  string operation_id = 6;
}
message ReplaceExecutorRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  uint64 expected_execution_epoch = 3;
  string expected_pod_uid = 4;
  string expected_pvc_uid = 5;
  string operation_id = 6;
}
message RecoverEnvironmentRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  uint64 expected_execution_epoch = 3;
  string expected_pod_uid = 4;
  string expected_pvc_uid = 5;
  string operation_id = 6;
}
message DeleteRetiredEnvironmentRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  string expected_pvc_uid = 3;
  string operation_id = 4;
}
message RevokeEnvironmentRequest {
  EnvironmentRef environment = 1;
  Owner owner = 2;
  uint64 expected_grant_generation = 3;
  string operation_id = 4;
}
message RevokeEnvironmentResponse { uint64 grant_generation = 1; }

// ErrorDetail is a stable machine-readable classification. Status messages are
// intentionally generic so backend/Kubernetes details never cross the boundary.
message ErrorDetail { string code = 1; bool retryable = 2; }
