// mecatl driver API: the remote memory-store protocol.
//
// MemoryStoreService is the wire seam behind the harness's `tool.MemoryStore`.
// A configured driver is operator-trusted infrastructure, but it is not trusted
// to sanitize model-written values. The harness and driver negotiate this
// CURRENT contract before the store is exposed; there is no old-peer fallback.
// Every mutation is a lifecycle CAS operation.

syntax = "proto3";

package mecatl.driver.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service MemoryStoreService {
  // Capabilities is mandatory. Success with the exact current contract marker
  // confirms that every RPC below has the documented lifecycle/CAS semantics.
  rpc Capabilities(MemoryStoreCapabilitiesRequest) returns (MemoryStoreCapabilitiesResponse);

  // Remember atomically appends a revision only when current exactly matches
  // the stored presence and opaque version.
  rpc Remember(RememberRequest) returns (MemoryRecordResponse);

  // Inspect returns the current revision and bounded oldest-to-newest history.
  rpc Inspect(InspectRequest) returns (InspectResponse);

  // Recall returns the active entry for the exact key. A miss is found=false.
  rpc Recall(RecallRequest) returns (RecallResponse);

  // List returns active entries matching prefix, key-sorted, values present.
  rpc List(ListRequest) returns (ListResponse);

  // Forget appends a tombstone only when expected_version exactly matches.
  rpc Forget(ForgetRequest) returns (MemoryRecordResponse);

  // Index returns the key-sorted tier-0 routing table with values omitted.
  rpc Index(IndexRequest) returns (IndexResponse);

  // Search returns deterministic best-first active matches with values omitted.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Undo appends a compensating revision only when expected_version matches.
  rpc Undo(UndoRequest) returns (MemoryRecordResponse);
}

message MemoryEntry {
  string key = 1;
  string value = 2;
  string description = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// MemoryCurrent is the complete expected state for Remember. A create-only
// write uses exists=false and an empty version. An update uses exists=true and
// the exact opaque current version; every other combination is invalid.
message MemoryCurrent {
  bool exists = 1;
  string version = 2 [(buf.validate.field).string.max_len = 128];
}

message RememberRequest {
  MemoryEntry entry = 1 [(buf.validate.field).required = true];
  MemoryCurrent current = 2 [(buf.validate.field).required = true];
  MemoryAttribution attribution = 3 [(buf.validate.field).required = true];
}

message InspectRequest {
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

message InspectResponse {
  MemoryRecord record = 1;
  bool found = 2;
}

message RecallRequest {
  string key = 1 [(buf.validate.field).string.min_len = 1];
}

message RecallResponse {
  MemoryEntry entry = 1;
  bool found = 2;
}

message ListRequest {
  string prefix = 1;
}

message ListResponse {
  repeated MemoryEntry entries = 1;
}

message ForgetRequest {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  string expected_version = 2 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 128];
  MemoryAttribution attribution = 3 [(buf.validate.field).required = true];
}

message IndexRequest {}

message IndexResponse {
  repeated MemoryEntry entries = 1;
}

message SearchRequest {
  string query = 1;
  int32 k = 2;
}

message SearchResponse {
  repeated MemoryEntry entries = 1;
}

message UndoRequest {
  string key = 1 [(buf.validate.field).string.min_len = 1];
  string expected_version = 2 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 128];
  MemoryAttribution attribution = 3 [(buf.validate.field).required = true];
}

// MemorySource carries optional durable provenance handles. Empty means absent.
message MemorySource {
  string session_id = 1;
  reserved 2, 3;
  reserved "event_id", "message_id";
  string proposal_id = 4;
}

// MemoryAttribution is informational write provenance and grants no authority.
message MemoryAttribution {
  string writer = 1;
  string origin = 2;
  MemorySource source = 3;
}

// MemoryRevision is one immutable lifecycle revision. Status, writer, origin,
// and version use strings on the wire; the negotiated current contract fixes
// their accepted lifecycle semantics, and malformed current values fail closed.
message MemoryRevision {
  string key = 1;
  string value = 2;
  string description = 3;
  string version = 4;
  string status = 5;
  string writer = 6;
  string origin = 7;
  MemorySource source = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message MemoryRecord {
  MemoryRevision current = 1;
  repeated MemoryRevision revisions = 2;
}

message MemoryRecordResponse {
  MemoryRecord record = 1 [(buf.validate.field).required = true];
}

message MemoryStoreCapabilitiesRequest {}

message MemoryStoreCapabilitiesResponse {
  // Removed alpha capability booleans must never be reused. The current
  // contract is indivisible: a peer either speaks all mandatory operations or
  // construction fails.
  reserved 1, 2;
  reserved "lifecycle", "convergence";
  string contract = 3 [(buf.validate.field).string.min_len = 1];
}
