// mecatl driver API: the remote session-store protocol.
//
// SessionStoreService is the wire seam behind the harness's `port.SessionStore`
// (engine/port/store.go): an operator-run driver process persists session
// snapshots on behalf of the harness, in place of the in-process stores
// (memstore, jsonlstore). The driver sits at the SAME trust tier as an
// on-disk store directory — operator-configured infrastructure, not a
// model-facing surface.
//
// The snapshot payload is OPAQUE to the driver: it is exactly the
// engine/adapter/sessnap encoding, identified by the envelope's `format` tag
// ("sessnap-json/1" today; see internal/adapter/grpcdriver.SnapshotFormat).
// The driver stores and returns the envelope VERBATIM and never decodes it —
// snapshot schema evolution lives in sessnap (additive JSON), while format
// identification lives in this envelope. The harness rejects an unknown
// `format` on Load with an infrastructure error (never not-found).
//
// Driver contract (mirrors the in-process stores):
//   - Load of an unknown session id MUST return NOT_FOUND.
//   - Save overwrites: Load returns the most recent snapshot saved under the id.
//   - List returns EVERY stored session id with its last-modified time (Save
//     time or the driver's nearest equivalent), unfiltered: prefix filtering
//     and retention policy (which ids are prunable, age thresholds, count
//     caps) stay HARNESS-side. A driver that does not retain modification
//     times may return its best approximation, but MUST return all ids.
//   - Delete is IDEMPOTENT: deleting an unknown session id succeeds (an
//     implementation built over a NOT_FOUND-returning primitive must tolerate
//     it — the harness treats unknown-id Delete as success, so a driver
//     SHOULD return OK rather than NOT_FOUND; the harness client tolerates
//     NOT_FOUND regardless). A backend that cannot enumerate or delete may
//     return UNIMPLEMENTED for both; the harness then degrades to never
//     sweeping that store.
//
// Validation: required-field annotations are authored with `buf.validate.field`
// for documentation and future runtime enforcement; V1 enforces them in the Go
// client/server wrappers (internal/adapter/grpcdriver).

syntax = "proto3";

package mecatl.driver.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SessionStoreService persists and retrieves opaque, format-tagged session
// snapshots keyed by session id. Save/Load are the remote analogue of
// port.SessionStore's two methods; List/Delete are the remote analogue of the
// OPTIONAL port.PrunableStore retention seam (a driver backed by a
// non-enumerable store may return UNIMPLEMENTED for both).
service SessionStoreService {
  // Save persists the snapshot under session_id, overwriting any prior
  // snapshot for the same id (a later Save wins).
  rpc Save(SaveRequest) returns (SaveResponse);

  // Create atomically publishes only when session_id is absent.
  rpc Create(SaveRequest) returns (SaveResponse);

  // Load returns the most recent snapshot saved under session_id. A session
  // id that was never saved MUST return NOT_FOUND — the harness maps that to
  // its port.ErrSessionNotFound sentinel; any other error is an
  // infrastructure failure.
  rpc Load(LoadRequest) returns (LoadResponse);

  // List returns EVERY stored session id with its last-modified time,
  // unfiltered — retention policy stays harness-side (see the package doc).
  rpc List(ListSessionsRequest) returns (ListSessionsResponse);

  // PageMetadata returns one owner-filtered keyset page when the backend
  // implements the optional port.SessionMetadataPager capability.
  rpc PageMetadata(PageSessionMetadataRequest) returns (PageSessionMetadataResponse);

  // ReadLineage returns the current retained root, applicable historical root
  // tombstones, and directly related content-free records. Records with the
  // same session id are distinct incarnations and MUST NOT be collapsed.
  // Available only when the backend implements port.SessionLineageReader.
  rpc ReadLineage(ReadSessionLineageRequest) returns (ReadSessionLineageResponse);

  // Delete removes the snapshot stored under session_id, idempotently: an
  // unknown id is success (a NOT_FOUND from a thin driver is tolerated by the
  // harness client and mapped to success).
  rpc Delete(DeleteSessionRequest) returns (DeleteSessionResponse);

  // Capabilities negotiates optional additive operations. Old drivers return
  // UNIMPLEMENTED and are treated as supporting only Save/Load.
  rpc Capabilities(SessionStoreCapabilitiesRequest) returns (SessionStoreCapabilitiesResponse);
}

// SessionSnapshot is the opaque snapshot envelope: a format tag plus the
// encoded payload. The driver round-trips both fields VERBATIM and never
// decodes the payload; decode happens harness-side (sessnap.Unmarshal).
//
// CAPACITY: a conforming driver MUST accept payloads up to 64 MiB — the
// protocol's required minimum message capacity (a snapshot carrying inline
// media legitimately reaches multiple MiB, so mount the gRPC server with a
// receive limit of at least that, e.g. grpc.MaxRecvMsgSize). The harness
// client is configured to send AND receive the same 64 MiB (see
// internal/adapter/grpcdriver.MaxSnapshotBytes).
message SessionSnapshot {
  // format identifies the payload encoding ("sessnap-json/1" today). The
  // harness writes it on Save and rejects an unknown format on Load with an
  // infrastructure error (never not-found).
  string format = 1 [(buf.validate.field).string.min_len = 1];

  // payload is the encoded session snapshot — exactly the bytes the harness
  // wrote (sessnap.Marshal output for format "sessnap-json/1").
  bytes payload = 2 [(buf.validate.field).bytes.min_len = 1];
}

// SaveRequest carries one snapshot to persist.
message SaveRequest {
  // session_id duplicates the snapshot's session id at the top level so a
  // driver can key and index its storage WITHOUT decoding the opaque payload.
  // It is the AUTHORITATIVE storage key: the harness always writes it equal
  // to the session id inside the payload, and a DECODING store (e.g. the
  // harness-provided Go server wrappers) rejects a request where the two
  // disagree with INVALID_ARGUMENT.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];

  // snapshot is the opaque envelope to store verbatim.
  SessionSnapshot snapshot = 2 [(buf.validate.field).required = true];
}

// SaveResponse is empty: a successful Save has no payload.
message SaveResponse {}

// LoadRequest asks for the most recent snapshot under a session id.
message LoadRequest {
  // session_id is the id the snapshot was saved under.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// LoadResponse carries the most recent snapshot for the requested id.
message LoadResponse {
  // snapshot is the envelope exactly as it was saved (format + payload
  // verbatim).
  SessionSnapshot snapshot = 1 [(buf.validate.field).required = true];
}

// ListSessionsRequest asks for the full stored-session inventory. (Named
// ListSessionsRequest — not ListRequest — because the memory-store service in
// this same proto package already owns ListRequest/ListResponse.)
message ListSessionsRequest {}

// StoredSessionEntry is one stored session's retention-relevant identity. It
// carries NO snapshot content — listing is an inventory concern, never a load.
message StoredSessionEntry {
  // session_id is the id the snapshot was saved under.
  string session_id = 1 [(buf.validate.field).string.min_len = 1];

  // modified_at is when the snapshot was last modified (Save time, file
  // mtime, or the driver's nearest equivalent). Unset when the driver
  // retains no modification time.
  google.protobuf.Timestamp modified_at = 2;
}

// ListSessionsResponse carries every stored session's entry, in no
// guaranteed order.
message ListSessionsResponse {
  // sessions is the unfiltered inventory.
  repeated StoredSessionEntry sessions = 1;
}

message SessionMetadataCursor {
  google.protobuf.Timestamp modified_at = 1;
  string session_id = 2;
  // generation binds continuation to one metadata catalog view.
  string generation = 3;
  // scope binds continuation to the ownership/filter set used for page one.
  string scope = 4;
  // continuation is opaque and interpreted only by the issuing backend.
  reserved 5;
  string continuation = 6;
}

message PageSessionMetadataRequest {
  int32 limit = 1;
  SessionMetadataCursor cursor = 2;
  bool ownership_enforced = 3;
  string owner_issuer = 4;
  string owner_subject = 5;
}

message StoredEnvironmentRef {
  string kind = 1;
  string id = 2;
  string revision = 3;
}

message SessionMetadataEntry {
  string session_id = 1;
  google.protobuf.Timestamp modified_at = 2;
  string state = 3;
  int32 turns = 4;
  string model_id = 5;
  google.protobuf.Timestamp created_at = 6;
  string title = 7;
  string kind = 8;
  string parent_session_id = 9;
  string call_id = 10;
  optional int32 branch_index = 11;
  string schedule_name = 12;
  string origin_session_id = 13;
  string team_id = 14;
  string member_name = 15;
  string owner_issuer = 16;
  string owner_subject = 17;
  string owner_grant_type = 18;
  string owner_name = 19;
  bool has_owner = 20;
  reserved 21;
  reserved "workspace";
  // Exact private storage identity. Trusted driver transport only; public
  // Harness/client projections must never expose it.
  StoredEnvironmentRef environment_ref = 28;
  // title_provenance is "first-prompt", "operator", or empty for legacy/unknown.
  string title_provenance = 22;
  int64 estimated_bytes = 23;
  string debug_target_session_id = 24;
  string parent_incarnation = 25;
  string origin_incarnation = 26;
  string debug_target_incarnation = 27;
}

message PageSessionMetadataResponse {
  repeated SessionMetadataEntry sessions = 1;
  SessionMetadataCursor next_cursor = 2;
  int32 total_count = 3;
}

message SessionStoreCapabilitiesRequest {}
message SessionStoreCapabilitiesResponse {
  bool list = 1;
  bool metadata_paging = 2;
  bool delete = 3;
  bool lineage = 4;
  bool create = 5;
}

message ReadSessionLineageRequest {
  string root_session_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 limit = 2;
  string root_incarnation = 3 [(buf.validate.field).string.min_len = 1];
}

// SessionLineageEntry is content-free durable relationship metadata. It must
// never gain transcript, title, model, tool, event, or workspace fields.
message SessionLineageEntry {
  string session_id = 1;
  string kind = 2;
  string parent_session_id = 3;
  string call_id = 4;
  optional int32 branch_index = 5;
  string schedule_name = 6;
  string origin_session_id = 7;
  string team_id = 8;
  string member_name = 9;
  string debug_target_session_id = 10;
  string parent_incarnation = 11;
  string origin_incarnation = 12;
  string debug_target_incarnation = 13;
  reserved 14 to 15;
  string state = 16;
  google.protobuf.Timestamp deleted_at = 17;
  // owner_scope is a non-reversible SHA-256 token; Principal PII is forbidden.
  bytes owner_scope = 18;
  // incarnation distinguishes delete/recreate crash boundaries without content.
  string incarnation = 19;
}

message ReadSessionLineageResponse {
  repeated SessionLineageEntry records = 1;
  bool truncated = 2;
}

// DeleteSessionRequest asks for the snapshot under session_id to be removed.
message DeleteSessionRequest {
  // session_id is the id to delete. An unknown id is success (idempotent).
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// DeleteSessionResponse is empty: a successful (or idempotent no-op) Delete
// has no payload.
message DeleteSessionResponse {}
